<script>
  // ================= PANEL TÉCNICOS (celular) =================
  var T = { actual: null, pend: [], pestana: 'hoy' };

  // ================= SIN SEÑAL =================
  // Todo lo que hace el técnico (iniciar, fotos, placas, pausar, cerrar) se guarda primero en el celular (IndexedDB)
  // y se envía en orden cuando hay señal. Las órdenes se guardan en una copia local para abrirlas sin internet.
  var BD = (function () {
    var db = null, abriendo = null, memoria = { copia: {}, envios: [] }, n = 0;
    function abrir() {
      if (db) return Promise.resolve(db);
      if (!abriendo) abriendo = new Promise(function (ok, fallo) {
        try {
          var r = indexedDB.open('familyair_tecnico', 1);
          r.onupgradeneeded = function () {
            var d = r.result;
            if (!d.objectStoreNames.contains('copia')) d.createObjectStore('copia');
            if (!d.objectStoreNames.contains('envios')) d.createObjectStore('envios', { keyPath: 'n', autoIncrement: true });
          };
          r.onsuccess = function () { db = r.result; ok(db); };
          r.onerror = function () { fallo(r.error); };
        } catch (e) { fallo(e); }
      });
      return abriendo;
    }
    function tx(almacen, modo, hacer) {
      return abrir().then(function (d) {
        return new Promise(function (ok, fallo) {
          var t = d.transaction(almacen, modo), res;
          var req = hacer(t.objectStore(almacen));
          if (req) req.onsuccess = function () { res = req.result; };
          t.oncomplete = function () { ok(res); };
          t.onerror = t.onabort = function () { fallo(t.error); };
        });
      });
    }
    // Si el celular no permite IndexedDB, se trabaja en memoria (se pierde al cerrar la app, pero no bloquea).
    return {
      leer: function (k) { return tx('copia', 'readonly', function (s) { return s.get(k); }).catch(function () { return memoria.copia[k]; }); },
      guardar: function (k, v) { return tx('copia', 'readwrite', function (s) { return s.put(v, k); }).catch(function () { memoria.copia[k] = v; }); },
      envios: function () { return tx('envios', 'readonly', function (s) { return s.getAll(); }).then(function (l) { return l || []; }).catch(function () { return memoria.envios.slice(); }); },
      agregar: function (e) { return tx('envios', 'readwrite', function (s) { return s.add(e); }).catch(function () { e.n = ++n; memoria.envios.push(e); return e.n; }); },
      actualizar: function (e) { return tx('envios', 'readwrite', function (s) { return s.put(e); }).catch(function () {}); },
      quitar: function (k) { return tx('envios', 'readwrite', function (s) { return s.delete(k); }).catch(function () { memoria.envios = memoria.envios.filter(function (x) { return x.n !== k; }); }); }
    };
  })();

  /** Llamada al servidor sin bloquear botones ni cerrar la sesión: la usan la cola y las actualizaciones en segundo plano. */
  function apiTec(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, fallo) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { fallo(new Error(((e && e.message) || String(e)).replace(/^Error:\s*/, ''))); })[fn].apply(null, [SES ? SES.token : null].concat(args));
    });
  }
  /** ¿El error es por falta de señal (y no un rechazo del servidor)? */
  function esRed(e) { return !navigator.onLine || /conexi|network|failed to fetch|load failed|http 0|timeout|NetworkError/i.test((e && e.message) || ''); }
  function claveCopia(tipo, id) { return tipo + '_' + SES.usuario + (id ? '_' + id : ''); }
  function misEnvios() { return T.pend.filter(function (e) { return e.usuario === SES.usuario; }); }
  function enviosDe(id) { return misEnvios().filter(function (e) { return e.ods === id; }); }

  /** Estado que ve el técnico: el del servidor, corregido por lo que tiene guardado sin enviar. */
  function estadoLocal(id, estado) {
    var cambio = { tecIniciar: 'EN_CURSO', tecReanudar: 'EN_CURSO', tecPausar: 'EN_PAUSA', tecCerrar: 'CERRADA_TECNICO' };
    enviosDe(id).forEach(function (e) { if (cambio[e.fn] && e.estado !== 'error') estado = cambio[e.fn]; });
    return estado;
  }
  function cambioPendiente(id) { return enviosDe(id).some(function (e) { return /tecIniciar|tecReanudar|tecPausar|tecCerrar/.test(e.fn) && e.estado !== 'error'; }); }

  /** Guarda una acción en el celular y la manda en cuanto haya señal. */
  function encolar(fn, ods, args, extra) {
    var e = { usuario: SES.usuario, fn: fn, ods: ods, args: args, creado: new Date().toISOString(), estado: 'pendiente' };
    Object.keys(extra || {}).forEach(function (k) { e[k] = extra[k]; });
    // Un cierre nuevo reemplaza un cierre anterior que falló.
    var viejos = fn === 'tecCerrar' ? enviosDe(ods).filter(function (x) { return x.fn === 'tecCerrar' && x.estado === 'error'; }) : [];
    viejos.forEach(function (x) { BD.quitar(x.n); });
    T.pend = T.pend.filter(function (x) { return viejos.indexOf(x) < 0; });
    T.pend.push(e);
    return BD.agregar(e).then(function (n) { e.n = n; pintarRed(); procesarEnvios(); return e; });
  }

  var enviando = false;
  function procesarEnvios() {
    if (enviando || !SES || !tieneRol('TECNICO')) return;
    var lista = misEnvios().filter(function (e) { return e.estado === 'pendiente' && e.n; }).sort(function (a, b) { return a.n - b.n; });
    if (!lista.length) { pintarRed(); return; }
    enviando = true; pintarRed();
    var siguiente = function () {
      var e = lista.shift();
      if (!e) { enviando = false; pintarRed(); if (!T.actual && $('tRefrescar')) refrescarLista(); return; }
      (e.fn === 'tecSubirVideo' ? subirVideo(e) : apiTec.apply(null, [e.fn].concat(e.args))).then(function (r) {
        return BD.quitar(e.n).then(function () { T.pend = T.pend.filter(function (x) { return x !== e; }); alEnviar(e, r); pintarRed(); siguiente(); });
      }).catch(function (err) {

          enviando = false; T.sesionVencida = /SESION_VENCIDA/.test(err.message); pintarRed();

        }

        BD.actualizar(e).then(function () { aviso(e.ods + ': ' + err.message, 8000, 'error'); pintarRed(); siguiente(); });
      });
    };
    siguiente();
  }

  /** Lo que cambia en la copia local cuando el servidor confirma un envío. */
  function alEnviar(e, r) {
    var clave = claveCopia('det', e.ods);

      if (!d) return;
      if ((e.fn === 'tecSubirFoto' || e.fn === 'tecSubirVideo') && r) d.fotos.push({ tipo: e.tipo, id: r, clave: e.clave, usuario: SES.usuario, por: SES.nombre });
      if (e.fn === 'tecGuardarEquipo' && r) d.equiposDetalle = r;
      if ({ tecIniciar: 1, tecReanudar: 1, tecPausar: 1, tecCerrar: 1 }[e.fn]) d.estado = r || d.estado;
      BD.guardar(clave, d);
    });
    if (T.actual && T.actual.id === e.ods) {
      if ((e.fn === 'tecSubirFoto' || e.fn === 'tecSubirVideo') && r) { T.actual.fotos.push({ tipo: e.tipo, id: r, clave: e.clave, usuario: SES.usuario }); if (T.vistas) T.vistas.push(r); }
      if (e.fn === 'tecGuardarEquipo' && r && $('tEquipos')) { T.actual.equiposDetalle = r; pintarEquipos(r, false); }
      $$('.mini.pendiente[data-clave="' + e.clave + '"]').forEach(function (m) { m.classList.remove('pendiente'); });
      pintarCola();
    }
    if (e.fn === 'tecCerrar') { borrarLocal('fa_borrador_' + e.ods); aviso('Servicio ' + e.ods + ' enviado a la oficina.', 0, 'exito'); }
  }

  /** Franja de estado: sin señal, envíos guardados y errores. */
  function pintarRed() {
    var el = $('tRed'); if (!el) return;
    var mios = misEnvios(), pend = mios.filter(function (e) { return e.estado !== 'error'; }).length, err = mios.filter(function (e) { return e.estado === 'error'; }).length;
    var sinRed = !navigator.onLine;
    if (!pend && !err && !sinRed && !T.sesionVencida) { el.className = 'red'; el.innerHTML = ''; return; }
    el.className = 'red visible ' + (err || T.sesionVencida ? 'mal' : sinRed ? 'sin' : 'envia');
    el.innerHTML = T.sesionVencida ? 'Su sesión venció. <button class="link" id="tReingresar">Ingrese de nuevo</button> para enviar ' + pend + ' pendiente(s); no se pierde nada.' :
      (sinRed ? '<b>Sin señal.</b> ' : '') +
      (pend ? pend + ' pendiente(s) guardado(s) en el celular' + (sinRed ? ': se envían solos cuando vuelva la señal.' : ' · enviando…') : (sinRed ? 'Puede seguir trabajando: todo queda guardado en el celular.' : '')) +
      (err ? ' <button class="link" id="tErrores">' + err + ' con error · ver</button>' : '');
    if ($('tReingresar')) $('tReingresar').onclick = function () { cerrarSesion(true); };
    if ($('tErrores')) $('tErrores').onclick = modalErrores;
  }

  function modalErrores() {
    var lista = misEnvios().filter(function (e) { return e.estado === 'error'; });
    var nombre = { tecIniciar: 'Iniciar', tecSubirFoto: 'Foto', tecSubirVideo: 'Video', tecPausar: 'Pausa', tecReanudar: 'Retomar', tecCerrar: 'Cierre', tecGuardarEquipo: 'Equipo' };
    var m = modal('Envíos con error', '<p class="gris" style="margin-top:0">El servidor no aceptó estos envíos. Corrija lo que indica y reintente, o descártelos.</p>' + lista.map(function (e, i) {
      return '<div class="tarjeta" style="padding:10px 12px"><b>' + esc(e.ods) + ' · ' + esc(nombre[e.fn] || e.fn) + '</b><br><span class="error">' + esc(e.error) + '</span>' +
        '<div class="acciones"><button class="sec" data-reint="' + i + '">Reintentar</button><button class="sec peligro" data-desc="' + i + '">Descartar</button></div></div>';
    }).join(''));
    $$('[data-reint]', m).forEach(function (b) { b.onclick = function () { var e = lista[Number(b.getAttribute('data-reint'))]; e.estado = 'pendiente'; delete e.error; BD.actualizar(e).then(function () { m.remove(); procesarEnvios(); }); }; });
    $$('[data-desc]', m).forEach(function (b) {
      b.onclick = function () {
        var e = lista[Number(b.getAttribute('data-desc'))];
        confirmar('Se descarta este envío (' + e.ods + '). Lo que contiene no llegará a la oficina.', 'Descartar', true).then(function (si) {
          if (!si) return;
          BD.quitar(e.n).then(function () { T.pend = T.pend.filter(function (x) { return x !== e; }); m.remove(); pintarRed(); });
        });
      };
    });
  }

  /** Al entrar: carga lo guardado sin enviar y reintenta cuando vuelve la señal o la app vuelve al frente. */
  function iniciarEnvios() {
    BD.envios().then(function (l) { T.pend = l; pintarRed(); procesarEnvios(); });
    if (!T.escuchando) {
      T.escuchando = true;
      window.addEventListener('online', function () { pintarRed(); procesarEnvios(); });
      window.addEventListener('offline', pintarRed);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) procesarEnvios(); });
      setInterval(procesarEnvios, 20000);
    }
  }

  function panelTecnico() {
    $('raiz').innerHTML = '<div class="tec-barra"><img src="' + LOGO + '" alt="Family Air"><b>' + esc(SES.nombre) + '</b>' + (dosPaneles() ? '<button id="tOficina">Oficina</button>' : '') + '<button id="tSalir">Salir</button></div><div id="tRed" class="red" role="status" aria-live="polite"></div><div class="tec" id="vistaTec">' + cargando('Cargando sus servicios…') + '</div>';
    $('tSalir').onclick = function () {
      var n = misEnvios().length;
      confirmar(n ? 'Hay ' + n + ' envío(s) guardado(s) en este celular que no han llegado a la oficina. Si cierra la sesión, se envían cuando vuelva a ingresar con su usuario.' : '¿Cerrar sesión en este celular?', 'Cerrar sesión').then(function (si) { if (si) cerrarSesion(false); });
    };
    if ($('tOficina')) $('tOficina').onclick = function () { cambiarPanel('oficina'); };
    iniciarEnvios();
    cargarMisOrdenes();
  }

  /** Mis servicios: muestra de una vez la copia guardada y la actualiza cuando responde el servidor. */
  function cargarMisOrdenes() {
    T.actual = null; clearInterval(T.relojSync);
    var clave = claveCopia('init'), fresco = false;
    $('vistaTec').innerHTML = cargando('Cargando sus servicios…');
    BD.leer(clave).then(function (c) { if (c && !fresco && !T.actual) pintarLista(c, true); });
    apiTec('tecInit').then(function (r) {
      fresco = true; BD.guardar(clave, r);
      if (!T.actual) pintarLista(r, false);
      precargarOrdenes(r);
    }).catch(function (e) {
      if (/SESION_VENCIDA/.test(e.message)) { cerrarSesion(true); return; }
      BD.leer(clave).then(function (c) {
        if (T.actual) return;
        if (c) pintarLista(c, true);
        else $('vistaTec').innerHTML = '<div class="tarjeta"><p class="error">' + esc(esRed(e) ? 'Sin señal y todavía no hay una copia de sus servicios en este celular. Ábrala una vez con señal.' : e.message) + '</p><button onclick="cargarMisOrdenes()">Reintentar</button></div>';
      });
    });
  }
  function refrescarLista() {
    apiTec('tecInit').then(function (r) { BD.guardar(claveCopia('init'), r); if (!T.actual && $('tRefrescar')) pintarLista(r, false); }).catch(function () {});
  }

  /** Guarda en el celular el detalle de cada orden abierta, para poder trabajarla sin señal. */
  function precargarOrdenes(r) {
    var ordenes = r.hoy.concat(r.proximos).slice(0, 25);
    // Solo las que cambiaron desde la copia del celular: volver a la lista no descarga otra vez todo.
    var una = function () {
      var o = ordenes.shift(); if (!o || !navigator.onLine) return;
      BD.leer(claveCopia('det', o.id)).then(function (c) {
        if (c && o.act && c.version === o.act) return;
        return apiTec('tecDetalle', o.id).then(function (d) { return BD.guardar(claveCopia('det', o.id), d); });
      }).then(una, una);
    };
    una();
  }

  function pintarLista(r, desdeCopia) {
    var hoy = hoyISO(0), grupos = { hoy: [], proximos: [], cerradas: [] };
    r.hoy.concat(r.proximos, r.cerradasHoy).forEach(function (o) {
      o.estado = estadoLocal(o.id, o.estado);
      o.porEnviar = enviosDe(o.id).length;
      if (o.estado === 'CERRADA_TECNICO') grupos.cerradas.push(o);
      else if (o.estado === 'EN_CURSO' || !o.dia || o.dia <= hoy) grupos.hoy.push(o);
      else grupos.proximos.push(o);
    });
    var pintar = function () {
      var lista = grupos[T.pestana];
      $('vistaTec').innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:4px 0 10px">Mis servicios</h2><button class="sec" id="tRefrescar">Actualizar</button></div>' +
        (desdeCopia ? '<p class="gris" style="margin:-4px 0 10px">Copia guardada en el celular' + (navigator.onLine ? ' · actualizando…' : ' · sin señal') + '</p>' : '') +
        '<div class="pestanas"><button data-p="hoy">Hoy <span class="cuenta">' + grupos.hoy.length + '</span></button><button data-p="proximos">Próximos <span class="cuenta">' + grupos.proximos.length + '</span></button><button data-p="cerradas">Cerrados hoy <span class="cuenta">' + grupos.cerradas.length + '</span></button></div>' +
        (lista.length ? lista.map(tarjetaOrden).join('') : '<div class="tarjeta vacio">' + ({ hoy: 'No tiene servicios pendientes para hoy.', proximos: 'No tiene servicios programados para los próximos días.', cerradas: 'Todavía no ha cerrado servicios hoy.' })[T.pestana] + '</div>');
      $$('.pestanas button').forEach(function (b) { b.className = b.getAttribute('data-p') === T.pestana ? 'activo' : ''; b.onclick = function () { T.pestana = b.getAttribute('data-p'); pintar(); }; });
      $('tRefrescar').onclick = cargarMisOrdenes;
      $$('[data-ods]').forEach(function (el) { el.onclick = function (e) { if (e.target.closest('a')) return; abrirOrden(el.getAttribute('data-ods')); }; });
    };
    pintar();
  }

  function tarjetaOrden(o) {
    var atrasada = o.estado === 'PROGRAMADA' && o.dia && o.dia < hoyISO(0);
    return '<div class="tarjeta orden-card" data-ods="' + esc(o.id) + '">' +
      '<div class="linea"><b style="font-size:17px">' + esc(o.id) + '</b>' + chipEstado(o.estado) + '</div>' +
      '<div style="margin:4px 0">' + marcasOrden(o) + (atrasada ? '<span class="marca perm">Atrasada</span>' : '') + (o.porEnviar ? '<span class="marca conf">' + o.porEnviar + ' por enviar</span>' : '') + '</div>' +
      '<div style="font-size:16px"><b>' + esc(o.cliente) + '</b></div><div>' + esc(o.direccion) + (o.barrio ? ', ' + esc(o.barrio) : '') + (o.ciudad ? ', ' + esc(o.ciudad) : '') + '</div>' +

  /** Abre la orden: primero la copia del celular (al instante y sin señal) y luego la versión del servidor. */
  function abrirOrden(id) {
    var clave = claveCopia('det', id), mostrada = false;
    T.abriendo = id;
    $('vistaTec').innerHTML = cargando('Cargando ' + id + '…');
    window.scrollTo(0, 0);
    BD.leer(clave).then(function (c) {
      if (c && T.abriendo === id) { mostrada = true; pintarOrden(c); }
      apiTec('tecDetalle', id).then(function (d) {
        BD.guardar(clave, d);
        if (T.abriendo !== id) return;
        if (!mostrada) { mostrada = true; pintarOrden(d); return; }
        // Ya está en pantalla la copia: solo se repinta si el técnico no ha empezado a llenar el cierre.
        var quieto = !document.activeElement || !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
        if (T.actual && T.actual.id === id && quieto && (!T.firma || T.firma.vacia()) && JSON.stringify(d) !== JSON.stringify(c)) pintarOrden(d);
      }).catch(function (e) {
        if (/SESION_VENCIDA/.test(e.message)) { cerrarSesion(true); return; }
        if (!mostrada && T.abriendo === id) $('vistaTec').innerHTML = '<div class="tarjeta"><p class="error">' + esc(esRed(e) ? 'Sin señal y esta orden no está guardada en el celular. Ábrala una vez con señal (la lista de servicios las guarda solas).' : e.message) + '</p><button onclick="cargarMisOrdenes()">Volver</button></div>';
      });
    });
  }

    $('iVIDEO').onchange = function () { if (this.files[0]) encolarVideo(this.files[0]); this.value = ''; };

  // ---------- Escáner de placa: foto del sticker → OCR → el técnico confirma serial y modelo ----------
  function leerPlaca(equipo, file, parte) {
    var m = modal('Leyendo placa…', cargando('Leyendo el texto de la placa…'));

      var id = T.actual.id, clave = 'placa-' + Date.now();

        m.remove();

        var r = { fotoClave: clave, aviso: 'Sin señal: la placa no se puede leer ahora. Escriba modelo y serial; la foto queda guardada y se sube sola.' };
        if (T.fichaDestino) { aviso(r.aviso, 8000, 'error'); T.fichaDestino = null; return; }
        modalPlaca(equipo, r, dataUrl, parte);
      };
      if (!navigator.onLine) return sinSenal();
      return apiTec('tecLeerPlaca', id, dataUrl, clave, true).then(function (r) {
        m.remove();

  }

  /** Compara lo registrado de la unidad (evaporadora o condensadora) con lo leído en su placa (sin espacios, guiones ni mayúsculas). */
  function compararPlaca(equipo, r, parte) {
    var limpio = function (v) { return String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); };
    var suf = parte === 'cond' ? 'Cond' : '';
    // El tipo leído solo llena el vacío: la placa a veces dice "SPLIT" en un equipo registrado como piso techo.
    return [['modelo', 'Modelo'], ['serial', 'Serial'], ['tipo', 'Tipo'], ['marca', 'Marca'], ['capacidad', 'Capacidad']].filter(function (c) { return r[c[0]] && !(c[0] === 'tipo' && equipo.tipo); }).map(function (c) {
      var clave = c[0] === 'modelo' || c[0] === 'serial' ? c[0] + suf : c[0];
      var reg = equipo[clave] || '', leido = r[c[0]];
      var estado = !reg ? 'nuevo' : limpio(reg) === limpio(leido) || (c[0] === 'capacidad' && limpio(reg).replace(/BTU/, '') === limpio(leido).replace(/BTU/, '')) ? 'ok' : 'distinto';
      return { clave: c[0], campo: c[1], reg: reg, leido: leido, estado: estado };
    });
  }

  /**
   * Placa de un equipo de la orden (equipo) o de un equipo no registrado (equipo null). El equipo es uno solo
   * con sus dos unidades: lo leído va a la unidad fotografiada (parte: evap o cond) y la otra queda como estaba.
   * Con foto: muestra lo leído, lo compara con lo registrado y al guardar corrige la base.

  function modalPlaca(equipo, r, foto, parte) {

    // Marca y capacidad leídas en la placa corrigen lo registrado; el tipo leído solo llena el vacío.
    var leidoFicha = function (k) { var c = cmp.filter(function (x) { return x.clave === k; })[0]; return c && c.estado === 'distinto' && k !== 'tipo' ? c.leido : ''; };
    var val = function (k) { return leidoEn(k) || leidoFicha(k) || (equipo && equipo[k]) || nuevo[k] || (k === 'marca' || k === 'capacidad' || k === 'tipo' ? r[k] : '') || ''; };
    var nombreParte = parte === 'cond' ? 'condensadora' : 'evaporadora';

        '<table style="width:100%;font-size:13px;margin-top:6px"><thead><tr><th style="text-align:left">Dato</th><th style="text-align:left">Registrado</th><th style="text-align:left">Placa</th><th></th></tr></thead><tbody>' + cmp.map(function (c) {
          return '<tr><td>' + esc(c.campo) + '</td><td>' + (c.reg ? esc(c.reg) : '<span class="gris">vacío</span>') + '</td><td><b>' + esc(c.leido) + '</b></td><td>' + (c.estado === 'ok' ? '✓' : c.estado === 'nuevo' ? 'se agrega' : '<span class="error">corrige</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div>' : (foto && !r.aviso ? '<p class="gris">Revise lo que leyó el sistema y corrija si hace falta.</p>' : '')) +
      (!equipo ? '<p class="gris">Se agrega a la base en esta sede y a esta orden, con sus dos unidades.</p>' +
        '<div class="fila"><button class="sec" id="plCamEvap">' + ICON.camara + ' Placa evaporadora</button><button class="sec" id="plCamCond">' + ICON.camara + ' Placa condensadora</button></div>' +
        (T.actual.sedesExtra && T.actual.sedesExtra.length ? '<label>Sede donde está el equipo</label><select id="plSede">' + [{ id: T.actual.idSede, nombre: T.actual.sede }].concat(T.actual.sedesExtra).map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === nuevo.idSede ? ' selected' : '') + '>' + esc(s.nombre) + '</option>'; }).join('') + '</select>' : '') : '') +

      '<label>Serial</label><input id="plSerial" value="' + esc(val('serial')) + '"></div>' +
      '<div' + (parte === 'cond' && foto ? ' class="leida"' : '') + '><h4>Condensadora (exterior)</h4><label>Modelo</label><input id="plModeloCond" value="' + esc(val('modeloCond')) + '">' +
      '<label>Serial</label><input id="plSerialCond" value="' + esc(val('serialCond')) + '"></div></div>' +
      '<div class="fila"><div><label>Marca</label><input id="plMarca" value="' + esc(val('marca')) + '"></div><div><label>Capacidad</label><input id="plCap" value="' + esc(val('capacidad')) + '"></div></div>' +
      (!equipo ? '<label>Ubicación</label><input id="plUbic" placeholder="Oficina, sala, piso 2…" value="' + esc(nuevo.ubicacion || '') + '">' : '') +
      (r.texto ? '<details><summary class="gris">Texto leído</summary><pre style="white-space:pre-wrap;font-size:12px">' + esc(r.texto) + '</pre></details>' : '') +
      '<div class="acciones"><button id="plGuardar" class="btn-grande">' + (distintos ? 'Corregir y guardar' : 'Guardar') + '</button></div><p id="plMsg"></p>');
    T.nuevoEq = null;
    var leerCampos = function () {

        marca: $('plMarca').value, capacidad: $('plCap').value, tipo: $('plTipo').value };
    };

      T.nuevoEq = Object.assign(leerCampos(), { ubicacion: $('plUbic').value, idSede: $('plSede') ? $('plSede').value : '' });
      T.placaEquipo = null; T.placaParte = p; T.fichaDestino = null; m.remove(); $('iPlaca').click();
    };
    if (m.querySelector('#plCamEvap')) { m.querySelector('#plCamEvap').onclick = function () { camara('evap'); }; m.querySelector('#plCamCond').onclick = function () { camara('cond'); }; }
    m.querySelector('#plGuardar').onclick = function () {
      var bt = this; bt.disabled = true;
      var datos = Object.assign(leerCampos(), { fotoId: r.fotoId || '', fotoClave: r.fotoClave || '' });
      if (equipo && foto) datos.parte = parte;
      if (!equipo) { datos.ubicacion = $('plUbic').value; if ($('plSede')) datos.idSede = $('plSede').value; }
      var d = T.actual, lista = (d.equiposDetalle || []).slice();
      var marca = function (x) {
        return Object.assign({}, x, { modelo: datos.modelo, serial: datos.serial, modeloCond: datos.modeloCond, serialCond: datos.serialCond, marca: datos.marca || x.marca, tipo: datos.tipo || x.tipo, capacidad: datos.capacidad || x.capacidad,
          escaneado: x.escaneado || (parte === 'evap' && !!foto), escaneadoCond: x.escaneadoCond || (parte === 'cond' && !!foto) });
      };

      encolar('tecGuardarEquipo', d.id, [d.id, equipo ? equipo.id : '', datos]).then(function () {
        m.remove(); vibrar(15); aviso(distintos ? 'Datos del equipo corregidos.' : 'Equipo guardado.', 0, 'exito');

  var esperaBorrador = null;

  // Si la app se cierra o pasa a segundo plano, lo escrito se guarda de una vez.

  /** Miniatura de una foto; "por" es quien la subió (se muestra cuando la orden la trabajan varios técnicos). */
  function agregarMini(tipo, src, por, clavePendiente) {
    var cont = $('f' + tipo); if (!cont) return;
    var m = document.createElement('div'); m.className = 'mini' + (clavePendiente ? ' pendiente' : '');
    if (clavePendiente) m.setAttribute('data-clave', clavePendiente);
    if (tipo === 'VIDEO') {
      // Video: el que está en el celular se ve con su primer cuadro; el que ya está en Drive, con la miniatura de Drive.
      m.className += ' video';
      if (/^blob:/.test(src)) {
        var v = document.createElement('video'); v.src = src; v.muted = true; v.playsInline = true; v.preload = 'metadata'; v.setAttribute('aria-label', 'Video de evidencia'); m.appendChild(v);
      } else {
        var iv = document.createElement('img'); iv.src = src; iv.alt = 'Video de evidencia'; iv.onerror = function () { iv.removeAttribute('src'); }; m.appendChild(iv);
      }
    } else {
      var img = document.createElement('img'); img.src = src; img.alt = 'Foto ' + ({ ANTES: 'de antes', DESPUES: 'de después', EVIDENCIA: 'de evidencia' })[tipo]; m.appendChild(img);
    }
    if (por) { var p = document.createElement('span'); p.className = 'por'; p.textContent = por; m.appendChild(p); }
    cont.appendChild(m);

  /**
   * Varios técnicos en la misma orden: mientras está abierta, cada 20 segundos trae lo que subieron los demás
   * (fotos con su autor, placas escaneadas) y avisa si otro la inició, la pausó o la cerró.
   */
  function sincronizarOrden(d) {
    clearInterval(T.relojSync);
    if (['PROGRAMADA', 'EN_CURSO', 'EN_PAUSA'].indexOf(d.estado) < 0) return;
    T.vistas = d.fotos.map(function (f) { return f.id; });
    var equipos = JSON.stringify(d.equiposDetalle || []), version = '';
    T.relojSync = setInterval(function () {
      if (!T.actual || T.actual.id !== d.id || !$('tEquipos')) { clearInterval(T.relojSync); return; }
      if (!navigator.onLine) return;
      apiTec('tecEstado', d.id, version).then(function (r) {
        if (!T.actual || T.actual.id !== d.id) return;
        version = r.version || '';
        if (!cambioPendiente(d.id) && r.estado !== d.estado) {
          clearInterval(T.relojSync);
          if (r.estado === 'CERRADA_TECNICO') { borrarLocal('fa_borrador_' + d.id); aviso((r.porQuien || 'Otro técnico') + ' cerró este servicio.', 6000, 'exito'); }
          else if (r.estado === 'EN_PAUSA') aviso((r.porQuien || 'Otro técnico') + ' pausó este servicio.', 6000);
          else if (r.estado === 'EN_CURSO') aviso('Otro técnico inició el servicio.', 4000);
          abrirOrden(d.id);
          return;
        }
        if (r.igual) return; // sin cambios desde la última consulta
        var propias = misEnvios().map(function (x) { return x.clave; }).concat(d.fotos.map(function (f) { return f.clave; }));
        r.fotos.forEach(function (f) {
          if (T.vistas.indexOf(f.id) >= 0) return;
          T.vistas.push(f.id);
          if (propias.indexOf(f.clave) >= 0) { d.fotos.push(f); return; } // la subió este celular: ya está en pantalla
          d.fotos.push(f);
          if (f.tipo !== 'PLACA') agregarMini(f.tipo, miniDrive(f.id), f.por);
        });
        var eq = JSON.stringify(r.equiposDetalle || []);
        if (eq !== equipos) { equipos = eq; d.equiposDetalle = r.equiposDetalle; pintarEquipos(r.equiposDetalle, false); }
      }).catch(function () { /* sin señal: lo intenta en la próxima vuelta */ });
    }, 20000);
  }

  // ---------- Fotos: se reducen y se suben una por una, con reintento ----------
  /**
   * Reduce la foto en el celular antes de guardarla o subirla. Lee el archivo directo (sin pasarlo a texto base64),
   * lo que en fotos de 5 a 12 MB ahorra segundos. gris: para placas (pesa menos y el OCR lee mejor el contraste).
   */
  function reducirImagen(file, max, calidad, gris) {
    max = max || 1280; calidad = calidad || 0.72;
    return new Promise(function (ok, fallo) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onerror = function (e) { URL.revokeObjectURL(url); fallo(e); };
      img.onload = function () {
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        var ctx = c.getContext('2d');
        if (gris) ctx.filter = 'grayscale(1) contrast(1.15)';
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        ok(c.toDataURL('image/jpeg', calidad));
      };
      img.src = url;
    });
  }

  /** Cada foto queda guardada en el celular y se sube en orden; sin señal espera y se reintenta sola. */
  function encolarFotos(tipo, files) {
    var d = T.actual;
    Array.prototype.forEach.call(files, function (f) {
      reducirImagen(f).then(function (dataUrl) {
        var clave = Date.now() + '-' + Math.random().toString(36).slice(2, 8);
        agregarMini(tipo, dataUrl, (d.apoyo || []).length ? 'Usted' : '', clave);
        return encolar('tecSubirFoto', d.id, [d.id, tipo, dataUrl, clave], { tipo: tipo, clave: clave }).then(pintarCola);
      }).catch(function () { aviso('No se pudo leer una foto.'); });
    });
  }

  // ---------- Videos: quedan en el celular y se suben por partes de 4 MB; si se cae la señal, siguen donde iban ----------
  var MAX_VIDEO = 150 * 1024 * 1024, PARTE_VIDEO = 4 * 1024 * 1024;
  function urlLocal(blob) { try { return blob ? URL.createObjectURL(blob) : ''; } catch (e) { return ''; } }

  function encolarVideo(file) {
    var d = T.actual;
    if (file.size > MAX_VIDEO) { aviso('El video pesa ' + Math.round(file.size / 1048576) + ' MB y el máximo es 150 MB. Grábelo más corto.', 6000, 'error'); return; }
    var clave = Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    agregarMini('VIDEO', urlLocal(file), (d.apoyo || []).length ? 'Usted' : '', clave);
    encolar('tecSubirVideo', d.id, [], { tipo: 'VIDEO', clave: clave, blob: file, mime: file.type || 'video/mp4', total: file.size, enviado: 0 }).then(pintarCola);
  }

  function base64De(blob) {
    return new Promise(function (ok, fallo) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).split(',')[1] || ''); };
      r.onerror = function () { fallo(new Error('No se pudo leer el video guardado en el celular.')); };
      r.readAsDataURL(blob);
    });
  }

  /** Sube el video parte por parte; guarda el avance en el celular para seguir desde ahí si se corta. Responde el id en Drive. */
  function subirVideo(e) {
    if (!e.blob) return Promise.reject(new Error('El video ya no está en el celular. Descártelo y grábelo de nuevo.'));
    var paso = function () {
      var ini = e.enviado || 0;
      return base64De(e.blob.slice(ini, Math.min(ini + PARTE_VIDEO, e.total))).then(function (b64) {
        return apiTec('tecVideoParte', e.ods, e.clave, ini, e.total, e.mime, b64);
      }).then(function (r) {
        if (r.id) return r.id;
        if (r.reiniciar && !ini) throw new Error('Drive no aceptó el video. Intente de nuevo.');
        if (!r.reiniciar && !(r.siguiente > ini)) throw new Error('Drive no recibió esa parte del video. Intente de nuevo.');
        e.enviado = r.reiniciar ? 0 : r.siguiente;
        return BD.actualizar(e).then(function () { pintarCola(); return paso(); });
      });
    };
    return paso();
  }

  function pintarCola() {
    if (!$('colaMsg') || !T.actual) return;
    var lista = enviosDe(T.actual.id);
    var pend = lista.filter(function (e) { return e.fn === 'tecSubirFoto'; }).length;
    var videos = lista.filter(function (e) { return e.fn === 'tecSubirVideo'; });
    var txt = [];
    if (pend) txt.push(pend + ' foto(s)');
    if (videos.length) txt.push(videos.length + ' video(s)' + (navigator.onLine ? ' (' + videos.map(function (v) { return Math.floor(100 * (v.enviado || 0) / v.total) + ' %'; }).join(', ') + ')' : ''));
    $('colaMsg').innerHTML = txt.length ? txt.join(' y ') + ' guardado(s) en el celular' + (navigator.onLine ? ', subiendo…' : '; se suben solos cuando haya señal.') : '';
  }

  // ---------- Firma ----------
  function prepararFirma(cv) {
    var r = window.devicePixelRatio || 1;
    cv.width = cv.clientWidth * r; cv.height = cv.clientHeight * r;
    var ctx = cv.getContext('2d');
    ctx.scale(r, r); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#111';
    var dibujando = false, trazos = 0;
    var pos = function (e) { var b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
    cv.addEventListener('pointerdown', function (e) { dibujando = true; var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', function (e) { if (!dibujando) return; var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); trazos++; });
    cv.addEventListener('pointerup', function () { dibujando = false; });
    return {
      vacia: function () { return trazos < 5; },
      limpiar: function () { ctx.clearRect(0, 0, cv.width, cv.height); trazos = 0; },
      dato: function () { return cv.toDataURL('image/png'); }
    };
  }

  // ---------- Cierre ----------
  function cerrarOrden() {
    var d = T.actual;
    var datos = { trabajo: $('oTrabajo').value.trim(), obs: $('oObs').value.trim(), recibeNombre: $('oRecibe').value.trim(), recibeDoc: $('oDoc').value.trim(), estadoArtefacto: valoresOpcion('tArt'),
      aceptaCondiciones: $('oAcepta').checked, envioCanal: valorOpcion('tEnvio'), envioDestino: $('oDestino').value.trim(),
      fichas: $('oFichas') ? leerFichas($('oFichas'), d.fichaTareas) : [] };
    $('oMsg').innerHTML = '';
    var hayError = false;
    // Servicio sin cobro: solo la nota.
    if (d.tipoOrden === 'SIN_COBRO') {
      if (!datos.trabajo) { marcarError($('oTrabajo'), 'Escriba la nota de lo que se hizo.'); vibrar([30, 60, 30]); irAlError($('vistaTec')); return; }
      return enviarCierre(d, datos);
    }
    var tieneFoto = function (tipo) { return d.fotos.some(function (f) { return f.tipo === tipo; }) || enviosDe(d.id).some(function (e) { return e.fn === 'tecSubirFoto' && e.tipo === tipo; }); };
    if (!tieneFoto('ANTES')) { marcarError($('bANTES'), 'Agregue al menos una foto de antes.'); hayError = true; }
    if (!tieneFoto('DESPUES')) { marcarError($('bDESPUES'), 'Agregue al menos una foto de después.'); hayError = true; }
    if ($('oFichas') && validarFichas($('oFichas'), d.fichaCampos, d.fichaTareas)) hayError = true;
    if (!datos.estadoArtefacto.length) { marcarError($('oArt'), 'Marque el estado del artefacto.'); hayError = true; }
    if (!datos.trabajo) { marcarError($('oTrabajo'), 'Escriba el trabajo realizado.'); hayError = true; }
    if (!datos.obs) { marcarError($('oObs'), 'Escriba las observaciones.'); hayError = true; }
    if (!datos.recibeNombre) { marcarError($('oRecibe'), 'Escriba quién recibe.'); hayError = true; }
    if (!datos.recibeDoc) { marcarError($('oDoc'), 'Escriba la cédula de quien recibe.'); hayError = true; }
    if (datos.envioCanal === 'CORREO' ? !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(datos.envioDestino) : datos.envioDestino.replace(/\D/g, '').length < 10) { marcarError($('oDestino'), datos.envioCanal === 'CORREO' ? 'Escriba un correo válido.' : 'Escriba un WhatsApp de 10 dígitos.'); hayError = true; }
    if (!datos.aceptaCondiciones) { marcarError($('oAcepta').parentNode, 'Quien recibe debe aceptar las condiciones.'); hayError = true; }
    if (T.firma.vacia()) { marcarError($('oFirma'), 'Falta la firma.'); hayError = true; }
    if (hayError) { vibrar([30, 60, 30]); irAlError($('vistaTec')); return; }
    enviarCierre(d, datos);
  }

  /**
   * El cierre (con firma) queda guardado en el celular y se envía después de las fotos de la orden.
   * El borrador del texto se conserva hasta que la oficina lo recibe.
   */
  function enviarCierre(d, datos) {
    datos.firma = d.tipoOrden === 'SIN_COBRO' ? '' : T.firma.dato();
    $('oCerrar').disabled = true;
    encolar('tecCerrar', d.id, [d.id, datos]).then(function () {
      vibrar(20);
      aviso('Servicio ' + d.id + ' cerrado. ' + (navigator.onLine ? 'Enviando a la oficina…' : 'Sin señal: se envía solo cuando vuelva la señal.'), 6000, 'exito');
      cargarMisOrdenes();
    });
  }
</script>
