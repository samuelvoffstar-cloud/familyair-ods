<style>
  :root {
    --menu: #0877c4; --menu-activo: #06609f; --primario: #126cc6; --primario-osc: #0f63b5; --primario-claro: #e8f3fe;
    --texto: #1f2a37; --gris: #5f6b79; --gris-claro: #9aa4b1; --borde: #e3e8ef; --borde-campo: #8a96a3; --fondo: #f2f5f8; --blanco: #fff;
    --verde: #0e7553; --verde-claro: #e3f6ee; --rojo: #c4320a; --rojo-claro: #fdebe6; --ambar: #a35a00; --ambar-claro: #fff3df;
    --morado: #6941c6; --morado-claro: #f1ebfd; --radio: 10px; --sombra: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; -webkit-tap-highlight-color: transparent; font: 15px/1.5 'Nunito', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: var(--texto); background: var(--fondo); }
  a { color: var(--primario); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { font-size: 1.75rem; font-weight: 800; margin: 0; line-height: 1.1; letter-spacing: -0.02em; }
  h2 { font-size: 1.15rem; font-weight: 800; margin: 0 0 12px; line-height: 1.25; letter-spacing: -0.01em; }
  h3 { font-size: 15px; font-weight: 700; margin: 18px 0 8px; }
  label { display: block; font-size: 13px; color: var(--gris); margin: 10px 0 4px; font-weight: 600; letter-spacing: 0.01em; }
  input, select, textarea, button { font: inherit; }
  /* Bordes de campos con contraste 3:1 (WCAG); en el celular, letra de 16 px para que iOS no haga zoom al tocarlos. */
  input, select, textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--borde-campo); border-radius: 8px; background: #fff; color: var(--texto); }
  @media (max-width: 760px) { input, select, textarea { font-size: 16px; } }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primario); box-shadow: 0 0 0 3px var(--primario-claro); }
  textarea { min-height: 84px; resize: vertical; }
  input[type=checkbox], input[type=radio] { width: auto; }
  button { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--primario); background: var(--primario); color: #fff; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
  button:hover { background: var(--primario-osc); border-color: var(--primario-osc); }
  button.sec { background: #fff; color: var(--primario); }
  button.sec:hover { background: var(--primario-claro); }
  button.peligro { background: #fff; color: var(--rojo); border-color: var(--rojo); }
  button.peligro:hover { background: var(--rojo-claro); }
  button.ok { background: var(--verde); border-color: var(--verde); }
  button.link { background: none; border: none; color: var(--primario); padding: 0; font-weight: 600; }
  button.link:hover { text-decoration: underline; background: none; }
  a.link-peligro, button.link.link-peligro { color: var(--rojo); font-weight: 600; }
  .eq-fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--borde, #e5e9f0); }

  button:disabled { opacity: .5; cursor: default; }
  button svg { width: 18px; height: 18px; }

  .principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .barra { background: rgba(255,255,255,.72); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid transparent; transition: box-shadow .2s ease, border-color .2s ease; display: flex; align-items: center; gap: 12px; padding: 10px 24px; position: sticky; top: 0; z-index: 20; min-height: 64px; }
  .barra .empresa { font-size: 18px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barra .buscar { position: relative; width: 280px; }
  .barra .buscar input { padding-left: 36px; border-radius: 20px; }

  .barra .icono:hover { background: var(--primario-claro); }
  .barra .icono svg { width: 24px; height: 24px; }

  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primario); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; flex-shrink: 0; }
  .btn-menu { display: none; }
  .titulo-pag { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 22px 28px 6px; }
  .titulo-pag h1 { flex: 1; min-width: 200px; }
  .migas { padding: 18px 28px 0; font-size: 13px; color: var(--gris); }
  .contenido { padding: 14px 28px 40px; }

  /* ---------- Tarjetas, tablas y filtros ---------- */
  .tarjeta { background: var(--blanco); border: 1px solid var(--borde); border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: var(--sombra); }
  .tarjeta > h2:first-child { margin-top: 0; }
  .tarjeta.tabla-card { padding: 0; overflow: hidden; }

  .tabla-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th { text-align: left; font-weight: 700; font-size: 14px; color: var(--texto); background: #f6f8fa; padding: 14px 16px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
  th + th { border-left: 1px solid var(--borde); }

  tfoot td { font-weight: 800; background: #fbfcfd; border-bottom: none; }
  .paginacion { display: flex; align-items: center; justify-content: flex-end; gap: 16px; padding: 12px 20px; font-size: 14px; color: var(--gris); border-top: 1px solid var(--borde); flex-wrap: wrap; }
  .paginacion select { width: auto; padding: 5px 8px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi { background: #fff; border: 1px solid var(--borde); border-radius: 14px; padding: 16px; cursor: pointer; box-shadow: var(--sombra); }

  .pestanas { display: flex; gap: 4px; border-bottom: 1px solid var(--borde); margin-bottom: 16px; overflow-x: auto; }

  .pestanas button:hover { background: none; color: var(--primario); }
  .pestanas button.activo { color: var(--primario); border-bottom-color: var(--primario); }
  .pestanas .cuenta { background: var(--fondo); border-radius: 10px; padding: 0 7px; font-size: 12px; color: var(--texto); }

  .opciones { display: flex; flex-wrap: wrap; gap: 8px; }
  .opciones label { margin: 0; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--borde); border-radius: 22px; padding: 7px 14px; color: var(--texto); cursor: pointer; font-size: 14px; background: #fff; }
  .opciones input { display: none; }
  .opciones label.on { border-color: var(--primario); background: var(--primario-claro); color: var(--primario-osc); }
  .chk { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 14px; color: var(--texto); margin: 0; font-weight: 600; cursor: pointer; }
  .chk input { margin-top: 3px; }
  .numero-orden { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .numero-orden .grande { font-size: 22px; font-weight: 800; color: var(--primario-osc); }

  .estado { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 12px; background: #eef1f4; font-weight: 700; white-space: nowrap; }
  .estado.PROGRAMADA { background: var(--primario-claro); color: var(--primario-osc); }
  .estado.EN_CURSO { background: var(--ambar-claro); color: var(--ambar); }
  .estado.EN_PAUSA { background: #fff1e6; color: #b54708; }
  .marca.auto { background: #e0f2fe; color: #026aa2; }
  .nota-interna { background: #fffaeb; border: 1px solid #fedf89; border-radius: 10px; padding: 10px 12px; color: #93370d; font-size: 14px; }
  .nota-interna b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }

  .nota-interna .dif { margin-top: 2px; }

  .jornada .gris { display: block; }

  .estado.REVISADA { background: #e0f2fe; color: #026aa2; }
  .estado.LIQUIDADA { background: #fef0c7; color: #93370d; }
  .estado.POR_FACTURAR { background: #fce7f6; color: #c11574; }
  .estado.COMPLETADA { background: var(--verde-claro); color: var(--verde); }
  .estado.ANULADA { background: var(--rojo-claro); color: var(--rojo); text-decoration: line-through; }
  .marca { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 800; margin-left: 4px; white-space: nowrap; }
  .marca.ga { background: #1f2a37; color: #fff; }
  .marca.sc { background: var(--verde-claro); color: var(--verde); }
  .marca.conf { background: var(--ambar-claro); color: var(--ambar); }
  .marca.perm { background: #ffe4e8; color: #c01048; }
  .marca.ret { background: var(--morado-claro); color: var(--morado); }

  .gris { color: var(--gris); font-size: 13px; }
  .error { color: var(--rojo); }
  .exito { color: var(--verde); }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .acciones.der { justify-content: flex-end; }
  .lista-res { border: 1px solid var(--borde); border-radius: 8px; max-height: 280px; overflow: auto; background: #fff; position: absolute; left: 0; right: 0; z-index: 15; box-shadow: 0 8px 24px rgba(16,24,40,.12); }

  .lista-res div:hover { background: var(--primario-claro); }
  .relativo { position: relative; }

  .con-boton > :first-child { flex: 1; }
  .items td { padding: 6px 8px; vertical-align: middle; }
  .items input, .items select { padding: 6px 8px; }
  input.sin-siigo { border-color: var(--rojo); background: var(--rojo-claro); }
  .items .x { background: none; border: none; color: var(--rojo); font-size: 18px; padding: 2px 8px; }
  .totales { margin-left: auto; max-width: 320px; font-size: 14px; }
  .totales div { display: flex; justify-content: space-between; padding: 4px 0; }
  .totales .t { font-weight: 800; font-size: 17px; border-top: 1px solid var(--borde); padding-top: 8px; }

  .modal { position: fixed; inset: 0; background: rgba(16,24,40,.45); display: flex; align-items: flex-start; justify-content: center; overflow: auto; z-index: 50; padding: 24px 16px; }
  .modal > div { background: #fff; border-radius: 14px; max-width: 760px; width: 100%; padding: 22px; box-shadow: 0 20px 40px rgba(16,24,40,.2); }
  .modal .cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .modal .cab h2 { margin: 0; }
  .fotos { display: flex; flex-wrap: wrap; gap: 8px; }

  .fotos .mini.video img { background: #1f2a37; }

  .fotos a.video { position: relative; display: inline-block; }

  .fotos label.sel input { position: absolute; top: 6px; left: 6px; }

  canvas.firma { width: 100%; height: 190px; border: 1px dashed var(--borde-campo); border-radius: 10px; background: #fff; touch-action: none; }
  #aviso { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #1f2a37; color: #fff; padding: 11px 18px; border-radius: 10px; display: none; z-index: 90; max-width: 90vw; font-weight: 600; }
  .cargando { padding: 30px; color: var(--gris); text-align: center; }

  /* ---------- Login ---------- */
  .login-fondo { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #0a8fe0 0%, #0877c4 100%); padding: 16px; }
  .login { background: #fff; border-radius: 16px; padding: 28px; width: 100%; max-width: 380px; box-shadow: 0 20px 40px rgba(0,0,0,.18); }
  .login img { width: 92px; display: block; margin: 0 auto 8px; }
  .login h2 { text-align: center; }
  .login button { width: 100%; margin-top: 16px; }
  .login .legal { text-align: center; font-size: 12px; margin: 14px 0 0; color: var(--gris); }
  .login .legal a { color: var(--gris); }

  /* ---------- Panel de técnicos (celular) ---------- */
  .tec-barra { background: var(--menu); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 20; }
  .tec-barra img { width: 34px; height: 34px; background: #fff; border-radius: 8px; padding: 2px; }
  .tec-barra b { flex: 1; }
  .chip-sede { display: inline-block; font-size: 12px; font-weight: 700; color: var(--primario-osc); background: var(--primario-claro); border-radius: 6px; padding: 1px 8px; margin-bottom: 2px; }
  .sede-extra { border: 1px solid var(--borde); border-radius: 10px; padding: 10px 14px; margin-top: 12px; background: #fbfdff; }
  .unidades { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; margin-top: 6px; }
  .unidades h4 { margin: 10px 0 0; font-size: 13px; color: var(--primario-osc); }
  @media (max-width: 600px) { .unidades { grid-template-columns: 1fr; } }
  .tec-barra button { background: transparent; border: 1px solid rgba(255,255,255,.7); padding: 5px 12px; }
  .tec { max-width: 720px; margin: 0 auto; padding: 14px; }
  .tec .tarjeta { padding: 16px; border-radius: 14px; }
  .orden-card { cursor: pointer; }
  .orden-card .linea { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .botones-rapidos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .botones-rapidos a, .botones-rapidos button { display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--primario); border-radius: 10px; padding: 10px 6px; font-weight: 700; font-size: 14px; background: #fff; color: var(--primario); text-decoration: none; }
  .btn-grande { width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; }
  .equipo { border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
  .equipo div { flex: 1; font-size: 14px; }
  .equipo .ok-chip { color: var(--verde); font-weight: 800; font-size: 12px; }
  .equipo .placas { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
  .equipo .placas button { padding: 6px 10px; font-size: 13px; white-space: nowrap; }
  .unidades .leida { background: var(--primario-claro); border-radius: 8px; padding: 0 8px 8px; }
  .condiciones { font-size: 12px; color: var(--gris); max-height: 220px; overflow: auto; border: 1px solid var(--borde); border-radius: 8px; padding: 8px 10px; background: #fafbfc; }
  .condiciones p { margin: 0 0 6px; }

  @media (max-width: 900px) {
    .menu { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform .2s; width: 260px; }
    .menu.abierto { transform: none; }
    .btn-menu { display: inline-flex; }
    .barra { padding: 10px 14px; }
    .barra .buscar { display: none; }
    .titulo-pag, .contenido, .migas { padding-left: 14px; padding-right: 14px; }
    .datos { grid-template-columns: 1fr; gap: 2px; }
    .datos dd { margin-bottom: 8px; }
    .ocultar-movil { display: none; }
  }

  /* ================= Respuesta, materiales y movimiento (principios de diseño fluido) ================= */
  button, .kpi, .opciones label, .chk, tr.clic, .orden-card, .botones-rapidos a, .menu nav a, .avatar, .chip button { touch-action: manipulation; }
  /* Respuesta al presionar, no al soltar */
  button, .kpi, .orden-card, .botones-rapidos a, .menu nav a, .opciones label, .avatar { transition: transform 120ms ease-out, background-color 120ms ease-out, border-color 120ms ease-out, box-shadow 120ms ease-out; }
  button:active:not(:disabled), .botones-rapidos a:active, .avatar:active { transform: scale(0.97); }
  .kpi:active, .orden-card:active { transform: scale(0.985); }
  .menu nav a:active { transform: scale(0.98); background: rgba(255,255,255,.2); }
  .opciones label:active { transform: scale(0.96); }
  tr.clic:active td { background: var(--primario-claro); }
  /* Barra con borde solo cuando el contenido pasa por debajo */
  .barra.con-borde { border-bottom-color: rgba(16,24,40,.08); box-shadow: 0 6px 16px -10px rgba(16,24,40,.25); }
  .tec-barra { background: rgba(10,157,245,.88); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); }
  /* Botón ocupado: respuesta inmediata mientras responde el servidor */
  button.ocupado { position: relative; color: transparent !important; pointer-events: none; }
  button.ocupado::after { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-color: #fff #fff transparent transparent; animation: girar .7s linear infinite; }
  button.sec.ocupado::after, button.peligro.ocupado::after { border-color: var(--primario) var(--primario) transparent transparent; }
  @keyframes girar { to { transform: rotate(360deg); } }
  /* Esqueletos en lugar de "Cargando…" */
  .esqueleto { display: grid; gap: 12px; padding: 4px 0; }
  .esqueleto i { display: block; height: 14px; border-radius: 7px; background: linear-gradient(90deg, #e9eef3 0%, #f5f8fa 40%, #e9eef3 80%); background-size: 200% 100%; animation: brillo 1.4s ease-in-out infinite; }
  .esqueleto i.alto { height: 44px; border-radius: 12px; }
  @keyframes brillo { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  /* Entrada de cada página: aparece desde donde va a quedar */
  .entra { animation: entrar 260ms cubic-bezier(.2,.8,.2,1) both; }
  @keyframes entrar { from { opacity: 0; transform: translateY(6px); } }
  /* Modal: nace del botón que lo abrió y vuelve a él al cerrar */
  .modal { background: rgba(16,24,40,0); transition: background-color 220ms ease; }
  .modal.visible { background: rgba(16,24,40,.45); }
  .modal > div { opacity: 0; transform: scale(.94); transition: opacity 200ms ease, transform 260ms cubic-bezier(.2,.8,.2,1); will-change: transform, opacity; }
  .modal.visible > div { opacity: 1; transform: none; }
  /* En celular el modal es una hoja inferior que se arrastra */
  @media (max-width: 640px) {
    .modal { align-items: flex-end; padding: 0; overflow: hidden; }
    .modal > div { border-radius: 18px 18px 0 0; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain; transform: translateY(100%); opacity: 1; transition: none; padding-top: 10px; }
    .modal > div::before { content: ''; display: block; width: 40px; height: 5px; border-radius: 3px; background: #d0d6dd; margin: 0 auto 10px; }
  }
  /* Avisos por tipo: estado, completado, advertencia, error */
  #aviso { transition: opacity 180ms ease, transform 260ms cubic-bezier(.2,.8,.2,1); opacity: 0; transform: translate(-50%, 16px); display: block !important; pointer-events: none; }
  #aviso.visible { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #aviso.exito { background: var(--verde); }
  #aviso.error { background: var(--rojo); }
  /* Validación en línea */
  .invalido { border-color: var(--rojo) !important; box-shadow: 0 0 0 3px var(--rojo-claro) !important; }
  .msg-campo { color: var(--rojo); font-size: 13px; margin-top: 4px; font-weight: 600; }
  /* Cajón del menú en celular */
  .velo { position: fixed; inset: 0; background: rgba(16,24,40,.4); z-index: 25; opacity: 0; pointer-events: none; transition: opacity 200ms ease; }
  .velo.visible { opacity: 1; pointer-events: auto; }
  @media (max-width: 900px) { .menu { transition: none; will-change: transform; } }
  /* Pestañas con indicador que se desplaza */
  .pestanas { position: relative; }
  /* Accesibilidad: menos movimiento, menos transparencia, más contraste */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
    .entra { animation: none; }
    button:active:not(:disabled), .kpi:active, .orden-card:active { transform: none; }
    .modal > div { transform: none !important; transition: opacity 180ms ease; }
    #aviso { transform: translate(-50%, 0); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .barra { background: #fff; -webkit-backdrop-filter: none; backdrop-filter: none; border-bottom-color: var(--borde); }
    .tec-barra { background: var(--menu); -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (prefers-contrast: more) {
    :root { --borde: #8a96a3; --gris: #3d4752; }
    .barra { background: #fff; border-bottom-color: #1f2a37; }
  }
.modal .cuerpo p a svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 2px; }
  /* Resumen financiero */
  .filtros-fin { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; margin-bottom: 16px; }
  .filtros-fin label { margin: 0; }
  .filtros-fin select { width: auto; min-width: 190px; margin-top: 4px; }
  .fn-act { font-size: 13px; padding-bottom: 8px; }
  .fn-hero { display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: flex-end; justify-content: space-between; }
  .fn-hero-v { font-size: 48px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; margin: 2px 0 4px; }
  .fn-sub { display: flex; flex-wrap: wrap; gap: 8px 32px; }
  .fn-sub div { display: flex; flex-direction: column; }
  .fn-sub b { font-size: 18px; }
  .fn-l { font-size: 13px; color: var(--gris); font-weight: 600; }
  .fn-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px; margin: 16px 0; }
  .fn-tiles .tarjeta { margin: 0; }
  .fn-t .fn-v { font-size: 26px; font-weight: 800; line-height: 1.2; margin: 2px 0; }
  .fn-t .gris { font-size: 13px; }
  .delta { display: inline-block; font-size: 13px; font-weight: 700; color: var(--gris); margin-top: 4px; }
  .delta.sube { color: var(--verde); }
  .delta.baja { color: var(--rojo); }
  .fn-graficas { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .fn-graficas .tarjeta { margin: 0; min-width: 0; }
  .fn-s { margin: -6px 0 10px; font-size: 13px; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--gris); margin-bottom: 6px; }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .grafica { position: relative; }
  .grafica svg { display: block; overflow: visible; }
  .grafica .eje { font-size: 11px; fill: var(--gris); font-variant-numeric: tabular-nums; }
  .grafica .eje.fuerte { fill: var(--texto); font-weight: 700; }
  .grafica .golpe { cursor: pointer; outline: none; }
  .grafica .golpe.sobre, .grafica .golpe:focus-visible { fill: rgba(27, 140, 242, .06); }
  .tip { display: none; position: absolute; z-index: 5; pointer-events: none; background: #fff; border: 1px solid var(--borde); border-radius: 10px; box-shadow: 0 6px 20px rgba(16,24,40,.12); padding: 8px 10px; font-size: 13px; min-width: 170px; }
  .tip-t { font-weight: 700; margin-bottom: 4px; color: var(--gris); }
  .tip-f { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .tip-f i { width: 12px; height: 3px; border-radius: 2px; flex: none; }
  .tip-f b { font-variant-numeric: tabular-nums; color: var(--texto); }
  .tip-f span { color: var(--gris); }
  .tip-f.total { border-top: 1px solid var(--borde); margin-top: 4px; padding-top: 4px; padding-left: 20px; }
  .hbarras { display: grid; gap: 6px; }
  .hb { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
  .hb-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--texto); }
  .hb-p { height: 12px; background: #f2f5f8; border-radius: 4px; overflow: hidden; }
  .hb-p i { display: block; height: 100%; background: #2a78d6; border-radius: 0 4px 4px 0; }
  .hb b { font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }
  @media (max-width: 720px) { .fn-graficas { grid-template-columns: 1fr; } .fn-hero-v { font-size: 38px; } }
</style>

<script>
  // ---------- utilidades comunes ----------
  var SES = null;
  var LOGO = document.getElementById('logoLogin').src;
  var $ = function (id) { return document.getElementById(id); };
  var $$ = function (sel, raiz) { return Array.prototype.slice.call((raiz || document).querySelectorAll(sel)); };

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pesos(n) { return '$' + Math.round(Number(n || 0)).toLocaleString('es-CO'); }
  /** Aviso con tipo: '' (estado), 'exito' o 'error'. Entra y sale por el mismo camino. */
  /** Texto sin tildes y en minúscula, para buscar sin que importen las tildes ("jose" encuentra "José"). */
  function plano(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  /** Aviso flotante. alClic opcional: el aviso se puede tocar (por ejemplo, para abrir la orden). */
  function aviso(t, ms, tipo, alClic) {
    var a = $('aviso'); a.textContent = t; a.className = 'visible ' + (tipo || '');
    a.onclick = alClic ? function () { a.className = tipo || ''; alClic(); } : null; a.style.cursor = alClic ? 'pointer' : '';
    clearTimeout(a._t); a._t = setTimeout(function () { a.className = tipo || ''; }, ms || (tipo === 'error' ? 6000 : 3500));
  }
  var MENOS_MOV = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function vibrar(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  /**
   * Resorte: anima desde el valor actual, hereda velocidad y se puede interrumpir en cualquier momento.
   * respuesta (s) = qué tan rápido llega; amortiguacion 1 = sin rebote, 0.8 = rebote leve (solo tras un gesto con impulso).
   */
  function resorte(op) {
    var k = Math.pow(2 * Math.PI / op.respuesta, 2), c = 4 * Math.PI * op.amortiguacion / op.respuesta;
    var x = op.desde, v = op.velocidad || 0, antes = null, vivo = true;
    if (MENOS_MOV) { op.alCambiar(op.hasta); if (op.alTerminar) op.alTerminar(); return { parar: function () {} }; }
    function paso(t) {
      if (!vivo) return;

  function copiaVista(fn, args) {

  function leer(fn, args, pintar) {
    var turno = ++TURNO, copia = copiaVista(fn, args), antes = copia == null ? null : JSON.stringify(copia);
    // Recién traída del servidor (al guardar o en una precarga de hace segundos): no se vuelve a pedir.
    var v = VISTAS[claveVista(fn, args)];
    if (copia != null && v && Date.now() - v.t < 5000) { pintar(copia, false); return Promise.resolve(copia); }
    if (copia != null) pintar(copia, true);
    return llamar(fn, args, false).then(function (r) {
      guardarVista(fn, args, r);

  /**

  function tablaSiigo(cont, op) {

      if (!estado.q) return op.filas;

    }
    function pintar() {
      var fs = filtradas();
      var paginas = Math.max(1, Math.ceil(fs.length / estado.por));
      if (estado.pag > paginas) estado.pag = paginas;
      var desde = (estado.pag - 1) * estado.por, vis = fs.slice(desde, desde + estado.por);

        vis.map(function (f, i) {

            return '<td class="' + (c.der ? 'der' : '') + (c.movil === false ? ' ocultar-movil' : '') + '">' + (c.fmt ? c.fmt(f) : esc(f[c.k])) + '</td>';
          }).join('') + '</tr>';
        }).join('') + '</tbody>' +
        (hayTotal ? '<tfoot><tr>' + op.columnas.map(function (c, i) {
          var v = c.total ? fs.reduce(function (a, f) { return a + Number(f[c.k] || 0); }, 0) : null;
          return '<td class="' + (c.der ? 'der' : '') + (c.movil === false ? ' ocultar-movil' : '') + '">' + (v !== null ? pesos(v) : (i === 0 ? 'Total' : '')) + '</td>';
        }).join('') + '</tr></tfoot>' : '') + '</table></div>' +
        (fs.length <= 25 && op.porPagina === 25 ? '' : '<div class="paginacion">Ítems por página <select data-por>' + [25, 50, 100].map(function (n) { return '<option' + (n === estado.por ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select>' +
        '<span>' + (desde + 1) + ' a ' + Math.min(desde + estado.por, fs.length) + ' de ' + fs.length + '</span>' +
        '<span><button data-p="1">|‹</button><button data-p="' + (estado.pag - 1) + '">‹</button> Página ' + estado.pag + ' de ' + paginas + ' <button data-p="' + (estado.pag + 1) + '">›</button><button data-p="' + paginas + '">›|</button></span></div>')
        : '<div class="vacio">' + esc(op.vacio || 'No hay registros.') + '</div>';
      $$('[data-p]', cont).forEach(function (b) { b.onclick = function () { var p = Number(b.getAttribute('data-p')); if (p >= 1 && p <= paginas) { estado.pag = p; pintar(); } }; });
      var sel = cont.querySelector('[data-por]'); if (sel) sel.onchange = function () { estado.por = Number(sel.value); estado.pag = 1; pintar(); };
      if (op.alClic) $$('tbody tr', cont).forEach(function (tr) {
        tr.onclick = function (e) { if (e.target.closest('a,button,input')) return; op.alClic(fs[Number(tr.getAttribute('data-i'))]); };
        // Al pasar el mouse o empezar a tocar una orden, su detalle ya se va trayendo.
        var f = fs[Number(tr.getAttribute('data-i'))];
        if (f && /^(ODS|GA|SC|PC)-\d+$/.test(f.id || '')) {
          // Con el mouse, solo si se detiene sobre la fila (no al pasar por encima de toda la tabla); al tocar, de una vez.
          var espera = null;
          tr.onpointerenter = function () { espera = setTimeout(function () { precargar('adminDetalle', [f.id]); }, 150); };
          tr.onpointerleave = function () { clearTimeout(espera); };
          tr.ontouchstart = function () { precargar('adminDetalle', [f.id]); };
        }
      });
      if (op.alPintar) op.alPintar(cont);
    }
    cont.innerHTML = '<div class="tarjeta tabla-card">' +
      (op.buscar !== false || op.descargar || op.herramientas ? '<div class="herramientas">' +
        (op.buscar !== false ? '<input class="busq" data-q placeholder="Buscar en la tabla">' : '') +
        (op.herramientas || '') + '<span class="espacio"></span>' +
        (op.descargar ? '<button class="sec" data-csv>' + ICON.descargar + ' Descargar</button>' : '') + '</div>' : '') +
      (op.chips || '') + '<div class="cuerpo-tabla"></div></div>';
    var q = cont.querySelector('[data-q]');
    if (q) { var t; q.oninput = function () { clearTimeout(t); t = setTimeout(function () { estado.q = q.value.trim(); estado.pag = 1; pintar(); }, 250); }; }
    var d = cont.querySelector('[data-csv]');
    if (d) d.onclick = function () { descargarCSV(op.descargar, op.columnas, filtradas()); };

    return { repintar: pintar };

   */
  var RELOJ_NUEVAS = null;
  function vigilarOrdenesNuevas() {

    var abrir = function (id) {

          if (!nuevas.length) return;
          var o = nuevas[0];
          var texto = nuevas.length === 1 ? 'Orden nueva ' + o.id + ' · ' + o.cliente + (o.fecha ? ' · ' + o.fecha : '') + ' · ' + (o.tecnico ? 'técnico: ' + o.tecnico : 'sin técnico asignado') + '.'
            : nuevas.length + ' órdenes nuevas (' + nuevas.map(function (x) { return x.id; }).join(', ') + ').';
          aviso(texto + ' Toque para abrir.', 20000, 'exito', function () { abrir(o.id); });
          vibrar([20, 40, 20]);
          try { if (window.Notification && Notification.permission === 'granted') { var n = new Notification('Family Air · Orden nueva', { body: texto }); n.onclick = function () { window.focus(); abrir(o.id); }; } } catch (e) {}
        });

    clearInterval(RELOJ_NUEVAS); RELOJ_NUEVAS = setInterval(revisar, 60000);

    } catch (e) {}
  }

  /**
   * Aviso cuando un técnico cierra una orden: cada minuto mira las órdenes por revisar y avisa las nuevas
   * (aviso en pantalla que abre la orden, número en "Revisión" y aviso del navegador si está permitido).
   */
  function vigilarRevision() {
    var clave = 'fa_revision_vistas_' + SES.usuario, vistas = leerLocal(clave) || [], version = null;
    // Solo pide la lista cuando hubo cambios (adminVersion es una consulta liviana) y con la pestaña a la vista.
    var revisar = function () {
      if (document.hidden || !navigator.onLine) return;
      api('adminVersion').then(function (v) {
        if (v === version) return;
        version = v;
        return api('adminPorRevisar').then(pintar);
      }).catch(function () { version = null; });
    };
    var pintar = function (l) {
      var el = document.querySelector('[data-cuenta="revision"]'); if (el) { el.style.display = l.length ? '' : 'none'; el.textContent = l.length; }
      var nuevas = l.filter(function (o) { return vistas.indexOf(o.id) < 0; });
      vistas = l.map(function (o) { return o.id; }); guardarLocal(clave, vistas);
      if (!nuevas.length) return;
      var o = nuevas[0], destino = nuevas.length === 1 ? 'orden/' + o.id : 'revision';
      var texto = nuevas.length === 1 ? o.id + ' · ' + o.cliente + ': ' + (o.tecnico || 'el técnico') + ' cerró el servicio. Lista para revisar y enviar al cliente.' : nuevas.length + ' servicios nuevos cerrados por los técnicos, listos para revisar.';
      aviso(texto + ' Toque para abrir.', 15000, 'exito', function () { ir(destino); });
      vibrar([20, 40, 20]);
      try { if (window.Notification && Notification.permission === 'granted') { var n = new Notification('Family Air · Por revisar', { body: texto }); n.onclick = function () { window.focus(); ir(destino); }; } } catch (e) {}
    };
    revisar();
    clearInterval(AD.relojRevision); AD.relojRevision = setInterval(revisar, 60000);
    document.removeEventListener('visibilitychange', AD.revisarAlVolver); AD.revisarAlVolver = revisar;
    document.addEventListener('visibilitychange', revisar);
    try {
      if (window.Notification && Notification.permission === 'default') document.addEventListener('click', function pedir() { document.removeEventListener('click', pedir); try { Notification.requestPermission(); } catch (e) {} });
    } catch (e) {}
  }

  /** Menú lateral en celular: entra desde la izquierda y sale por el mismo lado; se puede cerrar arrastrándolo. */
  function cajonMenu() {
    var menu = $('menu'), velo = $('velo'), x = -1, anim = null, g = null;
    var ancho = function () { return menu.offsetWidth || 260; };
    var esMovil = function () { return window.matchMedia('(max-width: 900px)').matches; };
    function poner(v) { x = v; menu.style.transform = 'translateX(' + v + 'px)'; velo.style.opacity = String(Math.max(0, Math.min(1, 1 + v / ancho()))); }
    function mover(hasta, vel) {
      if (anim) anim.parar();
      velo.classList.add('visible');
      anim = resorte({ desde: x === -1 ? -ancho() : x, hasta: hasta, velocidad: vel || 0, respuesta: 0.3, amortiguacion: 1, alCambiar: poner,
        alTerminar: function () { if (hasta < 0) { velo.classList.remove('visible'); menu.style.transform = ''; velo.style.opacity = ''; x = -1; } } });
    }
    AD.cerrarMenu = function () { if (esMovil() && x !== -1) mover(-ancho()); };
    $('btnMenu').onclick = function () { if (x === -1) { poner(-ancho()); mover(0); } else mover(-ancho()); };
    velo.onclick = AD.cerrarMenu;
    menu.addEventListener('pointerdown', function (e) {
      if (!esMovil() || x === -1 || e.pointerType === 'mouse') return;
      if (anim) anim.parar();
      g = { x0: x, px: e.clientX, id: e.pointerId, mov: false, hist: [{ t: performance.now(), v: e.clientX }] };
    });
    menu.addEventListener('pointermove', function (e) {
      if (!g || e.pointerId !== g.id) return;
      var d = e.clientX - g.px;
      if (!g.mov) { if (Math.abs(d) < 10) return; g.mov = true; menu.setPointerCapture(g.id); }
      var v = g.x0 + d; poner(v > 0 ? goma(v, ancho()) : v);
      g.hist.push({ t: performance.now(), v: e.clientX }); if (g.hist.length > 6) g.hist.shift();
    });
    var soltar = function (e) {
      if (!g || e.pointerId !== g.id) return;
      var mov = g.mov, vel = velocidadDe(g.hist); g = null;
      if (!mov) return;
      menu._arrastro = true; setTimeout(function () { menu._arrastro = false; }, 0);
      mover(x + proyectar(vel) < -ancho() / 2 ? -ancho() : 0, vel);
    };
    menu.addEventListener('pointerup', soltar); menu.addEventListener('pointercancel', soltar);
    menu.addEventListener('click', function (e) { if (menu._arrastro) { e.preventDefault(); e.stopPropagation(); } }, true);
  }

  /**

  function vigilarCambios() {
    clearInterval(AD.relojCambios);
    AD.version = undefined;
    api('adminVersion').then(function (v) { if (AD.version === undefined) AD.version = v; }).catch(function () {});
    AD.relojCambios = setInterval(function () {
      if (document.hidden || !navigator.onLine) return;
      api('adminVersion').then(function (v) {
        if (AD.version === undefined) { AD.version = v; return; }
        if (v === AD.version || !puedeRefrescar()) return;
        AD.version = v; refrescarVista();
      }).catch(function () {});
    }, 30000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && AD.version !== undefined) api('adminVersion').then(function (v) { if (v !== AD.version && puedeRefrescar()) { AD.version = v; refrescarVista(); } }).catch(function () {}); });
  }
  function puedeRefrescar() {
    if (AD.enFormulario || document.querySelector('.modal')) return false;

  }
  function refrescarVista() {
    var y = window.scrollY;

  /** Enviar el soporte (PDF de la ODS) por WhatsApp o correo, con los datos que dejó el cliente. */
  function modalSoporte(d, listo) {
    var m = modal('Enviar soporte · ' + d.id, cargando('Generando el PDF de la orden…'), 620);
    api('adminSoporte', d.id).then(function (r) {
      m.querySelector('.cuerpo').innerHTML =
        '<p style="margin-top:0">PDF generado. <a href="' + urlDrive(r.pdfId) + '" target="_blank">Ver PDF</a> · <a href="' + urlDescarga(r.pdfId) + '" target="_blank" download="' + esc(d.id) + '.pdf">' + ICON.descargar + ' Descargar</a>' + (r.enviado ? '<br><span class="gris">Ya enviado: ' + esc(r.enviado).replace(/\n/g, ' / ') + '</span>' : '') + '</p>' +
        '<label>Enviar por</label>' + opciones('spCanal', ['WHATSAPP', 'CORREO'], r.canal, false, { WHATSAPP: 'WhatsApp', CORREO: 'Correo' }) +
        '<label id="spEt">' + (r.canal === 'CORREO' ? 'Correo del cliente' : 'WhatsApp del cliente') + '</label><input id="spDest" value="' + esc(r.destino) + '">' +
        '<label>Mensaje</label><textarea id="spMsg" rows="5"></textarea>' +
        '<div class="acciones der" id="spAcc"></div><p class="gris" id="spAyuda"></p>';
      activarOpciones(m);
      // Por WhatsApp va el link del PDF dentro del mensaje; por correo va adjunto.
      var mensajeDe = function (canal) { return canal === 'CORREO' ? r.mensaje : r.mensaje + '\n\nSoporte de la orden: ' + r.enlace; };
      $('spMsg').value = mensajeDe(r.canal);
      var pintarAcc = function () {
        var canal = valorOpcion('spCanal', m);
        $('spEt').textContent = canal === 'CORREO' ? 'Correo del cliente' : 'WhatsApp del cliente';
        $('spAcc').innerHTML = canal === 'CORREO' ? '<button id="spCorreo">Enviar correo con el PDF</button>'
          : '<button id="spWa">' + ICON.wa + ' Enviar por WhatsApp</button>';
        $('spAyuda').textContent = canal === 'CORREO' ? 'El correo sale desde la cuenta de Family Air con el PDF adjunto.' : 'Se abre el chat del cliente con el mensaje y el link del PDF. Si el link no abre, use Descargar y adjunte el PDF en el chat.';
        if ($('spCorreo')) $('spCorreo').onclick = function () {
          var dest = $('spDest').value.trim();
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(dest)) { marcarError($('spDest'), 'Escriba un correo válido.'); return; }
          api('adminSoporteCorreo', d.id, dest, $('spMsg').value).then(function (nd) { m.remove(); aviso('Soporte enviado a ' + dest + '.', 0, 'exito'); listo(nd); }).catch(function (e) { aviso(e.message, 0, 'error'); });
        };
        if ($('spWa')) $('spWa').onclick = function () {
          var dest = $('spDest').value.trim();
          if (dest.replace(/\D/g, '').length < 10) { marcarError($('spDest'), 'Escriba un WhatsApp de 10 dígitos.'); return; }
          window.open(urlWhatsapp(dest) + '?text=' + encodeURIComponent($('spMsg').value), '_blank');
          api('adminSoporteWhatsapp', d.id, dest).then(function (nd) { m.remove(); aviso('Chat del cliente abierto con el link del soporte.', 0, 'exito'); listo(nd); }).catch(function (e) { aviso(e.message, 0, 'error'); });
        };
      };
      $$('input[name="spCanal"]', m).forEach(function (x) { x.addEventListener('change', function () { $('spDest').value = r.sugerido[x.value] || ''; $('spMsg').value = mensajeDe(x.value); pintarAcc(); }); });
      pintarAcc();
    }).catch(function (e) { m.querySelector('.cuerpo').innerHTML = '<p class="error">' + esc(e.message) + '</p>'; });
  }

  // ---------- Productos de Siigo: cada ítem que va en una factura necesita el código de un producto que exista allá ----------
  var PRODUCTOS_SIIGO = null; // null = sin cargar; [] = Siigo sin conectar
  function productosSiigo() {
    if (PRODUCTOS_SIIGO) return Promise.resolve(PRODUCTOS_SIIGO);
    return api('adminProductosSiigo').then(function (r) { PRODUCTOS_SIIGO = r.conectado ? r.productos : []; listaProductosSiigo(); return PRODUCTOS_SIIGO; })
      .catch(function () { return []; });
  }
  /** Lista de sugerencias (datalist) para escribir el código o buscar el producto por nombre. */
  function listaProductosSiigo() {
    var dl = $('dlSiigo');
    if (!dl) { dl = document.createElement('datalist'); dl.id = 'dlSiigo'; document.body.appendChild(dl); }
    dl.innerHTML = (PRODUCTOS_SIIGO || []).map(function (p) { return '<option value="' + esc(p.codigo) + '" label="' + esc(p.codigo + ' · ' + p.nombre) + '"></option>'; }).join('');
  }
  function productoSiigo(cod) {
    var c = String(cod || '').trim().toUpperCase();
    return (PRODUCTOS_SIIGO || []).filter(function (p) { return p.codigo.toUpperCase() === c; })[0];
  }
  /** Ítems sin un producto válido de Siigo. Sin catálogo cargado solo revisa que tengan código. */
  function itemsSinProducto(items) {
    var hay = PRODUCTOS_SIIGO && PRODUCTOS_SIIGO.length;
    return items.filter(function (i) { return !String(i.cod || '').trim() || (hay && !productoSiigo(i.cod)); });
  }

  // ---------- Editor de ítems (crear, editar y liquidar) ----------
  function editorItems(cont, items, getTarifa, getTipo) {
    var lista = (items || []).map(function (i) { return { cod: i.cod, desc: i.desc, cat: i.cat || 'SERVICIO', cant: i.cant, valor: i.valor }; });
    function precio(t) { return getTarifa() === 'EMPRESARIAL' ? t.empresarial : t.plena; }
    function pintar() {
      var tipo = getTipo();
      var sugeridas = AD.tarifas.filter(function (t) { return !tipo || !t.tipoServicio || t.tipoServicio === tipo; });
      cont.innerHTML = '<div class="tabla-scroll"><table class="items"><thead><tr><th style="width:120px">Código</th><th>Descripción</th><th style="width:140px">Categoría</th><th style="width:80px" class="der">Cant.</th><th style="width:140px" class="der">Valor unit.</th><th class="der" style="width:120px">Subtotal</th><th></th></tr></thead><tbody>' +
        lista.map(function (i, n) {
          var malo = PRODUCTOS_SIIGO && PRODUCTOS_SIIGO.length && !productoSiigo(i.cod);
          return '<tr data-n="' + n + '"><td><input data-c="cod" list="dlSiigo" placeholder="Código Siigo" value="' + esc(i.cod) + '"' + (malo ? ' class="sin-siigo" title="' + (i.cod ? 'Este código no existe en Siigo' : 'Falta el código del producto en Siigo') + '"' : '') + '></td><td><input data-c="desc" value="' + esc(i.desc) + '"></td>' +
            '<td><select data-c="cat">' + AD.cat.categorias.map(function (c) { return '<option' + (c === i.cat ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></td>' +
            '<td><input data-c="cant" type="number" min="0" step="1" value="' + esc(i.cant) + '"></td><td><input data-c="valor" type="number" min="0" step="1000" value="' + esc(i.valor) + '"></td>' +
            '<td class="der">' + pesos((Number(i.cant) || 0) * (Number(i.valor) || 0)) + '</td><td><button class="x" data-quitar title="Quitar">×</button></td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="acciones" style="padding:0 4px"><select id="itTarifa" style="max-width:420px"><option value="">+ Agregar de la lista de tarifas…</option>' +
        sugeridas.map(function (t, n) { return '<option value="' + AD.tarifas.indexOf(t) + '">' + esc(t.codigo + ' · ' + t.nombre + ' · ' + pesos(precio(t))) + '</option>'; }).join('') + '</select>' +
        '<button class="sec" id="itLibre">' + ICON.mas + ' Ítem libre</button></div>' +
        '<div class="totales" id="itTot"></div>';
      $$('tr[data-n]', cont).forEach(function (tr) {
        var n = Number(tr.getAttribute('data-n'));
        $$('[data-c]', tr).forEach(function (inp) {
          inp.oninput = inp.onchange = function () { lista[n][inp.getAttribute('data-c')] = inp.value; tr.children[5].textContent = pesos((Number(lista[n].cant) || 0) * (Number(lista[n].valor) || 0)); totales(); };
          // Al escoger el producto de Siigo: código como lo tiene Siigo y, si falta, su nombre como descripción.
          if (inp.getAttribute('data-c') === 'cod') inp.addEventListener('change', function () {
            var p = productoSiigo(inp.value);
            if (p) { lista[n].cod = inp.value = p.codigo; if (!String(lista[n].desc || '').trim()) lista[n].desc = tr.querySelector('[data-c="desc"]').value = p.nombre; }
            inp.classList.toggle('sin-siigo', !!(PRODUCTOS_SIIGO && PRODUCTOS_SIIGO.length && !p));
          });
        });
        tr.querySelector('[data-quitar]').onclick = function () { lista.splice(n, 1); pintar(); };
      });
      cont.querySelector('#itTarifa').onchange = function () {
        var t = AD.tarifas[Number(this.value)]; if (!t) return;
        lista.push({ cod: t.codigo, desc: t.nombre, cat: t.categoria || 'SERVICIO', cant: 1, valor: precio(t) }); pintar();
      };
      cont.querySelector('#itLibre').onclick = function () { lista.push({ cod: '', desc: '', cat: 'SERVICIO', cant: 1, valor: 0 }); pintar(); };
      totales();
    }
    function totales() {
      var s = { SERVICIO: 0, MATERIAL: 0, TRANSPORTE: 0 };
      lista.forEach(function (i) { s[i.cat] = (s[i.cat] || 0) + (Number(i.cant) || 0) * (Number(i.valor) || 0); });
      cont.querySelector('#itTot').innerHTML = '<div><span>Mano de obra</span><span>' + pesos(s.SERVICIO) + '</span></div><div><span>Materiales</span><span>' + pesos(s.MATERIAL) + '</span></div><div><span>Transporte</span><span>' + pesos(s.TRANSPORTE) + '</span></div><div class="t"><span>Total</span><span>' + pesos(s.SERVICIO + s.MATERIAL + s.TRANSPORTE) + '</span></div>';
    }
    pintar();
    return { valor: function () { return lista.filter(function (i) { return String(i.desc || i.cod).trim(); }).map(function (i) { return { cod: i.cod, desc: i.desc, cat: i.cat, cant: Number(i.cant) || 0, valor: Number(i.valor) || 0 }; }); }, repintar: pintar, poner: function (nueva) { lista = nueva.map(function (i) { return { cod: i.cod, desc: i.desc, cat: i.cat || 'SERVICIO', cant: i.cant, valor: i.valor }; }); pintar(); }, vacio: function () { return !lista.length; } };
  }

      if (!F.cliente) return;
      elegirCliente(F.cliente.id, F.sede && F.sede.id, equiposMarcados(), F.extras);
      api('adminClientes').then(function (l) { AD.clientes = l; });
    }
    if ($('oEditSede')) $('oEditSede').onclick = function () { if (F.sede) modalSede(F.cliente.id, function () { recargarCliente(); }, F.sede); };
    if ($('oDelSede')) $('oDelSede').onclick = function () {
      if (F.sede) eliminarMaestra('SEDES', F.sede, function () { F.sede = null; elegirCliente(F.cliente.id); });
    };
    $('oSede').onchange = function () { pintarSede(); };
    $('oFichaOn').onchange = pintarFichas;
    if ($('oNuevoCli')) $('oNuevoCli').onclick = function () { modalClienteNuevo(function (r) { elegirCliente(r.id, r.idSede); }); };
    if ($('oNuevaSede')) $('oNuevaSede').onclick = function () { if (F.cliente) modalSede(F.cliente.id, function (idSede) { elegirCliente(F.cliente.id, idSede); }); };
    if ($('oNuevoEq')) $('oNuevoEq').onclick = function () {
      if (!F.sede) return;
      var marcados = equiposMarcados();
      modalEquipo(F.sede.id, function (idEq) { elegirCliente(F.cliente.id, F.sede.id, marcados.concat([idEq]), F.extras); });
    };
    if (pre.idCliente) elegirCliente(pre.idCliente, pre.idSede, pre.equiposIds || [], (pre.sedesExtra || []).map(function (s) { return s.id || s; }));
    $('oCancelar').onclick = function () {
      if (editar) { ir('orden/' + id); return; }
      if (!leerLocal(claveBorrador)) { history.back(); return; }
      confirmar('Se descarta lo que lleva escrito de esta orden.', 'Descartar', true).then(function (si) { if (si) { borrarLocal(claveBorrador); ir('ordenes'); } });
    };
    if ($('oDescartar')) $('oDescartar').onclick = function () {
      confirmar('Se borra el borrador y el formulario queda en blanco.', 'Descartar borrador', true).then(function (si) { if (si) { borrarLocal(claveBorrador); formOrden(null, {}); } });
    };
    // El borrador se guarda en cada cambio; al salir de la pantalla sin guardar queda para la próxima vez.
    function guardarBorrador() {
      if (editar || !document.body.contains(cont) || !$('oGuardar') || $('oGuardar').disabled) return;
      var d = recoger();
      if (!d.idCliente && !d.falla && !d.solicitud && !d.cotizacion && !d.oc && !d.tipoServicio) return;
      d.tipoOrden = valorOpcion('oTipoOrden'); d.ocCorreo = ocCorreo;
      guardarLocal(claveBorrador, { fecha: new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16), datos: d });
    }
    if (!editar) { cont.addEventListener('input', guardarBorrador); cont.addEventListener('change', guardarBorrador); }

    function recoger() {
      var datos = {
        idCliente: F.cliente && F.cliente.id, idSede: F.sede && F.sede.id,
        equipos: equiposMarcados(), sedesExtra: F.extras.slice(),
        tipoServicio: valorOpcion('oTipo'), tarifa: valorOpcion('oTarifa'), falla: $('oFalla').value.trim(),
        tecnico: $('oTec').value, apoyo: $('oTec').value ? valoresOpcion('oApoyo').filter(function (u) { return u !== $('oTec').value; }) : [], fechaProgramada: $('oFecha').value ? $('oFecha').value + ($('oHora').value ? ' ' + $('oHora').value : '') : '',
        pendDisponibilidad: $('oConf').checked, requierePermisos: $('oPerm').checked,
        contacto: $('oContacto').value.trim(), telefono: $('oTel').value.trim(), solicitud: $('oSolicitud').value.trim(),
        cotizacion: datosCot(), oc: datosOC(),
        obsInternas: $('oObsInt').value.trim(), fichas: $('oFichaOn').checked ? leerFichas($('oFichas'), AD.cat.fichaTareas) : []
      };
      if ($('oCaso')) datos.numeroCaso = $('oCaso').value.trim();
      return datos;
    }
    /** Después de guardar: borra el borrador y, si se pidió, adjunta el PDF de la OC desde el correo. */
    function despuesDeGuardar(idOrden, mensaje, datos) {
      if (!editar) borrarLocal(claveBorrador);
      var ocNum = datos.oc && datos.oc.numero;
      if (!(ocCorreo && ocNum && ocCorreo.toUpperCase() === ocNum.toUpperCase())) { aviso(mensaje, 0, 'exito'); ir('orden/' + idOrden); return; }
      aviso(mensaje + ' Buscando la OC ' + ocNum + ' en el correo…');
      api('adminOCDesdeCorreo', idOrden).then(function () { aviso(mensaje + ' PDF de la OC ' + ocNum + ' adjunto.', 0, 'exito'); })
        .catch(function (e) { aviso('La orden quedó guardada, pero la OC no se adjuntó: ' + e.message, 9000, 'error'); })
        .then(function () { ir('orden/' + idOrden); });
    }

    $('oGuardar').onclick = function () {
      var bt = this;
      var datos = recoger();
      var hayError = false;
      if (!datos.idCliente) { marcarError($('oBuscar'), 'Escoja el cliente.'); hayError = true; }
      var sinCobro = (editar ? pre.tipoOrden : valorOpcion('oTipoOrden')) === 'SIN_COBRO';
      if (datos.idCliente && !datos.idSede && !sinCobro) { marcarError($('oSede'), 'El cliente necesita una sede.'); hayError = true; }
      if (!datos.tipoServicio && !sinCobro) { marcarError(document.querySelector('[data-opciones="oTipo"]'), 'Escoja el tipo de servicio.'); hayError = true; }
      if ($('oCaso') && $('oCasoBox') && $('oCasoBox').style.display !== 'none' && !datos.numeroCaso) { marcarError($('oCaso'), 'La garantía necesita el número de caso.'); hayError = true; }
      if (hayError) { $('oMsg').innerHTML = ''; irAlError(cont); return; }
      bt.disabled = true; $('oMsg').textContent = 'Guardando…';
      var p;
      if (editar) {
        if ($('oTrabajo')) { datos.trabajo = $('oTrabajo').value; datos.obs = $('oObs').value; datos.recibeNombre = $('oRecibe').value; datos.recibeDoc = $('oRecibeDoc').value; datos.estadoArtefacto = valoresOpcion('oArt'); }
        // Solo se envían los campos que cambiaron.
        var orig = {
          idCliente: pre.idCliente, idSede: pre.idSede, equipos: pre.equiposIds, tipoServicio: pre.tipoServicio, tarifa: pre.tarifa, falla: pre.falla || '',
          items: (pre.items || []).map(function (i) { return { cod: i.cod, desc: i.desc, cat: i.cat, cant: Number(i.cant), valor: Number(i.valor) }; }),
          tecnico: pre.tecnico || '', apoyo: pre.apoyo || [], fechaProgramada: pre.fechaProgramada || '', pendDisponibilidad: pre.pendDisponibilidad, requierePermisos: pre.requierePermisos,
          contacto: pre.contacto || '', telefono: pre.telefono || '', solicitud: pre.solicitud || '', numeroCaso: pre.numeroCaso || '',
          obsInternas: pre.obsInternas || '', fichas: pre.fichas || [],
          cotizacion: pre.cotizacion ? { numero: pre.cotizacion, id: pre.cotizacionId || '', fecha: pre.cotizacionFecha || '', total: pre.cotizacionTotal == null ? '' : pre.cotizacionTotal, items: pre.cotizacionItems || [] } : '',
          oc: pre.oc ? { numero: pre.oc.numero, fecha: pre.oc.fecha || '', valor: pre.oc.valor == null ? '' : pre.oc.valor, id: pre.oc.id || '', tercero: pre.oc.tercero || '', items: pre.oc.items || [] } : '',
          trabajo: pre.trabajo || '', obs: pre.obs || '', recibeNombre: pre.recibeNombre || '', recibeDoc: pre.recibeDoc || '', estadoArtefacto: pre.estadoArtefacto || []
        };
        var cambios = {};
        Object.keys(datos).forEach(function (k) { if (JSON.stringify(datos[k]) !== JSON.stringify(orig[k])) cambios[k] = datos[k]; });
        if (cambios.idCliente || cambios.idSede) { cambios.idCliente = datos.idCliente; cambios.idSede = datos.idSede; }
        if (!Object.keys(cambios).length) { ir('orden/' + id); return; }
        p = api('adminEditar', id, cambios).then(function (nd) { guardarVista('adminDetalle', [nd.id], nd); despuesDeGuardar(nd.id, nd.id !== id ? 'Servicio confirmado: ' + nd.id + '.' : 'Cambios guardados en ' + id + '.', datos); });
      } else {
        datos.tipoOrden = valorOpcion('oTipoOrden');
        p = api('adminCrearODS', datos).then(function (nuevo) { despuesDeGuardar(nuevo, /^PC-/.test(nuevo) ? 'Orden ' + nuevo + ' por confirmar. El número ODS se asigna al confirmar.' : 'Orden ' + nuevo + ' creada.', datos); });
      }
      p.catch(function (e) { $('oMsg').innerHTML = '<span class="error">' + esc(e.message) + '</span>'; bt.disabled = false; });
    };
  }

  /** Convierte lo guardado en el borrador al formato con el que se abre el formulario. */
  function preDeBorrador(d) {
    var cot = d.cotizacion || null, oc = d.oc || null;
    return {
      idCliente: d.idCliente, idSede: d.idSede, sedesExtra: d.sedesExtra || [], equiposIds: d.equipos || [], tipoServicio: d.tipoServicio, tarifa: d.tarifa, falla: d.falla,
      tecnico: d.tecnico, apoyo: d.apoyo || [], fechaProgramada: d.fechaProgramada, pendDisponibilidad: d.pendDisponibilidad, requierePermisos: d.requierePermisos,
      contacto: d.contacto, telefono: d.telefono, solicitud: d.solicitud, obsInternas: d.obsInternas, fichas: d.fichas || [],
      tipoOrden: d.tipoOrden, numeroCaso: d.numeroCaso, ocCorreo: d.ocCorreo || '',
      cotizacion: cot ? cot.numero : '', cotizacionId: cot ? cot.id : '', cotizacionFecha: cot ? cot.fecha : '',
      cotizacionTotal: cot && cot.total !== '' && cot.total != null ? cot.total : null, cotizacionItems: cot ? cot.items : [],
      oc: oc ? { numero: oc.numero, fecha: oc.fecha, valor: oc.valor === '' ? null : oc.valor, id: oc.id, tercero: oc.tercero, items: oc.items || [] } : null

  /** Eliminar una sede o un equipo: sale de las listas; la fila queda en la hoja como Eliminada/Eliminado. */
  function eliminarMaestra(tipo, x, listo) {
    var nombre = tipo === 'SEDES' ? 'la sede ' + (x.nombre || x.direccion) + ' (' + x.id + ')' : 'el equipo ' + x.texto;
    confirmar('Se elimina ' + nombre + '. Deja de aparecer al crear órdenes y en la programación de mantenimientos' + (tipo === 'SEDES' ? ', con todos sus equipos' : '') + '. Las órdenes anteriores lo siguen mostrando.', 'Eliminar', true).then(function (si) {
      if (!si) return;
      api('adminEliminarMaestra', tipo, x.id).then(function () { aviso(tipo === 'SEDES' ? 'Sede eliminada.' : 'Equipo eliminado.', 0, 'exito'); listo(); })
        .catch(function (e) { aviso(e.message, 9000, 'error'); });
    });
  }

  // ---------- Cliente, sede y equipo nuevos ----------
  /** Un equipo con sus dos unidades: evaporadora (interior) y condensadora (exterior). */

  /** nit: viene de la búsqueda de la orden; se busca de una vez en la base y en Siigo. */
  function modalClienteNuevo(listo, nit) {
    var m = modal('Cliente nuevo',
      '<p class="gris">Queda guardado en la base maestra (CLIENTES, SEDES y EQUIPOS). Si el cliente ya está creado en Siigo, escriba el NIT o la cédula y toque <b>Traer de Siigo</b>.</p>' +

      '<div><label>Tipo de documento</label><select id="cnTipoDoc"><option>NIT</option><option>CC</option><option>CE</option><option>PASAPORTE</option></select></div><div><label>Tipo de cliente</label><select id="cnTipoCli"><option>EMPRESA</option><option>PERSONA</option></select></div>' +
      '<div><label>Teléfono</label><input id="cnTel" inputmode="tel"></div><div><label>Correo</label><input id="cnEmail" type="email"></div></div>' +
      '<h3>Sede</h3><div id="cnSede">' + camposSede() + '</div>' +

      '<div class="tarjeta" id="cnSiigoBox" style="padding:10px 14px;margin-top:12px"><label class="chk"><input type="checkbox" id="cnCrearSiigo" checked> <b>Crear también en Siigo</b></label>' +
        '<div id="cnSiigoCampos"><p class="gris" style="margin:4px 0">Para la factura electrónica Siigo pide el <b>correo</b> (arriba) y la responsabilidad fiscal. Si algo falta, el cliente queda en la app y se crea en Siigo al facturar.</p>' +
        '<label>Responsabilidad fiscal</label><select id="cnResp">' + ((AD.cat && AD.cat.responsabilidadesSiigo) || [{ codigo: 'R-99-PN', nombre: 'No responsable' }]).map(function (x) { return '<option value="' + esc(x.codigo) + '">' + esc(x.nombre) + '</option>'; }).join('') + '</select></div></div>' +
      '<div class="acciones der"><button id="cnGuardar">Guardar cliente</button></div><p id="cnMsg"></p>', 820);
    $('cnCrearSiigo').onchange = function () { $('cnSiigoCampos').style.display = this.checked ? '' : 'none'; };
    m.querySelector('#cnMasEq').onclick = function () { var d = document.createElement('div'); d.className = 'tarjeta'; d.style.padding = '10px 14px'; d.innerHTML = camposEquipo(); $('cnEquipos').appendChild(d); };
    // Cliente creado en Siigo que no está en la app: se traen sus datos al formulario para revisarlos y guardar.
    var msgSiigo = function (html, tipo) { $('cnSiigoMsg').innerHTML = html ? '<span class="' + (tipo || 'gris') + '">' + html + '</span>' : ''; };
    var poner = function (id, v) { if (v) $(id).value = v; };
    var traerSiigo = function (auto) {
      var n = $('cnNit').value.replace(/\D/g, '');
      if (n.length < 5) { if (!auto) msgSiigo('Escriba el NIT o la cédula completos (sin DV).', 'error'); return; }
      msgSiigo('Buscando ' + esc(n) + ' en la base y en Siigo…');
      api('adminBuscarClienteSiigo', n).then(function (r) {
        if (r.enApp) {
          msgSiigo('Ya existe en la app: <b>' + esc(r.enApp.nombre) + '</b> (' + esc(r.enApp.id) + '). <button class="link" id="cnUsar">Usar este cliente</button>', 'error');
          $('cnUsar').onclick = function () { m.remove(); listo({ id: r.enApp.id }); };
          return;

        if (!r.conectado) return msgSiigo('Siigo no está conectado: llene los datos a mano.', 'error');

        poner('cnNombre', r.nombre); poner('cnDv', r.dv); poner('cnTel', r.telefono); poner('cnEmail', r.email);
        if (r.tipoDocumento) $('cnTipoDoc').value = r.tipoDocumento;
        $('cnTipoCli').value = r.tipoCliente;
        var sd = $('cnSede');

        msgSiigo('✓ Datos traídos de Siigo (<b>' + esc(r.nombre) + '</b>): revise la sede (barrio, contacto) y agregue los equipos.', 'exito');

      var d = { nombre: $('cnNombre').value.trim(), nit: $('cnNit').value.trim(), dv: $('cnDv').value.trim(), tipoDocumento: $('cnTipoDoc').value, tipoCliente: $('cnTipoCli').value,

      if (d.siigo && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)) {

      }
      $('cnMsg').innerHTML = '<span class="gris">' + (d.siigo ? 'Guardando en la app y en Siigo…' : 'Guardando…') + '</span>';
      api('adminCrearCliente', d).then(function (r) {
        AD.clientes.push({ id: r.id, nombre: d.nombre, nit: d.nit, estado: 'Activo', telefono: d.telefono, ciudad: d.sede.ciudad });

        var sg = r.siigo;

        else aviso('Cliente ' + d.nombre + ' guardado (' + r.id + ')' + (sg ? (sg.creado ? ' y creado en Siigo.' : '. Ya estaba en Siigo.') : '.'), 0, 'exito');
        listo(r);
      }).catch(function (e) { $('cnMsg').innerHTML = '<span class="error">' + esc(e.message) + '</span>'; bt.disabled = false; });
    };
  }

  /** Escoger el producto de Siigo de los ítems que no lo tienen; se guarda el código y sigue la factura o la cotización. */

          (r.puedeCrear ? '<label class="chk" style="margin-top:8px"><input type="checkbox" data-crear' + (crear ? ' checked' : '') + '> <span>Crear en Siigo como ' + NOMBRES_CAT[x.cat || 'SERVICIO'] + ' nuevo, con código automático</span></label>' : '') +
          '<input data-n="' + x.n + '" list="dlSiigo" placeholder="Código o nombre del producto en Siigo" value="' + esc(x.parecido || '') + '"' + (crear ? ' disabled' : '') + ' style="margin-top:8px">' +
          (x.parecido ? '<p class="gris" style="margin:4px 0 0">Ya hay un producto en Siigo con ese nombre: se usa ese.</p>' : '') + '</div>';
      }).join('') +
      '<div class="acciones der"><button id="psOk">' + esc(textoBoton || 'Guardar y enviar a Siigo') + '</button></div><p id="psMsg"></p>', 680);
    // Si escribe el nombre en vez del código, se toma el producto cuyo nombre coincide.
    var resolver = function (v) {
      var p = productoSiigo(v); if (p) return p;
      var t = plano(v).trim();
      var l = (PRODUCTOS_SIIGO || []).filter(function (x) { return plano(x.nombre) === t || plano(x.codigo + ' · ' + x.nombre) === t; });

      });
      if (malos.length) { $('psMsg').innerHTML = '<span class="error">Escoja un producto de Siigo para cada ítem' + (r.puedeCrear ? ' o márquelo para crearlo' : '') + '.</span>'; malos[0].focus(); return; }
      bt.disabled = true; $('psMsg').innerHTML = codigos.some(function (c) { return c.crear; }) ? '<span class="gris">Creando los productos en Siigo…</span>' : '';

        m.remove(); aviso((res.creados ? res.creados + ' producto(s) creado(s) en Siigo. ' : 'Productos guardados. ') + 'Continuando…', 0, 'exito'); alGuardar();
      }).catch(function (e) { $('psMsg').innerHTML = '<span class="error">' + esc(e.message) + '</span>'; bt.disabled = false; });

  // ---------- Liquidación, cobro, retorno ----------
  /**
   * Cotización y orden de compra junto a los ítems de la orden, con las diferencias contra la cotización
   * (líneas que faltan o sobran, cantidades y precios distintos), para rectificar al liquidar.
   */
  function comparativo(d, actuales) {
    var suma = function (l) { return l.reduce(function (a, i) { return a + Math.round((Number(i.cant) || 0) * (Number(i.valor) || 0)); }, 0); };
    var tabla = function (lineas) {
      if (!lineas || !lineas.length) return '<p class="gris">Sin líneas (número escrito a mano o sin traer de Siigo).</p>';
      return '<div class="tabla-scroll"><table><thead><tr><th>Código</th><th>Descripción</th><th class="der">Cant.</th><th class="der">Valor</th><th class="der">Subtotal</th></tr></thead><tbody>' +
        lineas.map(function (i) { return '<tr><td>' + esc(i.cod) + '</td><td>' + esc(i.desc) + '</td><td class="der">' + esc(i.cant) + '</td><td class="der">' + pesos(i.valor) + '</td><td class="der">' + pesos(Math.round(i.cant * i.valor)) + '</td></tr>'; }).join('') +
        '<tr><td></td><td><b>Total</b></td><td></td><td></td><td class="der"><b>' + pesos(suma(lineas)) + '</b></td></tr></tbody></table></div>';
    };
    var html = '';
    if (d.cotizacion) {
      html += '<h3>Cotización ' + esc(d.cotizacion) + (d.cotizacionFecha ? ' · ' + esc(d.cotizacionFecha) : '') + (d.cotizacionTotal != null ? ' · ' + pesos(d.cotizacionTotal) : '') + '</h3>' + tabla(d.cotizacionItems);
      var cot = d.cotizacionItems || [];
      if (cot.length && !(actuales || []).length) html += '<p class="gris" style="margin:10px 0">La orden aún no tiene ítems: al liquidar arranca con estas líneas.</p>';
      else if (cot.length) {
        var clave = function (i) { return String(i.cod || i.desc || '').trim().toUpperCase(); };
        var dif = [];
        cot.forEach(function (c) {
          var a = (actuales || []).filter(function (x) { return clave(x) === clave(c); })[0];
          if (!a) { dif.push('No está en la orden: <b>' + esc(c.cod || c.desc) + '</b> (' + esc(c.cant) + ' × ' + pesos(c.valor) + ')'); return; }
          if (Number(a.cant) !== Number(c.cant)) dif.push('<b>' + esc(c.cod || c.desc) + '</b>: cantidad ' + esc(a.cant) + ' en la orden, ' + esc(c.cant) + ' cotizada');
          if (Number(a.valor) !== Number(c.valor)) dif.push('<b>' + esc(c.cod || c.desc) + '</b>: valor ' + pesos(a.valor) + ' en la orden, ' + pesos(c.valor) + ' cotizado');
        });
        (actuales || []).forEach(function (a) { if (!cot.some(function (c) { return clave(c) === clave(a); })) dif.push('No estaba cotizado: <b>' + esc(a.cod || a.desc) + '</b> (' + esc(a.cant) + ' × ' + pesos(a.valor) + ')'); });
        var tOrden = suma(actuales || []), tCot = suma(cot);
        html += dif.length || tOrden !== tCot
          ? '<div class="nota-interna" style="margin:10px 0"><b>Diferencias con la cotización</b>' + dif.map(function (x) { return '<div class="dif">' + x + '</div>'; }).join('') + (tOrden !== tCot ? '<div class="dif">Total de la orden ' + pesos(tOrden) + ' · cotizado ' + pesos(tCot) + ' · diferencia ' + pesos(tOrden - tCot) + '</div>' : '') + '</div>'
          : '<p class="exito" style="margin:10px 0">Los ítems de la orden coinciden con la cotización.</p>';
      }
    }
    if (d.oc) {
      html += '<h3>Orden de compra ' + esc(d.oc.numero) + (d.oc.tercero ? ' · ' + esc(d.oc.tercero) : '') + (d.oc.fecha ? ' · ' + esc(d.oc.fecha) : '') + (d.oc.valor != null ? ' · ' + pesos(d.oc.valor) : '') +
        (d.oc.archivoId ? ' · <a href="' + urlDrive(d.oc.archivoId) + '" target="_blank">Ver documento</a>' : '') + '</h3>' + tabla(d.oc.items);
    }
    return html;
  }

  /** La ODS guardada en Drive (última versión con anexo interno) y el PDF de cada retorno. */
  function tarjetaArchivo(d) {
    var a = d.archivo || {};
    var dato = function (t, v) { return '<dt>' + esc(t) + '</dt><dd>' + v + '</dd>'; };
    if (!a.odsId && !a.pendiente) {

    }
    var puedeGuardar = puede('editar') || puede('liquidar') || puede('cobrar');

      '<p style="margin-top:0">' + estado + '</p><dl class="datos">' +
      (a.odsId ? dato('Orden guardada', '<a href="' + urlDrive(a.odsId) + '" target="_blank">Ver PDF</a> <span class="gris">· con anexo interno, no se envía al cliente</span>') : '') +
      a.retornos.map(function (r, i) { return dato('Retorno ' + (i + 1), '<a href="' + urlDrive(r) + '" target="_blank">Ver PDF del retorno</a>'); }).join('') +

  function modalLiquidar(d, listo) {
    var m = modal('Liquidar ' + d.id,
      '<p class="gris">' + esc(d.cliente) + ' · ' + esc(NOMBRES_TIPO[d.tipoServicio] || '') + ' · Tarifa ' + esc(d.tarifa === 'EMPRESARIAL' ? 'empresarial' : 'plena') + '</p>' +
      '<label>¿Se hizo algo adicional? ¿Queda algo extra por hacer?</label><textarea id="lqAdic">' + esc(d.adicionales || '') + '</textarea>' +
      '<h3>Ítems y precio final</h3>' + (d.cotizacionTotal != null || (d.oc && d.oc.valor != null) ? '<p class="gris">' + [d.cotizacionTotal != null ? 'Cotizado (' + esc(d.cotizacion) + '): ' + pesos(d.cotizacionTotal) : '', d.oc && d.oc.valor != null ? 'OC ' + esc(d.oc.numero) + ': ' + pesos(d.oc.valor) : ''].filter(Boolean).join(' · ') + '</p>' : '') + '<div id="lqItems"></div>' +
      ((d.cotizacionItems || []).length ? '<p style="margin:6px 0"><button class="sec" id="lqDeCot" type="button">Cargar líneas de la cotización ' + esc(d.cotizacion) + '</button></p>' : '') +
      (d.cotizacion || d.oc ? '<details open class="comparar"><summary><b>Comparar con la cotización y la orden de compra</b></summary><div id="lqComp"></div></details>' : '') +
      '<label>Forma de pago *</label>' + opciones('lqPago', AD.cat.formasPago, d.formaPago || '', false, NOMBRES_PAGO) +
      '<div class="acciones der"><button id="lqOk" class="ok">Liquidar</button></div><p id="lqMsg"></p>', 980);
    activarOpciones(m);
    // Si la orden aún no tiene ítems, arranca con las líneas de la cotización (la categoría sale de las tarifas).
    var deCotizacion = function () {
      return (d.cotizacionItems || []).map(function (i) {
        var t = AD.tarifas.filter(function (x) { return x.codigo === i.cod; })[0];
        return { cod: i.cod, desc: i.desc, cat: (t && t.categoria) || 'SERVICIO', cant: i.cant, valor: i.valor };
      });
    };
    var it = editorItems($('lqItems'), d.items.length ? d.items : deCotizacion(), function () { return d.tarifa; }, function () { return d.tipoServicio; });
    productosSiigo().then(function (l) { if (l.length && document.body.contains(m)) it.repintar(); });
    if ($('lqDeCot')) $('lqDeCot').onclick = function () {
      confirmar('Los ítems se reemplazan por las líneas originales de la cotización ' + d.cotizacion + '.', 'Reemplazar').then(function (si) { if (si) { it.poner(deCotizacion()); if ($('lqComp')) $('lqComp').innerHTML = comparativo(d, it.valor()); } });
    };
    if ($('lqComp')) {
      var pintarComp = function () { $('lqComp').innerHTML = comparativo(d, it.valor()); };
      ['input', 'change', 'click'].forEach(function (ev) { $('lqItems').addEventListener(ev, function () { setTimeout(pintarComp, 0); }); });
      pintarComp();
    }
    m.querySelector('#lqOk').onclick = function () {
      var bt = this, pago = valorOpcion('lqPago', m);
      if (!pago) { $('lqMsg').innerHTML = '<span class="error">Escoja la forma de pago.</span>'; return; }
      // Factura electrónica con ítems libres (sin producto de Siigo): Cobro los crea en Siigo al facturar.
      var faltan = pago === 'FACTURA' ? itemsSinProducto(it.valor()) : [];
      var total = it.valor().reduce(function (a, i) { return a + Math.round(i.cant * i.valor); }, 0);
      var dif = [];
      if (d.cotizacionTotal != null && total !== d.cotizacionTotal) dif.push('lo cotizado (' + pesos(d.cotizacionTotal) + ')');
      var seguir = function () {
        bt.disabled = true;
        api('adminLiquidar', d.id, { items: it.valor(), adicionales: $('lqAdic').value, formaPago: pago })
          .then(function (nd) { m.remove(); aviso('Orden liquidada: pasa a cobro.', 0, 'exito'); listo(nd); })
          .catch(function (e) { $('lqMsg').innerHTML = '<span class="error">' + esc(e.message) + '</span>'; bt.disabled = false; });
      };
      var avisoSiigo = faltan.length ? 'Estos ítems no tienen producto en Siigo: ' + faltan.map(function (i) { return i.desc || i.cod; }).join(', ') + '. Al facturar, Cobro los crea en Siigo con su descripción (o escoge uno que ya exista). ' : '';
      if (!dif.length && !avisoSiigo) return seguir();
      if (!dif.length) return confirmar(avisoSiigo, 'Liquidar').then(function (si) { if (si) seguir(); });
      confirmar(avisoSiigo + 'El total liquidado (' + pesos(total) + ') no coincide con ' + dif.join('') + '. Revise adicionales antes de liquidar.', 'Liquidar así').then(function (si) { if (si) seguir(); });
    };
  }

  // ---------- Resumen financiero ----------
  // Paleta categórica validada (orden fijo): azul, naranja, aguamarina, amarillo. El color sigue a la serie, no a su posición.
  var COLOR_SERIE = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100'];
  var MESES_N = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  function nombreMes(k, largo) {
    var p = String(k).split('-'), n = MESES_N[Number(p[1]) - 1] || k;
    return largo ? n.charAt(0).toUpperCase() + n.slice(1) + ' ' + p[0] : n.slice(0, 3) + ' ' + p[0].slice(2);
  }
  /** $1,2 M · $450 mil · $9.000 (ejes y tarjetas). */
  function pesosCorto(v) {
    var a = Math.abs(v), s = v < 0 ? '-' : '';
    if (a >= 1e6) return s + '$' + (Math.round(a / 1e5) / 10).toLocaleString('es-CO') + ' M';
    if (a >= 1e4) return s + '$' + Math.round(a / 1e3).toLocaleString('es-CO') + ' mil';
    return s + pesos(a);
  }
  function maxRedondo(v) {
    if (!(v > 0)) return 1;
    var p = Math.pow(10, Math.floor(Math.log(v) / Math.LN10)), n = v / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }
  /** Barra con extremo de datos redondeado (4px) y base cuadrada. */
  function rutaBarra(x, y, w, h, redondo) {
    if (h <= 0) return '';
    var r = redondo ? Math.min(4, w / 2, h) : 0;
    return 'M' + x + ',' + (y + h) + 'V' + (y + r) + (r ? 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y : '') + 'H' + (x + w - r) +
      (r ? 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) : '') + 'V' + (y + h) + 'Z';
  }

  /**
   * Gráfica de columnas por mes (apiladas o agrupadas), en SVG.
   * op: {categorias, etiquetas, series:[{nombre, color, valores}], apilado, formato, sel (índice resaltado), alElegir(i)}
   * Pasar el mouse o el foco por un mes muestra el detalle de todas las series; clic elige ese mes.
   */
  function graficaColumnas(cont, op) {
    var W = Math.max(300, cont.clientWidth || 640), H = 230, iz = 58, de = 8, ar = 10, ab = 26;
    var n = op.categorias.length, pw = W - iz - de, ph = H - ar - ab, banda = pw / n;
    var tot = op.categorias.map(function (_, i) { return op.series.reduce(function (a, s) { return a + (s.valores[i] || 0); }, 0); });
    var maxDato = op.apilado ? Math.max.apply(null, tot) : Math.max.apply(null, op.series.map(function (s) { return Math.max.apply(null, s.valores); }));
    // Cuatro divisiones redondas (en conteos, siempre enteras).
    var paso = maxRedondo(maxDato / 4); if (op.formato === 'n') paso = Math.max(1, paso === 2.5 ? 5 : Math.ceil(paso));
    var maxV = paso * 4;
    var y = function (v) { return ar + ph - (v / maxV) * ph; };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" role="img" aria-label="' + esc(op.titulo || '') + '">';
    for (var t = 0; t <= 4; t++) {
      var v = maxV * t / 4, yy = Math.round(y(v)) + 0.5;
      svg += '<line x1="' + iz + '" x2="' + (W - de) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + (t ? '#e3e8ef' : '#c3c9d1') + '" stroke-width="1"/>' +
        '<text x="' + (iz - 8) + '" y="' + (yy + 4) + '" text-anchor="end" class="eje">' + esc(op.formato === 'n' ? String(Math.round(v)) : pesosCorto(v)) + '</text>';
    }
    var salto = Math.max(1, Math.ceil(44 / banda)); // una etiqueta de mes cada ~44px para que no se monten
    op.categorias.forEach(function (c, i) {
      var x0 = iz + i * banda;
      if (i === op.sel) svg += '<rect x="' + (x0 + 1) + '" y="' + ar + '" width="' + (banda - 2) + '" height="' + ph + '" rx="6" fill="#eef4fb"/>';
      if (op.apilado) {
        var w = Math.min(24, banda * 0.56), x = x0 + (banda - w) / 2, base = 0;
        var ultimo = -1; op.series.forEach(function (s, k) { if (s.valores[i] > 0) ultimo = k; });
        op.series.forEach(function (s, k) {
          var val = s.valores[i] || 0; if (val <= 0) return;
          var yTop = y(base + val), yBot = y(base), h = yBot - yTop - (base > 0 ? 2 : 0);
          svg += '<path d="' + rutaBarra(x, yTop, w, Math.max(0, h), k === ultimo) + '" fill="' + s.color + '"/>';
          base += val;
        });
      } else {
        var m = op.series.length, wb = Math.min(24, (banda * 0.7 - (m - 1) * 2) / m), anchoG = m * wb + (m - 1) * 2, xs = x0 + (banda - anchoG) / 2;
        op.series.forEach(function (s, k) {
          var val = s.valores[i] || 0;
          svg += '<path d="' + rutaBarra(xs + k * (wb + 2), y(val), wb, y(0) - y(val), true) + '" fill="' + s.color + '"/>';
        });
      }
      if (i % salto === 0 || i === n - 1) svg += '<text x="' + (x0 + banda / 2) + '" y="' + (H - 8) + '" text-anchor="middle" class="eje' + (i === op.sel ? ' fuerte' : '') + '">' + esc(op.etiquetas[i]) + '</text>';
      svg += '<rect class="golpe" data-i="' + i + '" x="' + x0 + '" y="' + ar + '" width="' + banda + '" height="' + (ph + ab) + '" fill="transparent" tabindex="0" aria-label="' + esc(op.etiquetas[i]) + '"/>';
    });
    svg += '</svg>';
    cont.innerHTML = (op.series.length > 1 ? '<div class="leyenda">' + op.series.map(function (s) { return '<span><i style="background:' + s.color + '"></i>' + esc(s.nombre) + '</span>'; }).join('') + '</div>' : '') +
      '<div class="grafica">' + svg + '<div class="tip" role="status"></div></div>';
    var tip = cont.querySelector('.tip'), caja = cont.querySelector('.grafica');
    var mostrar = function (el) {
      var i = Number(el.getAttribute('data-i'));
      tip.textContent = '';
      var tt = document.createElement('div'); tt.className = 'tip-t'; tt.textContent = op.titulosTip ? op.titulosTip[i] : op.etiquetas[i]; tip.appendChild(tt);
      op.series.forEach(function (s) {
        var fila = document.createElement('div'); fila.className = 'tip-f';
        var linea = document.createElement('i'); linea.style.background = s.color; fila.appendChild(linea);
