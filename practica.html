ct.assign({}, o); });\n  const mapa = mapaColumnas_(clave);\n  const datos = valoresHoja_(CFG.HOJAS[clave]);\n  const out = [];\n  for (let r = 1; r < datos.length; r++) {\n    const fila = datos[r];\n    const o = { _fila: r + 1 };\n    let vacia = true;\n    Object.keys(mapa).forEach(function (campo) {\n      o[campo] = texto_(fila[mapa[campo]]);\n      if (o[campo] !== '') vacia = false;\n    });\n    if (!vacia) out.push(o);\n  }\n  MEMO_[memo] = out;\n  return out.map(function (o) { return Object.assign({}, o); });\n}\n\n/** Siguiente ID con el mismo formato de los existentes (prefijo + número con ceros). */\nfunction siguienteIdMaestra_(clave, prefijoDefecto) {\n  const ids = leerMaestra_(clave).map(function (x) { return x.id; });\n  let mejor = null;\n  ids.forEach(function (id) {\n    const m = /^(.*?)(\\d+)$/.exec(id);\n    if (m && (!mejor || Number(m[2]) > mejor.n)) mejor = { pre: m[1], n: Number(m[2]), ancho: m[2].length };\n  });\n  if (!mejor) return prefijoDefecto + '00001';\n  const sig = String(mejor.n + 1);\n  return mejor.pre + (sig.length < mejor.ancho ? ('0000000000' + sig).slice(-mejor.ancho) : sig);\n}\n\n/** Agrega una fila a una hoja de la base usando el mapa de columnas. */\nfunction agregarMaestra_(clave, obj) {\n  const sh = hoja_(CFG.HOJAS[clave]);\n  const mapa = mapaColumnas_(clave);\n  const fila = new Array(sh.getLastColumn()).fill('');\n  Object.keys(obj).forEach(function (campo) {\n    if (mapa[campo] !== undefined) fila[mapa[campo]] = obj[campo];\n  });\n  sh.appendRow(fila.map(celda_));\n  // La copia en memoria se corrige en lugar de releer la hoja entera (la fila nueva queda al final).\n  memoFila_(CFG.HOJAS[clave], valoresHoja_(CFG.HOJAS[clave]).length + 1, fila.map(valorMemo_));\n}\n\n/** Lo que devuelve la hoja después de escribir celda_(v): el texto sin el apóstrofo. */\nfunction valorMemo_(v) {\n  if (v === undefined || v === null) return '';\n  return typeof v === 'number' || typeof v === 'boolean' ? v : v instanceof Date ? texto_(v) : String(v);\n}\n\n/** Actualiza campos de una fila de la base (por su número de fila). */\nfunction actualizarMaestra_(clave, fila, cambios) {\n  const sh = hoja_(CFG.HOJAS[clave]);\n  const mapa = mapaColumnas_(clave);\n  const nombre = CFG.HOJAS[clave];\n  const actual = (valoresHoja_(nombre)[fila - 1] || []).slice();\n  Object.keys(cambios).forEach(function (campo) {\n    if (mapa[campo] === undefined) return;\n    sh.getRange(fila, mapa[campo] + 1).setValue(celda_(cambios[campo]));\n    actual[mapa[campo]] = valorMemo_(cambios[campo]);\n  });\n  // Se corrige la fila en memoria: la siguiente lectura en esta llamada no relee la hoja completa.\n  if (fila - 1 < valoresHoja_(nombre).length) memoFila_(nombre, fila, actual); else olvidarHoja_(nombre);\n}\n\n/** Agrega la columna al final de la hoja si no existe (por ejemplo ESTADO_SEDE). */\nfunction asegurarColumna_(clave, encabezado) {\n  const sh = hoja_(CFG.HOJAS[clave]);\n  const n = sh.getLastColumn();\n  const enc = n ? sh.getRange(1, 1, 1, n).getValues()[0].map(normalizar_) : [];\n  if (enc.indexOf(normalizar_(encabezado)) < 0) { sh.getRange(1, n + 1).setValue(encabezado).setFontWeight('bold'); olvidarHoja_(CFG.HOJAS[clave]); }\n}\n\n/** Sede o equipo eliminado desde el panel: la fila se conserva con estado Eliminada/Eliminado. */\nfunction eliminado_(x) { return /^ELIMINAD/.test(String((x && x.estado) || '').toUpperCase()); }\n\n/** Equipos que no están eliminados ni pertenecen a una sede eliminada. */\nfunction equiposActivos_() {\n  const sedesFuera = {};\n  leerMaestra_('SEDES').forEach(function (s) { if (eliminado_(s)) sedesFuera[s.id] = true; });\n  return leerMaestra_('EQUIPOS').filter(function (e) { return !eliminado_(e) && !sedesFuera[e.sede]; });\n}\n\nfunction buscarCliente_(id) {\n  return leerMaestra_('CLIENTES').filter(function (c) { return c.id === id; })[0] || null;\n}\n\nfunction sedesDe_(idCliente) {\n  return leerMaestra_('SEDES').filter(function (s) { return s.cliente === idCliente && !eliminado_(s); });\n}\n\n/**\n * Un equipo es una sola fila con sus dos unidades: evaporadora (MODELO, SERIAL) y condensadora\n * (MODELO_CONDENSADORA, SERIAL_CONDENSADORA). Si tiene condensadora, cada unidad sale con su nombre.\n */\nfunction describirEquipo_(e) {\n  const unidad = function (nombre, modelo, serial) {\n    const datos = [modelo ? 'Mod. ' + modelo : '', serial ? 'S/N ' + serial : ''].filter(String).join(' ');\n    return datos ? (nombre ? nombre + ' ' : '') + datos : '';\n  };\n  const conCond = !!(e.modeloCond || e.serialCond);\n  return [e.id, e.tipo, e.marca, e.capacidad, e.ubicacion,\n    unidad(conCond ? 'Evap.' : '', e.modelo, e.serial), unidad('Cond.', e.modeloCond, e.serialCond)]\n    .filter(function (x) { return x; }).join(' · ');\n}\n\n/**\n * Tarifas: si la hoja TARIFAS tiene datos se usa (precio plena / empresarial por tipo de servicio);\n * si está vacía, se usa SERVICIOS con el mismo valor para las dos tarifas.\n */\nfunction tarifas_() {\n  let t = [];\n  try { t = leerMaestra_('TARIFAS'); } catch (e) { t = []; }\n  if (t.length) {\n    return t.map(function (x) {\n      return {\n        codigo: x.codigo, nombre: x.nombre, tipoServicio: String(x.tipoServicio || '').toUpperCase(),\n        categoria: String(x.categoria || 'SERVICIO').toUpperCase(),\n        plena: numero_(x.plena), empresarial: numero_(x.empresarial || x.plena)\n      };\n    });\n  }\n  let s = [];\n  try { s = leerMaestra_('SERVICIOS'); } catch (e) { s = []; }\n  return s.map(function (x) {\n    const v = numero_(x.valor);\n    return { codigo: x.codigo, nombre: x.nombre, tipoServicio: '', categoria: 'SERVICIO', plena: v, empresarial: v };\n  });\n}\n\n/* ===================== API: base maestra para el panel ===================== */\n\n/** Clientes resumidos para el buscador del panel. */\nfunction adminClientes(token) {\n  sesion_(token, 'panel');\n  return leerMaestra_('CLIENTES').map(function (c) {\n    return { id: c.id, nombre: c.nombre, nit: c.nit, estado: c.estado || '', telefono: c.telefono || '', ciudad: c.ciudad || '' };\n  });\n}\n\n/** Cliente con sus sedes, equipos y último historial. */\nfunction adminCliente(token, idCliente) {\n  sesion_(token, 'panel');\n  const c = buscarCliente_(idCliente);\n  if (!c) throw new Error('Cliente no encontrado.');\n  const sedes = sedesDe_(idCliente);\n  const idsSede = sedes.map(function (x) { return x.id; });\n  const equipos = equiposActivos_().filter(function (e) { return idsSede.indexOf(e.sede) >= 0; });\n  delete c._fila;\n  c.sedes = sedes.map(function (sd) {\n    return {\n      id: sd.id, nombre: sd.nombre || sd.direccion, direccion: sd.direccion, ciudad: sd.ciudad || '',\n      barrio: sd.barrio || '', contacto: sd.contacto || '', telefono: sd.telefono || '', observaciones: sd.observaciones || '',\n      equipos: equipos.filter(function (e) { return e.sede === sd.id; }).map(function (e) {\n        return {\n          id: e.id, texto: describirEquipo_(e), tipo: e.tipo || '', marca: e.marca || '', modelo: e.modelo || '',\n          capacidad: e.capacidad || '', ubicacion: e.ubicacion || '', serial: e.serial || '',\n          modeloCond: e.modeloCond || '', serialCond: e.serialCond || '',\n          frecuencia: e.frecuencia || '', ultimo: e.ultimo || '', estado: e.estado || ''\n        };\n      })\n    };\n  });\n  c.historial = historialCliente_(idCliente, '').slice(0, 30);\n  return c;\n}\n\n/** Crea un cliente nuevo (con su primera sede y equipos opcionales) en la base maestra. */\nfunction adminCrearCliente(token, d) {\n  const s = sesion_(token, 'clientes');\n  const nombre = String(d.nombre || '').trim();\n  const nit = String(d.nit || '').replace(/[^\\dA-Za-z]/g, '');\n  if (!nombre || !nit) throw new Error('Razón social y NIT/CC son obligatorios.');\n  if (!d.sede || !String(d.sede.direccion || '').trim()) throw new Error('La dirección de la sede es obligatoria.');\n  // Con NIT y sin DV se guarda el DV calculado (es el mismo que exige Siigo).\n  if (!d.dv && String(d.tipoDocumento || '').toUpperCase() === 'NIT') d.dv = dvNit_(nit.replace(/\\D/g, ''));\n  const r = conLock_(function () {\n    const existe = leerMaestra_('CLIENTES').filter(function (c) { return String(c.nit).replace(/[^\\dA-Za-z]/g, '') === nit; })[0];\n    if (existe) throw new Error('Ya existe un cliente con NIT/CC ' + nit + ': ' + existe.nombre + ' (' + existe.id + ').');\n    // El código del cliente es su NIT o cédula, sin DV (decisión de Samuel, 19/10/2026).\n    const id = nit;\n    agregarMaestra_('CLIENTES', {\n      id: id, nombre: nombre, nit: nit, dv: d.dv || '', tipoDocumento: d.tipoDocumento || (d.dv ? 'NIT' : 'CC'),\n      tipoCliente: d.tipoCliente || '', estado: 'Activo', telefono: d.telefono || '', email: d.email || '',\n      direccion: d.sede.direccion, ciudad: d.sede.ciudad || d.ciudad || 'Medellín'\n    });\n    const idSede = crearSede_(id, d.sede);\n    (d.equipos || []).forEach(function (e) { crearEquipo_(idSede, e); });\n    log_('', s.usuario, 'CLIENTE_NUEVO', id + ' · ' + nombre);\n    return { id: id, idSede: idSede };\n  });\n  // \"Crear también en Siigo\": después de guardar en la app y fuera del bloqueo. Si falla, el cliente queda en la app\n  // y se crea en Siigo al facturar (como antes).\n  if (d.siigo && d.siigo.crear) {\n    try {\n      if (!siigoConectado_()) throw new Error('Siigo no está conectado.');\n      const rs = crearClienteSiigo_(datosSiigoDeCliente_(d));\n      r.siigo = { creado: rs.creado, yaExistia: !rs.creado };\n      if (rs.creado) conLock_(function () { log_('', s.usuario, 'SIIGO_CLIENTE_NUEVO', rs.nit + ' · ' + rs.nombre); });\n    } catch (e) { r.siigo = { error: e.message }; }\n  }\n  return r;\n}\n\nfunction crearSede_(idCliente, sd) {\n  const id = siguienteIdMaestra_('SEDES', 'SED-');\n  agregarMaestra_('SEDES', {\n    id: id, cliente: idCliente, nombre: sd.nombre || 'Principal', direccion: String(sd.direccion || '').trim(),\n    barrio: sd.barrio || '', ciudad: sd.ciudad || 'Medellín', contacto: sd.contacto || '', telefono: sd.telefono || '',\n    observaciones: sd.observaciones || ''\n  });\n  return id;\n}\n\nfunction crearEquipo_(idSede, e) {\n  const id = siguienteIdMaestra_('EQUIPOS', 'EQ-');\n  agregarMaestra_('EQUIPOS', {\n    id: id, sede: idSede, tipo: e.tipo || '', marca: e.marca || '', modelo: e.modelo || '', capacidad: e.capacidad || '',\n    ubicacion: e.ubicacion || '', serial: e.serial || '', modeloCond: e.modeloCond || '', serialCond: e.serialCond || '',\n    frecuencia: e.frecuencia || '', ultimo: '', estado: 'Operativo'\n  });\n  return id;\n}\n\nfunction adminCrearSede(token, idCliente, sd) {\n  const s = sesion_(token, 'clientes');\n  if (!buscarCliente_(idCliente)) throw new Error('Cliente no encontrado.');\n  if (!String(sd.direccion || '').trim()) throw new Error('La dirección es obligatoria.');\n  return conLock_(function () {\n    const id = crearSede_(idCliente, sd);\n    log_('', s.usuario, 'SEDE_NUEVA', idCliente + ' · ' + id);\n    return id;\n  });\n}\n\nfunction adminCrearEquipo(token, idSede, e) {\n  const s = sesion_(token, 'clientes');\n  if (!leerMaestra_('SEDES').some(function (x) { return x.id === idSede && !eliminado_(x); })) throw new Error('Sede no encontrada.');\n  return conLock_(function () {\n    const id = crearEquipo_(idSede, e);\n    log_('', s.usuario, 'EQUIPO_NUEVO', idSede + ' · ' + id);\n    return id;\n  });\n}\n\n/** Edita campos de cliente, sede o equipo. tipo: CLIENTES | SEDES | EQUIPOS. */\nfunction adminEditarMaestra(token, tipo, id, cambios) {\n  const s = sesion_(token, 'clientes');\n  if (['CLIENTES', 'SEDES', 'EQUIPOS'].indexOf(tipo) < 0) throw new Error('Tipo inválido.');\n  const permitidos = {\n    CLIENTES: ['nombre', 'nit', 'dv', 'tipoDocumento', 'tipoCliente', 'estado', 'telefono', 'email', 'direccion', 'ciudad', 'requierePermisos', 'obsInternas', 'facturaConOc'],\n    SEDES: ['nombre', 'direccion', 'barrio', 'ciudad', 'contacto', 'telefono', 'observaciones'],\n    EQUIPOS: ['tipo', 'marca', 'modelo', 'capacidad', 'ubicacion', 'serial', 'modeloCond', 'serialCond', 'frecuencia', 'ultimo']\n  }[tipo];\n  if (tipo === 'CLIENTES' && cambios && cambios.facturaConOc !== undefined) asegurarColumna_('CLIENTES', 'FACTURA_CON_OC');\n  const r = conLock_(function () {\n    const fila = leerMaestra_(tipo).filter(function (x) { return x.id === id; })[0];\n    if (!fila) throw new Error('No existe ' + id + '.');\n    const c = {};\n    Object.keys(cambios || {}).forEach(function (k) {\n      if (permitidos.indexOf(k) >= 0 && String(cambios[k]) !== fila[k]) c[k] = String(cambios[k]).trim();\n    });\n    if (!Object.keys(c).length) return { id: id, ordenes: [] };\n    actualizarMaestra_(tipo, fila._fila, c);\n    log_('', s.usuario, 'EDITAR_' + tipo, id + ' ' + JSON.stringify(c));\n    return { id: id, ordenes: propagarMaestra_(tipo, id) };\n  });\n  r.ordenes.forEach(sincronizarYGuardarEvento_);\n  return r.id;\n}\n\n/**\n * Lleva la corrección de un cliente, sede o equipo a las órdenes que no están completadas ni anuladas\n * (las completadas conservan lo que se le entregó al cliente). Devuelve los números de las órdenes tocadas.\n * Llamar dentro de conLock_.\n */\nfunction propagarMaestra_(tipo, id) {\n  const abiertas = leerODS_().filter(function (o) { return ['COMPLETADA', 'ANULADA'].indexOf(o.ESTADO) < 0; });\n  const tocadas = [];\n  if (tipo === 'CLIENTES') {\n    const cli = buscarCliente_(id);\n    abiertas.filter(function (o) { return o.ID_CLIENTE === id; }).forEach(function (o) {\n      actualizarODS_(o._fila, { CLIENTE: cli.nombre, NIT: cli.nit }); tocadas.push(o.ID_ODS);\n    });\n  } else if (tipo === 'SEDES') {\n    const sd = leerMaestra_('SEDES').filter(function (x) { return x.id === id; })[0];\n    abiertas.filter(function (o) { return o.ID_SEDE === id || sedesExtraDe_(o).indexOf(id) >= 0; }).forEach(function (o) {\n      const c = {};\n      if (o.ID_SEDE === id) { c.SEDE = sd.nombre || sd.direccion; c.DIRECCION = sd.direccion; c.BARRIO = sd.barrio || ''; c.CIUDAD = sd.ciudad || ''; Object.assign(o, c); }\n      if (sedesExtraDe_(o).indexOf(id) >= 0) {\n        c.SEDES_EXTRA_DETALLE = JSON.stringify(leerJSON_(o.SEDES_EXTRA_DETALLE, []).map(function (x) { return x.id === id ? datoSede_(sd) : x; }));\n        o.SEDES_EXTRA_DETALLE = c.SEDES_EXTRA_DETALLE;\n      }\n      // El nombre de la sede va en el detalle de equipos cuando la orden tiene varias.\n      if (o.SEDES_EXTRA) c.EQUIPOS_DETALLE = detalleEquipos_(equiposDeSedes_(String(o.EQUIPOS_IDS || '').split(',').filter(String), sedesDeOrden_(o)), sedesDeOrden_(o));\n      actualizarODS_(o._fila, c); tocadas.push(o.ID_ODS);\n    });\n  } else {\n    abiertas.filter(function (o) { return String(o.EQUIPOS_IDS || '').split(',').indexOf(id) >= 0; }).forEach(function (o) {\n      const ids = o.EQUIPOS_IDS.split(',').filter(String);\n      actualizarODS_(o._fila, { EQUIPOS_DETALLE: detalleEquipos_(equiposDeSedes_(ids, sedesDeOrden_(o)), sedesDeOrden_(o)) });\n      tocadas.push(o.ID_ODS);\n    });\n  }\n  return tocadas;\n}\n\n/**\n * Elimina una sede o un equipo desde el panel. No borra la fila: queda con estado Eliminada/Eliminado,\n * sale de las listas y de la programación de clientes fijos, y las órdenes viejas lo siguen mostrando.\n * No se puede si tiene una orden abierta. tipo: SEDES | EQUIPOS.\n */\nfunction adminEliminarMaestra(token, tipo, id) {\n  const s = sesion_(token, 'clientes');\n  if (['SEDES', 'EQUIPOS'].indexOf(tipo) < 0) throw new Error('Tipo inválido.');\n  return conLock_(function () {\n    asegurarColumna_(tipo, tipo === 'SEDES' ? 'ESTADO_SEDE' : 'ESTADO_EQUIPO');\n    const fila = leerMaestra_(tipo).filter(function (x) { return x.id === id; })[0];\n    if (!fila) throw new Error('No existe ' + id + '.');\n    const abierta = leerODS_().filter(function (o) {\n      if (['COMPLETADA', 'ANULADA'].indexOf(o.ESTADO) >= 0) return false;\n      return tipo === 'SEDES' ? o.ID_SEDE === id || sedesExtraDe_(o).indexOf(id) >= 0 : String(o.EQUIPOS_IDS || '').split(',').indexOf(id) >= 0;\n    })[0];\n    if (abierta) throw new Error('No se puede eliminar: la orden ' + abierta.ID_ODS + ' (' + abierta.ESTADO + ') la tiene. Quítela de esa orden o termínela primero.');\n    if (tipo === 'SEDES' && sedesDe_(fila.cliente).length <= 1) throw new Error('Es la única sede del cliente. Corrija sus datos con Editar en lugar de eliminarla.');\n    actualizarMaestra_(tipo, fila._fila, { estado: tipo === 'SEDES' ? 'Eliminada' : 'Eliminado' });\n    log_('', s.usuario, 'ELIMINAR_' + tipo, id + ' · ' + (fila.nombre || fila.direccion || describirEquipo_(fila)));\n    return id;\n  });\n}\n\n/** Historial de un cliente o una sede: órdenes del sistema + histórico migrado. Más reciente primero. */\nfunction historialCliente_(idCliente, idSede) {\n  const out = [];\n  leerODS_().forEach(function (o) {\n    const coincide = idSede ? o.ID_SEDE === idSede || sedesExtraDe_(o).indexOf(idSede) >= 0 : o.ID_CLIENTE === idCliente;\n    if (coincide && ['CERRADA_TECNICO', 'REVISADA', 'LIQUIDADA', 'POR_FACTURAR', 'COMPLETADA'].indexOf(o.ESTADO) >= 0) {\n      out.push({\n        numero: o.ID_ODS, fecha: o.HORA_CIERRE || o.FECHA_PROGRAMADA || o.FECHA_CREACION, sede: o.SEDE,\n        descripcion: [nombreTipo_(o.TIPO_SERVICIO), o.TRABAJO_REALIZADO].filter(String).join(' · '),\n        tecnico: o.TECNICO_NOMBRE, valor: numero_(o.TOTAL)\n      });\n    }\n  });\n  try {\n    leerMaestra_('HISTORICO').forEach(function (h) {\n      const coincide = idSede ? h.sede === idSede : h.cliente === idCliente;\n      if (coincide) out.push({ numero: h.numero || '', fecha: fechaISO_(h.fecha) || h.fecha, sede: '', descripcion: h.descripcion || '', tecnico: h.tecnico || '', valor: numero_(h.valor) });\n    });\n  } catch (e) { /* sin histórico */ }\n  out.sort(function (a, b) { return String(b.fecha).localeCompare(String(a.fecha)); });\n  return out;\n}\n\nfunction nombreTipo_(t) {\n  return { MANTENIMIENTO: 'Mantenimiento', REPARACION: 'Reparación', INSTALACION: 'Instalación', VISITA_TECNICA: 'Visita técnica' }[t] || t || '';\n}\n\n// Mercadeo.gs\n/**\n * Mercadeo: de dónde salen los clientes a programar.\n *   Clientes fijos: equipos con frecuencia (cada N meses) a los que les toca servicio.\n *   Reactivación: clientes a los que no se les presta servicio hace N meses (histórico + ODS).\n *   Informe mensual: guarda la foto del mes en MERCADEO_MENSUAL para conservar el histórico.\n */\n\nfunction sumarMeses_(iso, n) {\n  const p = fechaISO_(iso).split('-').map(Number);\n  if (p.length < 3 || !p[0]) return '';\n  const d = new Date(Date.UTC(p[0], p[1] - 1 + Number(n), 1));\n  const ultimoDia = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();\n  const dia = Math.min(p[2], ultimoDia);\n  return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + dia).slice(-2);\n}\n\nfunction mesesEntre_(desdeIso, hastaIso) {\n  const a = fechaISO_(desdeIso).split('-').map(Number), b = fechaISO_(hastaIso).split('-').map(Number);\n  if (!a[0] || !b[0]) return null;\n  let m = (b[0] - a[0]) * 12 + (b[1] - a[1]);\n  if (b[2] < a[2]) m -= 1;\n  return m;\n}\n\n/** Último servicio por equipo, por sede y por cliente, juntando el histórico migrado y las ODS del sistema. */\nfunction ultimosServicios_() {\n  const porEquipo = {}, porSede = {}, porCliente = {};\n  const max = function (obj, k, f) { if (k && f && (!obj[k] || f > obj[k])) obj[k] = f; };\n  leerODS_().forEach(function (o) {\n    if (['CERRADA_TECNICO', 'REVISADA', 'LIQUIDADA', 'POR_FACTURAR', 'COMPLETADA'].indexOf(o.ESTADO) < 0) return;\n    const f = fechaISO_(o.HORA_CIERRE || o.FECHA_PROGRAMADA || o.FECHA_CREACION);\n    (o.EQUIPOS_IDS || '').split(',').filter(String).forEach(function (e) { max(porEquipo, e, f); });\n    max(porSede, o.ID_SEDE, f); max(porCliente, o.ID_CLIENTE, f);\n  });\n  try {\n    leerMaestra_('HISTORICO').forEach(function (h) {\n      const f = fechaISO_(h.fecha);\n      max(porSede, h.sede, f); max(porCliente, h.cliente, f);\n    });\n  } catch (e) { /* sin histórico */ }\n  return { porEquipo: porEquipo, porSede: porSede, porCliente: porCliente };\n}\n\nfunction abiertasPorSede_() {\n  const out = {};\n  leerODS_().forEach(function (o) {\n    if (['PROGRAMADA', 'EN_CURSO'].indexOf(o.ESTADO) >= 0) out[o.ID_SEDE] = o.ID_ODS;\n  });\n  return out;\n}\n\n/** Clientes fijos con servicio vencido o que vence en los próximos `dias` días. Agrupado por sede. */\nfunction mercadeoFijos(token, f) {\n  sesion_(token, 'mercadeo');\n  return calcularFijos_(Number((f || {}).dias) || 30);\n}\n\n/**\n * soloApp: para la programación automática solo cuentan los equipos con un servicio hecho en la app\n * (orden cerrada en el sistema nuevo). Los clientes fijos que vienen de la base migrada salen en Mercadeo\n * para gestionarlos, pero no se agendan solos hasta su primer servicio en la app (decisión de Samuel, 20/10/2026).\n */\nfunction calcularFijos_(dias, soloApp) {\n  const hoy = hoy_();\n  const limite = Utilities.formatDate(new Date(Date.now() + dias * 864e5), TZ, 'yyyy-MM-dd');\n  const ult = ultimosServicios_();\n  const abiertas = abiertasPorSede_();\n  const clientes = {};\n  leerMaestra_('CLIENTES').forEach(function (c) { clientes[c.id] = c; });\n  const sedes = {};\n  leerMaestra_('SEDES').forEach(function (s) { sedes[s.id] = s; });\n  const grupos = {};\n  equiposActivos_().forEach(function (e) {\n    const freq = numero_(e.frecuencia);\n    if (!(freq > 0)) return;\n    if (soloApp && !ult.porEquipo[e.id]) return;\n    const ultimo = soloApp ? ult.porEquipo[e.id] : [fechaISO_(e.ultimo), ult.porEquipo[e.id] || '', ult.porSede[e.sede] || ''].filter(String).sort().pop() || '';\n    const proximo = ultimo ? sumarMeses_(ultimo, freq) : '';\n    if (proximo && proximo > limite) return;\n    const sd = sedes[e.sede] || {};\n    const c = clientes[sd.cliente] || {};\n    if (String(c.estado || '').toUpperCase().indexOf('INACTIV') === 0) return;\n    const g = grupos[e.sede] || (grupos[e.sede] = {\n      idCliente: sd.cliente || '', cliente: c.nombre || '', nit: c.nit || '', telefono: sd.telefono || c.telefono || '',\n      contacto: sd.contacto || '', idSede: e.sede, sede: sd.nombre || sd.direccion || '', direccion: sd.direccion || '',\n      equipos: 0, equiposIds: [], frecuencias: [], ultimo: '', proximo: '', odsAbierta: abiertas[e.sede] || ''\n    });\n    g.equipos++; g.equiposIds.push(e.id);\n    if (g.frecuencias.indexOf(freq) < 0) g.frecuencias.push(freq);\n    if (ultimo && (!g.ultimo || ultimo > g.ultimo)) g.ultimo = ultimo;\n    if (!g.proximo || (proximo && proximo < g.proximo)) g.proximo = proximo;\n  });\n  return Object.keys(grupos).map(function (k) {\n    const g = grupos[k];\n    g.vencido = !g.proximo || g.proximo < hoy;\n    g.frecuencia = g.frecuencias.sort(function (a, b) { return a - b; }).join(' / ') + ' meses';\n    delete g.frecuencias;\n    return g;\n  }).sort(function (a, b) { return String(a.proximo || '0000').localeCompare(String(b.proximo || '0000')); });\n}\n\n/** Clientes sin servicio hace `meses` meses o más, con la fecha del último servicio. */\nfunction mercadeoReactivacion(token, f) {\n  sesion_(token, 'mercadeo');\n  f = f || {};\n  return calcularReactivacion_(Number(f.meses) || 6, !!f.incluirInactivos);\n}\n\nfunction calcularReactivacion_(meses, incluirInactivos) {\n  const hoy = hoy_();\n  const ult = ultimosServicios_();\n  const abiertas = {};\n  leerODS_().forEach(function (o) { if (['PROGRAMADA', 'EN_CURSO'].indexOf(o.ESTADO) >= 0) abiertas[o.ID_CLIENTE] = o.ID_ODS; });\n  return leerMaestra_('CLIENTES').map(function (c) {\n    const u = ult.porCliente[c.id] || '';\n    return {\n      idCliente: c.id, cliente: c.nombre, nit: c.nit, telefono: c.telefono || '', ciudad: c.ciudad || '', estado: c.estado || '',\n      ultimo: u, meses: u ? mesesEntre_(u, hoy) : null, odsAbierta: abiertas[c.id] || ''\n    };\n  }).filter(function (r) {\n    if (!r.ultimo || r.meses < meses) return false;\n    if (!incluirInactivos && String(r.estado).toUpperCase().indexOf('INACTIV') === 0) return false;\n    return true;\n  }).map(function (r) {\n    r.grupo = r.meses >= 12 ? '12+ meses' : r.meses >= 6 ? '6 a 11 meses' : '3 a 5 meses';\n    return r;\n  }).sort(function (a, b) { return a.meses - b.meses; });\n}\n\n/** Guarda la foto del mes (clientes fijos próximos 30 días + reactivación desde 3 meses). Reemplaza la del mismo mes. */\nfunction mercadeoGuardarMes(token) {\n  const s = sesion_(token, 'mercadeo');\n  const mes = hoy_().slice(0, 7);\n  const fijos = calcularFijos_(30);\n  const react = calcularReactivacion_(3, false);\n  const filas = [];\n  fijos.forEach(function (g) {\n    filas.push({ MES: mes, TIPO: 'FIJO', ID_CLIENTE: g.idCliente, CLIENTE: g.cliente, NIT: g.nit, TELEFONO: g.telefono, ID_SEDE: g.idSede, SEDE: g.sede,\n      ULTIMO_SERVICIO: g.ultimo, MESES_SIN_SERVICIO: g.ultimo ? mesesEntre_(g.ultimo, hoy_()) : '', PROXIMO_SERVICIO: g.proximo,\n      DETALLE: g.equipos + ' equipo(s) · cada ' + g.frecuencia + (g.odsAbierta ? ' · ya programada ' + g.odsAbierta : '') });\n  });\n  react.forEach(function (r) {\n    filas.push({ MES: mes, TIPO: 'REACTIVACION', ID_CLIENTE: r.idCliente, CLIENTE: r.cliente, NIT: r.nit, TELEFONO: r.telefono, ID_SEDE: '', SEDE: '',\n      ULTIMO_SERVICIO: r.ultimo, MESES_SIN_SERVICIO: r.meses, PROXIMO_SERVICIO: '', DETALLE: r.grupo + (r.odsAbierta ? ' · ya programada ' + r.odsAbierta : '') });\n  });\n  conLock_(function () {\n    const sh = hoja_(CFG.HOJAS.MERCADEO);\n    const idx = indiceEncabezados_(sh);\n    const datos = sh.getDataRange().getValues();\n    const conservar = [datos[0]].concat(datos.slice(1).filter(function (r) { return texto_(r[idx.MES]) !== mes; }));\n    const nuevas = filas.map(function (o) {\n      const fila = new Array(datos[0].length).fill('');\n      o.GENERADO_POR = s.usuario; o.FECHA = ahora_();\n      Object.keys(o).forEach(function (k) { if (idx[k] !== undefined) fila[idx[k]] = o[k]; });\n      return fila;\n    });\n    const todo = conservar.concat(nuevas).map(function (r, i) { return i === 0 ? r : r.map(celda_); });\n    sh.getRange(1, 1, Math.max(datos.length, 1), datos[0].length).clearContent();\n    sh.getRange(1, 1, todo.length, datos[0].length).setValues(todo);\n    olvidarHoja_(CFG.HOJAS.MERCADEO);\n    log_('', s.usuario, 'MERCADEO_MES', mes + ' · ' + filas.length + ' filas');\n  });\n  return { mes: mes, fijos: fijos.length, reactivacion: react.length };\n}\n\nfunction mercadeoMeses(token) {\n  sesion_(token, 'mercadeo');\n  const cuenta = {};\n  filasComoObjetos_(hoja_(CFG.HOJAS.MERCADEO)).forEach(function (r) {\n    if (!r.MES) return;\n    const c = cuenta[r.MES] || (cuenta[r.MES] = { mes: r.MES, fijos: 0, reactivacion: 0, fecha: r.FECHA });\n    if (r.TIPO === 'FIJO') c.fijos++; else c.reactivacion++;\n  });\n  return Object.keys(cuenta).sort().reverse().map(function (k) { return cuenta[k]; });\n}\n\nfunction mercadeoMes(token, mes) {\n  sesion_(token, 'mercadeo');\n  return filasComoObjetos_(hoja_(CFG.HOJAS.MERCADEO)).filter(function (r) { return r.MES === mes; }).map(function (r) {\n    return { tipo: r.TIPO, idCliente: r.ID_CLIENTE, cliente: r.CLIENTE, nit: r.NIT, telefono: r.TELEFONO, sede: r.SEDE, ultimo: r.ULTIMO_SERVICIO, meses: r.MESES_SIN_SERVICIO, proximo: r.PROXIMO_SERVICIO, detalle: r.DETALLE };\n  });\n}\n\n/* ===================== Programación automática de clientes fijos ===================== */\n\n/**\n * Crea la ODS de cada sede con equipos de frecuencia a la que le toca servicio en los próximos CFG.DIAS_ANTICIPACION días\n * (o ya vencida), si no tiene una orden abierta. La orden queda sin técnico, con \"Pendiente por confirmar disponibilidad\"\n * y en el calendario el día que le toca, para que la auxiliar haga el mercadeo y confirme fecha y técnico.\n */\nfunction programarFijos_(usuario, soloApp) {\n  const manana = Utilities.formatDate(new Date(Date.now() + 864e5), TZ, 'yyyy-MM-dd');\n  const ultimaTarifa = {};\n  // La última tarifa del cliente, incluida \"sin tarifa\" (''); las órdenes sin cobro no cuentan.\n  leerODS_().forEach(function (o) { if (o.TIPO_ORDEN !== 'SIN_COBRO') ultimaTarifa[o.ID_CLIENTE] = String(o.TARIFA || ''); });\n  const creadas = [], errores = [];\n  calcularFijos_(CFG.DIAS_ANTICIPACION, soloApp).forEach(function (g) {\n    if (g.odsAbierta || !g.idCliente || !g.idSede) return;\n    const fecha = g.proximo && g.proximo > manana ? g.proximo : manana;\n    try {\n      creadas.push(crearODS_({\n        idCliente: g.idCliente, idSede: g.idSede, equipos: g.equiposIds, tipoServicio: 'MANTENIMIENTO',\n        tarifa: g.idCliente in ultimaTarifa ? ultimaTarifa[g.idCliente] : 'PLENA', items: [], pendDisponibilidad: true, tecnico: '', fechaProgramada: fecha,\n        solicitud: 'Mantenimiento periódico (cada ' + g.frecuencia + '). Último servicio: ' + (g.ultimo || 'sin registro') + '. Confirmar disponibilidad, fecha y técnico.'\n      }, usuario, { auto: true }));\n    } catch (e) { errores.push(g.idSede + ': ' + e.message); }\n  });\n  if (errores.length) log_('', usuario, 'ERROR_PROGRAMAR_FIJOS', errores.join(' | ').slice(0, 4000));\n  return { creadas: creadas, errores: errores.length };\n}\n\n/**\n * Disparador diario (lo crea la instalación). Siempre activo. Programa solo equipos con frecuencia cuyo último servicio\n * se hizo en la app: después de cada servicio cerrado en la app, el siguiente queda por confirmar y en el calendario.\n * Antes quita las órdenes automáticas que se habían creado con los datos de la base anterior.\n */\nfunction programarFijosDiario(e) {\n  soloInterno_(e);\n  try { cerrarEnlacesVencidos_(); } catch (err) { log_('', 'sistema', 'ERROR_ENLACES', err.message); }\n  try { limpiarVideosViejos_(); } catch (err) { log_('', 'sistema', 'ERROR_VIDEOS', err.message); }\n  try { respaldoSemanal_(); } catch (err) { log_('', 'sistema', 'ERROR_RESPALDO', err.message); }\n  try { quitarAutomaticasDeBase_('sistema'); } catch (e) { log_('', 'sistema', 'ERROR_QUITAR_AUTOMATICAS', e.message); }\n  return programarFijos_('sistema', true);\n}\n\n/**\n * Órdenes automáticas que nadie ha tocado (por confirmar, sin técnico, en Programada, sin iniciar) y cuyos equipos\n * no tienen ningún servicio en la app: salieron de la base anterior, que ya no programa sola (20/10/2026).\n */\nfunction automaticasDeBase_() {\n  const conServicio = ultimosServicios_().porEquipo;\n  return leerODS_().filter(function (o) {\n    if (o.AUTO !== 'SI' || o.ESTADO !== 'PROGRAMADA' || !esProvisional_(o.ID_ODS) || o.TECNICO || o.HORA_INICIO) return false;\n    return !String(o.EQUIPOS_IDS || '').split(',').filter(String).some(function (e) { return conServicio[e]; });\n  });\n}\n\n/** Respaldo de la hoja ODS; borra los eventos del calendario y las filas de esas órdenes. */\nfunction quitarAutomaticasDeBase_(usuario) {\n  return conLock_(function () {\n    const lista = automaticasDeBase_();\n    if (!lista.length) return { quitadas: 0, respaldo: '' };\n    const respaldo = 'RESPALDO_ODS_' + Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd_HHmm');\n    protegerHoja_(hoja_(CFG.HOJAS.ODS).copyTo(SpreadsheetApp.getActive()).setName(respaldo));\n    const cal = calendario_();\n    lista.forEach(function (o) {\n      if (!cal || !o.EVENTO_ID) return;\n      try { const ev = cal.getEventById(o.EVENTO_ID); if (ev) ev.deleteEvent(); } catch (e) { /* ya no existe */ }\n    });\n    const sh = hoja_(CFG.HOJAS.ODS);\n    lista.map(function (o) { return o._fila; }).sort(function (a, b) { return b - a; }).forEach(function (f) { sh.deleteRow(f); });\n    olvidarHoja_(CFG.HOJAS.ODS);\n    log_('', usuario, 'QUITAR_AUTOMATICAS', lista.map(function (o) { return o.ID_ODS; }).join(',').slice(0, 4000));\n    return { quitadas: lista.length, respaldo: respaldo };\n  });\n}\n\n/** Botón \"Programar ahora\" de Mercadeo. */\nfunction mercadeoProgramarAhora(token) {\n  const s = sesion_(token, 'mercadeo');\n  return programarFijos_(s.usuario, true);\n}\n\n// Ods.gs\n/**\n * Ciclo de la orden de servicio:\n *   PROGRAMADA → EN_CURSO → CERRADA_TECNICO → REVISADA → LIQUIDADA → COMPLETADA\n *                                                          └→ POR_FACTURAR → COMPLETADA (factura electrónica)\n *   ANULADA en cualquier momento antes de completar (conserva el número).\n *   RETORNO: una orden COMPLETADA vuelve a PROGRAMADA, sin cobro; al revisarla pasa directo a COMPLETADA.\n */\n\n/* ===================== Lectura y escritura de la hoja ODS ===================== */\n\nfunction leerODS_() {\n  return filasComoObjetos_(CFG.HOJAS.ODS).filter(function (o) { return o.ID_ODS; });\n}\n\n/** Huella de la fila (cambia con cualquier dato; ACTUALIZADO solo llega al minuto). Para que el celular sepa si algo cambió. */\nfunction versionODS_(o) {\n  const txt = JSON.stringify(o);\n  let h = 5381;\n  for (let i = 0; i < txt.length; i++) h = ((h * 33) ^ txt.charCodeAt(i)) | 0;\n  return (h >>> 0).toString(36) + '.' + txt.length.toString(36);\n}\n\nfunction buscarODS_(id) {\n  const o = leerODS_().filter(function (x) { return x.ID_ODS === id; })[0];\n  if (!o) throw new Error('No existe la orden ' + id);\n  return o;\n}\n\n/** Escribe los campos indicados de una ODS en una sola operación. Llamar dentro de conLock_. */\nfunction actualizarODS_(fila, cambios) {\n  const sh = hoja_(CFG.HOJAS.ODS);\n  const idx = indiceEncabezados_(sh);\n  const n = sh.getLastColumn();\n  const rango = sh.getRange(fila, 1, 1, n);\n  const valores = rango.getValues()[0];\n  cambios.ACTUALIZADO = ahora_();\n  Object.keys(cambios).forEach(function (k) {\n    if (idx[k] === undefined) throw new Error('Columna desconocida en ODS: ' + k);\n    valores[idx[k]] = cambios[k];\n  });\n  rango.setValues([valores.map(celda_)]);\n  memoFila_(CFG.HOJAS.ODS, fila, valores);\n}\n\n/** Cada tipo de orden con su consecutivo: ODS-#, GA-# (garantía) y SC-# (servicio sin cobro, no gasta número ODS). */\nconst CONSECUTIVOS_ = { ODS: ['CONSECUTIVO_ODS', 'ODS-'], GARANTIA: ['CONSECUTIVO_GA', 'GA-'], SIN_COBRO: ['CONSECUTIVO_SC', 'SC-'] };\n\nfunction siguienteNumero_(tipoOrden) {\n  const p = PropertiesService.getScriptProperties();\n  const c = CONSECUTIVOS_[tipoOrden] || CONSECUTIVOS_.ODS;\n  const n = Number(p.getProperty(c[0]) || 0) + 1;\n  p.setProperty(c[0], String(n));\n  return c[1] + n;\n}\n\n/** Número provisional de una orden por confirmar: no gasta consecutivo ODS ni GA. */\nfunction numeroProvisional_() {\n  const p = PropertiesService.getScriptProperties();\n  const n = Number(p.getProperty('CONSECUTIVO_PC') || 0) + 1;\n  p.setProperty('CONSECUTIVO_PC', String(n));\n  return CFG.PREFIJO_PROVISIONAL + n;\n}\n\nfunction esProvisional_(id) { return String(id || '').indexOf(CFG.PREFIJO_PROVISIONAL) === 0; }\n\n/** Pasa el historial de la orden del número provisional al definitivo. */\nfunction renombrarLog_(viejo, nuevo) {\n  const sh = hoja_(CFG.HOJAS.LOG);\n  const n = sh.getLastRow() - 1;\n  if (n < 1) return;\n  // ID_ODS es la columna B (CFG.LOG_COLS): se lee solo esa y se escriben solo las celdas de esa orden, en bloques.\n  const vals = sh.getRange(2, 2, n, 1).getValues();\n  const filas = [];\n  vals.forEach(function (v, i) { if (String(v[0]) === viejo) filas.push(i + 2); });\n  for (let i = 0; i < filas.length;) {\n    let j = i; while (j + 1 < filas.length && filas[j + 1] === filas[j] + 1) j++;\n    sh.getRange(filas[i], 2, filas[j] - filas[i] + 1, 1).setValues(filas.slice(i, j + 1).map(function () { return [nuevo]; }));\n    i = j + 1;\n  }\n  if (filas.length) olvidarHoja_(CFG.HOJAS.LOG);\n}\n\n/** Normaliza los ítems y calcula los totales por categoría. */\n/** sinCobro: servicio sin cobro, los ítems solo describen el trabajo (valor 0). */\nfunction calcularItems_(items, sinCobro) {\n  const lista = (items || []).map(function (it) {\n    const cant = numero_(it.cant) || 0;\n    const valor = sinCobro ? 0 : numero_(it.valor) || 0;\n    const cat = CFG.CATEGORIAS_ITEM.indexOf(String(it.cat || '').toUpperCase()) >= 0 ? String(it.cat).toUpperCase() : 'SERVICIO';\n    return { cod: String(it.cod || '').trim(), desc: String(it.desc || '').trim(), cat: cat, cant: cant, valor: valor, subtotal: Math.round(cant * valor) };\n  }).filter(function (it) { return it.desc || it.cod; });\n  lista.forEach(function (it) {\n    if (!(it.cant > 0)) throw new Error('Cantidad inválida en \"' + (it.desc || it.cod) + '\".');\n    if (!(it.valor >= 0)) throw new Error('Valor inválido en \"' + (it.desc || it.cod) + '\".');\n  });\n  const suma = function (cat) { return lista.filter(function (i) { return i.cat === cat; }).reduce(function (a, i) { return a + i.subtotal; }, 0); };\n  const r = { items: lista, manoObra: suma('SERVICIO'), materiales: suma('MATERIAL'), transporte: suma('TRANSPORTE') };\n  r.total = r.manoObra + r.materiales + r.transporte;\n  return r;\n}\n\nfunction leerJSON_(s, defecto) {\n  if (!s) return defecto;\n  try { return JSON.parse(s); } catch (e) { return defecto; }\n}\n\nfunction fotosDe_(o) {\n  return o.FOTOS ? o.FOTOS.split('\\n').filter(String).map(function (l) { const p = l.split('|'); return { tipo: p[0], id: p[1], clave: p[2] || '', jornada: Number(p[3]) || 1, usuario: p[4] || '' }; }) : [];\n}\n\n/* ===================== Equipo de técnicos ===================== */\n// Cada orden tiene un técnico responsable (TECNICO) y técnicos de apoyo (TECNICOS_APOYO, usuarios separados por coma).\n// Todos ven la orden en su panel y cualquiera la puede iniciar, documentar, pausar o cerrar (decisión de Samuel, 20/10/2026).\n\nfunction apoyoDe_(o) { return String(o.TECNICOS_APOYO || '').split(',').filter(String); }\n\n/** ¿El usuario es el responsable o uno de los técnicos de apoyo de la orden? */\nfunction esDeLaOrden_(o, usuario) { return !!usuario && (o.TECNICO === usuario || apoyoDe_(o).indexOf(usuario) >= 0); }\n\n/** \"Jaime Ospina + Osiel Díaz\" para el calendario, el PDF y las listas. */\nfunction equipoTecnico_(o) {\n  return [o.TECNICO_NOMBRE].concat(String(o.APOYO_NOMBRES || '').split(',').filter(String)).filter(String).join(' + ');\n}\n\n/** Valida los técnicos de apoyo: activos, sin repetir y sin el responsable. Devuelve {usuarios, nombres} como texto. */\nfunction validarApoyo_(lista, responsable) {\n  const tecs = tecnicos_();\n  const usuarios = [], nombres = [];\n  (Array.isArray(lista) ? lista : String(lista || '').split(',')).map(String).filter(String).forEach(function (u) {\n    if (u === responsable || usuarios.indexOf(u) >= 0) return;\n    const t = tecs.filter(function (x) { return x.usuario === u; })[0];\n    if (!t) throw new Error('Técnico de apoyo no encontrado o inactivo: ' + u);\n    usuarios.push(t.usuario); nombres.push(t.nombre);\n  });\n  if (usuarios.length && !responsable) throw new Error('Escoja primero el técnico responsable.');\n  return { usuarios: usuarios.join(','), nombres: nombres.join(',') };\n}\n\n/** Agrega a la hoja ODS las columnas nuevas si todavía no se corrió Instalar después de actualizar el código. */\n/* ===================== Varias sedes en una orden ===================== */\n// La orden tiene una sede principal (ID_SEDE, SEDE, DIRECCION...) y puede tener sedes adicionales del mismo cliente\n// (SEDES_EXTRA: ids; SEDES_EXTRA_DETALLE: JSON con nombre y dirección). Los equipos pueden ser de cualquiera de ellas.\n\nfunction sedesExtraDe_(o) { return String(o.SEDES_EXTRA || '').split(',').filter(String); }\n\nfunction datoSede_(s) {\n  return { id: s.id, nombre: s.nombre || s.direccion, direccion: s.direccion || '', barrio: s.barrio || '', ciudad: s.ciudad || '', contacto: s.contacto || '', telefono: s.telefono || '' };\n}\n\n/** Sede principal y adicionales de la orden, como quedaron guardadas en ella. */\nfunction sedesDeOrden_(o) {\n  return [{ id: o.ID_SEDE, nombre: o.SEDE, direccion: o.DIRECCION, barrio: o.BARRIO, ciudad: o.CIUDAD }].concat(leerJSON_(o.SEDES_EXTRA_DETALLE, []));\n}\n\nfunction validarSedesExtra_(idCliente, idPrincipal, lista) {\n  const sedes = sedesDe_(idCliente);\n  return (lista || []).map(String).filter(function (x, i, a) { return x && x !== idPrincipal && a.indexOf(x) === i; }).map(function (id) {\n    const s = sedes.filter(function (x) { return x.id === id; })[0];\n    if (!s) throw new Error('La sede ' + id + ' no es de este cliente.');\n    return datoSede_(s);\n  });\n}\n\n/** Equipos de la orden en el orden de sus sedes; con varias sedes, cada línea del detalle dice de cuál es. */\nfunction equiposDeSedes_(ids, sedes) {\n  const orden = sedes.map(function (s) { return s.id; });\n  return leerMaestra_('EQUIPOS').filter(function (e) { return ids.indexOf(e.id) >= 0 && orden.indexOf(e.sede) >= 0; })\n    .sort(function (a, b) { return orden.indexOf(a.sede) - orden.indexOf(b.sede) || ids.indexOf(a.id) - ids.indexOf(b.id); });\n}\nfunction detalleEquipos_(equipos, sedes) {\n  const nombre = {}; sedes.forEach(function (s) { nombre[s.id] = s.nombre; });\n  return equipos.map(function (e) { return (sedes.length > 1 ? '[' + (nombre[e.sede] || e.sede) + '] ' : '') + describirEquipo_(e); }).join('\\n');\n}\n\nfunction asegurarColumnasODS_() { prepararHoja_(SpreadsheetApp.getActive(), CFG.HOJAS.ODS, CFG.ODS_COLS); }\n\nfunction resumenODS_(o) {\n  return {\n    id: o.ID_ODS, tipoOrden: o.TIPO_ORDEN, numeroCaso: o.NUMERO_CASO, estado: o.ESTADO,\n    cliente: o.CLIENTE, nit: o.NIT, sede: o.SEDE, direccion: o.DIRECCION, barrio: o.BARRIO, ciudad: o.CIUDAD,\n    contacto: o.CONTACTO, telefono: o.TELEFONO, tipoServicio: o.TIPO_SERVICIO, tarifa: o.TARIFA,\n    tecnico: o.TECNICO, tecnicoNombre: o.TECNICO_NOMBRE, apoyo: apoyoDe_(o), apoyoNombres: String(o.APOYO_NOMBRES || '').split(',').filter(String),\n    equipoTecnico: equipoTecnico_(o), fechaProgramada: o.FECHA_PROGRAMADA, creada: o.FECHA_CREACION,\n    total: numero_(o.TOTAL), formaPago: o.FORMA_PAGO, factura: o.FACTURA_SIIGO, siigoError: o.SIIGO_ERROR,\n    pendDisponibilidad: o.PEND_DISPONIBILIDAD === 'SI', requierePermisos: o.REQUIERE_PERMISOS === 'SI',\n    enRetorno: o.EN_RETORNO === 'SI', retornos: numero_(o.RETORNOS), horaCierre: o.HORA_CIERRE,\n    valorRecibido: o.VALOR_RECIBIDO === '' ? null : numero_(o.VALOR_RECIBIDO), fechaPago: o.FECHA_PAGO, completada: o.FECHA_COMPLETADA,\n    pausaMotivo: o.PAUSA_MOTIVO, pausaRetoma: o.PAUSA_RETOMA, auto: o.AUTO === 'SI', soporteEnviado: o.SOPORTE_ENVIADO,\n    jornadas: leerJSON_(o.JORNADAS, []).length\n  };\n}\n\n/** Clientes que facturan con orden de compra (CLIENTES.FACTURA_CON_OC = SI), leídos una vez por llamada. */\nfunction clientesConOC_() {\n  if (!MEMO_.clientesOC) {\n    const m = {};\n    leerMaestra_('CLIENTES').forEach(function (c) { if (String(c.facturaConOc || '').toUpperCase() === 'SI') m[c.id] = true; });\n    MEMO_.clientesOC = m;\n  }\n  return MEMO_.clientesOC;\n}\n\n/**\n * Total cotizado antes de IVA, como lo liquidado: la suma de las líneas guardadas de la cotización.\n * Las cotizaciones traídas de Siigo antes del 23/10/2026 guardaron el total con IVA. null si no hay total.\n */\nfunction totalCotizacion_(o) {\n  let items = [];\n  try { items = o.COTIZACION_ITEMS ? JSON.parse(o.COTIZACION_ITEMS) : []; } catch (e) { items = []; }\n  if (items.length) return items.reduce(function (a, i) { return a + (numero_(i.cant) || 0) * (numero_(i.valor) || 0); }, 0);\n  return o.COTIZACION_TOTAL === '' || o.COTIZACION_TOTAL === undefined ? null : numero_(o.COTIZACION_TOTAL);\n}\n\n/**\n * Factura con orden de compra: el cliente pide una cotización con lo liquidado y envía su OC; sin el número de la OC\n * la factura no se envía a Siigo. esperandoOC = ya está para facturar y falta la OC.\n */\nfunction conOC_(d, o) {\n  d.facturaConOc = !!clientesConOC_()[o.ID_CLIENTE];\n  d.esperandoOC = d.facturaConOc && o.FORMA_PAGO === 'FACTURA' && ['LIQUIDADA', 'POR_FACTURAR'].indexOf(o.ESTADO) >= 0 && !o.OC_NUMERO && !o.SIIGO_ID;\n  d.ocNumero = o.OC_NUMERO || ''; d.cotizacion = o.COTIZACION || '';\n  return d;\n}\n\nfunction detalleODS_(o) {\n  const d = conOC_(resumenODS_(o), o);\n  d.idCliente = o.ID_CLIENTE; d.idSede = o.ID_SEDE;\n  d.sedesExtra = leerJSON_(o.SEDES_EXTRA_DETALLE, []);\n  d.equiposIds = o.EQUIPOS_IDS ? o.EQUIPOS_IDS.split(',').filter(String) : [];\n  d.equipos = o.EQUIPOS_DETALLE ? o.EQUIPOS_DETALLE.split('\\n').filter(String) : [];\n  d.falla = o.FALLA_CLIENTE; d.items = leerJSON_(o.ITEMS, []);\n  d.oc = o.OC_NUMERO ? { numero: o.OC_NUMERO, fecha: fechaISO_(o.OC_FECHA), valor: o.OC_VALOR === '' ? null : numero_(o.OC_VALOR), archivoId: o.OC_ARCHIVO_ID,\n    id: o.OC_ID || '', tercero: o.OC_TERCERO || '', items: leerJSON_(o.OC_ITEMS, []) } : null;\n  d.archivo = { pendiente: o.ARCHIVO_PENDIENTE || '', odsId: o.ODS_FINAL_ID || '',\n    retornos: String(o.ODS_RETORNOS_IDS || '').split(',').filter(String), fecha: o.ARCHIVADO || '', error: o.ARCHIVO_ERROR || '', carpetaId: o.CARPETA_ID || '' };\n  // Cotización y orden de compra: información interna. No va al técnico ni al cliente (PDF, factura).\n  d.cotizacion = o.COTIZACION || ''; d.cotizacionId = o.COTIZACION_ID; d.cotizacionFecha = fechaISO_(o.COTIZACION_FECHA);\n  d.cotizacionItems = leerJSON_(o.COTIZACION_ITEMS, []);\n  d.cotizacionTotal = totalCotizacion_(o);\n  d.manoObra = numero_(o.MANO_OBRA); d.materiales = numero_(o.MATERIALES); d.transporte = numero_(o.TRANSPORTE);\n  d.solicitud = o.SOLICITUD; d.horaInicio = o.HORA_INICIO;\n  d.estadoArtefacto = o.ESTADO_ARTEFACTO ? o.ESTADO_ARTEFACTO.split(',').filter(String) : [];\n  d.trabajo = o.TRABAJO_REALIZADO; d.obs = o.OBS_TECNICO;\n  d.recibeNombre = o.RECIBE_NOMBRE; d.recibeDoc = o.RECIBE_DOC;\n  d.fotos = fotosDe_(o).map(function (f) { return { tipo: f.tipo, id: f.id, jornada: f.jornada, clave: f.clave, usuario: f.usuario }; });\n  d.firmaId = o.FIRMA_ID; d.carpetaId = o.CARPETA_ID; d.placas = leerJSON_(o.PLACAS, {});\n  d.revisadoPor = o.REVISADO_POR; d.fechaRevision = o.FECHA_REVISION;\n  d.adicionales = o.ADICIONALES; d.liquidadoPor = o.LIQUIDADO_POR; d.fechaLiquidacion = o.FECHA_LIQUIDACION;\n  d.referenciaPago = o.REFERENCIA_PAGO; d.cobra lor === undefined || c.valor === null || c.valor === '' ? '' : numero_(c.valor);\n  if (valor !== '' && !(valor >= 0)) throw new Error('Valor de la orden de compra inválido.');\n  const items = lineasDoc_(c.items);\n  return { numero: numero, fecha: fechaISO_(c.fecha) || '', valor: valor, id: String(c.id || '').slice(0, 80), tercero: String(c.tercero || '').slice(0, 120), items: items };\n}\n\n/**\n * Cobro registra la orden de compra que envió el cliente (número y, si lo tiene, valor). Con el número se habilita\n * el envío a Siigo; el documento se trae del correo o se adjunta aparte. Avisa si el valor no es el cotizado.\n */\nfunction adminRegistrarOC(token, id, d) {\n  d = d || {};\n  const s = sesion_(token, 'cobrar');\n  const oc = normalizarOC_({ numero: d.numero, valor: d.valor, fecha: d.fecha || hoy_() });\n  if (!oc) throw new Error('Escriba el número de la orden de compra.');\n  conLock_(function () {\n    const o = buscarODS_(id);\n    if (['LIQUIDADA', 'POR_FACTURAR'].indexOf(o.ESTADO) < 0 || o.SIIGO_ID) throw new Error('La orden de compra se registra antes de enviar la factura a Siigo.');\n    const cambios = { OC_NUMERO: oc.numero, OC_FECHA: oc.fecha, OC_VALOR: oc.valor };\n    if (oc.numero !== o.OC_NUMERO && o.OC_ARCHIVO_ID) {\n      try { DriveApp.getFileById(o.OC_ARCHIVO_ID).setTrashed(true); } catch (e) { /* ya no existe */ }\n      cambios.OC_ARCHIVO_ID = '';\n    }\n    actualizarODS_(o._fila, cambios);\n    log_(id, s.usuario, 'REGISTRAR_OC', oc.numero + (oc.valor !== '' ? ' · $' + oc.valor : ''));\n  });\n  return adminDetalle(token, id);\n}\n\n/**\n * Cobro crea en Siigo la cotización con los ítems y valores liquidados (cliente que factura con orden de compra).\n * Cada ítem debe tener su producto en Siigo (se escoge o se crea antes, como al facturar). Queda en la orden como\n * su cotización; Adriana la envía al cliente desde Siigo.\n */\nfunction adminCrearCotizacionSiigo(token, id) {\n  const s = sesion_(token, 'cobrar');\n  const o = busc r('Adjunte la orden de compra en PDF, JPG o PNG.');\n  const bytes = Utilities.base64Decode(m[2]);\n  if (bytes.length > CFG.MAX_ADJUNTO_BYTES) throw new Error('El archivo pesa más de 8 MB.');\n  // Se revisa el contenido, no solo el tipo que manda el navegador.\n  const tipo = tipoReal_(bytes);\n  if (!tipo) throw new Error('Adjunte la orden de compra en PDF, JPG o PNG.');\n  adjuntarOC_(s, id, Utilities.newBlob(bytes, tipo), nombre, 'ADJUNTAR_OC');\n  return adminDetalle(token, id);\n}\n\n/**\n * Busca en el Gmail de la cuenta del sistema el PDF de la orden de compra que Siigo envió\n * (con copia a esta cuenta) y lo adjunta a la orden. La API de Siigo no expone las OC.\n */\nfunction adminOCDesdeCorreo(token, id) {\n  const s = sesion_(token, 'panel');\n  if (!puede_(s, 'editar') && !puede_(s, 'cobrar')) throw new Error('No autorizado.');\n  const o = buscarODS_(id);\n  if (!o.OC_NUMERO) throw new Error('Primero escriba el número de la orden de compra y guarde la orden.');\n  const adj = buscarOCEnCorreo_(o.OC_NUMERO);\n  if (!adj) throw new Error('No encontré en el correo un PDF de la OC ' + o.OC_NUMERO + '. Revise que al enviarla desde Siigo vaya con copia a ' + Session.getEffectiveUser().getEmail() + '.');\n  if (adj.blob.getBytes().length > CFG.MAX_ADJUNTO_BYTES) throw new Error('El PDF de la OC pesa más de 8 MB.');\n  adjuntarOC_(s, id, adj.blob, adj.nombre, 'OC_DESDE_CORREO');\n  return adminDetalle(token, id);\n}\n\n/**\n * Devuelve {blob, nombre, fecha} del PDF más reciente de la OC en el correo, o null.\n * Usa el servicio avanzado de Gmail con permiso de solo lectura: la app no puede borrar ni cambiar correos.\n */\nfunction buscarOCEnCorreo_(numero) {\n  // Solo letras, números y guion: el número no puede cambiar la búsqueda de Gmail.\n  const txt = String(numero || '').trim().toUpperCase().replace(/[^A-Z0-9-]/g, '');\n  const n = (/(\\d+)$/.exec(txt) || [])[1];\n  if (!n) return null;\n  const n0 = String(Number(n));\n  const terminos = ['\"' + txt + '\"', '\"OC-1-' + n0 + '\"', 'OC' + ('0000000000' + n0).slice(-10)]\n    .filter(function (t, i, a) { return a.indexOf(t) === i; });\n  const lista = Gmail.Users.Messages.list('me', { q: 'has:attachment newer_than:2y {' + terminos.join(' ') + '}', maxResults: 20 });\n  const numeroEn = function (texto) {\n    return (String(texto || '').match(/\\d+/g) || []).some(function (d) { return String(Number(d)) === n0; });\n  };\n  let mejor = null;\n  // Gmail entrega primero los más recientes: el primero con el número en el adjunto y en el correo es el mejor posible.\n  (lista.messages || []).some(function (ref) {\n    if (mejor && mejor.puntos === 3) return true;\n    const msg = Gmail.Users.Messages.get('me', ref.id, { format: 'full' });\n    const partes = partesCorreo_(msg.payload);\n    const asunto = ((msg.payload.headers || []).filter(function (h) { return /^subject$/i.test(h.name); })[0] || {}).value || '';\n    const texto = partes.filter(function (p) { return p.mimeType === 'text/plain' && p.body && p.body.data; })\n      .map(function (p) { return Utilities.newBlob(bytesGmail_(p.body.data)).getDataAsString(); }).join('\\n');\n    const cuerpo = (asunto + ' ' + texto).toUpperCase();\n    // Número completo, sin que la OC 31 coincida con la 310.\n    const enCuerpo = new RegExp('(^|[^0-9A-Z])(' + txt.replace(/[^0-9A-Z]/g, '\\\\W?') + '|OC\\\\W?1\\\\W?0*' + n0 + ')(?![0-9])').test(cuerpo);\n    const fecha = new Date(Number(msg.internalDate));\n    partes.forEach(function (p) {\n      const nombre = p.filename || '';\n      if (!nombre || !(p.body && (p.body.attachmentId || p.body.data))) return;\n      if (!/pdf/i.test(p.mimeType) && !/\\.pdf$/i.test(nombre)) return;\n      const puntos = (numeroEn(nombre) ? 2 : 0) + (enCuerpo ? 1 : 0);\n      if (!puntos) return;\n      if (!mejor || puntos > mejor.puntos || (puntos === mejor.puntos && fecha > mejor.fecha)) {\n        mejor = { msgId: ref.id, parte: p, nombre: nombre, fecha: fecha, puntos: puntos };\n      }\n    });\n  });\n  if (!mejor) return null;\n  const datos = mejor.parte.body.attachmentId\n    ? Gmail.Users.Messages.Attachments.get('me', mejor.msgId, mejor.parte.body.attachmentId).data\n    : mejor.parte.body.data;\n  return { blob: Utilities.newBlob(bytesGmail_(datos), 'application/pdf', mejor.nombre), nombre: mejor.nombre, fecha: mejor.fecha };\n}\n\n/** Todas las partes de un correo (las partes vienen anidadas). */\nfunction partesCorreo_(p) {\n  if (!p) return [];\n  let out = [p];\n  (p.parts || []).forEach(function (h) { out = out.concat(partesCorreo_(h)); });\n  return out;\n}\n\n/** El servicio de Gmail entrega los datos como bytes o como texto base64 web; se aceptan las dos formas. */\nfunction bytesGmail_(d) {\n  return typeof d === 'string' ? Utilities.base64DecodeWebSafe(d) : d;\n}\n\n/** Guarda el documento de la OC en la carpeta de la orden (reemplaza el anterior) y lo registra. */\nfunction adjuntarOC_(s, id, blob, nombre, accion) {\n  conLock_(function () {\n    const o = buscarODS_(id);\n    if (!o.OC_NUMERO) throw new Error('Primero escriba el número de la orden de compra.');\n    if (o.OC_ARCHIVO_ID) { try { DriveApp.getFileById(o.OC_ARCHIVO_ID).setTrashed(true); } catch (e) { /* ya no existe */ } }\n    const tipo = blob.getContentType();\n    const ext = tipo === 'application/pdf' ? '.pdf' : tipo === 'image/png' ? '.png' : '.jpg';\n    const fid = carpetaODS_(o).createFile(blob.setName('OC ' + o.OC_NUMERO + ' · ' + o.ID_ODS + ext)).getId();\n    const c = { OC_ARCHIVO_ID: fid };\n    if (o.ODS_FINAL_ID) c.ARCHIVO_PENDIENTE = unirMarcas_(o.ARCHIVO_PENDIENTE, ['ODS']);\n    actualizarODS_(o._fila, c);\n    log_(id, s.usuario, accion, o.OC_NUMERO + ' · ' + String(nombre || '').slice(0, 100));\n  });\n}\n\n/**\n * Trae de Siigo la cotización por su número, para cargarla en la orden.\n * Verifica que sea del mismo cliente (NIT). Las líneas toman la categoría de TARIFAS cuando el código existe.\n */\nfunction adminCotizacion(token, numero, idCliente) {\n  sesion_(token, 'editar');\n  if (!String(numero || '').trim()) throw new Error('Escriba el número de la cotización.');\n  if (!siigoConectado_()) throw new Error('Siigo todavía no está conectado. Deje el número escrito y cargue las líneas desde la lista de tarifas.');\n  const c = siigoBuscarCotizacion_(numero);\n  if (!c) throw new Error('No se encontró la cotización ' + numero + ' en Siigo.');\n  const cliente = idCliente ? buscarCliente_(idCliente) : null;\n  if (cliente) {\n    const a = String(cliente.nit || '').replace(/\\D/g, ''), b = c.nit.replace(/\\D/g, '');\n    if (a && b && a !== b) throw new Error('La cotización ' + c.numero + ' es del NIT ' + c.nit + ', no de ' + cliente.nombre + ' (NIT ' + cliente.nit + ').');\n  }\n  const cats = {};\n  tarifas_().forEach(function (t) { cats[t.codigo] = t.categoria; });\n  c.items = c.items.map(function (i) { i.cat = cats[i.cod] || 'SERVICIO'; return i; });\n  return c;\n}\n\n/** Confirma la disponibilidad: la orden queda confirmada y recibe su número ODS o GA. */\nfunction adminConfirmar(token, id) {\n  return adminEditar(token, id, { pendDisponibilidad: false });\n}\n\n/* ===================== API: flujo ===================== */\n\n/** conEvento: el cambio mueve el evento del calendario (se encola en el mismo bloqueo, sin volver a calcular el detalle). */\nfunction transicion_(token, permiso, id, desde, fn, conEvento) {\n  const s = sesion_(token, permiso);\n  conLock_(function () {\n    const o = buscarODS_(id);\n    if (desde.indexOf(o.ESTADO) < 0) throw new Error('La orden ' + id + ' está en ' + o.ESTADO + '.');\n    const r = fn(o, s);\n    const marcas = marcasPorAccion_(o, r.accion);\n    if (marcas) r.cambios.ARCHIVO_PENDIENTE = marcas;\n    actualizarODS_(o._fila, r.cambios);\n    log_(id, s.usuario, r.accion, r.detalle || '');\n    if (conEvento) sincronizarYGuardarEvento_(id);\n  });\n  return adminDetalle(token, id);\n}\n\n/** Revisión: la orden cerrada por el técnico pasa a liquidación. Si es un retorno, se completa sin cobro. */\nfunction adminRevisar(token, id) {\n  return transicion_(token, 'revisar', id, ['CERRADA_TECNICO'], function (o, s) {\n    const base = { REVISADO_POR: s.usuario, FECHA_REVISION: ahora_() };\n    // Servicio sin cobro: con la revisión de la auxiliar queda completado (sin liquidación, cobro ni Siigo).\n    if (o.TIPO_ORDEN === 'SIN_COBRO' && o.EN_RETORNO !== 'SI') {\n      base.ESTADO = 'COMPLETADA'; base.EN_RETORNO = ''; base.FECHA_COMPLETADA = ahora_();\n      return { cambios: base, accion: 'REVISAR_SIN_COBRO', detalle: 'Servicio sin cobro: pasa a COMPLETADA' };\n    }\n    if (o.EN_RETORNO === 'SI') {\n      base.ESTADO = 'COMPLETADA'; base.EN_RETORNO = ''; base.FECHA_COMPLETADA = ahora_();\n      return { cambios: base, accion: 'REVISAR_RETORNO', detalle: 'Retorno sin cobro: pasa a COMPLETADA' };\n    }\n    base.ESTADO = 'REVISADA';\n    return { cambios: base, accion: 'REVISAR' };\n  });\n}\n\n/** Devuelve al técnico una orden cerrada (para corregir fotos, firma o trabajo). */\nfunction adminDevolver(token, id, motivo) {\n  if (!String(motivo || '').trim()) throw new Error('Escriba el motivo de la devolución.');\n  return transicion_(token, 'revisar', id, ['CERRADA_TECNICO'], function () {\n    return { cambios: { ESTADO: 'EN_CURSO', HORA_CIERRE: '' }, accion: 'DEVOLVER', detalle: motivo };\n  });\n}\n\n/** Liquidación (Lucas): adicionales, ítems con precio final y forma de pago. */\nfunction adminLiquidar(token, id, d) {\n  d = d || {};\n  if (CFG.FORMAS_PAGO.indexOf(d.formaPago) < 0) throw new Error('Escoja la forma de pago.');\n  return transicion_(token, 'liquidar', id, ['REVISADA', 'LIQUIDADA'], function (o, s) {\n    const calc = calcularItems_(d.items !== undefined ? d.items : leerJSON_(o.ITEMS, []));\n    if (!calc.items.length && o.TIPO_ORDEN !== 'GARANTIA') throw new Error('La orden no tiene ítems para liquidar.');\n    return {\n      cambios: {\n        ESTADO: 'LIQUIDADA', ITEMS: JSON.stringify(calc.items), MANO_OBRA: calc.manoObra, MATERIALES: calc.materiales,\n        TRANSPORTE: calc.transporte, TOTAL: calc.total, ADICIONALES: String(d.adicionales || '').trim(),\n        FORMA_PAGO: d.formaPago, LIQUIDADO_POR: s.usuario, FECHA_LIQUIDACION: ahora_()\n      },\n      accion: 'LIQUIDAR', detalle: d.formaPago + ' · $' + calc.total\n    };\n  });\n}\n\n/** Cobro (Adriana): registra el pago y completa la orden. No aplica a factura electrónica. */\nfunction adminCobrar(token, id, d) {\n  d = d || {};\n  return transicion_(token, 'cobrar', id, ['LIQUIDADA'], function (o, s) {\n    if (o.FORMA_PAGO === 'FACTURA') throw new Error('Esta orden va con factura electrónica: páselo a Por facturar.');\n    const valor = d.valorRecibido === undefined || d.valorRecibido === '' ? numero_(o.TOTAL) : numero_(d.valorRecibido);\n    if (!(valor >= 0)) throw new Error('Valor recibido inválido.');\n    const forma = d.formaPago && ['EFECTIVO', 'TRANSFERENCIA'].indexOf(d.formaPago) >= 0 ? d.formaPago : (o.FORMA_PAGO === 'PENDIENTE' ? '' : o.FORMA_PAGO);\n    if (!forma) throw new Error('Indique si el pago fue en efectivo o por transferencia.');\n    if (forma === 'TRANSFERENCIA' && !String(d.referenciaPago || '').trim()) throw new Error('Escriba la referencia de la transferencia.');\n    return {\n      cambios: {\n        ESTADO: 'COMPLETADA', FORMA_PAGO: forma, VALOR_RECIBIDO: valor, FECHA_PAGO: fechaISO_(d.fechaPago) || hoy_(),\n        REFERENCIA_PAGO: String(d.referenciaPago || '').trim(), COBRADO_POR: s.usuario, FECHA_COBRO: ahora_(), FECHA_COMPLETADA: ahora_()\n      },\n      accion: 'COBRAR', detalle: forma + ' · $' + valor\n    };\n  });\n}\n\n/** Cobro (Adriana): una orden de factura electrónica pasa a Por facturar. */\nfunction adminPasarAFacturar(token, id) {\n  return transicion_(token, 'cobrar', id, ['LIQUIDADA'], function (o, s) {\n    if (o.FORMA_PAGO !== 'FACTURA') throw new Error('La forma de pago de esta orden no es factura electrónica.');\n    return { cambios: { ESTADO: 'POR_FACTURAR', COBRADO_POR: s.usuario, FECHA_COBRO: ahora_() }, accion: 'POR_FACTURAR' };\n  });\n}\n\n/** Envía la orden a Siigo como factura sin enviar a la DIAN. Adriana la revisa y la termina en Siigo. */\nfunction adminEnviarSiigo(token, id) {\n  const s = sesion_(token, 'cobrar');\n  // Si la factura anterior se anuló en Siigo, se desliga y se puede enviar una nueva.\n  verificarFacturaSiigo_(id, s.usuario);\n  const o = conLock_(function () {\n    const x = buscarODS_(id);\n    if (x.ESTADO !== 'POR_FACTURAR') throw new Error('Solo se envía a Siigo una orden en Por facturar (está en ' + x.ESTADO + ').');\n    if (x.SIIGO_ID) throw new Error('Ya se envió a Siigo: ' + x.FACTURA_SIIGO);\n    if (!x.OC_NUMERO && clientesConOC_()[x.ID_CLIENTE]) throw new Error('Este cliente factura con orden de compra: registre el número de la OC antes de enviar la factura.');\n    const enviando = /^ENVIANDO\\|(\\d+)$/.exec(x.FACTURA_SIIGO);\n    if (enviando && Date.now() - Number(enviando[1]) < 10 * 60 * 1000) throw new Error('La orden se está enviando a Siigo. Espere un momento.');\n    actualizarODS_(x._fila, { FACTURA_SIIGO: 'ENVIANDO|' + Date.now(), SIIGO_ERROR: '' });\n    return x;\n  });\n  try {\n    const f = siigoCrearFactura_(o);\n    conLock_(function () {\n      actualizarODS_(o._fila, { FACTURA_SIIGO: f.nombre, SIIGO_ID: f.id, SIIGO_ERROR: '' });\n      log_(id, s.usuario, 'SIIGO', f.nombre + (f.yaExistia ? ' (ya estaba creada en Siigo; no se creó otra)' : ''));\n    });\n  } catch (e) {\n    conLock_(function () {\n      actualizarODS_(o._fila, { FACTURA_SIIGO: '', SIIGO_ERROR: String(e.message).slice(0, 500) });\n      log_(id, s.usuario, 'ERROR_SIIGO', e.message);\n    });\n    throw new Error('Siigo: ' + e.message);\n  }\n  return adminDetalle(token, id);\n}\n\n/** Adriana terminó la factura en Siigo: la orden se completa. Si la factura se hizo a mano en Siigo, se escribe el número. */\nfunction adminFacturaTerminada(token, id, numeroFactura) {\n  return transicion_(token, 'cobrar', id, ['POR_FACTURAR'], function (o) {\n    const num = String(numeroFactura || '').trim() || (/^ENVIANDO\\|/.test(o.FACTURA_SIIGO) ? '' : o.FACTURA_SIIGO);\n    if (!num) throw new Error('Escriba el número de la factura de Siigo.');\n    if (!o.OC_NUMERO && !o.SIIGO_ID && clientesConOC_()[o.ID_CLIENTE]) throw new Error('Este cliente factura con orden de compra: registre la OC y envíe la factura antes de marcarla terminada.');\n    return { cambios: { ESTADO: 'COMPLETADA', FACTURA_SIIGO: num, FECHA_COMPLETADA: ahora_() }, accion: 'FACTURA_TERMINADA', detalle: num };\n  });\n}\n\n/** Retorno: reabre una orden completada para volver donde el cliente. Sin cobro (garantía), por defecto el mismo técnico. */\nfunction adminRetorno(token, id, d) {\n  d = d || {};\n  if (!String(d.motivo || '').trim()) throw new Error('Escriba el motivo del retorno.');\n  return transicion_(token, 'retorno', id, ['COMPLETADA'], function (o) {\n    let tec = { usuario: o.TECNICO, nombre: o.TECNICO_NOMBRE };\n    if (d.tecnico && d.tecnico !== o.TECNICO) {\n      tec = tecnicos_().filter(function (t) { return t.usuario === d.tecnico; })[0];\n      if (!tec) throw new Error('Técnico no encontrado o inactivo.');\n    }\n    const anterior = { HORA_INICIO: o.HORA_INICIO, HORA_CIERRE: o.HORA_CIERRE, TRABAJO_REALIZADO: o.TRABAJO_REALIZADO, OBS_TECNICO: o.OBS_TECNICO,\n      RECIBE_NOMBRE: o.RECIBE_NOMBRE, RECIBE_DOC: o.RECIBE_DOC, FIRMA_ID: o.FIRMA_ID, ESTADO_ARTEFACTO: o.ESTADO_ARTEFACTO, REVISADO_POR: o.REVISADO_POR, JORNADAS: o.JORNADAS };\n    return {\n      cambios: {\n        ESTADO: 'PROGRAMADA', EN_RETORNO: 'SI', RETORNOS: numero_(o.RETORNOS) + 1, MOTIVO_RETORNO: String(d.motivo).trim(),\n        TECNICO: tec.usuario, TECNICO_NOMBRE: tec.nombre, FECHA_PROGRAMADA: String(d.fechaProgramada || '').replace('T', ' '),\n        HORA_INICIO: '', HORA_CIERRE: '', TRABAJO_REALIZADO: '', OBS_TECNICO: '', RECIBE_NOMBRE: '', RECIBE_DOC: '', FIRMA_ID: '',\n        ESTADO_ARTEFACTO: '', REVISADO_POR: '', FECHA_REVISION: '', JORNADAS: '', INICIO_JORNADA: '', ODS_PDF_ID: '', SOPORTE_ENVIADO: ''\n      },\n      accion: 'RETORNO', detalle: JSON.stringify({ motivo: d.motivo, cierreAnterior: anterior }).slice(0, 4000)\n    };\n  }, true);\n}\n\n/** Anula la orden: conserva el número para que el consecutivo no tenga huecos. */\nfunction adminAnular(token, id, motivo) {\n  if (!String(motivo || '').trim()) throw new Error('Escriba el motivo de la anulación.');\n  sesion_(token, 'anular');\n  verificarFacturaSiigo_(id, 'sistema');\n  return transicion_(token, 'anular', id, ['PROGRAMADA', 'EN_CURSO', 'EN_PAUSA', 'CERRADA_TECNICO', 'REVISADA', 'LIQUIDADA', 'POR_FACTURAR'], function (o) {\n    if (o.SIIGO_ID) throw new Error('La orden ya tiene factura en Siigo (' + o.FACTURA_SIIGO + '). Anule primero la factura en Siigo.');\n    return { cambios: { ESTADO: 'ANULADA', MOTIVO_ANULACION: String(motivo).trim(), EN_RETORNO: '' }, accion: 'ANULAR', detalle: motivo };\n  }, true);\n}\n\nfunction adminReactivar(token, id) {\n  return transicion_(token, 'anular', id, ['ANULADA'], function () {\n    return { cambios: { ESTADO: 'PROGRAMADA', MOTIVO_ANULACION: '', HORA_CIERRE: '' }, accion: 'REACTIVAR' };\n  }, true);\n}\n\n/* ===================== Google Calendar (calendario administrativo) ===================== */\n\nfunction calendario_() {\n  const id = PropertiesService.getScriptProperties().getProperty('CALENDARIO_ID');\n  if (!id) return null;\n  return CalendarApp.getCalendarById(id);\n}\n\n/** Crea, actualiza o borra el evento de la orden y guarda su id. Un error de Calendar no detiene la operación. */\n/**\n * El evento del calendario ya no demora el botón: la orden queda en la cola y el disparador de segundo plano\n * (cada minuto) lo crea o lo mueve. Así guardar, editar, pausar o cerrar responde sin esperar a Google Calendar.\n */\nfunction sincronizarYGuardarEvento_(id) {\n  encolarSegundoPlano_('CAL', id);\n}\n\nfunction sincronizarEventoAhora_(id) {\n  try {\n    const o = buscarODS_(id);\n    const nuevoId = sincronizarEvento_(o);\n    if (nuevoId !== o.EVENTO_ID) conLock_(function () { actualizarODS_(buscarODS_(id)._fila, { EVENTO_ID: nuevoId }); });\n  } catch (e) {\n    try { log_(id, 'sistema', 'ERROR_CALENDARIO', e.message); } catch (e2) { /* sin log */ }\n  }\n}\n\nfunction sincronizarEvento_(o) {\n  const cal = calendario_();\n  if (!cal) return o.EVENTO_ID || '';\n  let ev = null;\n  if (o.EVENTO_ID) { try { ev = cal.getEventById(o.EVENTO_ID); } catch (e) { ev = null; } }\n  const dia = fechaISO_(o.FECHA_PROGRAMADA);\n  if (o.ESTADO === 'ANULADA' || !dia) {\n    if (ev) ev.deleteEvent();\n    return '';\n  }\n  const marcas = [];\n  if (o.PEND_DISPONIBILIDAD === 'SI') marcas.push('POR CONFIRMAR');\n  if (o.REQUIERE_PERMISOS === 'SI') marcas.push('PERMISOS');\n  if (o.EN_RETORNO === 'SI') marcas.push('RETORNO');\n  if (o.ESTADO === 'EN_PAUSA') marcas.push('EN PAUSA');\n  const titulo = (marcas.length ? '[' + marcas.join(' · ') + '] ' : '') + o.ID_ODS + ' · ' + o.CLIENTE + ' · ' + (equipoTecnico_(o) || 'Sin técnico');\n  const lugar = [o.DIRECCION, o.BARRIO, o.CIUDAD].filter(String).join(', ');\n  const desc = [\n    'Tipo: ' + nombreTipo_(o.TIPO_SERVICIO) + (o.TIPO_ORDEN === 'GARANTIA' ? ' · Garantía caso ' + o.NUMERO_CASO : o.TIPO_ORDEN === 'SIN_COBRO' ? ' · Servicio sin cobro' : ''),\n    'Sede: ' + o.SEDE, 'Contacto: ' + [o.CONTACTO, o.TELEFONO].filter(String).join(' · '),\n    o.SEDES_EXTRA_DETALLE ? 'Otras sedes: ' + leerJSON_(o.SEDES_EXTRA_DETALLE, []).map(function (s) { return s.nombre + ' — ' + [s.direccion, s.barrio, s.ciudad].filter(String).join(', '); }).join('; ') : '',\n    'Técnico: ' + (o.TECNICO_NOMBRE || 'sin asignar') + (o.APOYO_NOMBRES ? ' · Apoyo: ' + String(o.APOYO_NOMBRES).split(',').join(', ') : ''),\n    o.EQUIPOS_DETALLE ? 'Equipos:\\n' + o.EQUIPOS_DETALLE : '',\n    o.FALLA_CLIENTE ? 'Falla según el cliente: ' + o.FALLA_CLIENTE : '',\n    o.SOLICITUD ? 'Indicaciones: ' + o.SOLICITUD : '',\n    o.OBS_INTERNAS ? 'Nota interna del cliente: ' + o.OBS_INTERNAS : '',\n    o.ESTADO === 'EN_PAUSA' ? 'En pausa: ' + o.PAUSA_MOTIVO : ''\n  ].filter(String).join('\\n');\n  const hora = /\\d{1,2}:\\d{2}/.test(String(o.FECHA_PROGRAMADA));\n  if (hora) {\n    const inicio = Utilities.parseDate(dia + ' ' + /(\\d{1,2}:\\d{2})/.exec(o.FECHA_PROGRAMADA)[1], TZ, 'yyyy-MM-dd HH:mm');\n    const fin = new Date(inicio.getTime() + 2 * 3600 * 1000);\n    if (ev) ev.setTime(inicio, fin); else ev = cal.createEvent(titulo, inicio, fin, opcionesEvento_(desc, lugar));\n  } else {\n    const d = Utilities.parseDate(dia, TZ, 'yyyy-MM-dd');\n    if (ev) ev.setAllDayDate(d); else ev = cal.createAllDayEvent(titulo, d, opcionesEvento_(desc, lugar));\n  }\n  invitarAvisoOrden_(ev);\n  ev.setTitle(titulo); ev.setDescription(desc); ev.setLocation(lugar);\n  const color = CFG.COLORES_CALENDARIO[o.TIPO_SERVICIO];\n  if (color && CalendarApp.EventColor && CalendarApp.EventColor[color]) ev.setColor(CalendarApp.EventColor[color]);\n  return ev.getId();\n}\n\n/** Al crear el evento se invita a quienes asignan los técnicos: les llega la invitación y queda en su calendario. */\nfunction opcionesEvento_(desc, lugar) {\n  const correos = correosAvisoOrden_();\n  const op = { description: desc, location: lugar };\n  if (correos.length) { op.guests = correos.join(','); op.sendInvites = true; }\n  return op;\n}\n\n/** Eventos que ya existían (o un correo agregado después): se agrega el invitado que falte. */\nfunction invitarAvisoOrden_(ev) {\n  const correos = correosAvisoOrden_();\n  if (!correos.length) return;\n  const ya = ev.getGuestList().map(function (g) { return String(g.getEmail()).toLowerCase(); });\n  correos.forEach(function (c) { if (ya.indexOf(c) < 0) ev.addGuest(c); });\n}\n\n/* ===================== Pausa por jornadas ===================== */\n\n/** Cierra la jornada en curso y deja la orden en pausa. d: {motivo, retoma (fecha), trabajo (lo hecho en esta jornada), obs} */\nfunction pausar_(o, s, d, exigirTrabajo) {\n  if (o.ESTADO !== 'EN_CURSO') throw new Error('Solo se pausa una orden en curso (está en ' + o.ESTADO + ').');\n  if (!String(d.motivo || '').trim()) throw new Error('Escriba el motivo de la pausa.');\n  if (exigirTrabajo && !String(d.trabajo || '').trim()) throw new Error('Escriba qué se hizo en esta jornada.');\n  const retoma = fechaISO_(d.retoma);\n  const jornadas = leerJSON_(o.JORNADAS, []);\n  jornadas.push({\n    n: jornadas.length + 1, inicio: o.INICIO_JORNADA || o.HORA_INICIO || ahora_(), fin: ahora_(),\n    trabajo: String(d.trabajo || '').trim(), obs: String(d.obs || '').trim(), tecnico: (s && tieneRol_(s, 'TECNICO') && s.nombre) || o.TECNICO_NOMBRE, pausa: String(d.motivo).trim()\n  });\n  const cambios = { ESTADO: 'EN_PAUSA', JORNADAS: JSON.stringify(jornadas), INICIO_JORNADA: '', PAUSA_MOTIVO: String(d.motivo).trim(), PAUSA_RETOMA: retoma };\n  if (retoma) cambios.FECHA_PROGRAMADA = retoma + (/\\d{1,2}:\\d{2}/.test(String(d.retoma)) ? ' ' + /(\\d{1,2}:\\d{2})/.exec(d.retoma)[1] : '');\n  actualizarODS_(o._fila, cambios);\n  log_(o.ID_ODS, s.usuario, 'PAUSAR', 'Jornada ' + jornadas.length + ' · ' + d.motivo + (retoma ? ' · retoma ' + retoma : ''));\n}\n\nfunction reanudar_(o, s) {\n  if (o.ESTADO !== 'EN_PAUSA') throw new Error('La orden no está en pausa.');\n  actualizarODS_(o._fila, { ESTADO: 'EN_CURSO', INICIO_JORNADA: ahora_(), PAUSA_MOTIVO: '', PAUSA_RETOMA: '' });\n  log_(o.ID_ODS, s.usuario, 'REANUDAR', 'Jornada ' + (leerJSON_(o.JORNADAS, []).length + 1));\n}\n\nfunction adminPausar(token, id, d) {\n  const s = sesion_(token, 'editar');\n  conLock_(function () { pausar_(buscarODS_(id), s, d || {}, false); });\n  sincronizarYGuardarEvento_(id);\n  return adminDetalle(token, id);\n}\n\nfunction adminReanudar(token, id) {\n  const s = sesion_(token, 'editar');\n  conLock_(function () { reanudar_(buscarODS_(id), s); });\n  sincronizarYGuardarEvento_(id);\n  return adminDetalle(token, id);\n}\n\n/* ===================== Soporte de la ODS para el cliente (PDF) ===================== */\n\nconst ESTADOS_CON_SOPORTE_ = ['CERRADA_TECNICO', 'REVISADA', 'LIQUIDADA', 'POR_FACTURAR', 'COMPLETADA'];\n\nfunction validarDestino_(canal, destino) {\n  const v = String(destino || '').trim();\n  if (canal === 'WHATSAPP') {\n    if (v.replace(/\\D/g, '').length < 10) throw new Error('Escriba un número de WhatsApp de 10 dígitos o más.');\n  } else if (canal === 'CORREO') {\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(v)) throw new Error('Escriba un correo válido.');\n  } else throw new Error('Escoja WhatsApp o correo.');\n  return v;\n}\n\n/** Genera (o regenera) el PDF de la ODS y devuelve los datos para enviarlo. */\nfunction adminSoporte(token, id) {\n  sesion_(token, 'soporte');\n  const o = buscarODS_(id);\n  if (ESTADOS_CON_SOPORTE_.indexOf(o.ESTADO) < 0) throw new Error('El soporte se envía cuando el técnico cerró la orden.');\n  // El PDF (varios segundos) se arma fuera del bloqueo: la oficina y los técnicos no esperan mientras tanto.\n  if (!o.CARPETA_ID) o.CARPETA_ID = conLock_(function () { return carpetaODS_(buscarODS_(id)).getId(); });\n  const pdfId = generarPdfODS_(o);\n  // El cliente abre el soporte desde el link de WhatsApp sin iniciar sesión en Google. El enlace se cierra a los 7 días.\n  DriveApp.getFileById(pdfId).setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);\n  const anterior = conLock_(function () {\n    const x = buscarODS_(id);\n    enlacePublico_(pdfId);\n    actualizarODS_(x._fila, { ODS_PDF_ID: pdfId });\n    return x.ODS_PDF_ID;\n  });\n  if (anterior && anterior !== pdfId) { try { DriveApp.getFileById(anterior).setTrashed(true); } catch (e) { /* ya no existe */ } }\n  const c = buscarCliente_(o.ID_CLIENTE) || {};\n  return {\n    id: id, pdfId: pdfId, enlace: 'https://drive.google.com/file/d/' + pdfId + '/view', canal: o.ENVIO_CANAL || 'WHATSAPP',\n    destino: o.ENVIO_DESTINO || (o.ENVIO_CANAL === 'CORREO' ? c.email : o.TELEFONO) || '',\n    sugerido: { WHATSAPP: o.ENVIO_CANAL === 'WHATSAPP' && o.ENVIO_DESTINO ? o.ENVIO_DESTINO : (o.TELEFONO || c.telefono || ''), CORREO: o.ENVIO_CANAL === 'CORREO' && o.ENVIO_DESTINO ? o.ENVIO_DESTINO : (c.email || '') },\n    mensaje: 'Hola, ' + (o.CONTACTO || o.CLIENTE) + '. Le compartimos el soporte de la orden de servicio ' + id + ' realizada en ' + (o.SEDE || o.DIRECCION) + '. Gracias por confiar en Family Air.',\n    enviado: o.SOPORTE_ENVIADO\n  };\n}\n\n/** Anota cuándo se abrió el enlace público de un PDF. `cerrarEnlacesVencidos_` lo cierra a los CFG.DIAS_ENLACE días. */\nfunction enlacePublico_(fileId) {\n  const p = PropertiesService.getScriptProperties();\n  const m = leerJSON_(p.getProperty('ENLACES_PUBLICOS'), {});\n  m[fileId] = Date.now();\n  p.setProperty('ENLACES_PUBLICOS', JSON.stringify(m));\n}\n\n/** Lo corre el disparador diario: los PDF de soporte con más de 7 días vuelven a ser privados. */\nfunction cerrarEnlacesVencidos_() {\n  const p = PropertiesService.getScriptProperties();\n  const m = leerJSON_(p.getProperty('ENLACES_PUBLICOS'), {});\n  let cerrados = 0;\n  Object.keys(m).forEach(function (fid) {\n    if (Date.now() - m[fid] < CFG.DIAS_ENLACE * 864e5) return;\n    try { DriveApp.getFileById(fid).setSharing(DriveApp.Access.PRIVATE, DriveApp.Permission.NONE); cerrados++; } catch (e) { /* ya no existe */ }\n    delete m[fid];\n  });\n  p.setProperty('ENLACES_PUBLICOS', JSON.stringify(m));\n  return cerrados;\n}\n\n/** En el soporte del cliente la cédula de quien recibe sale con los 4 últimos dígitos. El archivo interno la conserva completa. */\nfunction ocultarDoc_(doc) {\n  const v = String(doc || '').trim();\n  return v.length > 4 ? v.slice(0, -4).replace(/[0-9A-Za-z]/g, '•') + v.slice(-4) : v;\n}\n\nfunction registrarEnvio_(id, s, canal, destino) {\n  conLock_(function () {\n    const o = buscarODS_(id);\n    const previo = o.SOPORTE_ENVIADO ? o.SOPORTE_ENVIADO + '\\n' : '';\n    actualizarODS_(o._fila, { SOPORTE_ENVIADO: previo + ahora_() + ' · ' + canal + ' · ' + destino + ' · ' + s.usuario, ENVIO_CANAL: canal, ENVIO_DESTINO: destino });\n    log_(id, s.usuario, 'SOPORTE_' + canal, destino);\n  });\n}\n\n/** Envía el soporte por correo desde la cuenta de Family Air, con el PDF adjunto. */\nfunction adminSoporteCorreo(token, id, destino, mensaje) {\n  const s = sesion_(token, 'soporte');\n  const correo = validarDestino_('CORREO', destino);\n  cupo_(s, 'CORREO');\n  const o = buscarODS_(id);\n  if (!o.ODS_PDF_ID) throw new Error('Primero genere el PDF de la orden.');\n  const pdf = DriveApp.getFileById(o.ODS_PDF_ID).getBlob();\n  MailApp.sendEmail({\n    to: correo, subject: 'Soporte orden de servicio ' + id + ' · Family Air',\n    body: String(mensaje || '').slice(0, 2000) + '\\n\\nFamily Air · ' + CFG.EMPRESA.telefono + ' · ' + CFG.EMPRESA.correo +\n      '\\nTratamiento de datos personales: ' + CFG.EMPRESA.privacidad,\n    name: 'Family Air', attachments: [pdf]\n  });\n  registrarEnvio_(id, s, 'CORREO', correo);\n  return adminDetalle(token, id);\n}\n\n/** Registra el envío por WhatsApp (el chat lo abre el navegador de quien envía, con el PDF descargado para adjuntar). */\nfunction adminSoporteWhatsapp(token, id, destino) {\n  const s = sesion_(token, 'soporte');\n  const numero = validarDestino_('WHATSAPP', destino);\n  registrarEnvio_(id, s, 'WHATSAPP', numero);\n  return adminDetalle(token, id);\n}\n\n/** Construye el PDF de la orden con el formato de la ODS en papel. No incluye las observaciones internas. */\nfunction generarPdfODS_(o, opts) {\n  opts = opts || {};\n  const GRIS = '#D9D9D9', E = CFG.EMPRESA;\n  const carpeta = opts.carpeta || carpetaODS_(o);\n  const doc = DocumentApp.create(o.ID_ODS + ' · Soporte');\n  const archivoDoc = DriveApp.getFileById(doc.getId()); // se abre una sola vez: mover, exportar y borrar\n  archivoDoc.moveTo(carpeta);\n  const body = doc.getBody();\n  body.setMarginTop(30).setMarginBottom(30).setMarginLeft(40).setMarginRight(40);\n  const base = {}; base[DocumentApp.Attribute.FONT_FAMILY] = 'Arial'; base[DocumentApp.Attribute.FONT_SIZE] = 9;\n  body.setAttributes(base);\n  // Un retorno es garantía: su PDF no lleva valores.\n  const liquidada = !opts.retorno && ['LIQUIDADA', 'POR_FACTURAR', 'COMPLETADA'].indexOf(o.ESTADO) >= 0;\n  const cedula = opts.anexoInterno || opts.retorno ? o.RECIBE_DOC : ocultarDoc_(o.RECIBE_DOC);\n  const centrar = function (cell, negrita) { const p = cell.getChild(0).asParagraph().setAlignment(DocumentApp.HorizontalAlignment.CENTER); if (negrita) p.editAsText().setBold(true); return cell; };\n  const banda = function (texto) { const t = body.appendTable([[texto]]); centrar(t.getCell(0, 0).setBackgroundColor(GRIS), true); return t; };\n  const tablaDatos = function (pares) {\n    const filas = []; for (let i = 0; i < pares.length; i += 2) filas.push([pares[i][0], pares[i][1] || '', (pares[i + 1] || ['', ''])[0], (pares[i + 1] || ['', ''])[1] || '']);\n    const t = body.appendTable(filas);\n    filas.forEach(function (f, r) { [0, 2].forEach(function (c) { t.getCell(r, c).getChild(0).asParagraph().editAsText().setBold(true); }); });\n    return t;\n  };\n\n  // Encabezado\n  const cab = body.appendTable([['', E.nombre + '\\n' + E.actividad + '\\n' + E.titular + '\\nNIT: ' + E.nit,\n    (o.TIPO_ORDEN === 'SIN_COBRO' ? 'SERVICIO SIN COBRO' : 'ORDEN DE SERVICIO') + '\\nNo. ' + o.ID_ODS + (o.TIPO_ORDEN === 'GARANTIA' ? '\\nGarantía · caso ' + o.NUMERO_CASO : '') + (opts.retorno ? '\\nRetorno ' + opts.retorno + ' · sin cobro' : ''),\n    'Fecha:\\n' + fechaCorta_(o.FECHA_CREACION) + '\\nFec. servicio:\\n' + fechaCorta_(o.HORA_INICIO || o.FECHA_PROGRAMADA)]]);\n  try {\n    const logo = cab.getCell(0, 0).getChild(0).asParagraph().appendInlineImage(Utilities.newBlob(Utilities.base64Decode(LOGO_PNG_B64), 'image/png', 'logo.png'));\n    const k = 60 / logo.getHeight(); logo.setHeight(60).setWidth(Math.round(logo.getWidth() * k));\n  } catch (e) { /* sin logo */ }\n  centrar(cab.getCel
