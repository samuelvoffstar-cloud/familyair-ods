<!DOCTYPE html>
<html lang="es">
<head>
  <title>Family Air · Práctica técnicos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --menu: #0877c4; --menu-activo: #06609f; --primario: #126cc6; --primario-osc: #0f63b5; --primario-claro: #e8f3fe;
    --texto: #1f2a37; --gris: #5f6b79; --gris-claro: #9aa4b1; --borde: #e3e8ef; --borde-campo: #8a96a3; --fondo: #f2f5f8; --blanco: #fff;
    --verde: #0e7553; --verde-claro: #e3f6ee; --rojo: #c4320a; --rojo-claro: #fdebe6; --ambar: #a35a00; --ambar-claro: #fff3df;
    --morado: #6941c6; --morado-claro: #f1ebfd; --radio: 10px; --sombra: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; -webkit-tap-highlight-color: transparent; font: 15px/1.5 'Nunito', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: var(--texto); background: var(--fondo); }
  a { color: var(--primario); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { font-size: 1.75rem; font-weight: 800; margin: 0; line-height: 1.1; letter-spacing: -0.02em; }
  h2 { font-size: 1.15rem; font-weight: 800; margin: 0 0 12px; line-height: 1.25; letter-spacing: -0.01em; }
  h3 { font-size: 15px; font-weight: 700; margin: 18px 0 8px; }
  label { display: block; font-size: 13px; color: var(--gris); margin: 10px 0 4px; font-weight: 600; letter-spacing: 0.01em; }
  input, select, textarea, button { font: inherit; }
  /* Bordes de campos con contraste 3:1 (WCAG); en el celular, letra de 16 px para que iOS no haga zoom al tocarlos. */
  input, select, textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--borde-campo); border-radius: 8px; background: #fff; color: var(--texto); }
  @media (max-width: 760px) { input, select, textarea { font-size: 16px; } }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primario); box-shadow: 0 0 0 3px var(--primario-claro); }
  textarea { min-height: 84px; resize: vertical; }
  input[type=checkbox], input[type=radio] { width: auto; }
  button { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--primario); background: var(--primario); color: #fff; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
  button:hover { background: var(--primario-osc); border-color: var(--primario-osc); }
  button.sec { background: #fff; color: var(--primario); }
  button.sec:hover { background: var(--primario-claro); }
  button.peligro { background: #fff; color: var(--rojo); border-color: var(--rojo); }
  button.peligro:hover { background: var(--rojo-claro); }
  button.ok { background: var(--verde); border-color: var(--verde); }
  button.link { background: none; border: none; color: var(--primario); padding: 0; font-weight: 600; }
  button.link:hover { text-decoration: underline; background: none; }
  a.link-peligro, button.link.link-peligro { color: var(--rojo); font-weight: 600; }
  .eq-fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--borde, #e5e9f0); }
  .eq-fila .chk { flex: 1; margin: 0; }
  .eq-acc { display: flex; gap: 12px; white-space: nowrap; }
  .borrador { background: #fff8e1; border: 1px solid #f3d27a; border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  button:disabled { opacity: .5; cursor: default; }
  button svg { width: 18px; height: 18px; }

  /* ---------- Estructura del panel administrativo (como Siigo) ---------- */
  .shell { display: flex; min-height: 100vh; }
  .menu { width: 248px; background: var(--menu); color: #fff; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; transition: width .2s; z-index: 30; }
  .menu .marca { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
  .menu .marca img { width: 44px; height: 44px; background: #fff; border-radius: 10px; padding: 3px; object-fit: contain; }
  .menu .marca b { font-size: 16px; line-height: 1.1; }
  .menu .marca small { display: block; font-weight: 600; opacity: .85; font-size: 12px; }
  .menu nav { padding: 6px 10px; flex: 1; }
  .menu nav a { display: flex; align-items: center; gap: 14px; color: #fff; padding: 12px 14px; border-radius: 10px; font-size: 16px; font-weight: 600; margin-bottom: 2px; text-decoration: none; }
  .menu nav a:hover { background: rgba(255,255,255,.14); }
  .menu nav a.activo { background: var(--menu-activo); box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
  .menu nav a svg { width: 24px; height: 24px; flex-shrink: 0; }
  .menu nav a .cuenta { margin-left: auto; background: #fff; color: var(--menu-activo); border-radius: 10px; font-size: 12px; padding: 0 8px; font-weight: 800; }
  .menu nav hr { border: none; border-top: 1px solid rgba(255,255,255,.25); margin: 8px 6px; }
  .menu .pie { padding: 12px 18px; font-size: 12px; opacity: .85; }
  .menu.plegado { width: 72px; }
  .menu.plegado .marca b, .menu.plegado nav a span, .menu.plegado nav a .cuenta, .menu.plegado .pie { display: none; }
  .menu.plegado nav a { justify-content: center; padding: 12px 0; }

  .principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .barra { background: rgba(255,255,255,.72); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid transparent; transition: box-shadow .2s ease, border-color .2s ease; display: flex; align-items: center; gap: 12px; padding: 10px 24px; position: sticky; top: 0; z-index: 20; min-height: 64px; }
  .barra .empresa { font-size: 18px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barra .buscar { position: relative; width: 280px; }
  .barra .buscar input { padding-left: 36px; border-radius: 20px; }
  .barra .buscar svg { position: absolute; left: 11px; top: 10px; width: 18px; height: 18px; color: var(--primario); }
  .barra .icono { background: none; border: none; color: var(--primario); padding: 6px; position: relative; }
  .barra .icono:hover { background: var(--primario-claro); }
  .barra .icono svg { width: 24px; height: 24px; }
  .barra .icono .punto { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--rojo); color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primario); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; flex-shrink: 0; }
  .btn-menu { display: none; }
  .titulo-pag { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 22px 28px 6px; }
  .titulo-pag h1 { flex: 1; min-width: 200px; }
  .migas { padding: 18px 28px 0; font-size: 13px; color: var(--gris); }
  .contenido { padding: 14px 28px 40px; }

  /* ---------- Tarjetas, tablas y filtros ---------- */
  .tarjeta { background: var(--blanco); border: 1px solid var(--borde); border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: var(--sombra); }
  .tarjeta > h2:first-child { margin-top: 0; }
  .tarjeta.tabla-card { padding: 0; overflow: hidden; }
  .herramientas { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 18px 20px 10px; }
  .herramientas .busq { max-width: 300px; }
  .herramientas .espacio { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 20px 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--borde); border-radius: 18px; padding: 4px 6px 4px 12px; font-size: 13px; background: #fff; }
  .chip button { width: 20px; height: 20px; border-radius: 50%; padding: 0; background: var(--texto); border: none; color: #fff; font-size: 12px; line-height: 1; }
  .filtro-cuenta { background: var(--rojo); color: #fff; border-radius: 9px; font-size: 11px; padding: 0 6px; }
  .tabla-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th { text-align: left; font-weight: 700; font-size: 14px; color: var(--texto); background: #f6f8fa; padding: 14px 16px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
  th + th { border-left: 1px solid var(--borde); }
  td { padding: 13px 16px; border-bottom: 1px solid var(--borde); font-size: 14px; vertical-align: top; }
  td.der, th.der { text-align: right; white-space: nowrap; }
  tr.clic { cursor: pointer; }
  tr.clic:hover td { background: #f7fbff; }
  td .enlace { color: var(--primario); font-weight: 700; white-space: nowrap; }
  tfoot td { font-weight: 800; background: #fbfcfd; border-bottom: none; }
  .paginacion { display: flex; align-items: center; justify-content: flex-end; gap: 16px; padding: 12px 20px; font-size: 14px; color: var(--gris); border-top: 1px solid var(--borde); flex-wrap: wrap; }
  .paginacion select { width: auto; padding: 5px 8px; }
  .paginacion button { padding: 4px 8px; background: none; border: none; color: var(--gris); }
  .paginacion button:hover { background: var(--fondo); }
  .vacio { padding: 28px 20px; text-align: center; color: var(--gris); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi { background: #fff; border: 1px solid var(--borde); border-radius: 14px; padding: 16px; cursor: pointer; box-shadow: var(--sombra); }
  .kpi:hover { border-color: var(--primario); }
  .kpi b { display: block; font-size: 28px; font-weight: 800; }
  .kpi span { color: var(--gris); font-size: 13px; font-weight: 600; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .fila { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0 16px; }
  .fila.dos { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .datos { display: grid; grid-template-columns: 160px 1fr; gap: 6px 14px; font-size: 14px; }
  .datos dt { color: var(--gris); font-weight: 600; }
  .datos dd { margin: 0; white-space: pre-wrap; }

  .pestanas { display: flex; gap: 4px; border-bottom: 1px solid var(--borde); margin-bottom: 16px; overflow-x: auto; }
  .pestanas button { background: none; border: none; border-bottom: 3px solid transparent; color: var(--gris); border-radius: 0; padding: 10px 14px; white-space: nowrap; }
  .pestanas button:hover { background: none; color: var(--primario); }
  .pestanas button.activo { color: var(--primario); border-bottom-color: var(--primario); }
  .pestanas .cuenta { background: var(--fondo); border-radius: 10px; padding: 0 7px; font-size: 12px; color: var(--texto); }

  .opciones { display: flex; flex-wrap: wrap; gap: 8px; }
  .opciones label { margin: 0; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--borde); border-radius: 22px; padding: 7px 14px; color: var(--texto); cursor: pointer; font-size: 14px; background: #fff; }
  .opciones input { display: none; }
  .opciones label.on { border-color: var(--primario); background: var(--primario-claro); color: var(--primario-osc); }
  .chk { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 14px; color: var(--texto); margin: 0; font-weight: 600; cursor: pointer; }
  .chk input { margin-top: 3px; }
  .numero-orden { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .numero-orden .grande { font-size: 22px; font-weight: 800; color: var(--primario-osc); }

  .estado { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 12px; background: #eef1f4; font-weight: 700; white-space: nowrap; }
  .estado.PROGRAMADA { background: var(--primario-claro); color: var(--primario-osc); }
  .estado.EN_CURSO { background: var(--ambar-claro); color: var(--ambar); }
  .estado.EN_PAUSA { background: #fff1e6; color: #b54708; }
  .marca.auto { background: #e0f2fe; color: #026aa2; }
  .nota-interna { background: #fffaeb; border: 1px solid #fedf89; border-radius: 10px; padding: 10px 12px; color: #93370d; font-size: 14px; }
  .nota-interna b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .nota-interna .dif b { display: inline; font-size: inherit; text-transform: none; letter-spacing: 0; margin: 0; }
  .nota-interna .dif { margin-top: 2px; }
  .jornada { border-left: 3px solid var(--primario); padding: 4px 0 4px 12px; margin: 10px 0; }
  .jornada .gris { display: block; }
  .estado.CERRADA_TECNICO { background: var(--morado-claro); color: var(--morado); }
  .estado.REVISADA { background: #e0f2fe; color: #026aa2; }
  .estado.LIQUIDADA { background: #fef0c7; color: #93370d; }
  .estado.POR_FACTURAR { background: #fce7f6; color: #c11574; }
  .estado.COMPLETADA { background: var(--verde-claro); color: var(--verde); }
  .estado.ANULADA { background: var(--rojo-claro); color: var(--rojo); text-decoration: line-through; }
  .marca { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 800; margin-left: 4px; white-space: nowrap; }
  .marca.ga { background: #1f2a37; color: #fff; }
  .marca.sc { background: var(--verde-claro); color: var(--verde); }
  .marca.conf { background: var(--ambar-claro); color: var(--ambar); }
  .marca.perm { background: #ffe4e8; color: #c01048; }
  .marca.ret { background: var(--morado-claro); color: var(--morado); }

  .gris { color: var(--gris); font-size: 13px; }
  .error { color: var(--rojo); }
  .exito { color: var(--verde); }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .acciones.der { justify-content: flex-end; }
  .lista-res { border: 1px solid var(--borde); border-radius: 8px; max-height: 280px; overflow: auto; background: #fff; position: absolute; left: 0; right: 0; z-index: 15; box-shadow: 0 8px 24px rgba(16,24,40,.12); }
  .lista-res div { padding: 9px 12px; border-bottom: 1px solid var(--borde); cursor: pointer; }
  .lista-res div:hover { background: var(--primario-claro); }
  .relativo { position: relative; }
  .con-boton { display: flex; gap: 8px; }
  .con-boton > :first-child { flex: 1; }
  .items td { padding: 6px 8px; vertical-align: middle; }
  .items input, .items select { padding: 6px 8px; }
  input.sin-siigo { border-color: var(--rojo); background: var(--rojo-claro); }
  .items .x { background: none; border: none; color: var(--rojo); font-size: 18px; padding: 2px 8px; }
  .totales { margin-left: auto; max-width: 320px; font-size: 14px; }
  .totales div { display: flex; justify-content: space-between; padding: 4px 0; }
  .totales .t { font-weight: 800; font-size: 17px; border-top: 1px solid var(--borde); padding-top: 8px; }

  .modal { position: fixed; inset: 0; background: rgba(16,24,40,.45); display: flex; align-items: flex-start; justify-content: center; overflow: auto; z-index: 50; padding: 24px 16px; }
  .modal > div { background: #fff; border-radius: 14px; max-width: 760px; width: 100%; padding: 22px; box-shadow: 0 20px 40px rgba(16,24,40,.2); }
  .modal .cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .modal .cab h2 { margin: 0; }
  .fotos { display: flex; flex-wrap: wrap; gap: 8px; }
  .fotos img { width: 104px; height: 104px; object-fit: cover; border-radius: 8px; border: 1px solid var(--borde); background: var(--fondo); }
  .fotos label.sel { margin: 0; position: relative; cursor: pointer; }
  .fotos .mini { position: relative; display: inline-block; }
  .fotos .mini.pendiente img, .fotos .mini.pendiente video { opacity: .65; }
  .fotos video { width: 104px; height: 104px; object-fit: cover; border-radius: 8px; border: 1px solid var(--borde); background: #1f2a37; display: block; }
  .fotos .mini.video img { background: #1f2a37; }
  .fotos .mini.video::before, .fotos a.video::before { content: '▶ Video'; position: absolute; right: 4px; top: 4px; z-index: 1; background: rgba(31,42,55,.85); color: #fff; font-size: 10px; font-weight: 800; border-radius: 6px; padding: 1px 6px; }
  .fotos a.video { position: relative; display: inline-block; }
  .fotos .mini.pendiente::after { content: 'Por enviar'; position: absolute; top: 4px; left: 4px; background: var(--ambar); color: #fff; font-size: 10px; font-weight: 800; border-radius: 6px; padding: 1px 6px; }
  .red { display: none; padding: 9px 16px; font-size: 14px; font-weight: 600; line-height: 1.4; }
  .red.visible { display: block; }
  .red.sin { background: var(--ambar-claro); color: var(--ambar); }
  .red.envia { background: var(--primario-claro); color: var(--primario-osc); }
  .red.mal { background: var(--rojo-claro); color: var(--rojo); }
  .red button.link { color: inherit; text-decoration: underline; font-size: inherit; }
  .fotos .mini .por { position: absolute; left: 4px; right: 4px; bottom: 4px; background: rgba(31,42,55,.78); color: #fff; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .fotos label.sel input { position: absolute; top: 6px; left: 6px; }
  .fotos label.sel input:checked + img { outline: 3px solid var(--primario); }
  canvas.firma { width: 100%; height: 190px; border: 1px dashed var(--borde-campo); border-radius: 10px; background: #fff; touch-action: none; }
  #aviso { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #1f2a37; color: #fff; padding: 11px 18px; border-radius: 10px; display: none; z-index: 90; max-width: 90vw; font-weight: 600; }
  .cargando { padding: 30px; color: var(--gris); text-align: center; }

  /* ---------- Login ---------- */
  .login-fondo { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #0a8fe0 0%, #0877c4 100%); padding: 16px; }
  .login { background: #fff; border-radius: 16px; padding: 28px; width: 100%; max-width: 380px; box-shadow: 0 20px 40px rgba(0,0,0,.18); }
  .login img { width: 92px; display: block; margin: 0 auto 8px; }
  .login h2 { text-align: center; }
  .login button { width: 100%; margin-top: 16px; }
  .login .legal { text-align: center; font-size: 12px; margin: 14px 0 0; color: var(--gris); }
  .login .legal a { color: var(--gris); }

  /* ---------- Panel de técnicos (celular) ---------- */
  .tec-barra { background: var(--menu); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 20; }
  .tec-barra img { width: 34px; height: 34px; background: #fff; border-radius: 8px; padding: 2px; }
  .tec-barra b { flex: 1; }
  .chip-sede { display: inline-block; font-size: 12px; font-weight: 700; color: var(--primario-osc); background: var(--primario-claro); border-radius: 6px; padding: 1px 8px; margin-bottom: 2px; }
  .sede-extra { border: 1px solid var(--borde); border-radius: 10px; padding: 10px 14px; margin-top: 12px; background: #fbfdff; }
  .unidades { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; margin-top: 6px; }
  .unidades h4 { margin: 10px 0 0; font-size: 13px; color: var(--primario-osc); }
  @media (max-width: 600px) { .unidades { grid-template-columns: 1fr; } }
  .tec-barra button { background: transparent; border: 1px solid rgba(255,255,255,.7); padding: 5px 12px; }
  .tec { max-width: 720px; margin: 0 auto; padding: 14px; }
  .tec .tarjeta { padding: 16px; border-radius: 14px; }
  .orden-card { cursor: pointer; }
  .orden-card .linea { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .botones-rapidos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .botones-rapidos a, .botones-rapidos button { display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--primario); border-radius: 10px; padding: 10px 6px; font-weight: 700; font-size: 14px; background: #fff; color: var(--primario); text-decoration: none; }
  .btn-grande { width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; }
  .equipo { border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
  .equipo div { flex: 1; font-size: 14px; }
  .equipo .ok-chip { color: var(--verde); font-weight: 800; font-size: 12px; }
  .equipo .placas { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
  .equipo .placas button { padding: 6px 10px; font-size: 13px; white-space: nowrap; }
  .unidades .leida { background: var(--primario-claro); border-radius: 8px; padding: 0 8px 8px; }
  .condiciones { font-size: 12px; color: var(--gris); max-height: 220px; overflow: auto; border: 1px solid var(--borde); border-radius: 8px; padding: 8px 10px; background: #fafbfc; }
  .condiciones p { margin: 0 0 6px; }

  @media (max-width: 900px) {
    .menu { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform .2s; width: 260px; }
    .menu.abierto { transform: none; }
    .btn-menu { display: inline-flex; }
    .barra { padding: 10px 14px; }
    .barra .buscar { display: none; }
    .titulo-pag, .contenido, .migas { padding-left: 14px; padding-right: 14px; }
    .datos { grid-template-columns: 1fr; gap: 2px; }
    .datos dd { margin-bottom: 8px; }
    .ocultar-movil { display: none; }
  }

  /* ================= Respuesta, materiales y movimiento (principios de diseño fluido) ================= */
  button, .kpi, .opciones label, .chk, tr.clic, .orden-card, .botones-rapidos a, .menu nav a, .avatar, .chip button { touch-action: manipulation; }
  /* Respuesta al presionar, no al soltar */
  button, .kpi, .orden-card, .botones-rapidos a, .menu nav a, .opciones label, .avatar { transition: transform 120ms ease-out, background-color 120ms ease-out, border-color 120ms ease-out, box-shadow 120ms ease-out; }
  button:active:not(:disabled), .botones-rapidos a:active, .avatar:active { transform: scale(0.97); }
  .kpi:active, .orden-card:active { transform: scale(0.985); }
  .menu nav a:active { transform: scale(0.98); background: rgba(255,255,255,.2); }
  .opciones label:active { transform: scale(0.96); }
  tr.clic:active td { background: var(--primario-claro); }
  /* Barra con borde solo cuando el contenido pasa por debajo */
  .barra.con-borde { border-bottom-color: rgba(16,24,40,.08); box-shadow: 0 6px 16px -10px rgba(16,24,40,.25); }
  .tec-barra { background: rgba(10,157,245,.88); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); }
  /* Botón ocupado: respuesta inmediata mientras responde el servidor */
  button.ocupado { position: relative; color: transparent !important; pointer-events: none; }
  button.ocupado::after { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-color: #fff #fff transparent transparent; animation: girar .7s linear infinite; }
  button.sec.ocupado::after, button.peligro.ocupado::after { border-color: var(--primario) var(--primario) transparent transparent; }
  @keyframes girar { to { transform: rotate(360deg); } }
  /* Esqueletos en lugar de "Cargando…" */
  .esqueleto { display: grid; gap: 12px; padding: 4px 0; }
  .esqueleto i { display: block; height: 14px; border-radius: 7px; background: linear-gradient(90deg, #e9eef3 0%, #f5f8fa 40%, #e9eef3 80%); background-size: 200% 100%; animation: brillo 1.4s ease-in-out infinite; }
  .esqueleto i.alto { height: 44px; border-radius: 12px; }
  @keyframes brillo { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  /* Entrada de cada página: aparece desde donde va a quedar */
  .entra { animation: entrar 260ms cubic-bezier(.2,.8,.2,1) both; }
  @keyframes entrar { from { opacity: 0; transform: translateY(6px); } }
  /* Modal: nace del botón que lo abrió y vuelve a él al cerrar */
  .modal { background: rgba(16,24,40,0); transition: background-color 220ms ease; }
  .modal.visible { background: rgba(16,24,40,.45); }
  .modal > div { opacity: 0; transform: scale(.94); transition: opacity 200ms ease, transform 260ms cubic-bezier(.2,.8,.2,1); will-change: transform, opacity; }
  .modal.visible > div { opacity: 1; transform: none; }
  /* En celular el modal es una hoja inferior que se arrastra */
  @media (max-width: 640px) {
    .modal { align-items: flex-end; padding: 0; overflow: hidden; }
    .modal > div { border-radius: 18px 18px 0 0; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain; transform: translateY(100%); opacity: 1; transition: none; padding-top: 10px; }
    .modal > div::before { content: ''; display: block; width: 40px; height: 5px; border-radius: 3px; background: #d0d6dd; margin: 0 auto 10px; }
  }
  /* Avisos por tipo: estado, completado, advertencia, error */
  #aviso { transition: opacity 180ms ease, transform 260ms cubic-bezier(.2,.8,.2,1); opacity: 0; transform: translate(-50%, 16px); display: block !important; pointer-events: none; }
  #aviso.visible { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #aviso.exito { background: var(--verde); }
  #aviso.error { background: var(--rojo); }
  /* Validación en línea */
  .invalido { border-color: var(--rojo) !important; box-shadow: 0 0 0 3px var(--rojo-claro) !important; }
  .msg-campo { color: var(--rojo); font-size: 13px; margin-top: 4px; font-weight: 600; }
  /* Cajón del menú en celular */
  .velo { position: fixed; inset: 0; background: rgba(16,24,40,.4); z-index: 25; opacity: 0; pointer-events: none; transition: opacity 200ms ease; }
  .velo.visible { opacity: 1; pointer-events: auto; }
  @media (max-width: 900px) { .menu { transition: none; will-change: transform; } }
  /* Pestañas con indicador que se desplaza */
  .pestanas { position: relative; }
  /* Accesibilidad: menos movimiento, menos transparencia, más contraste */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
    .entra { animation: none; }
    button:active:not(:disabled), .kpi:active, .orden-card:active { transform: none; }
    .modal > div { transform: none !important; transition: opacity 180ms ease; }
    #aviso { transform: translate(-50%, 0); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .barra { background: #fff; -webkit-backdrop-filter: none; backdrop-filter: none; border-bottom-color: var(--borde); }
    .tec-barra { background: var(--menu); -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (prefers-contrast: more) {
    :root { --borde: #8a96a3; --gris: #3d4752; }
    .barra { background: #fff; border-bottom-color: #1f2a37; }
  }
.modal .cuerpo p a svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 2px; }
  /* Resumen financiero */
  .filtros-fin { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; margin-bottom: 16px; }
  .filtros-fin label { margin: 0; }
  .filtros-fin select { width: auto; min-width: 190px; margin-top: 4px; }
  .fn-act { font-size: 13px; padding-bottom: 8px; }

  .delta { display: inline-block; font-size: 13px; font-weight: 700; color: var(--gris); margin-top: 4px; }

  .delta.baja { color: var(--rojo); }
  .fn-graficas { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; margin-bottom: 16px; }

  .fn-s { margin: -6px 0 10px; font-size: 13px; }

  .grafica { position: relative; }
  .grafica svg { display: block; overflow: visible; }

  .grafica .golpe.sobre, .grafica .golpe:focus-visible { fill: rgba(27, 140, 242, .06); }
  .tip { display: none; position: absolute; z-index: 5; pointer-events: none; background: #fff; border: 1px solid var(--borde); border-radius: 10px; box-shadow: 0 6px 20px rgba(16,24,40,.12); padding: 8px 10px; font-size: 13px; min-width: 170px; }
  .tip-t { font-weight: 700; margin-bottom: 4px; color: var(--gris); }
  .tip-f { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .tip-f i { width: 12px; height: 3px; border-radius: 2px; flex: none; }
  .tip-f b { font-variant-numeric: tabular-nums; color: var(--texto); }
  .tip-f span { color: var(--gris); }
  .tip-f.total { border-top: 1px solid var(--borde); margin-top: 4px; padding-top: 4px; padding-left: 20px; }
  .hbarras { display: grid; gap: 6px; }
  .hb { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; align-items: center; gap: 10px; font-size: 13px; }

{ body.appendParagraph('Sin líneas.'); return; }\n    const filas = [['Código', 'Descripción', 'Cant.', 'Valor', 'Subtotal']].concat(items.map(function (i) {\n      return [i.cod || '', i.desc || '', String(i.cant), pesos(i.valor), pesos(numero_(i.cant) * numero_(i.valor))];\n    }));\n    if (conTotal) filas.push(['', 'TOTAL', '', '', pesos(items.reduce(function (a, i) { return a + numero_(i.cant) * numero_(i.valor); }, 0))]);\n    tabla(filas, true);\n  };\n\n  body.appendPageBreak();\n  const t0 = 'ANEXO INTERNO · ' + o.ID_ODS;\n  const enc = body.appendTable([[t0 + '\\nUso interno de ' + CFG.EMPRESA.nombre + '. No se envía al cliente.\\nEstado: ' + (NOMBRE_ESTADO_[o.ESTADO] || o.ESTADO) + ' · última actualización ' + ahora_()]]);\n  enc.getCell(0, 0).setBackgroundColor(AMBAR).getChild(0).asParagraph().editAsText().setBold(0, t0.length - 1, true);\n\n  const fotos = fotosDe_(o);\n  banda('EVIDENCIAS (' + fotos.length + ' archivos en la carpeta de la orden)');\n  if (fotos.length) tabla([['Tipo', 'Día', 'Archivo']].concat(fotos.map(function (f) { return [f.tipo, String(f.jornada || ''), enlaceDrive_(f.id)]; })), true);\n  else body.appendParagraph('Sin evidencias.');\n  if (o.FIRMA_ID) datos([['Firma', enlaceDrive_(o.FIRMA_ID)]]);\n\n  banda('LIQUIDACIÓN, COBRO Y FACTURA');\n  lineas(leerJSON_(o.ITEMS, []), false);\n  campos(['MANO_OBRA', 'MATERIALES', 'TRANSPORTE', 'TOTAL', 'ADICIONALES', 'FORMA_PAGO', 'LIQUIDADO_POR', 'FECHA_LIQUIDACION',\n    'VALOR_RECIBIDO', 'FECHA_PAGO', 'REFERENCIA_PAGO', 'COBRADO_POR', 'FACTURA_SIIGO', 'SIIGO_ERROR']);\n\n  if (o.COTIZACION) {\n    banda('COTIZACIÓN ' + o.COTIZACION);\n    const cot = leerJSON_(o.COTIZACION_ITEMS, []), items = leerJSON_(o.ITEMS, []);\n    campos(['COTIZACION_FECHA', 'COTIZACION_TOTAL']);\n    lineas(cot, true);\n    const dif = items.length ? diferenciasCotizacion_(cot, items) : [];\n    if (dif.length) { body.appendParagraph('Diferencias con lo liquidado:').editAsText().setBold(true); dif.forEach(function c.desc) + ' (' + c.cant + ' × ' + pesos(c.valor) + ')'); return; }\n    if (numero_(a.cant) !== numero_(c.cant)) dif.push((c.cod || c.desc) + ': cantidad ' + a.cant + ' liquidada, ' + c.cant + ' cotizada');\n    if (numero_(a.valor) !== numero_(c.valor)) dif.push((c.cod || c.desc) + ': valor ' + pesos(a.valor) + ' liquidado, ' + pesos(c.valor) + ' cotizado');\n  });\n  items.forEach(function (a) { if (!cot.some(function (c) { return clave(c) === clave(a); })) dif.push('No estaba cotizado: ' + (a.cod || a.desc) + ' (' + a.cant + ' × ' + pesos(a.valor) + ')'); });\n  const tl = items.reduce(function (s, i) { return s + numero_(i.cant) * numero_(i.valor); }, 0), tc = cot.reduce(function (s, i) { return s + numero_(i.cant) * numero_(i.valor); }, 0);\n  if (cot.length && tl !== tc) dif.push('Total liquidado ' + pesos(tl) + ' · cotizado ' + pesos(tc) + ' · diferencia ' + pesos(tl - tc));\n  return dif;\n}\n\n// Code.gs\n/**\n * Family Air — Sistema de órdenes de servicio (ODS) sobre Google Sheets.\n * Un solo proyecto Apps Script atado a la hoja \"Family Air · Base ODS\", servido como web app.\n *\n * Archivos:\n *   Code.gs      configuración, menú, instalación, sesión, roles y utilidades de hojas\n *   Maestra.gs   base maestra: clientes, sedes, equipos, tarifas (lectura y escritura)\n *   Ods.gs       ciclo de la orden: crear, editar, revisar, liquidar, cobrar, retorno, anular, calendario\n *   Tecnico.gs   panel de técnicos: servicios del día, fotos, escáner de placa, cierre\n *   Informes.gs  informes técnicos para clientes (Google Docs + PDF)\n *   Mercadeo.gs  clientes fijos, reactivación e informe mensual\n *   Siigo.gs     API de Siigo (factura sin envío a la DIAN)\n *   Logo.gs      logo en base64\n *\n * Los encabezados de la base maestra se buscan por nombre (sin tildes, mayúsculas, espacios = _),\n * probando en orden los candidatos de CFG.COLS.\n */\n\nconst CFG = {\n  HOJAS: {\n    CLIENTES: 'CLIENTES',\n    SEDES: 'SEDES',\n    EQUIPOS: 'EQUIPOS',\n    SER
