l(0, 1), false).getChild(0).asParagraph().editAsText().setBold(0, E.nombre.length - 1, true);\n  centrar(cab.getCell(0, 2), true); centrar(cab.getCell(0, 3), true);\n  [70, 250, 120, 92].forEach(function (w, i) { cab.setColumnWidth(i, w); });\n\n  banda('INFORMACIÓN DEL CLIENTE');\n  const otrasSedes = leerJSON_(o.SEDES_EXTRA_DETALLE, []);\n  tablaDatos([['Cliente:', o.CLIENTE], ['NIT / C.C.:', o.NIT], ['Dirección:', o.DIRECCION], ['Barrio:', o.BARRIO], ['Ciudad:', o.CIUDAD], ['Sede:', o.SEDE], ['Contacto:', o.CONTACTO], ['Celular:', o.TELEFONO]]\n    .concat(otrasSedes.map(function (s, i) { return ['Sede ' + (i + 2) + ':', s.nombre + ' — ' + [s.direccion, s.barrio, s.ciudad].filter(String).join(', ')]; })));\n\n  banda('SERVICIO');\n  tablaDatos([['Tipo de servicio:', nombreTipo_(o.TIPO_SERVICIO)], ['Técnico:', equipoTecnico_(o)], ['Falla según el cliente:', o.FALLA_CLIENTE], ['Estado del artefacto:', (o.ESTADO_ARTEFACTO || '').split(',').filter(String).join(', ')]]);\n  if (o.EQUIPOS_DETALLE) { const p = body.appendParagraph('Equipos: ' + o.EQUIPOS_DETALLE.split('\\n').join('; ')); p.editAsText().setBold(false).setBold(0, 7, true); }\n\n  // Ítems\n  const items = leerJSON_(o.ITEMS, []);\n  if (items.length) {\n    banda('DESCRIPCIÓN DEL MATERIAL Y DEL SERVICIO');\n    const filas = [liquidada ? ['Código', 'Descripción', 'Cantidad', 'Valor', 'Subtotal'] : ['Código', 'Descripción', 'Cantidad']];\n    items.forEach(function (i) { filas.push(liquidada ? [i.cod || '', i.desc, String(i.cant), '$' + Math.round(i.valor).toLocaleString('es-CO'), '$' + Math.round(i.subtotal).toLocaleString('es-CO')] : [i.cod || '', i.desc, String(i.cant)]); });\n    if (liquidada) {\n      [['Materiales', o.MATERIALES], ['Mano de obra', o.MANO_OBRA], ['Transporte', o.TRANSPORTE], ['TOTAL A PAGAR', o.TOTAL]].forEach(function (t) { filas.push(['', '', '', t[0], '$' + Math.round(numero_(t[1])).toLocaleString('es-CO')]); });\n    }\n    const ti = body.appendTable(filas);\n    for (let c = 0; c < filas[0].length; c++) ti.getCell(0, c).setBackgroundColor(GRIS).getChild(0).asParagraph().editAsText().setBold(true);\n  }\n\n  // Trabajo realizado, separado por jornadas\n  banda('TRABAJO REALIZADO');\n  const jornadas = leerJSON_(o.JORNADAS, []);\n  if (jornadas.length > 1) {\n    jornadas.forEach(function (j) {\n      const t = 'Día ' + j.n + ' (' + fechaLarga_(j.inicio) + (j.tecnico ? ' · ' + j.tecnico : '') + '): ';\n      const p = body.appendParagraph(t + (j.trabajo || '')); p.editAsText().setBold(false).setBold(0, t.length - 1, true);\n      if (j.obs) body.appendParagraph('Observaciones: ' + j.obs);\n    });\n  } else {\n    body.appendParagraph(o.TRABAJO_REALIZADO || '');\n    if (o.OBS_TECNICO) { const p = body.appendParagraph('Observaciones: ' + o.OBS_TECNICO); p.editAsText().setBold(false).setBold(0, 13, true); }\n  }\n\n  // Evidencias\n  // Todas las fotos de la sección Evidencias del técnico (pedido de Samuel, 26/10/2026): antes, después y otras evidencias,\n  // en ese orden y por jornada. Placas, firma y videos no van aquí.\n  const ORDEN_EVID = { ANTES: 0, DESPUES: 1, EVIDENCIA: 2 };\n  const fotos = fotosDe_(o).filter(function (f) { return ORDEN_EVID[f.tipo] !== undefined; })\n    .map(function (f, i) { f.i = i; return f; })\n    .sort(function (a, b) { return ORDEN_EVID[a.tipo] - ORDEN_EVID[b.tipo] || a.jornada - b.jornada || a.i - b.i; });\n  if (fotos.length) {\n    banda('EVIDENCIAS');\n    const filas = []; for (let i = 0; i < fotos.length; i += 4) filas.push(['', '', '', '']);\n    const tf = body.appendTable(filas); tf.setBorderWidth(0);\n    fotos.forEach(function (f, i) {\n      try {\n        const p = tf.getCell(Math.floor(i / 4), i % 4).getChild(0).asParagraph().setAlignment(DocumentApp.HorizontalAlignment.CENTER);\n        const img = p.appendInlineImage(DriveApp.getFileById(f.id).getBlob());\n        const k = 110 / img.getWidth(); img.setWidth(110).setHeight(Math.round(img.getHeight() * k));\n        p.appendText('\\n' + ({ ANTES: 'Antes', DESPUES: 'Después', EVIDENCIA: 'Evidencia' })[f.tipo] + (jornadas.length > 1 ? ' · día ' + f.jornada : ''));\n      } catch (e) { /* foto no disponible */ }\n    });\n  }\n\n  // Condiciones y aceptación (el servicio sin cobro no las lleva: no hay firma de quien recibe)\n  if (o.TIPO_ORDEN !== 'SIN_COBRO') {\n    banda('CONDICIONES GENERALES');\n    CFG.CONDICIONES.forEach(function (c) { const p = body.appendParagraph(c); p.editAsText().setFontSize(7).setBold(false); });\n    const tAcep = body.appendTable([['ACEPTAMOS LAS CONDICIONES', 'TÉCNICO'], ['Nombre: ' + (o.RECIBE_NOMBRE || '') + '\\nC.C.: ' + (cedula || ''), equipoTecnico_(o)]]);\n    [0, 1].forEach(function (c) { centrar(tAcep.getCell(0, c).setBackgroundColor(GRIS), true); });\n    if (o.FIRMA_ID) {\n      try {\n        const img = tAcep.getCell(1, 0).getChild(0).asParagraph().appendInlineImage(DriveApp.getFileById(o.FIRMA_ID).getBlob());\n        const k = 50 / img.getHeight(); img.setHeight(50).setWidth(Math.round(img.getWidth() * k));\n      } catch (e) { /* sin firma */ }\n    }\n  }\n\n  // Datos de contacto de la empresa al final de la orden\n  const pie = body.appendTable([[E.direccion + '  ·  ' + E.telefono + '  ·  ' + E.correo + '\\nTratamiento de datos personales: ' + E.privacidad]]);\n  centrar(pie.getCell(0, 0).setBackgroundColor(GRIS), false);\n\n  // Fichas técnicas: una página por equipo\n  leerJSON_(o.FICHAS, []).forEach(function (f) { agregarFichaDoc_(body, o, f, GRIS, cedula); });\n  // Copia que se guarda en Drive: lleva al final la información interna. La que se envía al cliente no.\n  if (opts.anexoInterno) agregarAnexoInterno_(body, o);\n\n  doc.saveAndClose();\n  const pdf = carpeta.createFile(archivoDoc.getAs('application/pdf')).setName(opts.nombre || o.ID_ODS + '.pdf');\n  archivoDoc.setTrashed(true);\n  return pdf.getId();\n}\n\n/** Ficha técnica con el formato \"Control de mantenimiento preventivo aire acondicionado\". */\nfunction agregarFichaDoc_(body, o, f, GRIS, cedula) {\n  body.appendPageBreak();\n  const t = body.appendParagraph('CONTROL DE MANTENIMIENTO PREVENTIVO AIRE ACONDICIONADO');\n  t.setAlignment(DocumentApp.HorizontalAlignment.CENTER).editAsText().setBold(true).setFontSize(11);\n  const cli = body.appendTable([['INFORMACIÓN DEL CLIENTE', '', 'FECHA'], ['Cliente / sucursal:', o.CLIENTE + (o.SEDE ? ' · ' + o.SEDE : ''), fechaCorta_(o.HORA_CIERRE || o.HORA_INICIO || o.FECHA_PROGRAMADA)], ['Dirección:', o.DIRECCION, ''], ['Ciudad:', o.CIUDAD, '']]);\n  cli.getCell(0, 0).setBackgroundColor(GRIS).getChild(0).asParagraph().editAsText().setBold(true);\n  cli.getCell(0, 2).setBackgroundColor(GRIS).getChild(0).asParagraph().editAsText().setBold(true);\n  const filasEq = [['INFORMACIÓN DEL EQUIPO', '']].concat(CFG.FICHA_CAMPOS.map(function (c) { return [c[1].toUpperCase() + ':', f[c[0]] || '']; }));\n  const teq = body.appendTable(filasEq);\n  teq.getCell(0, 0).setBackgroundColor(GRIS).getChild(0).asParagraph().editAsText().setBold(true);\n  const filasT = [['', 'EJECUTADO', 'NO EJECUTADO']].concat(CFG.FICHA_TAREAS.map(function (x) { const v = (f.tareas || {})[x[0]]; return [x[1].toUpperCase() + ':', v === 'SI' ? 'X' : '', v === 'NO' ? 'X' : '']; }));\n  filasT.push(['SE ENTREGA EN FUNCIONAMIENTO NORMAL:', f.funcionamientoNormal === 'SI' ? 'SÍ' : '', f.funcionamientoNormal === 'NO' ? 'NO' : '']);\n  const tt = body.appendTable(filasT);\n  [1, 2].forEach(function (c) { tt.getCell(0, c).setBackgroundColor(GRIS).getChild(0).asParagraph().editAsText().setBold(true); });\n  const tobs = body.appendTable([['OBSERVACIONES O NOVEDADES TÉCNICAS:'], [f.observaciones || '']]);\n  tobs.getCell(0, 0).setBackgroundColor(GRIS).getChild(0).asParagraph().editAsText().setBold(true);\n  body.appendTable([['TÉCNICO ASIGNADO', 'CLIENTE'], [equipoTecnico_(o), (o.RECIBE_NOMBRE || '') + (cedula ? ' · C.C. ' + cedula : '')]]);\n}\n\n// Siigo.gs\n/**\n * Conexión con Siigo Nube (API v1). Credenciales y parámetros en\n * Configuración del proyecto > Propiedades del script:\n *\n *   SIIGO_USUARIO       usuario API de Siigo (correo)\n *   SIIGO_ACCESS_KEY    llave de acceso generada en Siigo\n *   SIIGO_PARTNER_ID    nombre de la integración, ej: FamilyAirODS\n *   SIIGO_DOC_ID        id del tipo de comprobante de factura (FV)\n *   SIIGO_VENDEDOR_ID   id del usuario vendedor\n *   SIIGO_PAGO_ID       id de la forma de pago\n *   SIIGO_IVA_ID        id del impuesto IVA 19 % (vacío = sin IVA)\n *   SIIGO_IVA_PCT       19\n *   SIIGO_ENVIAR_DIAN   NO (la factura queda en Siigo sin enviarse a la DIAN; Adriana la termina) o SI\n *\n * Los ids de comprobante, vendedor, forma de pago e impuesto se consultan con el menú\n * Family Air > Probar conexión con Siigo.\n */\n\nconst SIIGO_URL = 'https://api.siigo.com';\n\nfunction siigoProp_(k, obligatorio) {\n  // trim: al copiar y pegar la llave suele colarse un espacio o un salto de línea, y Siigo la rechaza.\n  // De las Propiedades leídas una vez por llamada (antes: una consulta por cada propiedad).\n  const v = String(propsMemo_()[k] || '').trim();\n  if (obligatorio && !v) throw new Error('Falta la propiedad ' + k);\n  return v || '';\n}\n\nfunction siigoToken_() {\n  const cache = CacheService.getScriptCache();\n  const t = cache.get('siigo_token');\n  if (t) return t;\n  const res = UrlFetchApp.fetch(SIIGO_URL + '/auth', {\n    method: 'post',\n    contentType: 'application/json',\n    headers: { 'Partner-Id': siigoProp_('SIIGO_PARTNER_ID', true) },\n    payload: JSON.stringify({ username: siigoProp_('SIIGO_USUARIO', true), access_key: siigoProp_('SIIGO_ACCESS_KEY', true) }),\n    muteHttpExceptions: true\n  });\n  if (res.getResponseCode() !== 200) throw new Error('Autenticación rechazada (' + res.getResponseCode() + '): ' + res.getContentText().slice(0, 300));\n  const j = JSON.parse(res.getContentText());\n  // El token dura 24 h; CacheService guarda máximo 6 h.\n  cache.put('siigo_token', j.access_token, Math.min(21600, (j.expires_in || 3600) - 300));\n  return j.access_token;\n}\n\nfunction siigoFetch_(metodo, ruta, cuerpo) {\n  const opciones = {\n    method: metodo,\n    contentType: 'application/json',\n    headers: { Authorization: 'Bearer ' + siigoToken_(), 'Partner-Id': siigoProp_('SIIGO_PARTNER_ID', true) },\n    muteHttpExceptions: true\n  };\n  if (cuerpo) opciones.payload = JSON.stringify(cuerpo);\n  // Un POST que falla por error de Siigo (5xx) o por tiempo pudo haber creado el documento: no se reintenta,\n  // para no duplicar facturas. 401 (token vencido) y 429 (demasiadas solicitudes) se rechazan antes de crear nada.\n  const escritura = metodo !== 'get';\n  for (let intento = 1; intento <= 3; intento++) {\n    let res;\n    try { res = UrlFetchApp.fetch(SIIGO_URL + ruta, opciones); } catch (e) {\n      if (escritura) throw siigoIncierto_(e.message);\n      if (intento === 3) throw e;\n      Utilities.sleep(1500 * intento); continue;\n    }\n    const code = res.getResponseCode();\n    const txt = res.getContentText();\n    if (code >= 200 && code < 300) return txt ? JSON.parse(txt) : {};\n    if (code === 401) { CacheService.getScriptCache().remove('siigo_token'); opciones.headers.Authorization = 'Bearer ' + siigoToken_(); continue; }\n    if (code === 429) { Utilities.sleep(1500 * intento); continue; }\n    if (code >= 500 && escritura) throw siigoIncierto_(code + ' ' + siigoMensaje_(txt));\n    if (code >= 500) { Utilities.sleep(1500 * intento); continue; }\n    throw new Error(code + ' ' + siigoMensaje_(txt));\n  }\n  throw new Error('Siigo no respondió después de 3 intentos.');\n}\n\n/** Error de un envío que Siigo pudo haber recibido. Antes de reenviar se busca si el documento quedó creado. */\nfunction siigoIncierto_(detalle) {\n  const e = new Error('Siigo no confirmó si recibió la factura (' + detalle + '). Al volver a enviar se revisa primero si quedó creada.');\n  e.incierto = true;\n  return e;\n}\n\nfunction siigoMensaje_(txt) {\n  try {\n    const j = JSON.parse(txt);\n    if (j.Errors) return j.Errors.map(function (e) { return e.Code + ': ' + e.Message; }).join(' | ');\n    return txt.slice(0, 400);\n  } catch (e) { return txt.slice(0, 400); }\n}\n\nfunction siigoBuscarCliente_(nit) {\n  const id = String(nit).replace(/\\D/g, '');\n  if (!id) return null;\n  const r = siigoFetch_('get', '/v1/customers?identification=' + encodeURIComponent(id));\n  return (r.results && r.results[0]) || null;\n}\n\n/* ===================== Cliente nuevo en Siigo ===================== */\n\n/** Municipios con su código DANE (departamento, municipio) para la dirección del cliente en Siigo. */\nconst SIIGO_CIUDADES_ = [\n  ['Medellín', '05', '05001'], ['Bello', '05', '05088'], ['Itagüí', '05', '05360'], ['Envigado', '05', '05266'], ['Sabaneta', '05', '05631'],\n  ['La Estrella', '05', '05380'], ['Caldas', '05', '05129'], ['Copacabana', '05', '05212'], ['Girardota', '05', '05308'], ['Barbosa', '05', '05079'],\n  ['Rionegro', '05', '05615'], ['Marinilla', '05', '05440'], ['La Ceja', '05', '05376'], ['El Retiro', '05', '05607'], ['Guarne', '05', '05318'],\n  ['El Carmen de Viboral', '05', '05148'], ['Bogotá', '11', '11001'], ['Cali', '76', '76001'], ['Barranquilla', '08', '08001'],\n  ['Cartagena', '13', '13001'], ['Bucaramanga', '68', '68001'], ['Pereira', '66', '66001'], ['Manizales', '17', '17001'], ['Montería', '23', '23001']\n];\nconst SIIGO_TIPO_DOC_ = { NIT: '31', CC: '13', CE: '22', PASAPORTE: '41', TI: '12' };\nconst SIIGO_RESPONSABILIDADES_ = [['R-99-PN', 'No responsable'], ['O-13', 'Gran contribuyente'], ['O-15', 'Autorretenedor'], ['O-23', 'Agente de retención IVA'], ['O-47', 'Régimen simple de tributación']];\n\n/** Dígito de verificación de un NIT (algoritmo de la DIAN). */\nfunction dvNit_(nit) {\n  const pesos = [3, 7, 13, 17, 19, 23, 29, 37, 41, 43, 47, 53, 59, 67, 71];\n  const d = String(nit || '').replace(/\\D/g, '').split('').reverse();\n  const r = d.reduce(function (a, x, i) { return a + Number(x) * pesos[i]; }, 0) % 11;\n  return String(r > 1 ? 11 - r : r);\n}\n\nconst sinTildes_ = function (t) { return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); };\n\n/**\n * Cliente creado en Siigo que no está en la app: busca el NIT o la cédula en la base y, si no está, en Siigo.\n * Devuelve los datos de Siigo para llenar el formulario de cliente nuevo (la persona revisa y guarda).\n */\nfunction adminBuscarClienteSiigo(token, nit) {\n  sesion_(token, 'clientes');\n  const id = String(nit || '').replace(/\\D/g, '');\n  if (id.length < 5) throw new Error('Escriba el NIT o la cédula completos (sin DV).');\n  const enApp = leerMaestra_('CLIENTES').filter(function (c) { return String(c.nit).replace(/\\D/g, '') === id || String(c.id) === id; })[0];\n  if (enApp) return { enApp: { id: enApp.id, nombre: enApp.nombre } };\n  if (!siigoConectado_()) return { conectado: false };\n  const c = siigoBuscarCliente_(id);\n  return c ? Object.assign({ conectado: true, encontrado: true }, clienteDeSiigo_(c)) : { conectado: true, encontrado: false };\n}\n\n/** Pasa un cliente de Siigo (GET /v1/customers) a los campos del formulario de la app. */\nfunction clienteDeSiigo_(c) {\n  const empresa = c.person_type === 'Company';\n  const nombre = (Array.isArray(c.name) ? c.name.join(' ') : String(c.name || '')).replace(/\\s+/g, ' ').trim().toUpperCase();\n  const codigoDoc = String((c.id_type && (c.id_type.code || c.id_type)) || '');\n  const tipoDocumento = Object.keys(SIIGO_TIPO_DOC_).filter(function (k) { return SIIGO_TIPO_DOC_[k] === codigoDoc; })[0] || (empresa ? 'NIT' : 'CC');\n  const dir = c.address || {}, ciu = dir.city || {};\n  const deDane = SIIGO_CIUDADES_.filter(function (x) { return x[2] === String(ciu.city_code || '') || sinTildes_(x[0]) === sinTildes_(ciu.city_name); })[0];\n  const contacto = (c.contacts || [])[0] || {};\n  const tel = ((c.phones || [])[0] || {}).number || ((contacto.phone || {}).number) || '';\n  return {\n    nombre: nombre, nit: String(c.identification || '').replace(/\\D/g, ''), dv: String(c.check_digit == null ? '' : c.check_digit),\n    tipoDocumento: tipoDocumento, tipoCliente: empresa ? 'EMPRESA' : 'PERSONA',\n    telefono: String(tel).replace(/\\D/g, ''), email: String(contacto.email || '').trim().toLowerCase(),\n    direccion: String(dir.address || '').trim(), ciudad: deDane ? deDane[0] : String(ciu.city_name || 'Medellín').toLowerCase().replace(/(^|\\s)\\S/g, function (x) { return x.toUpperCase(); }),\n    contacto: [contacto.first_name, contacto.last_name].filter(Boolean).join(' ').trim()\n  };\n}\n\n/** Datos del cliente de la orden para crearlo en Siigo, y si ya existe allá. */\nfunction adminClienteSiigo(token, idOds) {\n  const s = sesion_(token, 'panel');\n  if (!puede_(s, 'cobrar') && !puede_(s, 'clientes')) throw new Error('No autorizado.');\n  const o = buscarODS_(idOds);\n  const c = buscarCliente_(o.ID_CLIENTE) || {};\n  const nit = String(c.nit || o.NIT || '').replace(/\\D/g, '');\n  const tipoDoc = String(c.tipoDocumento || (c.dv ? 'NIT' : '')).toUpperCase() || (nit.length >= 9 && /^[89]/.test(nit) ? 'NIT' : 'CC');\n  const empresa = String(c.tipoCliente || '').toUpperCase() === 'EMPRESA' || tipoDoc === 'NIT';\n  const nombre = String(c.nombre || o.CLIENTE || '').trim();\n  const palabras = nombre.split(/\\s+/).filter(String);\n  const corte = palabras.length >= 4 ? Math.floor(palabras.length / 2) : 1;\n  const ciudad = sinTildes_(c.ciudad || o.CIUDAD || 'Medellín');\n  const ciu = SIIGO_CIUDADES_.filter(function (x) { return sinTildes_(x[0]) === ciudad; })[0];\n  return {\n    existe: siigoConectado_() ? !!siigoBuscarCliente_(nit) : false, conectado: siigoConectado_(),\n    nit: nit, dv: String(c.dv || '') || (tipoDoc === 'NIT' ? dvNit_(nit) : ''), tipoDocumento: tipoDoc, empresa: empresa,\n    razonSocial: nombre, nombres: empresa ? '' : palabras.slice(0, corte).join(' '), apellidos: empresa ? '' : palabras.slice(corte).join(' '),\n    direccion: c.direccion || o.DIRECCION || '', ciudad: ciu ? ciu[2] : '05001', telefono: String(c.telefono || o.TELEFONO || '').replace(/\\D/g, '').slice(0, 10),\n    email: c.email || '', contacto: o.CONTACTO || '',\n    ciudades: SIIGO_CIUDADES_.map(function (x) { return { codigo: x[2], nombre: x[0] }; }),\n    responsabilidades: SIIGO_RESPONSABILIDADES_.map(function (x) { return { codigo: x[0], nombre: x[1] }; })\n  };\n}\n\n/** Crea en Siigo el cliente de la orden con los datos que confirmó Adriana. Si ya existe, no lo duplica. */\nfunction adminCrearClienteSiigo(token, idOds, d) {\n  const s = sesion_(token, 'panel');\n  if (!puede_(s, 'cobrar') && !puede_(s, 'clientes')) throw new Error('No autorizado.');\n  d = d || {};\n  const o = buscarODS_(idOds);\n  // La consulta a Siigo va fuera del bloqueo: los demás no esperan su respuesta.\n  const r = crearClienteSiigo_(d);\n  if (!r.creado) return r;\n  conLock_(function () {\n    // Lo que faltaba en la app (correo, teléfono, DV) queda guardado en el cliente.\n    const c = leerMaestra_('CLIENTES').filter(function (x) { return x.id === o.ID_CLIENTE; })[0];\n    if (c) {\n      const cambios = {};\n      if (!c.email) cambios.email = r.email;\n      if (!c.telefono && r.telefono) cambios.telefono = r.telefono;\n      if (r.dv && !c.dv) cambios.dv = r.dv;\n      if (Object.keys(cambios).length) actualizarMaestra_('CLIENTES', c._fila, cambios);\n    }\n    log_(idOds, s.usuario, 'SIIGO_CLIENTE_NUEVO', r.nit + ' · ' + r.nombre);\n  });\n  return { creado: true, nit: r.nit };\n}\n\n/**\n * Crea el cliente en Siigo (POST /v1/customers) si no existe allá. d: {nit, dv, tipoDocumento, empresa, razonSocial,\n * nombres, apellidos, direccion, ciudad (código DANE), telefono, email, contacto, responsabilidad, responsableIva}.\n * Devuelve {creado, nit, nombre, email, telefono, dv}; lanza error con lo que falta.\n */\nfunction crearClienteSiigo_(d) {\n  const nit = String(d.nit || '').replace(/\\D/g, '');\n  const idType = SIIGO_TIPO_DOC_[String(d.tipoDocumento || '').toUpperCase()];\n  const ciu = SIIGO_CIUDADES_.filter(function (x) { return x[2] === d.ciudad; })[0];\n  const email = String(d.email || '').trim();\n  const faltan = [];\n  if (!nit) faltan.push('número de documento');\n  if (!idType) faltan.push('tipo de documento');\n  if (d.empresa ? !String(d.razonSocial || '').trim() : !String(d.nombres || '').trim() || !String(d.apellidos || '').trim()) faltan.push(d.empresa ? 'razón social' : 'nombres y apellidos');\n  if (!String(d.direccion || '').trim()) faltan.push('dirección');\n  if (!ciu) faltan.push('ciudad');\n  if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(email)) faltan.push('correo para la factura electrónica');\n  if (faltan.length) throw new Error('Falta: ' + faltan.join(', ') + '.');\n  if (idType === '31' && String(d.dv || '') !== dvNit_(nit)) throw new Error('El dígito de verificación del NIT ' + nit + ' es ' + dvNit_(nit) + '.');\n  const responsabilidad = SIIGO_RESPONSABILIDADES_.some(function (x) { return x[0] === d.responsabilidad; }) ? d.responsabilidad : 'R-99-PN';\n  const nombre = d.empresa ? String(d.razonSocial).trim() : String(d.nombres).trim() + ' ' + String(d.apellidos).trim();\n  const telefono = String(d.telefono || '').replace(/\\D/g, '').slice(0, 10);\n  const salida = { nit: nit, nombre: nombre, email: email, telefono: telefono, dv: idType === '31' ? dvNit_(nit) : '' };\n  if (siigoBuscarCliente_(nit)) return Object.assign({ creado: false }, salida);\n  const contactoNombre = d.empresa ? String(d.contacto || d.razonSocial).trim() : String(d.nombres).trim();\n  const partes = contactoNombre.split(/\\s+/);\n  const cuerpo = {\n    type: 'Customer', person_type: d.empresa ? 'Company' : 'Person', id_type: idType, identification: nit,\n    name: d.empresa ? [String(d.razonSocial).trim()] : [String(d.nombres).trim(), String(d.apellidos).trim()],\n    branch_office: 0, active: true, vat_responsible: !!d.responsableIva,\n    fiscal_responsibilities: [{ code: responsabilidad }],\n    address: { address: String(d.direccion).trim(), city: { country_code: 'Co', state_code: ciu[1], city_code: ciu[2] } },\n    phones: telefono ? [{ number: telefono }] : [],\n    contacts: [{ first_name: partes[0], last_name: d.empresa ? (partes.slice(1).join(' ') || '.') : String(d.apellidos).trim(), email: email }]\n  };\n  if (idType === '31') cuerpo.check_digit = dvNit_(nit);\n  siigoFetch_('post', '/v1/customers', cuerpo);\n  return Object.assign({ creado: true }, salida);\n}\n\n/**\n * Cliente nuevo de la app → datos para Siigo. Persona natural: las primeras palabras son nombres y el resto apellidos\n * (con 4 o más palabras, la mitad). La ciudad se busca por nombre en la lista DANE.\n */\nfunction datosSiigoDeCliente_(d) {\n  const tipoDoc = String(d.tipoDocumento || (d.dv ? 'NIT' : 'CC')).toUpperCase();\n  const empresa = String(d.tipoCliente || '').toUpperCase() === 'EMPRESA' || tipoDoc === 'NIT';\n  const nombre = String(d.nombre || '').trim();\n  const palabras = nombre.split(/\\s+/).filter(String);\n  const corte = palabras.length >= 4 ? Math.floor(palabras.length / 2) : 1;\n  const sede = d.sede || {};\n  const ciu = SIIGO_CIUDADES_.filter(function (x) { return sinTildes_(x[0]) === sinTildes_(sede.ciudad || d.ciudad || 'Medellín'); })[0];\n  const nit = String(d.nit || '').replace(/\\D/g, '');\n  return {\n    nit: nit, dv: tipoDoc === 'NIT' ? (String(d.dv || '') || dvNit_(nit)) : '', tipoDocumento: tipoDoc, empresa: empresa,\n    razonSocial: nombre, nombres: empresa ? '' : palabras.slice(0, corte).join(' '), apellidos: empresa ? '' : palabras.slice(corte).join(' '),\n    direccion: sede.direccion || '', ciudad: ciu ? ciu[2] : '', telefono: d.telefono || sede.telefono || '', email: d.email || '',\n    contacto: sede.contacto || '', responsabilidad: (d.siigo || {}).responsabilidad\n  };\n}\n\n/* ===================== Factura anulada en Siigo ===================== */\n// Siigo no avisa cuando se anula o elimina una factura: la app pregunta por las que creó (disparador de 15 minutos,\n// y antes de enviar o anular una orden). Si ya no vale, la orden se desliga y vuelve a Por facturar.\n\n/** 'vigente', 'anulada' o 'eliminada'; 'desconocido' si Siigo no responde. */\nfunction siigoEstadoFactura_(id) {\n  try {\n    const f = siigoFetch_('get', '/v1/invoices/' + encodeURIComponent(id));\n    return f && (f.annulled === true || /anulad/i.test(String(f.status || ''))) ? 'anulada' : 'vigente';\n  } catch (e) {\n    return /^404\\b/.test(e.message) ? 'eliminada' : 'desconocido';\n  }\n}\n\n/** Desliga de la orden una factura anulada o eliminada en Siigo. Llamar dentro de conLock_. */\nfunction soltarFacturaSiigo_(o, estado, usuario) {\n  const factura = o.FACTURA_SIIGO;\n  const cambios = { SIIGO_ID: '', FACTURA_SIIGO: '', SIIGO_ERROR: 'La factura ' + factura + ' fue ' + estado + ' en Siigo (' + ahora_() + '). Envíela de nuevo cuando corresponda.' };\n  if (o.ESTADO === 'COMPLETADA' && o.FORMA_PAGO === 'FACTURA') { cambios.ESTADO = 'POR_FACTURAR'; cambios.FECHA_COMPLETADA = ''; }\n  if (o.ODS_FINAL_ID) cambios.ARCHIVO_PENDIENTE = unirMarcas_(o.ARCHIVO_PENDIENTE, ['ODS']);\n  actualizarODS_(o._fila, cambios);\n  log_(o.ID_ODS, usuario, 'SIIGO_ANULADA', factura + ' ' + estado + ' en Siigo' + (cambios.ESTADO ? '; la orden vuelve a Por facturar' : ''));\n}\n\n/** Si la factura de la orden ya no vale en Siigo, la desliga. Devuelve true si la soltó. */\nfunction verificarFacturaSiigo_(id, usuario) {\n  const o = buscarODS_(id);\n  if (!o.SIIGO_ID || !siigoConectado_()) return false;\n  const estado = siigoEstadoFactura_(o.SIIGO_ID);\n  if (estado !== 'anulada' && estado !== 'eliminada') return false;\n  return conLock_(function () {\n    const x = buscarODS_(id);\n    if (x.SIIGO_ID !== o.SIIGO_ID) return false;\n    soltarFacturaSiigo_(x, estado, usuario);\n    return true;\n  });\n}\n\n/** Lo corre el disparador de 15 minutos: facturas de órdenes por facturar y completadas en los últimos 90 días. */\nfunction revisarFacturasSiigo_() {\n  if (!siigoConectado_()) return [];\n  const desde = Utilities.formatDate(new Date(Date.now() - 90 * 864e5), TZ, 'yyyy-MM-dd');\n  return leerODS_().filter(function (o) {\n    return o.SIIGO_ID && (o.ESTADO === 'POR_FACTURAR' || (o.ESTADO === 'COMPLETADA' && String(fechaISO_(o.FECHA_COMPLETADA) || '') >= desde));\n  }).slice(0, 60).filter(function (o) { return verificarFacturaSiigo_(o.ID_ODS, 'sistema'); }).map(function (o) { return o.ID_ODS; });\n}\n\n/**\n * Menú: consulta ya mismo la factura de una orden en Siigo, muestra cómo la reporta Siigo y,\n * si está anulada o eliminada, la desliga sin esperar la revisión de cada 15 minutos.\n */\nfunction menuRevisarFacturaSiigo() {\n  soloInterno_();\n  const ui = SpreadsheetApp.getUi();\n  const r = ui.prompt('Revisar factura en Siigo', 'Número de la orden (ej: ODS-1)', ui.ButtonSet.OK_CANCEL);\n  if (r.getSelectedButton() !== ui.Button.OK) return;\n  try {\n    const o = buscarODS_(String(r.getResponseText()).trim().toUpperCase());\n    if (!o.SIIGO_ID) { ui.alert(o.ID_ODS + ' no tiene factura de Siigo ligada.' + (o.SIIGO_ERROR ? '\\n\\n' + o.SIIGO_ERROR : '')); return; }\n    let resumen;\n    try {\n      const f = siigoFetch_('get', '/v1/invoices/' + encodeURIComponent(o.SIIGO_ID));\n      resumen = 'Siigo responde:\\n' + JSON.stringify({ nombre: f.name, anulada: f.annulled, estado: f.status, dian: f.stamp, total: f.total, saldo: f.balance, actualizada: f.metadata }, null, 1).slice(0, 1500) +\n        '\\n\\nCampos: ' + Object.keys(f).join(', ');\n    } catch (e) { resumen = 'Siigo responde: ' + e.message; }\n    const solto = verificarFacturaSiigo_(o.ID_ODS, Session.getActiveUser().getEmail() || 'menu');\n    ui.alert(o.ID_ODS + ' · factura ' + o.FACTURA_SIIGO + ' (' + o.ESTADO + ')\\n\\n' + resumen + '\\n\\n' +\n      (solto ? 'La factura ya no vale en Siigo: se desligó y la orden quedó en Por facturar.' : 'Para la app la factura sigue vigente.'));\n  } catch (e) {\n    ui.alert('Error: ' + e.message);\n  }\n}\n\n/** Siigo está conectado si Samuel ya ingresó las credenciales. */\nfunction siigoConectado_() {\n  return !!(siigoProp_('SIIGO_USUARIO') && siigoProp_('SIIGO_ACCESS_KEY') && siigoProp_('SIIGO_PARTNER_ID'));\n}\n\n/**\n * Busca un documento de Siigo (cotización u orden de compra) por su número: el nombre completo\n * (C-1-25, OC-1-31) o solo el consecutivo (25). Primero filtra con ?name=; si la API no aplica\n * ese filtro, recorre las páginas más recientes (hasta 1.000 documentos).\n */\nfunction siigoBuscarDoc_(ruta, numero) {\n  const q = String(numero || '').trim().toUpperCase().replace(/\\s+/g, '');\n  if (!q) return null;\n  const consecutivo = (/(\\d+)$/.exec(q) || [])[1];\n  // Acepta C-1-4, 1-4 o 4: nombre exacto, nombre que termina en \"-1-4\" o el mismo consecutivo.\n  const igual = function (c) {\n    const nombre = String(c.name || '').toUpperCase();\n    return nombre === q || nombre.slice(-(q.length + 1)) === '-' + q ||\n      (!!consecutivo && c.number != null && String(Number(c.number)) === String(Number(consecutivo)));\n  };\n  const lista = function (r) { return r.results || (Array.isArray(r) ? r : []); };\n  let directo = null;\n  try { directo = lista(siigoFetch_('get', ruta + '?name=' + encodeURIComponent(q))).filter(igual)[0]; } catch (e) {\n    if (/^404\\b/.test(e.message)) throw e; // la ruta no existe en Siigo\n    // si Siigo no acepta el filtro por nombre, se buscan las páginas\n  }\n  if (directo) return directo;\n  // Sin filtro por nombre: la primera página dice cuántas hay y las demás (hasta 10) se piden todas a la vez.\n  const r1 = siigoFetch_('get', ruta + '?page=1&page_size=100');\n  const primera = lista(r1);\n  const c1 = primera.filter(igual)[0];\n  if (c1) return c1;\n  const total = (r1.pagination && r1.pagination.total_results) || (primera.length < 100 ? primera.length : 1000);\n  const paginas = Math.min(10, Math.ceil(total / 100));\n  const rutas = [];\n  for (let p = 2; p <= paginas; p++) rutas.push(ruta + '?page=' + p + '&page_size=100');\n  const resto = rutas.length ? siigoFetchVarios_(rutas) : [];\n  for (let i = 0; i < resto.length; i++) {\n    const c = lista(resto[i]).filter(igual)[0];\n    if (c) return c;\n  }\n  return null;\n}\n\n/** Varias consultas GET a Siigo en paralelo (UrlFetchApp.fetchAll). Devuelve las respuestas en el mismo orden. */\nfunction siigoFetchVarios_(rutas) {\n  const pedir = function () {\n    const enc = { Authorization: 'Bearer ' + siigoToken_(), 'Partner-Id': siigoProp_('SIIGO_PARTNER_ID', true) };\n    return UrlFetchApp.fetchAll(rutas.map(function (r) { return { url: SIIGO_URL + r, method: 'get', headers: enc, muteHttpExceptions: true }; }));\n  };\n  let res = pedir();\n  if (res.some(function (x) { return x.getResponseCode() === 401; })) { CacheService.getScriptCache().remove('siigo_token'); res = pedir(); }\n  return res.map(function (x, i) {\n    const code = x.getResponseCode();\n    if (code >= 200 && code < 300) { const t = x.getContentText(); return t ? JSON.parse(t) : {}; }\n    // Una página que falle se vuelve a pedir sola (con sus reintentos normales).\n    return siigoFetch_('get', rutas[i]);\n  });\n}\n\nfunction siigoItems_(c) {\n  return (c.items || []).map(function (i) { return { cod: i.code || '', desc: i.description || '', cant: numero_(i.quantity) || 1, valor: numero_(i.price) || 0 }; });\n}\n\n/** Total antes de IVA de un documento de Siigo (suma de sus líneas), como se liquida en la app. El total de Siigo trae el IVA. */\nfunction siigoSubtotal_(c) {\n  const items = siigoItems_(c);\n  return items.length ? items.reduce(function (a, i) { return a + i.cant * i.valor; }, 0) : numero_(c.total);\n}\n\n/**\n * Busca una cotización por su número (ej. C-1-25 o 25). Devuelve\n * {numero, id, fecha, total, nit, items:[{cod, desc, cant, valor}]} o null.\n */\nfunction siigoBuscarCotizacion_(numero) {\n  const c = siigoBuscarDoc_('/v1/quotations', numero);\n  if (!c) return null;\n  return {\n    numero: c.name || String(c.number), id: c.id, fecha: String(c.date || '').slice(0, 10), total: siigoSubtotal_(c),\n    nit: String((c.customer && c.customer.identification) || ''),\n    items: siigoItems_(c)\n  };\n}\n\n/**\n * Busca una orden de compra de Siigo por su número. Es un documento distinto de la cotización.\n * Ruta configurable con la propiedad SIIGO_RUTA_OC (por defecto /v1/purchase-orders); el menú\n * Probar conexión con Siigo muestra si la cuenta la expone. Devuelve\n * {numero, id, fecha, total, tercero, nitTercero, items:[{cod, desc, cant, valor}]} o null.\n */\nfunction siigoBuscarOrdenCompra_(numero) {\n  const c = siigoBuscarDoc_(siigoProp_('SIIGO_RUTA_OC') || '/v1/purchase-orders', numero);\n  if (!c) return null;\n  const t = c.supplier || c.provider || c.customer || {};\n  const nombre = Array.isArray(t.name) ? t.name.join(' ') : (t.name || t.business_name || '');\n  return {\n    numero: c.name || String(c.number), id: c.id, fecha: String(c.date || '').slice(0, 10), total: siigoSubtotal_(c),\n    tercero: String(nombre || ''), nitTercero: String(t.identification || ''),\n    items: siigoItems_(c)\n  };\n}\n\n/* ===================== Productos de Siigo (códigos de los ítems) ===================== */\n\n/**\n * Catálogo de productos activos de Siigo: [{codigo, nombre}]. Cada línea de una factura necesita el código de un\n * producto que exista allá. Queda 6 horas en caché; refrescar = true lo vuelve a pedir (un producto recién creado).\n */\nfunction productosSiigo_(refrescar) {\n  const cache = CacheService.getScriptCache();\n  if (!refrescar) { const c = cache.get('siigo_productos'); if (c) return JSON.parse(c); }\n  const lista = function (r) { return r.results || (Array.isArray(r) ? r : []); };\n  const r1 = siigoFetch_('get', '/v1/products?page=1&page_size=100');\n  let todos = lista(r1);\n  const total = (r1.pagination && r1.pagination.total_results) || todos.length;\n  const rutas = [];\n  for (let p = 2; p <= Math.min(20, Math.ceil(total / 100)); p++) rutas.push('/v1/products?page=' + p + '&page_size=100');\n  if (rutas.length) siigoFetchVarios_(rutas).forEach(function (r) { todos = todos.concat(lista(r)); });\n  const prods = todos.filter(function (p) { return p.active !== false && p.code; })\n    .map(function (p) { return { codigo: String(p.code).trim(), nombre: String(p.name || '').trim() }; });\n  const txt = JSON.stringify(prods);\n  if (txt.length < 95000) cache.put('siigo_productos', txt, 21600);\n  return prods;\n}\n\n/** Ítems sin un producto válido de Siigo (sin código, o con un código que Siigo no tiene). Si falta alguno, relee el catálogo una vez. */\nfunction faltanProductoSiigo_(items) {\n  const revisar = function (prods) {\n    const hay = {};\n    prods.forEach(function (p) { hay[p.codigo.toUpperCase()] = true; });\n    return items.map(function (i, n) { return { n: n, cod: String(i.cod || '').trim(), desc: i.desc || '' }; })\n      .filter(function (x) { return !x.cod || !hay[x.cod.toUpperCase()]; });\n  };\n  const faltan = revisar(productosSiigo_(false));\n  return faltan.length ? revisar(productosSiigo_(true)) : faltan;\n}\n\n/** Catálogo de productos de Siigo para el editor de ítems (liquidar) y para escoger el producto antes de facturar. */\nfunction adminProductosSiigo(token) {\n  const s = sesion_(token, 'panel');\n  if (!puede_(s, 'liquidar') && !puede_(s, 'cobrar')) throw new Error('No autorizado.');\n  if (!siigoConectado_()) return { conectado: false, productos: [] };\n  return { conectado: true, productos: productosSiigo_(false) };\n}\n\n/** Antes de facturar: ítems de la orden sin un producto válido de Siigo, con el catálogo para escogerlo. */\nfunction adminItemsSiigo(token, idOds) {\n  sesion_(token, 'cobrar');\n  if (!siigoConectado_()) return { conectado: false, faltan: [] };\n  const o = buscarODS_(idOds);\n  const items = leerJSON_(o.ITEMS, []);\n  const faltan = faltanProductoSiigo_(items);\n  const prods = faltan.length ? productosSiigo_(false) : [];\n  faltan.forEach(function (x) {\n    const p = productoPorNombre_(prods, x.desc);\n    x.parecido = p ? p.codigo : '';\n    x.cat = (items[x.n] && items[x.n].cat) || 'SERVICIO';\n  });\n  return { conectado: true, faltan: faltan, productos: prods, puedeCrear: faltan.every(function (x) { return !!grupoSiigo_(x.cat, o.TIPO_SERVICIO); }) };\n}\n\n/**\n * Grupo de inventario del producto nuevo: materiales a venta de producto; mano de obra y transporte al grupo del tipo de\n * servicio de la orden. Propiedad SIIGO_GRUPO_<CLAVE> (o la anterior SIIGO_GRUPO_SERVICIO como respaldo) si existe.\n */\nfunction grupoSiigo_(cat, tipoServicio) {\n  const clave = String(cat || '').toUpperCase() === 'MATERIAL' ? 'MATERIAL' : String(tipoServicio || '').toUpperCase();\n  return siigoProp_('SIIGO_GRUPO_' + clave) || String(CFG.SIIGO_GRUPOS[clave] || '') || (clave !== 'MATERIAL' ? siigoProp_('SIIGO_GRUPO_SERVICIO') : '');\n}\n\n/** Producto de Siigo con el mismo nombre (sin tildes, mayúsculas ni espacios de más). */\nfunction productoPorNombre_(prods, nombre) {\n  const t = sinTildes_(nombre).replace(/\\s+/g, ' ');\n  return t ? prods.filter(function (p) { return sinTildes_(p.nombre).replace(/\\s+/g, ' ') === t; })[0] || null : null;\n}\n\n/**\n * Crea en Siigo el producto de un ítem libre: código con consecutivo propio (FA-0001…), nombre = descripción, servicio o\n * producto según la categoría, IVA y precio = valor liquidado. Si ya hay uno con ese nombre, devuelve ese (no duplica).\n * El grupo de inventario (cuentas contables) sale de SIIGO_GRUPO_SERVICIO o SIIGO_GRUPO_MATERIAL.\n */\nfunction crearProductoSiigo_(item, tipoServicio) {\n  const nombre = String(item.desc || '').trim().replace(/\\s+/g, ' ');\n  if (!nombre) throw new Error('El ítem no tiene descripción para crear el producto en Siigo.');\n  const material = String(item.cat || '').toUpperCase() === 'MATERIAL';\n  const grupo = grupoSiigo_(item.cat, tipoServicio);\n  if (!grupo) throw new Error('No hay grupo de inventario de Siigo para ' + (material ? 'materiales' : 'el tipo de servicio ' + (tipoServicio || '(sin tipo)')) + '. El menú Family Air → Probar conexión con Siigo muestra los grupos.');\n  let prods = productosSiigo_(true);\n  const ya = productoPorNombre_(prods, nombre);\n  if (ya) return { codigo: ya.codigo, nombre: ya.nombre, creado: false };\n  const usados = {};\n  prods.forEach(function (p) { usados[p.codigo.toUpperCase()] = true; });\n  // Consecutivo propio bajo bloqueo; salta códigos que ya existan en Siigo.\n  const codigo = conLock_(function () {\n    const props = PropertiesService.getScriptProperties();\n    let n = Number(props.getProperty('CONSECUTIVO_PRODUCTO_SIIGO') || 0), c;\n    do { n++; c = 'FA-' + ('000' + n).slice(-4); } while (usados[c]);\n    props.setProperty('CONSECUTIVO_PRODUCTO_SIIGO', String(n));\n    return c;\n  });\n  const ivaId = siigoProp_('SIIGO_IVA_ID');\n  const cuerpo = {\n    code: codigo, name: nombre.slice(0, 100), account_group: Number(grupo), type: material ? 'Product' : 'Service',\n    stock_control: false, active: true, tax_classification: ivaId ? 'Taxed' : 'Excluded', tax_included: false,\n    prices: [{ currency_code: 'COP', price_list: [{ position: 1, value: numero_(item.valor) || 0 }] }],\n    unit: '94', description: 'Creado desde la app de ODS'\n  };\n  if (ivaId) cuerpo.taxes = [{ id: Number(ivaId) }];\n  siigoFetch_('post', '/v1/products', cuerpo);\n  CacheService.getScriptCache().remove('siigo_productos');\n  return { codigo: codigo, nombre: nombre, creado: true };\n}\n\n/**\n * Cobro escoge el producto de Siigo de cada ítem que no lo tenía (orden en Por facturar, sin factura en Siigo).\n * Solo cambia el código: descripción, cantidad y valor quedan como los liquidó Lucas. codigos = [{n, cod}].\n */\nfunction adminCodigosSiigo(token, idOds, codigos) {\n  const s = sesion_(token, 'cobrar');\n  // Ítems marcados \"Crear en Siigo\": el producto se crea antes (fuera del bloqueo, mientras responde Siigo).\n  const o0 = buscarODS_(idOds);\n  if (['LIQUIDADA', 'POR_FACTURAR'].indexOf(o0.ESTADO) < 0 || o0.SIIGO_ID) throw new Error('Solo se escoge el producto de Siigo en una orden liquidada o en Por facturar que aún no tiene factura.');\n  const items0 = leerJSON_(o0.ITEMS, []);\n  const creados = [];\n  codigos = (codigos || []).map(function (c) {\n    if (!c.crear) return c;\n    const i = items0[Number(c.n)];\n    if (!i) return c;\n    const p = crearProductoSiigo_(i, o0.TIPO_SERVICIO);\n    if (p.creado) creados.push(p.codigo + ' ' + p.nombre);\n    return { n: c.n, cod: p.codigo };\n  });\n  const valido = {};\n  productosSiigo_(false).forEach(function (p) { valido[p.codigo.toUpperCase()] = p.codigo; });\n  return conLock_(function () {\n    const o = buscarODS_(idOds);\n    if (['LIQUIDADA', 'POR_FACTURAR'].indexOf(o.ESTADO) < 0 || o.SIIGO_ID) throw new Error('Solo se escoge el producto de Siigo en una orden liquidada o en Por facturar que aún no tiene factura.');\n    const items = leerJSON_(o.ITEMS, []);\n    const cambios = [];\n    (codigos || []).forEach(function (c) {\n      const i = items[Number(c.n)];\n      const cod = valido[String(c.cod || '').trim().toUpperCase()];\n      if (!i) return;\n      if (!cod) throw new Error('\"' + String(c.cod || '').trim() + '\" no es un código de producto de Siigo (' + i.desc + ').');\n      if (i.cod !== cod) { cambios.push(i.desc + ': ' + (i.cod || 'sin código') + ' → ' + cod); i.cod = cod; }\n    });\n    if (cambios.length) {\n      actualizarODS_(o._fila, { ITEMS: JSON.stringify(items) });\n      log_(idOds, s.usuario, 'CODIGOS_SIIGO', cambios.join(' · ') + (creados.length ? ' · creados en Siigo: ' + creados.join(', ') : ''));\n    }\n    return { cambiados: cambios.length, creados: creados.length };\n  });\n}\n\n/**\n * Crea en Siigo la factura de una orden en Por facturar, sin enviarla a la DIAN (SIIGO_ENVIAR_DIAN=NO).\n * Cada ítem de la orden es una línea; su código debe existir como producto en Siigo. Devuelve {id, nombre}.\n */\nfunction siigoCrearFactura_(o) {\n  const cliente = siigoBuscarCliente_(o.NIT);\n  if (!cliente) throw new Error('El cliente con NIT ' + o.NIT + ' no existe en Siigo. Créelo en Siigo y vuelva a enviar.');\n\n  const items = leerJSON_(o.ITEMS, []).filter(function (i) { return numero_(i.cant) > 0; });\n  if (!items.length) throw new Error('La orden no tiene ítems.');\n  // Cada línea necesita el código de un producto que exista en Siigo. Si el catálogo no se puede leer, al menos se exige el código.\n  let faltan;\n  try { faltan = faltanProductoSiigo_(items); } catch (e) { faltan = items.filter(function (i) { return !i.cod; }).map(function (i) { return { desc: i.desc, cod: '' }; }); }\n  if (faltan.length) throw new Error('Estos ítems no tienen un producto de Siigo: ' + faltan.map(function (x) { return x.desc + (x.cod ? ' (el código ' + x.cod + ' no existe en Siigo)' : ''); }).join(', ') + '. Escoja el producto de cada uno y vuelva a enviar.');\n  const ivaId = siigoProp_('SIIGO_IVA_ID');\n  const ivaPct = Number(siigoProp_('SIIGO_IVA_PCT') || 19);\n  const hoy = Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd');\n\n  let total = 0;\n  const lineas = items.map(function (i) {\n    const cant = numero_(i.cant), precio = numero_(i.valor);\n    total += cant * precio * (ivaId ? 1 + ivaPct / 100 : 1);\n    const l = { code: i.cod, description: i.desc, quantity: cant, price: precio, discount: 0 };\n    if (ivaId) l.taxes = [{ id: Number(ivaId) }];\n    return l;\n  });\n  total = Math.round(total * 100) / 100;\n\n  const cuerpo = {\n    document: { id: Number(siigoProp_('SIIGO_DOC_ID', true)) },\n    date: hoy,\n    customer: { identification: cliente.identification, branch_office: cliente.branch_office || 0 },\n    seller: Number(siigoProp_('SIIGO_VENDEDOR_ID', true)),\n    observations: observacionesFactura_(o),\n    items: lineas,\n    payments: [{ id: Number(siigoProp_('SIIGO_PAGO_ID', true)), value: total, due_date: hoy }],\n    stamp: { send: siigoProp_('SIIGO_ENVIAR_DIAN') === 'SI' },\n    mail: { send: false }\n  };\n  // Orden de compra del cliente: va como documento de referencia de la factura (additional_fields.purchase_order).\n  const oc = ocParaSiigo_(o.OC_NUMERO);\n  if (oc) cuerpo.additional_fields = { purchase_order: oc };\n  // Si un envío anterior quedó sin respuesta, la factura pudo quedar creada: se busca antes de crear otra.\n  const previa = siigoFacturaDeOrden_(o, cliente);\n  if (previa) return { id: previa.id, nombre: previa.name || String(previa.number), yaExistia: true };\n  let r;\n  try { r = siigoFetch_('post', '/v1/invoices', cuerpo); } catch (e) {\n    // Si Siigo rechaza el campo de la OC (un 400 no crea nada), la OC va en las observaciones y se envía otra vez.\n    if (!oc || e.incierto || !/^4\\d\\d\\b/.test(e.message) || !/additional|purchase/i.test(e.message)) throw e;\n    delete cuerpo.additional_fields;\n    cuerpo.observations += '\\n\\nORDEN DE COMPRA ' + o.OC_NUMERO;\n    r = siigoFetch_('post', '/v1/invoices', cuerpo);\n  }\n  return { id: r.id, nombre: r.name || String(r.number) };\n}\n\n/** Número de OC como lo pide Siigo: prefijo y número (\"OC-1-31\" → OC-1 / 31; \"4500012345\" → OC / 4500012345). */\nfunction ocParaSiigo_(numero) {\n  const t = String(numero || '').trim().toUpperCase();\n  if (!t) return null;\n  const m = /^(.*?)[\\s\\-#.]*(\\d+)$/.exec(t);\n  const prefijo = m ? m[1].replace(/[\\s\\-#.]+$/, '') : '';\n  return { prefix: (prefijo || 'OC').slice(0, 20), number: m ? m[2] : t.slice(0, 20) };\n}\n\n/**\n * Crea en Siigo la cotización de una orden liquidada con sus mismos ítems, valores e IVA. Comprobante de cotización:\n * propiedad SIIGO_COTIZACION_DOC_ID o el primero de tipo C. Si un envío anterior quedó sin respuesta, la busca antes.\n */\nfunction siigoCrearCotizacion_(o) {\n  const cliente = siigoBuscarCliente_(o.NIT);\n  if (!cliente) throw new Error('El cliente con NIT ' + o.NIT + ' no existe en Siigo. Créelo y vuelva a intentar.');\n  const items = leerJSON_(o.ITEMS, []).filter(function (i) { return numero_(i.cant) > 0; });\n  if (!items.length) throw new Error('La orden no tiene ítems.');\n  const faltan = faltanProductoSiigo_(items);\n  if (faltan.length) throw new Error('Estos ítems no tienen un producto de Siigo: ' + faltan.map(function (x) { return x.desc; }).join(', ') + '.');\n  let doc = siigoProp_('SIIGO_COTIZACION_DOC_ID');\n  if (!doc) {\n    const tipos = siigoFetch_('get', '/v1/document-types?type=C');\n    const t = (tipos.results || tipos || []).filter(function (x) { return x.active !== false; })[0];\n    if (!t) throw new Error('Siigo no tiene un comprobante de cotización activo.');\n    doc = t.id;\n  }\n  const ivaId = siigoProp_('SIIGO_IVA_ID');\n  const desde = Utilities.formatDate(new Date(Date.now() - 30 * 864e5), TZ, 'yyyy-MM-dd');\n  const previa = (siigoFetch_('get', '/v1/quotations?customer_identification=' + encodeURIComponent(cliente.identification) + '&created_start=' + desde + '&page_size=100').results || [])\n    .filter(function (x) { return ordenDeObservaciones_(x.observations) === String(o.ID_ODS).toUpperCase(); })[0];\n  const lineas = items.map(function (i) { return { cod: i.cod, desc: i.desc, cant: numero_(i.cant), valor: numero_(i.valor) }; });\n  if (previa) return { id: previa.id, nombre: previa.name || String(previa.number), items: lineas, yaExistia: true };\n  const cuerpo = {\n    document: { id: Number(doc) }, date: Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd'),\n    customer: { identification: cliente.identification, branch_office: cliente.branch_office || 0 },\n    seller: Number(siigoProp_('SIIGO_VENDEDOR_ID', true)), observations: observacionesFactura_(o),\n    items: items.map(function (i) {\n      const l = { code: i.cod, description: i.desc, quantity: numero_(i.cant), price: numero_(i.valor), discount: 0 };\n      if (ivaId) l.taxes = [{ id: Number(ivaId) }];\n      return l;\n    })\n  };\n  const r = siigoFetch_('post', '/v1/quotations', cuerpo);\n  return { id: r.id, nombre: r.name || String(r.number), items: lineas };\n}\n\n/**\n * Observaciones de la factura como las escribe Adriana: \"ODS-5, SEDE PRINCIPAL Y BODEGA\", una línea en blanco y el\n * texto de la cuenta para transferir. Empiezan siempre con el número de la orden (así se reconoce la factura al reenviar).\n */\nfunction observacionesFactura_(o) {\n  const sedes = sedesDeOrden_(o).map(function (x) { return String(x.nombre || '').trim(); }).filter(String);\n  const primera = o.ID_ODS + (o.TIPO_ORDEN === 'GARANTIA' && o.NUMERO_CASO ? ', CASO ' + o.NUMERO_CASO : '') +\n    (sedes.length ? ', SEDE ' + sedes.join(' Y ') : '') + (sedes.length <= 1 && o.DIRECCION ? ' (' + o.DIRECCION + ')' : '');\n  return [primera.toUpperCase(), CFG.EMPRESA.textoPago].filter(String).join('\\n\\n');\n}\n\n/** Número de orden con que empiezan las observaciones de una factura (\"ODS-5, SEDE …\" o el formato anterior \"ODS-5 · …\"). */\nfunction ordenDeObservaciones_(txt) {\n  const m = /^\\s*([^\\s,·]+)/.exec(String(txt || ''));\n  return m ? m[1].toUpperCase() : '';\n}\n\n/** Factura de Siigo de este cliente creada en los últimos 30 días cuyas observaciones empiezan con el número de la orden. */\nfunction siigoFacturaDeOrden_(o, cliente) {\n  const desde = Utilities.formatDate(new Date(Date.now() - 30 * 864e5), TZ, 'yyyy-MM-dd');\n  for (let pagina = 1; pagina <= 5; pagina++) {\n    const r = siigoFetch_('get', '/v1/invoices?customer_identification=' + encodeURIComponent(cliente.identification) +\n      '&created_start=' + desde + '&page=' + pagina + '&page_size=100');\n    const lista = r.results || [];\n    // Una factura anulada en Siigo no cuenta: la orden se puede facturar de nuevo.\n    const f = lista.filter(function (x) {\n      return ordenDeObservaciones_(x.observations) === String(o.ID_ODS).toUpperCase() && x.annulled !== true && !/anulad/i.test(String(x.status || ''));\n    })[0];\n    if (f) return f;\n    if (lista.length < 100) return null;\n  }\n  return null;\n}\n\n/**\n * Menú: cambia el usuario y la llave de Siigo API. El editor de Apps Script deja las propiedades en solo lectura\n * cuando hay más de 50 (las sesiones ocupan muchas). Las nuevas se prueban contra Siigo antes de guardarlas:\n * si Siigo las rechaza, quedan las anteriores. La llave nunca se muestra.\n */\nfunction menuCredencialesSiigo() {\n  soloInterno_();\n  const ui = SpreadsheetApp.getUi();\n  const props = PropertiesService.getScriptProperties();\n  const r1 = ui.prompt('Credenciales de Siigo API (1 de 2)', 'Usuario API, como aparece en Siigo → Credenciales de Siigo API.\\nActual: ' + (props.getProperty('SIIGO_USUARIO') || '(vacío)'), ui.ButtonSet.OK_CANCEL);\n  if (r1.getSelectedButton() !== ui.Button.OK) return;\n  const usuario = String(r1.getResponseText()).trim();\n  if (!usuario) { ui.alert('No se cambió nada: el usuario está vacío.'); return; }\n  const r2 = ui.prompt('Credenciales de Siigo API (2 de 2)', 'Pegue la Access Key (botón \"Copiar Access Key\" en Siigo).', ui.ButtonSet.OK_CANCEL);\n  if (r2.getSelectedButton() !== ui.Button.OK) return;\n  const llave = String(r2.getResponseText()).trim();\n  if (!llave) { ui.alert('No se cambió nada: la llave está vacía.'); return; }\n  const res = UrlFetchApp.fetch(SIIGO_URL + '/auth', {\n    method: 'post', contentType: 'application/json',\n    headers: { 'Partner-Id': siigoProp_('SIIGO_PARTNER_ID', true) },\n    payload: JSON.stringify({ username: usuario, access_key: llave }), muteHttpExceptions: true\n  });\n  if (res.getResponseCode() !== 200) { ui.alert('Siigo rechazó ese usuario y llave (' + res.getResponseCode() + '). No se cambió nada; revíselos y vuelva a intentar.'); return; }\n  props.setProperty('SIIGO_USUARIO', usuario);\n  props.setProperty('SIIGO_ACCESS_KEY', llave);\n  CacheService.getScriptCache().remove('siigo_token');\n  ui.alert('Credenciales de Siigo guardadas: la app ya se conecta como ' + usuario + '.');\n}\n\n/** Menú: valida credenciales y muestra los ids que hay que poner en las propiedades. */\nfunction menuProbarSiigo() {\n  soloInterno_();\n  const ui = SpreadsheetApp.getUi();\n  try {\n    CacheService.getScriptCache().remove('siigo_token');\n    siigoToken_();\n    const docs = siigoFetch_('get', '/v1/document-types?type=FV');\n    const pagos = siigoFetch_('get', '/v1/payment-types?document_type=FV');\n    const imp = siigoFetch_('get', '/v1/taxes');\n    const usr = siigoFetch_('get', '/v1/users');\n    let grupos = '';\n    try {\n      // Grupos de inventario y cuántos productos actuales usan cada uno (para escoger los de servicios y materiales).\n      const g = siigoFetch_('get', '/v1/account-groups');\n      const uso = {};\n      (siigoFetch_('get', '/v1/products?page=1&page_size=100').results || []).forEach(function (p) {\n        const id = p.account_group && p.account_group.id; if (!id) return;\n        uso[id] = uso[id] || { n: 0, tipos: {} }; uso[id].n++; uso[id].tipos[p.type] = true;\n      });\n      grupos = (g.results || g || []).filter(function (x) { return x.active !== false; }).map(function (x) {\n        const u = uso[x.id];\n        return x.id + ' · ' + x.name + (u ? ' (' + u.n + ' productos: ' + Object.keys(u.tipos).join(', ') + ')' : '');\n      }).join('\\n');\n    } catch (e) { grupos = 'No se pudieron leer: ' + e.message; }\n    const lista = function (arr, f) { return (arr.results || arr || []).map(f).join('\\n'); };\n    const contar = function (ruta) {\n      try {\n        const r = siigoFetch_('get', ruta + '?page=1&page_size=1');\n        const n = r.pagination ? r.pagination.total_results : (r.results || r || []).length;\n        return 'disponible (' + n + ' documentos)';\n      } catch (e) { return 'NO disponible: ' + e.message; }\n    };\n    ui.alert('Conexión correcta.\\n\\n' +\n      'Cotizaciones (Traer de Siigo): ' + contar('/v1/quotations') + '\\n' +\n      'Órdenes de compra (Traer de Siigo): ' + contar(siigoProp_('SIIGO_RUTA_OC') || '/v1/purchase-orders') + '\\n\\n' +\n      'SIIGO_DOC_ID (comprobantes FV):\\n' + lista(docs, function (d) { return d.id + ' · ' + d.name; }) + '\\n\\n' +\n      'SIIGO_COTIZACION_DOC_ID (comprobantes de cotización; sin la propiedad se usa el primero):\\n' + (function () { try { return lista(siigoFetch_('get', '/v1/document-types?type=C'), function (d) { return d.id + ' · ' + d.name; }); } catch (e) { return 'No se pudieron leer: ' + e.message; } })() + '\\n\\n' +\n      'SIIGO_PAGO_ID:\\n' + lista(pagos, function (d) { return d.id + ' · ' + d.name; }) + '\\n\\n' +\n      'SIIGO_IVA_ID:\\n' + lista(imp, function (d) { return d.id + ' · ' + d.name + ' ' + (d.percentage || ''); }) + '\\n\\n' +\n      'SIIGO_VENDEDOR_ID:\\n' + lista(usr, function (d) { return d.id + ' · ' + d.first_name + ' ' + d.last_name; }) + '\\n\\n' +\n      'Grupos de inventario (productos que crea la app; en uso: material ' + grupoSiigo_('MATERIAL') + ', ' +\n        CFG.TIPOS_SERVICIO.map(function (t) { return t.toLowerCase() + ' ' + (grupoSiigo_('SERVICIO', t) || 'sin grupo'); }).join(', ') + '):\\n' + grupos);\n  } catch (e) {\n    ui.alert('Error con Siigo: ' + e.message);\n  }\n}\n\n// Tecnico.gs\n/**\n * Panel de técnicos: servicios del día, ejecución, evidencias, escáner de placa y cierre.\n * El técnico nunca ve valores en pesos.\n */\n\nfunction tecInit(token) {\n  const s = sesion_(token, 'TECNICO');\n  const hoy = hoy_();\n  const mias = leerODS_().filter(function (o) { return esDeLaOrden_(o, s.usuario); });\n  const abiertas = mias.filter(function (o) { return ['PROGRAMADA', 'EN_CURSO', 'EN_PAUSA'].indexOf(o.ESTADO) >= 0; });\n  const orden = function (a, b) { return String(a.fechaProgramada).localeCompare(String(b.fechaProgramada)); };\n  const tarjeta = function (o) {\n    const r = resumenODS_(o);\n    delete r.total; delete r.valorRecibido;\n    r.dia = fechaISO_(o.FECHA_PROGRAMADA);\n    r.falla = o.FALLA_CLIENTE;\n    r.act = versionODS_(o); // el celular solo vuelve a descargar el detalle de las órdenes que cambiaron\n    return r;\n  };\n  return {\n    sesion: s, fechaHoy: hoy,\n    // Hoy: lo programado para hoy, lo que quedó atrasado y lo que está en curso o devuelto.\n    hoy: abiertas.filter(function (o) { const d = fechaISO_(o.FECHA_PROGRAMADA); return o.ESTADO === 'EN_CURSO' || !d || d <= hoy; }).map(tarjeta).sort(orden),\n    proximos: abiertas.filter(function (o) { const d = fechaISO_(o.FECHA_PROGRAMADA); return o.ESTADO !== 'EN_CURSO' && d && d > hoy; }).map(tarjeta).sort(orden),\n    cerradasHoy: mias.filter(function (o) { return o.ESTADO === 'CERRADA_TECNICO' && fechaISO_(o.HORA_CIERRE) === hoy; }).map(tarjeta)\n  };\n}\n\nfunction odsDelTecnico_(s, id) {\n  const o = buscarODS_(id);\n  if (!esDeLaOrden_(o, s.usuario)) throw new Error('Esta orden no está asignada a usted.');\n  return o;\n}\n\n/** Equipos de la orden con sus datos actuales de la base (para escanear placa). */\nfunction equiposOrden_(o) {\n  const ids = o.EQUIPOS_IDS ? o.EQUIPOS_IDS.split(',').filter(String) : [];\n  const base = ids.length ? leerMaestra_('EQUIPOS').filter(function (e) { return ids.indexOf(e.id) >= 0; }) : [];\n  const placas = leerJSON_(o.PLACAS, {});\n  const sedes = sedesDeOrden_(o), nombreSede = {};\n  sedes.forEach(function (s) { nombreSede[s.id] = s.nombre; });\n  return ids.map(function (id) {\n    const e = base.filter(function (x) { return x.id === id; })[0] || { id: id };\n    const p = placas[id] || {};\n    return { id: id, texto: describirEquipo_(e), tipo: e.tipo || '', marca: e.marca || '', modelo: p.modelo || e.modelo || '', serial: p.serial || e.serial || '',\n      modeloCond: p.modeloCond || e.modeloCond || '', serialCond: p.serialCond || e.serialCond || '',\n      capacidad: e.capacidad || '', ubicacion: e.ubicacion || '', escaneado: !!(p.serial || p.modelo), escaneadoCond: !!(p.serialCond || p.modeloCond),\n      idSede: e.sede || '', sede: sedes.length > 1 ? (nombreSede[e.sede] || '') : '' };\n  });\n}\n\nfunction tecDetalle(token, id) {\n  const s = sesion_(token, 'TECNICO');\n  const o = odsDelTecnico_(s, id);\n  const d = detalleODS_(o);\n  ['total', 'archivo', 'cotizacion', 'cotizacionId', 'cotizacionFecha', 'cotizacionTotal', 'cotizacionItems', 'oc', 'valorRecibido', 'manoObra', 'materiales', 'transporte', 'formaPago', 'factura', 'siigoError', 'siigoId', 'adicionales', 'referenciaPago'].forEach(function (k) { delete d[k]; });\n  d.items = d.items.map(function (i) { return { desc: i.desc, cant: i.cant, cat: i.cat }; });\n  d.equiposDetalle = equiposOrden_(o);\n  d.version = versionODS_(o);\n  d.fotos = conAutor_(d.fotos);\n  d.historial = historialCliente_(o.ID_CLIENTE, o.ID_SEDE).filter(function (h) { return h.numero !== id; }).slice(0, 10)\n    .map(function (h) { return { numero: h.numero, fecha: h.fecha, descripcion: h.descripcion, tecnico: h.tecnico }; });\n  d.condiciones = CFG.CONDICIONES;\n  d.estadosArtefacto = CFG.ESTADO_ARTEFACTO;\n  d.fichaCampos = CFG.FICHA_CAMPOS; d.fichaTareas = CFG.FICHA_TAREAS;\n  const c = buscarCliente_(o.ID_CLIENTE) || {};\n  d.envioSugerido = { WHATSAPP: o.TELEFONO || c.telefono || '', CORREO: c.email || '' };\n  return d;\n}\n\nfunction tecIniciar(token, id) {\n  const s = sesion_(token, 'TECNICO');\n  return conLock_(function () {\n    const o = odsDelTecnico_(s, id);\n    if (o.ESTADO !== 'PROGRAMADA') return o.ESTADO;\n    if (o.PEND_DISPONIBILIDAD === 'SI') throw new Error('El servicio está pendiente por confirmar. La oficina debe confirmarlo antes de iniciar.');\n    actualizarODS_(o._fila, { ESTADO: 'EN_CURSO', HORA_INICIO: o.HORA_INICIO || ahora_(), INICIO_JORNADA: ahora_() });\n    log_(id, s.usuario, 'INICIAR', '');\n    return 'EN_CURSO';\n  });\n}\n\n/** El técnico pausa el servicio: queda registrado lo que hizo en esta jornada. */\nfunction tecPausar(token, id, d) {\n  const s = sesion_(token, 'TECNICO');\n  // Un reintento de un envío sin señal puede llegar cuando la orden ya quedó en pausa: no es error.\n  const ya = conLock_(function () { const o = odsDelTecnico_(s, id); if (o.ESTADO === 'EN_PAUSA') return true; pausar_(o, s, d || {}, true); return false; });\n  if (ya) return 'EN_PAUSA';\n  sincronizarYGuardarEvento_(id);\n  return 'EN_PAUSA';\n}\n\nfunction tecReanudar(token, id) {\n  const s = sesion_(token, 'TECNICO');\n  const ya = conLock_(function () { const o = odsDelTecnico_(s, id); if (o.ESTADO === 'EN_CURSO') return true; reanudar_(o, s); return false; });\n  if (ya) return 'EN_CURSO';\n  sincronizarYGuardarEvento_(id);\n  return 'EN_CURSO';\n}\n\n/**\n * FAMILY AIR ODS / Clientes / (cliente) / (año) / ODS-123. El año es el de creación de la orden.\n * Ahí quedan fotos, firma, placas, la OC y el archivo final de la orden.\n */\n/** Carpeta de la orden en Drive. Llamar dentro de conLock_ (guarda CARPETA_ID en la orden). */\nfunction carpetaODS_(o) {\n  if (o.CARPETA_ID) return DriveApp.getFolderById(o.CARPETA_ID);\n  const c = crearCarpetaDrive_(o);\n  actualizarODS_(o._fila, { CARPETA_ID: c.getId() });\n  o.CARPETA_ID = c.getId();\n  return c;\n}\n\n/**\n * Crea Clientes/<cliente>/<año>/<orden> sin tocar la hoja. La carpeta del año de cada cliente queda en caché\n * (6 horas): las siguientes órdenes del mismo cliente se crean con una sola llamada a Drive.\n */\nfunction crearCarpetaDrive_(o) {\n  const f = fechaISO_(o.FECHA_CREACION) || hoy_();\n  const nombreCliente = String(o.CLIENTE || o.ID_CLIENTE || 'Sin cliente').replace(/[\\/\\\\]+/g, '-').trim();\n  const cache = CacheService.getScriptCache(), clave = ('carp_' + f.slice(0, 4) + '_' + String(o.ID_CLIENTE || nombreCliente).replace(/[^\\w-]/g, '')).slice(0, 200);\n  let anio = null;\n  const id = cache.get(clave);\n  if (id) { try { anio = DriveApp.getFolderById(id); if (anio.isTrashed()) anio = null; } catch (e) { anio = null; } }\n  if (!anio) {\n    const raiz = carpetaRaiz_('CARPETA_ODS', CFG.CARPETA_ODS);\n    anio = subcarpeta_(subcarpeta_(subcarpeta_(raiz, 'Clientes'), nombreCliente), f.slice(0, 4));\n    cache.put(clave, anio.getId(), 21600);\n  }\n  return anio.createFolder(o.ID_ODS);\n}\n\n/** Cola de segundo plano: la carpeta de una orden nueva se crea antes de que el técnico tome la primera foto. */\nfunction crearCarpetaOrden_(id) {\n  const o = buscarODS_(id);\n  if (o.CARPETA_ID || o.ESTADO === 'ANULADA') return;\n  const c = crearCarpetaDrive_(o);\n  conLock_(function () {\n    const x = buscarODS_(id);\n    // Si mientras tanto otra llamada la creó (primera foto), esta sobra.\n    if (x.CARPETA_ID) { try { c.setTrashed(true); } catch (e) { /* ya no existe */ } return; }\n    actualizarODS_(x._fila, { CARPETA_ID: c.getId() });\n  });\n}\n\nfunction subcarpeta_(padre, nombre) {\n  const it = padre.getFoldersByName(nombre);\n  return it.hasNext() ? it.next() : padre.createFolder(nombre);\n}\n\nfunction guardarImagen_(carpeta, dataUrl, nombre) {\n  return carpeta.createFile(blobImagen_(dataUrl, nombre)).getId();\n}\n\n/**\n * Tipo real del archivo según sus primeros bytes (JPEG, PNG o PDF), sin creerle al tipo que dice el celular:\n * así no se guarda un HTML o SVG disfrazado de foto. Los bytes de Apps Script vienen con signo (-128 a 127).\n */\nfunction tipoReal_(bytes) {\n  const b = function (i) { return bytes[i] & 0xFF; };\n  if (b(0) === 0xFF && b(1) === 0xD8 && b(2) === 0xFF) return 'image/jpeg';\n  if (b(0) === 0x89 && b(1) === 0x50 && b(2) === 0x4E && b(3) === 0x47) return 'image/png';\n  if (b(0) === 0x25 && b(1) === 0x50 && b(2) === 0x44 && b(3) === 0x46) return 'application/pdf';\n  return '';\n}\n\n/**\n * Guarda una foto en la carpeta de la orden sin duplicar reintentos (claveCliente). Llamar dentro de conLock_.\n * Cada línea de FOTOS: tipo|id|clave|jornada|usuario que la subió.\n */\nfunction agregarFoto_(o, tipo, dataUrl, claveCliente, quien) {\n  const previas = o.FOTOS ? o.FOTOS.split('\\n').filter(String) : [];\n  const repetida = claveCliente && previas.filter(function (l) { return l.split('|')[2] === claveCliente; })[0];\n  if (repetida) return repetida.split('|')[1];\n  const ext = /^data:image\\/png/.test(dataUrl) ? '.png' : '.jpg';\n  const fid = guardarImagen_(carpetaODS_(o), dataUrl, o.ID_ODS + '_' + tipo + '_' + (previas.length + 1) + ext);\n  return anotarArchivo_(o, tipo, fid, claveCliente, quien);\n}\n\n/** Agrega una línea a FOTOS con el archivo ya guardado en Drive (foto o video). Llamar dentro de conLock_. */\nfunction anotarArchivo_(o, tipo, fid, claveCliente, quien) {\n  const previas = o.FOTOS ? o.FOTOS.split('\\n').filter(String) : [];\n  const repetida = claveCliente && previas.filter(function (l) { return l.split('|')[2] === claveCliente; })[0];\n  if (repetida) return repetida.split('|')[1];\n  previas.push(tipo + '|' + fid + '|' + (claveCliente || '') + '|' + (leerJSON_(o.JORNADAS, []).length + 1) + '|' + (quien || ''));\n  actualizarODS_(o._fila, { FOTOS: previas.join('\\n') });\n  o.FOTOS = previas.join('\\n');\n  return fid;\n}\n\nconst VIDEO_ = 'VID_'; // subida de video en curso, una propiedad por video: {url, ods, usuario, total, mime, fecha}\nconst TIPOS_VIDEO_ = { 'video/mp4': '.mp4', 'video/quicktime': '.mov', 'video/webm': '.webm', 'video/3gpp': '.3gp' };\n\n/** Video real según sus primeros bytes: MP4, MOV y 3GP llevan \"ftyp\" en el byte 4; WebM empieza con 1A 45 DF A3. */\nfunction esVideo_(bytes) {\n  const b = function (i) { return bytes[i] & 0xFF; };\n  if (b(4) === 0x66 && b(5) === 0x74 && b(6) === 0x79 && b(7) === 0x70) return true;\n  return b(0) === 0x1A && b(1) === 0x45 && b(2) === 0xDF && b(3) === 0xA3;\n}\n\nfunction cabecera_(r, nombre) {\n  const h = r.getAllHeaders ? r.getAllHeaders() : r.getHeaders();\n  const k = Object.keys(h).filter(function (x) { return x.toLowerCase() === nombre.toLowerCase(); })[0];\n  return k ? String(h[k]) : '';\n}\n\n/**\n * Video de evidencia (opcional). El celular lo manda en partes de CFG.PARTE_VIDEO_BYTES por la subida reanudable de\n * Drive: un video de un par de minutos no depende de un solo envío grande y, si se cae la señal, sigue desde la última\n * parte que Drive recibió. Responde {siguiente: byte que sigue}, {reiniciar: true} (la subida venció: empezar de 0)\n * o {id
