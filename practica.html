'capacidad', 'Capacidad del equipo'], ['refrigerante', 'Refrigerante'],\n    ['voltaje', 'Voltaje'], ['escalera', 'Requiere escalera']\n  ],\n  EMPRESA: {\n    nombre: 'FAMILY AIR', titular: 'GARCÍA PATIÑO ADRIANA LUCÍA', nit: '43.669.150-5',\n    actividad: 'Venta, instalación, mantenimiento y reparación de sistemas de refrigeración, ventilación mecánica y redes eléctricas',\n    direccion: 'Cra 53 # 62-39', telefono: 'Línea única 313 756 7485', correo: 'familyairmercadeo@gmail.com', ciudad: 'Medellín - Antioquia',\n    // Va en las observaciones de cada factura de Siigo, como la pone Adriana (decisión de Samuel, 21/10/2026).\n    privacidad: 'https://samuelvoffstar-cloud.github.io/familyair-ods/privacidad.html',\n    textoPago: 'FAVOR TRANSFERIR O CONSIGNAR EN LA CUENTA DE AHORROS BANCOLOMBIA N° 10139811490, a nombre de Adriana Lucía García Patiño.'\n  },\n  USUARIOS_COLS: ['USUARIO', 'NOMBRE', 'ROL', 'PIN_HASH', 'ACTIVO', 'TELEFONO', 'CORREO'],\n  LOG_COLS: ['FECHA', 'ID_ODS', 'USUARIO', 'ACCION', 'DETALLE'],\n  TARIFAS_COLS: ['CODIGO', 'DESCRIPCION', 'TIPO_SERVICIO', 'CATEGORIA', 'VALOR_PLENA', 'VALOR_EMPRESARIAL'],\n  INFORMES_COLS: ['ID_INFORME', 'FECHA', 'ID_CLIENTE', 'CLIENTE', 'ODS_IDS', 'TITULO', 'DIRIGIDO_A', 'DATOS', 'DOC_ID', 'PDF_ID', 'CREADO_POR', 'ACTUALIZADO'],\n  MERCADEO_COLS: ['MES', 'TIPO', 'ID_CLIENTE', 'CLIENTE', 'NIT', 'TELEFONO', 'ID_SEDE', 'SEDE', 'ULTIMO_SERVICIO', 'MESES_SIN_SERVICIO', 'PROXIMO_SERVICIO', 'DETALLE', 'GENERADO_POR', 'FECHA'],\n\n  // Condiciones generales de la orden de servicio (las mismas del formato en papel).\n  CONDICIONES: [\n    'PRIMERA: FAMILY AIR recibe el artefacto en el estado en que se declara, por lo que no responderá por otros desperfectos y solo se devolverá contra presentación de este documento.',\n    'SEGUNDA: Los costos de reparación y repuestos se cubrirán de contado al momento de recepción del artefacto y si pasada la fecha de reparación no ha sido retirado, se causará un bodegaje cuyo valor será de quinientos ($500) pesos día.',\n    'TERCERA: La reparación tendrá una garantía de dos (2) meses, que no amparará los efectos resultantes del mal uso o fallas eléctricas y cubrirá únicamente los daños reparados y los repuestos cambiados en la reparación.',\n    'CUARTA: FAMILY AIR no responde por daños del artefacto por fuerza mayor o caso fortuito y se califican como tales las fallas eléctricas, hurto con violencia, asonada y motín.',\n    'QUINTA: Si vencidos sesenta (60) días calendario de la fecha de reparado del artefacto el cliente no lo ha retirado, FAMILY AIR se faculta el derecho de disponer del mismo sin indemnización, pero si decide devolverlo se causará un bodegaje de acuerdo a lo establecido en la segunda condición general.',\n    'SEXTA: Para que un artefacto sea recogido y/o recibido por algún representante del Departamento de Servicio de FAMILY AIR, el cliente debe abonar como mínimo un treinta por ciento (30%) del valor aproximado del total de la reparación.',\n    'SÉPTIMA: Para cualquier información rogamos citar el número de este comprobante.',\n    // Autorización de datos personales (Ley 1581 de 2012): la firma de quien recibe la incluye.\n    'OCTAVA: Datos personales. Quien firma autoriza a FAMILY AIR (NIT 43.669.150-5) a tratar su nombre, cédula, teléfono, correo, firma y las fotos del servicio para prestar, documentar, facturar y garantizar el servicio, y para recordarle los mantenimientos de sus equipos. Puede conocer, actualizar, rectificar o suprimir sus datos y revocar esta autorización en familyairmercadeo@gmail.com o en la línea 313 756 7485. Política: https://samuelvoffstar-cloud.github.io/familyair-ods/privacidad.html'\n  ],\n\n  CALENDARIO_NOMBRE: 'Family Air · Servicios',\n  // Evidencias por cliente: FAMILY AIR ODS / Clientes / (cliente) / (año) / (orden). Decisión de Samuel, 20/10/2026.\n  CARPETA_ODS: 'FAMILY AIR ODS',\n  CARPETA_INFORMES: 'Family Air · Informes técnicos',\n  SESION_SEG: 21600,       // 6 horas (máximo de CacheService)\n  SESION_TECNICO_DIAS: 7,  // el técnico puede pasar días sin señal: su sesión se guarda también en Propiedades\n  // Límite por usuario cada 6 horas: fotos y placas subidas, documentos de OC y correos de soporte.\n  CUPOS: { FOTO: 300, VIDEO: 30, OC: 30, CORREO: 30 },\n  MAX_INTENTOS: 5,         // cada 5 PIN errados el usuario se bloquea: 15 min, luego 1 hora, luego 6 horas\n  MAX_INTENTOS_GLOBAL: 30, // PIN errados en toda la app en 10 minutos que disparan el aviso por correo\n  SESION_MAX_HORAS: 12,    // oficina: hay que volver a ingresar cada 12 horas aunque se esté usando\n  SESION_TECNICO_MAX_DIAS: 30, // técnico: máximo 30 días con la misma sesión\n  MAX_FOTO_BYTES: 4 * 1024 * 1024,\n  // Grupo de inventario de Siigo de los productos que crea la app, como Family Air ya clasifica los suyos (menú Probar\n  // conexión con Siigo, 23/10/2026). Material = venta de producto; mano de obra y transporte según el tipo de servicio.\n  // Una propiedad SIIGO_GRUPO_<CLAVE> los reemplaza sin cambiar el código.\n  SIIGO_GRUPOS: { MATERIAL: 399, INSTALACION: 400, REPARACION: 1421, MANTENIMIENTO: 1422, VISITA_TECNICA: 21520 },\n  MAX_VIDEO_BYTES: 150 * 1024 * 1024, // unos 2 minutos grabados con el celular\n  PARTE_VIDEO_BYTES: 4 * 1024 * 1024, // múltiplo de 256 KB, como lo pide la subida reanudable de Drive\n  MAX_ADJUNTO_BYTES: 8 * 1024 * 1024\n};\n\nconst TZ = Session.getScriptTimeZone() || 'America/Bogota';\n\n/* ===================== Web app y menú ===================== */\n\nfunction doGet() {\n  // Sin ALLOWALL: otras páginas no pueden mostrar la app dentro de la suya. GitHub Pages usa doPost, no la incrusta.\n  return HtmlService.createTemplateFromFile('Index').evaluate()\n    .setTitle('Family Air · Órdenes de servicio')\n    .setFaviconUrl('https://samuelvoffstar-cloud.github.io/familyair-ods/icono-192.png')\n    // Sin maximum-scale: se puede ampliar con los dedos (accesibilidad); los campos van a 16 px para que iOS no haga zoom solo.\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1');\n}\n\n/**\n * API de la app publicada en GitHub Pages (https://samuelvoffstar-cloud.github.io/familyair-ods/).\n * Recibe {fn, args} como texto plano (así el navegador no hace consulta previa de CORS) y responde JSON {ok, r} o {ok:false, e}.\n * Solo atiende las funciones que la interfaz ya llamaba con google.script.run; cada una valida su sesión y permisos.\n */\nfunction doPost(e) {\n  MEMO_ = {};\n  let out;\n  try {\n    const p = JSON.parse((e && e.postData && e.postData.contents) || '{}');\n    const fn = String(p.fn || '');\n    if (!/^(admin|tec|informes?|mercadeo)[A-Z]\\w*$/.test(fn) && ['login', 'logout', 'validarSesion'].indexOf(fn) < 0) throw new Error('Función no permitida.');\n    const f = globalThis[fn];\n    if (typeof f !== 'function') throw new Error('Función no encontrada: ' + fn);\n    const r = f.apply(null, Array.isArray(p.args) ? p.args : []);\n    out = { ok: true, r: r === undefined ? null : r };\n    finLlamada_();\n  } catch (err) {\n    out = { ok: false, e: String((err && err.message) || err) };\n  }\n  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction include(nombre) {\n  return HtmlService.createHtmlOutputFromFile(nombre).getContent();\n}\n\nfunction logoDataUri() {\n  return 'data:image/png;base64,' + LOGO_PNG_B64;\n}\n\nfunction onOpen() {\n  SpreadsheetApp.getUi().createMenu('Family Air')\n    .addItem('1. Instalar / verificar', 'instalar')\n    .addItem('2. Crear o cambiar usuario', 'menuCrearUsuario')\n    .addItem('Ver encabezados de la base', 'diagnosticoEncabezados')\n    .addItem('Probar conexión con Siigo', 'menuProbarSiigo')\n    .addItem('Cambiar credenciales de Siigo', 'menuCredencialesSiigo')\n    .addItem('Revisar factura en Siigo', 'menuRevisarFacturaSiigo')\n    .addToUi();\n}\n\n/**\n * Las funciones del menú y de los disparadores son globales, así que quien abra la URL de la app podría llamarlas\n * con google.script.run. Solo corren desde la hoja (el dueño o un editor) o desde su propio disparador.\n */\nfunction soloInterno_(e) {\n  if (e && e.triggerUid && ScriptApp.getProjectTriggers().some(function (t) { return t.getUniqueId() === String(e.triggerUid); })) return;\n  const correo = String(Session.getActiveUser().getEmail() || '').toLowerCase();\n  const permitidos = [Session.getEffectiveUser().getEmail()]\n    .concat(SpreadsheetApp.getActive().getEditors().map(function (u) { return u.getEmail(); }))\n    .map(function (c) { return String(c).toLowerCase(); });\n  if (!correo || permitidos.indexOf(correo) < 0) throw new Error('No autorizado.');\n}\n\n/** Crea o completa las hojas de operación, el calendario, las carpetas y la sal de los PIN. Se puede correr varias veces. */\nfunction instalar() {\n  soloInterno_();\n  const ss = SpreadsheetApp.getActive();\n  prepararHoja_(ss, CFG.HOJAS.ODS, CFG.ODS_COLS);\n  prepararHoja_(ss, CFG.HOJAS.USUARIOS, CFG.USUARIOS_COLS);\n  prepararHoja_(ss, CFG.HOJAS.LOG, CFG.LOG_COLS);\n  prepararHoja_(ss, CFG.HOJAS.TARIFAS, CFG.TARIFAS_COLS);\n  prepararHoja_(ss, CFG.HOJAS.INFORMES, CFG.INFORMES_COLS);\n  prepararHoja_(ss, CFG.HOJAS.MERCADEO, CFG.MERCADEO_COLS);\n\n  const p = PropertiesService.getScriptProperties();\n  if (!p.getProperty('SALT')) p.setProperty('SALT', Utilities.getUuid());\n  if (!p.getProperty('CONSECUTIVO_ODS')) p.setProperty('CONSECUTIVO_ODS', '0');\n  if (!p.getProperty('CONSECUTIVO_GA')) p.setProperty('CONSECUTIVO_GA', '0');\n  if (!p.getProperty('CONSECUTIVO_SC')) p.setProperty('CONSECUTIVO_SC', '0');\n  if (!p.getProperty('CONSECUTIVO_PC')) p.setProperty('CONSECUTIVO_PC', '0');\n  if (!p.getProperty('CARPETA_INFORMES')) p.setProperty('CARPETA_INFORMES', DriveApp.createFolder(CFG.CARPETA_INFORMES).getId());\n  carpetaRaiz_('CARPETA_ODS', CFG.CARPETA_ODS);\n  // Estado de sedes y equipos: \"Eliminada\" o \"Eliminado\" los saca de las listas sin borrar la fila.\n  asegurarColumna_('SEDES', 'ESTADO_SEDE');\n  asegurarColumna_('EQUIPOS', 'ESTADO_EQUIPO');\n  if (!p.getProperty('CALENDARIO_ID')) {\n    const cal = CalendarApp.createCalendar(CFG.CALENDARIO_NOMBRE, { timeZone: 'America/Bogota', color: CalendarApp.Color.BLUE });\n    p.setProperty('CALENDARIO_ID', cal.getId());\n  }\n\n  // Columnas nuevas de CLIENTES: permisos e indicaciones internas que quedan por defecto para el cliente.\n  const shCli = ss.getSheetByName(CFG.HOJAS.CLIENTES);\n  if (shCli && shCli.getLastColumn() > 0) {\n    const enc = shCli.getRange(1, 1, 1, shCli.getLastColumn()).getValues()[0].map(normalizar_);\n    const faltan = CFG.CLIENTES_EXTRA.filter(function (c) { return enc.indexOf(c) < 0; });\n    if (faltan.length) shCli.getRange(1, shCli.getLastColumn() + 1, 1, faltan.length).setValues([faltan]).setFontWeight('bold');\n    olvidarHoja_(CFG.HOJAS.CLIENTES);\n  }\n  // Disparador diario: programa a los clientes fijos que les toca servicio.\n  if (!ScriptApp.getProjectTriggers().some(function (t) { return t.getHandlerFunction() === 'programarFijosDiario'; })) {\n    ScriptApp.newTrigger('programarFijosDiario').timeBased().everyDays(1).atHour(6).create();\n  }\n  asegurarDisparadorSegundoPlano_();\n  // Disparador cada 15 minutos: guarda en Drive la última versión de cada orden liquidada, con su anexo interno.\n  if (!ScriptApp.getProjectTriggers().some(function (t) { return t.getHandlerFunction() === 'archivarPendientes'; })) {\n    ScriptApp.newTrigger('archivarPendientes').timeBased().everyMinutes(15).create();\n  }\n\n  const problemas = [];\n  ['CLIENTES', 'SEDES', 'EQUIPOS', 'SERVICIOS'].forEach(function (k) {\n    try { mapaColumnas_(k); } catch (e) { problemas.push(e.message); }\n  });\n  // Órdenes automáticas creadas con la frecuencia de la base anterior: se quitan (solo programa desde servicios hechos en la app).\n  let limpieza = { quitadas: 0 };\n  try { limpieza = quitarAutomaticasDeBase_('instalar'); } catch (e) { problemas.push('No se pudieron quitar las órdenes automáticas: ' + e.message); }\n  const msg = (problemas.length\n    ? 'Hojas de operación, calendario y carpetas listos, pero hay que ajustar CFG.COLS:\\n\\n' + problemas.join('\\n')\n    : 'Instalación correcta. Base maestra reconocida, calendario \"' + CFG.CALENDARIO_NOMBRE + '\" y carpetas creados.\\nSiguiente paso: crear usuarios (menú Family Air > 2).') +\n    (limpieza.quitadas ? '\\n\\nSe quitaron ' + limpieza.quitadas + ' órdenes automáticas creadas con la base anterior (copia en la hoja ' + limpieza.respaldo + ').' : '');\n  SpreadsheetApp.getUi().alert(msg);\n}\n\n/** Solo el dueño de la hoja puede editar la pestaña (los respaldos que crea el sistema). */\nfunction protegerHoja_(sh) {\n  try {\n    const pr = sh.protect().setDescription('Respaldo del sistema: no editar');\n    pr.removeEditors(pr.getEditors());\n    if (pr.canDomainEdit()) pr.setDomainEdit(false);\n  } catch (e) { /* sin permiso para proteger: queda como está */ }\n  return sh;\n}\n\n/**\n * Copia semanal del archivo completo en FAMILY AIR ODS / Respaldos, compartida con los editores de la hoja.\n * Conserva las últimas CFG.RESPALDOS. La corre el disparador diario; solo copia si pasó una semana.\n */\nfunction respaldoSemanal_() {\n  const p = PropertiesService.getScriptProperties();\n  if (Date.now() - Number(p.getProperty('RESPALDO_ULTIMO') || 0) < 7 * 864e5 - 3600e3) return null;\n  const ss = SpreadsheetApp.getActive();\n  const raiz = carpetaRaiz_('CARPETA_ODS', CFG.CARPETA_ODS);\n  const it = raiz.getFoldersByName('Respaldos');\n  const carpeta = it.hasNext() ? it.next() : raiz.createFolder('Respaldos');\n  ss.getEditors().forEach(function (u) { try { carpeta.addEditor(u.getEmail()); } catch (e) { /* ya tiene acceso */ } });\n  const copia = DriveApp.getFileById(ss.getId()).makeCopy('Respaldo Base ODS ' + Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd'), carpeta);\n  const copias = [];\n  const fs = carpeta.getFiles();\n  while (fs.hasNext()) { const f = fs.next(); if (/^Respaldo Base ODS /.test(f.getName())) copias.push(f); }\n  copias.sort(function (a, b) { return b.getDateCreated() - a.getDateCreated(); })\n    .slice(CFG.RESPALDOS).forEach(function (f) { f.setTrashed(true); });\n  p.setProperty('RESPALDO_ULTIMO', String(Date.now()));\n  log_('', 'sistema', 'RESPALDO', copia.getName());\n  return copia.getId();\n}\n\n/**\n * Deja la hoja con los encabezados indicados. Si no tiene datos, reescribe el encabezado completo en ese orden;\n * si ya tiene datos, solo agrega al final las columnas que falten.\n */\nfunction prepararHoja_(ss, nombre, cols) {\n  olvidarHoja_(nombre);\n  let sh = ss.getSheetByName(nombre);\n  if (!sh) sh = ss.insertSheet(nombre);\n  if (sh.getLastRow() <= 1) {\n    if (sh.getLastColumn() > 0) sh.getRange(1, 1, 1, sh.getLastColumn()).clearContent();\n    sh.getRange(1, 1, 1, cols.length).setValues([cols]).setFontWeight('bold');\n    sh.setFrozenRows(1);\n    return sh;\n  }\n  const actuales = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0].map(String);\n  const faltan = cols.filter(function (c) { return actuales.indexOf(c) < 0; });\n  if (faltan.length) sh.getRange(1, sh.getLastColumn() + 1, 1, faltan.length).setValues([faltan]).setFontWeight('bold');\n  return sh;\n}\n\nfunction diagnosticoEncabezados() {\n  soloInterno_();\n  const ss = SpreadsheetApp.getActive();\n  const lineas = ss.getSheets().map(function (sh) {\n    const n = sh.getLastColumn();\n    const h = n ? sh.getRange(1, 1, 1, n).getValues()[0].map(String) : [];\n    return sh.getName() + ' (' + Math.max(sh.getLastRow() - 1, 0) + ' filas): ' + h.join(' | ');\n  });\n  SpreadsheetApp.getUi().alert(lineas.join('\\n\\n'));\n}\n\nfunction menuCrearUsuario() {\n  soloInterno_();\n  const ui = SpreadsheetApp.getUi();\n  const pedir = function (t) {\n    const r = ui.prompt('Usuario', t, ui.ButtonSet.OK_CANCEL);\n    if (r.getSelectedButton() !== ui.Button.OK) throw new Error('Cancelado');\n    return r.getResponseText().trim();\n  };\n  try {\n    const usuario = pedir('Usuario de ingreso (ej: jperez). Si ya existe, se actualiza.').toLowerCase();\n    const nombre = pedir('Nombre completo');\n    const rol = rolesDe_(pedir('Rol: ' + CFG.ROLES.join(', ') + '. Si tiene dos, sepárelos con coma (ej: LIQUIDACION,TECNICO).')).join(',');\n    const pin = pedir('PIN de 6 a 8 dígitos (no sirven 123456, 111111 ni 121212). Cambiar el PIN cierra las sesiones abiertas de ese usuario y lo desbloquea.');\n    pinSeguro_(pin);\n    const tel = pedir('Celular (opcional, Enter para omitir)');\n    guardarUsuario_(usuario, nombre, rol, pin, tel);\n    ui.alert('Usuario ' + usuario + ' guardado como ' + rol + '.');\n  } catch (e) {\n    if (e.message !== 'Cancelado') ui.alert('Error: ' + e.message);\n  }\n}\n\n/** PIN de 6 a 8 dígitos, sin secuencias (123456, 987654) ni repeticiones (111111, 121212, 112211). */\nfunction pinSeguro_(pin) {\n  pin = String(pin || '');\n  if (!/^\\d{6,8}$/.test(pin)) throw new Error('El PIN debe tener de 6 a 8 dígitos.');\n  const d = pin.split('').map(Number);\n  const paso = d[1] - d[0];\n  const secuencia = Math.abs(paso) === 1 && d.every(function (x, i) { return i === 0 || x - d[i - 1] === paso; });\n  const distintos = d.filter(function (x, i) { return d.indexOf(x) === i; }).length;\n  if (secuencia || distintos <= 2) throw new Error('Ese PIN es muy fácil de adivinar. Usa uno sin secuencias ni números repetidos.');\n}\n\nfunction guardarUsuario_(usuario, nombre, rol, pin, tel) {\n  if (!/^[a-z0-9._-]{3,30}$/.test(usuario)) throw new Error('Usuario: solo minúsculas, números, punto o guion (3 a 30)');\n  rol = rolesDe_(rol).join(',');\n  pinSeguro_(pin);\n  const sh = hoja_(CFG.HOJAS.USUARIOS);\n  const idx = indiceEncabezados_(sh);\n  const datos = sh.getDataRange().getValues();\n  const fila = new Array(sh.getLastColumn()).fill('');\n  fila[idx.USUARIO] = usuario;\n  fila[idx.NOMBRE] = nombre;\n  fila[idx.ROL] = rol;\n  fila[idx.PIN_HASH] = hashPin_(usuario, pin);\n  fila[idx.ACTIVO] = 'SI';\n  fila[idx.TELEFONO] = tel || '';\n  const celdas = fila.map(celda_);\n  for (let r = 1; r < datos.length; r++) {\n    if (String(datos[r][idx.USUARIO]).toLowerCase() === usuario) {\n      // Lo que el menú no pide (por ejemplo CORREO) se conserva.\n      if (idx.CORREO !== undefined) celdas[idx.CORREO] = celda_(datos[r][idx.CORREO]);\n      sh.getRange(r + 1, 1, 1, celdas.length).setValues([celdas]);\n      olvidarHoja_(CFG.HOJAS.USUARIOS);\n      return usuarioGuardado_(usuario, rol, 'actualizado');\n    }\n  }\n  sh.appendRow(celdas);\n  olvidarHoja_(CFG.HOJAS.USUARIOS);\n  usuarioGuardado_(usuario, rol, 'creado');\n}\n\n/** Tras crear o cambiar un usuario: cierra sus sesiones abiertas, lo desbloquea y lo deja en el registro (nunca el PIN). */\nfunction usuarioGuardado_(usuario, rol, que) {\n  const p = PropertiesService.getScriptProperties();\n  p.setProperty('gen_' + usuario, String(Number(p.getProperty('gen_' + usuario) || 0) + 1));\n  const cache = CacheService.getScriptCache();\n  ['usr_', 'int_', 'blq_'].forEach(function (k) { cache.remove(k + usuario); });\n  registrarAcceso_(usuario, 'USUARIO', 'Usuario ' + que + ' con rol ' + rol + ' (PIN nuevo, sesiones anteriores cerradas)');\n}\n\n/* ===================== Sesión y permisos ===================== */\n\n/** Huella del PIN. \"v2:\" marca los PIN creados con las reglas de 6 a 8 dígitos; los anteriores hay que cambiarlos. */\nfunction hashPin_(usuario, pin, anterior) {\n  const salt = PropertiesService.getScriptProperties().getProperty('SALT');\n  if (!salt) throw new Error('Falta correr Instalar');\n  const texto = salt + '|' + usuario + '|' + pin + (anterior ? '' : '|v2');\n  const h = Utilities.base64Encode(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, texto, Utilities.Charset.UTF_8));\n  return anterior ? h : 'v2:' + h;\n}\n\n/** Inicios de sesión, fallos, bloqueos y cambios de usuarios en ODS_LOG. No cambia VERSION_DATOS: no recarga los paneles. */\nfunction registrarAcceso_(usuario, accion, detalle) {\n  try { hoja_(CFG.HOJAS.LOG).appendRow([ahora_(), '', usuario, accion, detalle || ''].map(celda_)); olvidarHoja_(CFG.HOJAS.LOG); } catch (e) {}\n}\n\nfunction avisarIntentosGlobales_(n) {\n  try {\n    MailApp.sendEmail({\n      to: Session.getEffectiveUser().getEmail(),\n      subject: 'Family Air ODS · muchos PIN errados',\n      body: 'En los últimos 10 minutos hubo ' + n + ' intentos de ingreso con PIN errado en la app, contra uno o varios usuarios.\\n\\n' +\n        'Si no fue el equipo, alguien está intentando entrar. Revise la hoja ODS_LOG (LOGIN_FALLIDO) y, si hace falta, cambie los PIN desde el menú Family Air > Crear o cambiar usuario.'\n    });\n  } catch (e) {}\n}\n\nfunction avisarBloqueo_(usuario, intentos, minutos) {\n  try {\n    MailApp.sendEmail({\n      to: Session.getEffectiveUser().getEmail(),\n      subject: 'Family Air ODS · usuario ' + usuario + ' bloqueado',\n      body: 'El usuario \"' + usuario + '\" lleva ' + intentos + ' PIN errados y quedó bloqueado ' + minutos + ' minutos.\\n\\n' +\n        'Si no fue esa persona, alguien está intentando entrar. Para desbloquearlo antes, cámbiale el PIN desde la hoja: menú Family Air > Crear o cambiar usuario.\\n' +\n        'El detalle queda en la hoja ODS_LOG (LOGIN_FALLIDO y BLOQUEO).'\n    });\n  } catch (e) {}\n}\n\nfunction login(usuario, pin) {\n  usuario = String(usuario || '').trim().toLowerCase();\n  pin = String(pin || '').trim();\n  // Usuario con el formato de guardarUsuario_: sin esto, cualquiera escribe filas de cualquier tamaño en ODS_LOG.\n  if (!/^[a-z0-9._-]{3,30}$/.test(usuario)) throw new Error('Usuario o PIN incorrecto.');\n  const cache = CacheService.getScriptCache();\n  const lock = LockService.getScriptLock();\n  let u;\n  // El contador va con bloqueo: varias solicitudes al tiempo no pueden saltarse el límite.\n  lock.waitLock(20000);\n  try {\n    const hasta = Number(cache.get('blq_' + usuario) || 0);\n    if (hasta > Date.now()) throw new Error('Usuario bloqueado por intentos fallidos. Intenta en ' + Math.ceil((hasta - Date.now()) / 60000) + ' minutos o pide al administrador que te cambie el PIN.');\n\n    u = usuarios_().filter(function (x) { return x.USUARIO === usuario; })[0];\n    const guardado = u ? String(u.PIN_HASH) : '';\n    if (u && u.ACTIVO === 'SI' && guardado.indexOf('v2:') !== 0 && guardado === hashPin_(usuario, pin, true)) {\n      throw new Error('Tu PIN es del sistema anterior y hay que cambiarlo por uno de 6 dígitos. Pídele al administrador que te lo cambie.');\n    }\n    if (!u || u.ACTIVO !== 'SI' || guardado !== hashPin_(usuario, pin)) {\n      const n = Number(cache.get('int_' + usuario) || 0) + 1;\n      cache.put('int_' + usuario, String(n), CFG.SESION_SEG);\n      // Usuario que no existe: mismo mensaje y bloqueo (desde afuera no se distingue), pero sin fila por intento\n      // ni correo, para que nadie llene la hoja ni agote el cupo de correos con usuarios inventados.\n      if (u) registrarAcceso_(usuario, 'LOGIN_FALLIDO', 'Intento ' + n);\n      // Contador de toda la app (Apps Script no ve la IP): muchos PIN errados en 10 minutos dejan un registro y un\n      // solo correo por ventana. No bloquea a todos, para que un tercero no pueda dejar a la empresa sin entrar.\n      const global = Number(cache.get('int_global') || 0) + 1;\n      cache.put('int_global', String(global), 600);\n      if (global === CFG.MAX_INTENTOS_GLOBAL) { registrarAcceso_('', 'LOGIN_MASIVO', global + ' PIN errados en 10 minutos'); avisarIntentosGlobales_(global); }\n      if (n % CFG.MAX_INTENTOS === 0) {\n        const min = n >= 3 * CFG.MAX_INTENTOS ? 360 : n >= 2 * CFG.MAX_INTENTOS ? 60 : 15;\n        cache.put('blq_' + usuario, String(Date.now() + min * 60000), min * 60);\n        if (u) { registrarAcceso_(usuario, 'BLOQUEO', min + ' minutos tras ' + n + ' intentos'); avisarBloqueo_(usuario, n, min); }\n      }\n      throw new Error('Usuario o PIN incorrecto.');\n    }\n    cache.remove('int_' + usuario);\n  } finally {\n    lock.releaseLock();\n  }\n  const token = Utilities.getUuid();\n  const roles = rolesDe_(u.ROL);\n  const s = { usuario: u.USUARIO, nombre: u.NOMBRE, rol: roles[0], roles: roles, ini: Date.now(), gen: genUsuario_(u.USUARIO) };\n  cache.put('tok_' + token, JSON.stringify(s), CFG.SESION_SEG);\n  if (tieneRol_(s, 'TECNICO')) guardarSesionLarga_(token, s);\n  registrarAcceso_(usuario, 'LOGIN', roles.join(','));\n  return { token: token, usuario: s.usuario, nombre: s.nombre, rol: s.rol, roles: roles, permisos: permisosDe_(roles) };\n}\n\n/**\n * Sesión larga del técnico (7 días desde el último uso): si se queda sin señal más de 6 horas, al volver\n * no tiene que ingresar de nuevo para que se envíe lo que hizo. Se guarda en Propiedades del script.\n */\nfunction guardarSesionLarga_(token, s) {\n  const p = PropertiesService.getScriptProperties();\n  p.setProperty('ses_' + token, JSON.stringify({ s: s, exp: Date.now() + CFG.SESION_TECNICO_DIAS * 864e5 }));\n  // Limpieza de sesiones vencidas.\n  const todas = p.getProperties();\n  Object.keys(todas).forEach(function (k) {\n    if (k.indexOf('ses_') !== 0) return;\n    try { if (JSON.parse(todas[k]).exp < Date.now()) p.deleteProperty(k); } catch (e) { p.deleteProperty(k); }\n  });\n}\n\n/** Sesión guardada en Propiedades (solo técnicos). Devuelve el texto de la sesión o null. */\nfunction sesionLarga_(token) {\n  if (!token) return null;\n  const p = PropertiesService.getScriptProperties();\n  const raw = p.getProperty('ses_' + token);\n  if (!raw) return null;\n  const v = JSON.parse(raw);\n  if (v.exp < Date.now() || !sesionVigente_(v.s)) { p.deleteProperty('ses_' + token); return null; }\n  v.exp = Date.now() + CFG.SESION_TECNICO_DIAS * 864e5;\n  p.setProperty('ses_' + token, JSON.stringify(v));\n  const txt = JSON.stringify(v.s);\n  CacheService.getScriptCache().put('tok_' + token, txt, CFG.SESION_SEG);\n  return txt;\n}\n\nfunction validarSesion(token) {\n  const l = leerSesion_(token);\n  if (!l) return null;\n  const o = l.s;\n  o.roles = rolesSes_(o);\n  o.permisos = permisosDe_(o.roles);\n  return o;\n}\n\n/** Número de versión del usuario: sube cada vez que se le cambia el PIN o el rol, y así se cierran sus sesiones. */\nfunction genUsuario_(usuario) {\n  return PropertiesService.getScriptProperties().getProperty('gen_' + usuario) || '0';\n}\n\n/** Activo, rol y versión del usuario, con 2 minutos de caché para no leer la hoja en cada llamada. */\nfunction estadoUsuario_(usuario) {\n  const cache = CacheService.getScriptCache();\n  const c = cache.get('usr_' + usuario);\n  if (c) return JSON.parse(c);\n  const u = usuarios_().filter(function (x) { return x.USUARIO === usuario; })[0];\n  const v = u ? { activo: u.ACTIVO === 'SI', rol: rolesDe_(u.ROL).join(','), gen: genUsuario_(usuario) } : { activo: false };\n  cache.put('usr_' + usuario, JSON.stringify(v), 120);\n  return v;\n}\n\n/**\n * La sesión sirve si el usuario sigue activo, con el mismo rol y el mismo PIN, y no pasó el máximo:\n * 12 horas en oficina, 30 días el técnico. Desactivarlo en la hoja lo saca en máximo 2 minutos.\n */\nfunction sesionVigente_(s) {\n  if (!s || !s.ini) return false;\n  const v = estadoUsuario_(s.usuario);\n  if (!v.activo || v.rol !== rolesSes_(s).join(',') || String(v.gen) !== String(s.gen)) return false;\n  const max = tieneRol_(s, 'TECNICO') ? CFG.SESION_TECNICO_MAX_DIAS * 864e5 : CFG.SESION_MAX_HORAS * 36e5;\n  return Date.now() - s.ini <= max;\n}\n\nfunction leerSesion_(token) {\n  if (!token) return null;\n  const raw = CacheService.getScriptCache().get('tok_' + token) || sesionLarga_(token);\n  if (!raw) return null;\n  const s = JSON.parse(raw);\n  if (!sesionVigente_(s)) { logout(token); return null; }\n  return { raw: raw, s: s };\n}\n\nfunction logout(token) {\n  CacheService.getScriptCache().remove('tok_' + token);\n  if (token) PropertiesService.getScriptProperties().deleteProperty('ses_' + token);\n  return true;\n}\n\n/** Cuenta un uso (foto, OC, correo) del usuario y lo frena si pasa CFG.CUPOS en 6 horas. */\nfunction cupo_(s, tipo) {\n  const cache = CacheService.getScriptCache();\n  const k = 'cupo_' + tipo + '_' + s.usuario;\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    const n = Number(cache.get(k) || 0) + 1;\n    if (n > CFG.CUPOS[tipo]) {\n      if (n === CFG.CUPOS[tipo] + 1) registrarAcceso_(s.usuario, 'LIMITE', tipo + ': ' + CFG.CUPOS[tipo] + ' en 6 horas');\n      throw new Error('Llegó al límite de ' + CFG.CUPOS[tipo] + ' en 6 horas. Si es un trabajo grande, avísele al administrador.');\n    }\n    cache.put(k, String(n), CFG.SESION_SEG);\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n/**\n * Roles de un usuario. Una persona puede tener dos (ej. LIQUIDACION,TECNICO: Lucas liquida y también presta servicios).\n * El primero que no es TECNICO es el principal (panel de oficina); TECNICO va al final.\n */\nfunction rolesDe_(texto) {\n  const lista = String(texto || '').toUpperCase().split(/[,+;\\/\\s]+/).filter(String)\n    .filter(function (r, i, a) { return a.indexOf(r) === i; });\n  if (!lista.length) throw new Error('Rol inválido');\n  lista.forEach(function (r) { if (CFG.ROLES.indexOf(r) < 0) throw new Error('Rol inválido: ' + r); });\n  return lista.filter(function (r) { return r !== 'TECNICO'; }).concat(lista.indexOf('TECNICO') >= 0 ? ['TECNICO'] : []);\n}\n\n/** Roles de la sesión (las sesiones anteriores solo guardaban uno). */\nfunction rolesSes_(s) {\n  return s.roles && s.roles.length ? s.roles : [s.rol];\n}\n\nfunction tieneRol_(s, rol) {\n  return rolesSes_(s).indexOf(rol) >= 0;\n}\n\nfunction permisosDe_(roles) {\n  roles = Array.isArray(roles) ? roles : [roles];\n  const out = {};\n  Object.keys(CFG.PERMISOS).forEach(function (k) {\n    out[k] = roles.some(function (r) { return CFG.PERMISOS[k].indexOf(r) >= 0; });\n  });\n  return out;\n}\n\nfunction puede_(s, permiso) {\n  return rolesSes_(s).some(function (r) { return (CFG.PERMISOS[permiso] || []).indexOf(r) >= 0; });\n}\n\n/** Valida la sesión. `requisito` es un rol ('TECNICO') o un permiso de CFG.PERMISOS ('liquidar'). */\nfunction sesion_(token, requisito) {\n  const l = leerSesion_(token);\n  if (!l) throw new Error('SESION_VENCIDA');\n  const raw = l.raw, s = l.s;\n  if (requisito) {\n    const ok = CFG.PERMISOS[requisito] ? puede_(s, requisito) : tieneRol_(s, requisito);\n    if (!ok) throw new Error('No autorizado.');\n    // Técnico con rol de oficina (Lucas): su sesión larga sirve para el panel del técnico; la oficina, máximo 12 horas.\n    if (CFG.PERMISOS[requisito] && tieneRol_(s, 'TECNICO') && Date.now() - s.ini > CFG.SESION_MAX_HORAS * 36e5) throw new Error('SESION_OFICINA_VENCIDA');\n  }\n  // Sesión deslizante: mientras la persona use el panel, no vence.\n  CacheService.getScriptCache().put('tok_' + token, raw, CFG.SESION_SEG);\n  return s;\n}\n\nfunction usuarios_() {\n  return filasComoObjetos_(CFG.HOJAS.USUARIOS).map(function (u) {\n    u.USUARIO = String(u.USUARIO).toLowerCase();\n    u.ACTIVO = String(u.ACTIVO).toUpperCase();\n    u.ROL = String(u.ROL).toUpperCase();\n    return u;\n  });\n}\n\n/** Correos de quienes reciben el aviso de orden nueva (activos, con permiso avisoOrdenNueva y CORREO escrito). */\nfunction correosAvisoOrden_() {\n  return usuarios_().filter(function (u) {\n    if (u.ACTIVO !== 'SI' || !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(String(u.CORREO || '').trim())) return false;\n    try { return permisosDe_(rolesDe_(u.ROL)).avisoOrdenNueva; } catch (e) { return false; }\n  }).map(function (u) { return String(u.CORREO).trim().toLowerCase(); });\n}\n\nfunction tecnicos_() {\n  return usuarios_().filter(function (u) { return u.ACTIVO === 'SI' && String(u.ROL).split(/[,+;\\/\\s]+/).indexOf('TECNICO') >= 0; })\n    .map(function (u) { return { usuario: u.USUARIO, nombre: u.NOMBRE, telefono: u.TELEFONO }; });\n}\n\n/* ===================== Utilidades de hojas ===================== */\n\nfunction normalizar_(s) {\n  return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '')\n    .toUpperCase().trim().replace(/[^A-Z0-9]+/g, '_').replace(/^_|_$/g, '');\n}\n\nfunction hoja_(nombre) {\n  const memo = MEMO_.__sh || (MEMO_.__sh = {});\n  if (memo[nombre]) return memo[nombre];\n  const sh = SpreadsheetApp.getActive().getSheetByName(nombre);\n  if (!sh) throw new Error('No existe la hoja ' + nombre + '. Corra Family Air > 1. Instalar / verificar.');\n  return (memo[nombre] = sh);\n}\n\n/**\n * Después de escribir una fila, la copia leída de la hoja se corrige en memoria en vez de volver a leer\n * toda la hoja (fila = número de fila en la hoja; si es la siguiente a la última, se agrega).\n */\nfunction memoFila_(nombre, fila, valores) {\n  const datos = MEMO_[nombre];\n  delete MEMO_['obj_' + nombre];\n  delete MEMO_['fil_' + nombre];\n  const gen = subirGeneracion_(nombre);\n  const corregidas = MEMO_.__corregidas || (MEMO_.__corregidas = {});\n  delete corregidas[nombre];\n  if (!datos) return;\n  if (fila - 1 < datos.length) datos[fila - 1] = valores.slice();\n  else if (fila - 1 === datos.length) datos.push(valores.slice());\n  else { delete MEMO_[nombre]; return; }\n  // La copia corregida es igual a la hoja: al final de la llamada se guarda en caché con esta generación.\n  if (gen) corregidas[nombre] = gen;\n}\n\n/**\n * Al terminar cada llamada: las hojas corregidas en memoria quedan en la caché con su generación, así la siguiente\n * llamada (de cualquier usuario) no relee la hoja completa. Si otra llamada escribió después, su generación es otra\n * y esta copia simplemente no se usa.\n */\nfunction finLlamada_() {\n  const corregidas = MEMO_.__corregidas || {};\n  Object.keys(corregidas).forEach(function (nombre) {\n    if (MEMO_[nombre]) guardarCacheHoja_(nombre, corregidas[nombre], MEMO_[nombre]);\n  });\n  MEMO_.__corregidas = {};\n}\n\n/* ===================== Lectura rápida de hojas ===================== */\n// Cada hoja se lee una sola vez por llamada (MEMO_). Las que casi no cambian se guardan además en CacheService\n// entre llamadas, con una generación por hoja (GEN_<hoja> en Propiedades) que sube con cada escritura:\n// así nunca se usa una copia vieja. Las ediciones a mano en la hoja las detecta onEdit.\nvar MEMO_ = {};\nconst HOJAS_EN_CACHE_ = ['CLIENTES', 'SEDES', 'EQUIPOS', 'SERVICIOS', 'TARIFAS', 'HISTORICO_ODS', 'USUARIOS', 'ODS'];\nconst TROZO_CACHE_ = 40000;\n\nfunction propsMemo_() {\n  if (!MEMO_.__props) MEMO_.__props = PropertiesService.getScriptProperties().getProperties();\n  return MEMO_.__props;\n}\n\n/** Valores de la hoja completa (como getDataRange().getValues()), leídos una vez por llamada. */\nfunction valoresHoja_(nombre) {\n  if (MEMO_[nombre]) return MEMO_[nombre];\n  const enCache = HOJAS_EN_CACHE_.indexOf(nombre) >= 0;\n  const gen = enCache ? String(propsMemo_()['GEN_' + nombre] || '0') : '';\n  let datos = enCache ? leerCacheHoja_(nombre, gen) : null;\n  if (!datos) {\n    const sh = SpreadsheetApp.getActive().getSheetByName(nombre);\n    datos = sh ? sh.getDataRange().getValues() : [[]];\n    if (enCache && sh) guardarCacheHoja_(nombre, gen, datos);\n  }\n  MEMO_[nombre] = datos;\n  return datos;\n}\n\nfunction leerCacheHoja_(nombre, gen) {\n  try {\n    const cache = CacheService.getScriptCache();\n    const meta = JSON.parse(cache.get('hc_' + nombre) || 'null');\n    if (!meta || meta.gen !== gen) return null;\n    const claves = []; for (let i = 0; i < meta.n; i++) claves.push('hc_' + nombre + '_' + gen + '_' + i);\n    const trozos = cache.getAll(claves);\n    if (claves.some(function (k) { return trozos[k] == null; })) return null;\n    // Las fechas viajan como {\"$d\": milisegundos} para volver a ser Date.\n    return JSON.parse(claves.map(function (k) { return trozos[k]; }).join(''), function (k, v) { return v && typeof v === 'object' && v.$d !== undefined ? new Date(v.$d) : v; });\n  } catch (e) { return null; }\n}\n\nfunction guardarCacheHoja_(nombre, gen, datos) {\n  try {\n    const txt = JSON.stringify(datos.map(function (f) { return f.map(function (v) { return v instanceof Date ? { $d: v.getTime() } : v; }); }));\n    const piezas = {};\n    let n = 0;\n    for (let i = 0; i < txt.length; i += TROZO_CACHE_) piezas['hc_' + nombre + '_' + gen + '_' + (n++)] = txt.slice(i, i + TROZO_CACHE_);\n    if (n > 60) return; // hoja demasiado grande para la caché: se sigue leyendo directo\n    const cache = CacheService.getScriptCache();\n    cache.putAll(piezas, CFG.SESION_SEG);\n    cache.put('hc_' + nombre, JSON.stringify({ gen: gen, n: n }), CFG.SESION_SEG);\n  } catch (e) { /* sin caché: solo más lento */ }\n}\n\n/** Después de escribir en una hoja: se descarta lo leído y, si está en caché, sube su generación. */\nfunction olvidarHoja_(nombre) {\n  if (MEMO_.__corregidas) delete MEMO_.__corregidas[nombre];\n  delete MEMO_[nombre];\n  delete MEMO_['obj_' + nombre];\n  delete MEMO_['fil_' + nombre];\n  subirGeneracion_(nombre);\n}\n\n/** La copia en caché de esa hoja deja de valer para las demás llamadas. */\nfunction subirGeneracion_(nombre) {\n  if (HOJAS_EN_CACHE_.indexOf(nombre) < 0) return '';\n  const gen = String(Date.now()) + Math.floor(Math.random() * 1000);\n  PropertiesService.getScriptProperties().setProperty('GEN_' + nombre, gen);\n  if (MEMO_.__props) MEMO_.__props['GEN_' + nombre] = gen;\n  return gen;\n}\n\n/* ===================== Trabajo en segundo plano ===================== */\n// Lo que no tiene que demorar un botón (evento del calendario, correo de aviso) se anota en una cola en Propiedades\n// y lo procesa el disparador procesarSegundoPlano cada minuto. Si el disparador no existe, se crea solo.\nconst COLA_ = 'COLA_SEGUNDO_PLANO';\n\nfunction encolarSegundoPlano_(tipo, dato) {\n  const lock = LockService.getScriptLock();\n  const tenia = lock.hasLock();\n  if (!tenia) lock.waitLock(20000);\n  try {\n    const p = PropertiesService.getScriptProperties();\n    const cola = leerJSON_(p.getProperty(COLA_), []);\n    const item = tipo + ':' + dato;\n    if (cola.indexOf(item) < 0) cola.push(item);\n    p.setProperty(COLA_, JSON.stringify(cola));\n    if (!p.getProperty('DISPARADOR_SEGUNDO_PLANO')) asegurarDisparadorSegundoPlano_();\n  } finally {\n    if (!tenia) lock.releaseLock();\n  }\n}\n\nfunction asegurarDisparadorSegundoPlano_() {\n  try {\n    if (!ScriptApp.getProjectTriggers().some(function (t) { return t.getHandlerFunction() === 'procesarSegundoPlano'; })) {\n      ScriptApp.newTrigger('procesarSegundoPlano').timeBased().everyMinutes(1).create();\n    }\n    PropertiesService.getScriptProperties().setProperty('DISPARADOR_SEGUNDO_PLANO', 'SI');\n  } catch (e) { /* sin permiso para crear disparadores: se crea al correr Instalar */ }\n}\n\n/** Disparador de cada minuto: si la cola está vacía, termina de una vez (no lee la hoja). */\nfunction procesarSegundoPlano(e) {\n  soloInterno_(e);\n  return procesarColaSegundoPlano_();\n}\n\nconst BORRAR_ = 'BORRAR_'; // documentos temporales del OCR, una propiedad por documento\n\nfunction procesarColaSegundoPlano_() {\n  const p = PropertiesService.getScriptProperties();\n  const todas = p.getProperties();\n  Object.keys(todas).filter(function (k) { return k.indexOf(BORRAR_) === 0; }).forEach(function (k) {\n    try { DriveApp.getFileById(k.slice(BORRAR_.length)).setTrashed(true); } catch (e) { /* ya no existe */ }\n    p.deleteProperty(k);\n  });\n  if (!todas[COLA_]) return 0;\n  const cola = conLock_(function () {\n    const c = leerJSON_(p.getProperty(COLA_), []);\n    p.deleteProperty(COLA_);\n    return c;\n  });\n  const inicio = Date.now();\n  cola.forEach(function (item, i) {\n    // Lo que no alcance en 4 minutos vuelve a la cola para la siguiente corrida.\n    if (Date.now() - inicio > 4 * 60 * 1000) { cola.slice(i).forEach(function (x) { const t = x.split(':'); encolarSegundoPlano_(t[0], t.slice(1).join(':')); }); return; }\n    const sep = item.indexOf(':'), tipo = item.slice(0, sep), dato = item.slice(sep + 1);\n    try {\n      if (tipo === 'CAL') sincronizarEventoAhora_(dato);\n      else if (tipo === 'CARPETA') crearCarpetaOrden_(dato);\n      else if (tipo === 'BORRAR') DriveApp.getFileById(dato).setTrashed(true);\n      else if (tipo === 'AVISO') { const d = dato.split('|'); avisarCierre_(buscarODS_(d[0]), { usuario: d[1], nombre: d[2] }); }\n    } catch (err) {\n      try { log_(dato.split('|')[0], 'sistema', 'ERROR_SEGUNDO_PLANO', tipo + ': ' + err.message); } catch (e2) { /* sin registro */ }\n    }\n  });\n  return cola.length;\n}\n\n/** Edición a mano en la hoja: las copias en caché de esa pestaña dejan de valer. */\nfunction onEdit(e) {\n  try { olvidarHoja_(e.range.getSheet().getName()); } catch (err) { /* sin evento */ }\n}\n\nfunction indiceEncabezados_(sh) {\n  const enc = valoresHoja_(sh.getName())[0] || [];\n  const idx = {};\n  enc.forEach(function (h, i) { idx[String(h)] = i; });\n  return idx;\n}\n\n/** Filas como objetos {encabezado: texto, _fila}. Recibe la hoja o su nombre (con el nombre no se abre la hoja si está en caché). */\nfunction filasComoObjetos_(sh) {\n  const nombre = typeof sh === 'string' ? sh : sh.getName();\n  const memo = 'fil_' + nombre;\n  // Se convierten una vez por llamada; cada quien recibe copias para poder modificarlas sin dañar las demás.\n  if (!MEMO_[memo]) {\n    const datos = valoresHoja_(nombre);\n    const enc = datos[0].map(String);\n    const out = [];\n    for (let r = 1; r < datos.length; r++) {\n      const o = { _fila: r + 1 };\n      enc.forEach(function (h, i) { o[h] = texto_(datos[r][i]); });\n      out.push(o);\n    }\n    MEMO_[memo] = out;\n  }\n  return MEMO_[memo].map(function (o) { return Object.assign({}, o); });\n}\n\nfunction texto_(v) {\n  if (v instanceof Date) return Utilities.formatDate(v, TZ, 'yyyy-MM-dd HH:mm').replace(/ 00:00$/, '');\n  if (v === null || v === undefined) return '';\n  return String(v).trim();\n}\n\nfunction numero_(v) {\n  if (typeof v === 'number') return v;\n  const s = String(v == null ? '' : v).replace(/[^\\d,.-]/g, '');\n  if (!s) return 0;\n  // 1.234.567 o 1,234,567 -> miles; 1234.5 -> decimal\n  const limpio = /[.,]\\d{3}([.,]|$)/.test(s) ? s.replace(/[.,](?=\\d{3}(\\D|$))/g, '') : s.replace(',', '.');\n  return Number(limpio) || 0;\n}\n\n/** Guarda texto como texto: Sheets no lo convierte en fecha o número ni lo ejecuta como fórmula. */\nfunction celda_(v) {\n  if (v === undefined || v === null || v === '') return '';\n  if (typeof v === 'number' || typeof v === 'boolean') return v;\n  if (v instanceof Date) return \"'\" + texto_(v);\n  return \"'\" + String(v);\n}\n\nfunction ahora_() {\n  return Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd HH:mm');\n}\n\nfunction hoy_() {\n  return Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd');\n}\n\n/** Acepta 'yyyy-MM-dd[ HH:mm]', 'dd/MM/yyyy' o Date. Devuelve 'yyyy-MM-dd' o ''. */\nfunction fechaISO_(v) {\n  if (!v) return '';\n  if (v instanceof Date) return Utilities.formatDate(v, TZ, 'yyyy-MM-dd');\n  const s = String(v).trim();\n  let m = /^(\\d{4})-(\\d{1,2})-(\\d{1,2})/.exec(s);\n  if (m) return m[1] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[3]).slice(-2);\n  m = /^(\\d{1,2})[\\/.-](\\d{1,2})[\\/.-](\\d{4})/.exec(s);\n  if (m) return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);\n  return '';\n}\n\nfunction conLock_(fn) {\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  refrescarMemo_();\n  try { return fn(); } finally { lock.releaseLock(); }\n}\n\n/**\n * Con el bloqueo puesto: otra llamada pudo cambiar las hojas mientras se esperaba. Se vuelven a leer las Propiedades\n * (una llamada) y se conserva lo leído solo de las hojas en caché cuya generación no cambió; lo demás se relee.\n */\nfunction refrescarMemo_() {\n  const antes = MEMO_.__props;\n  const viejo = MEMO_;\n  MEMO_ = { __sh: viejo.__sh, __corregidas: {} };\n  if (!antes) return;\n  const ahora = propsMemo_();\n  HOJAS_EN_CACHE_.forEach(function (h) {\n    if (!viejo[h] || String(antes['GEN_' + h] || '0') !== String(ahora['GEN_' + h] || '0')) return;\n    ['', 'obj_', 'fil_'].forEach(function (pre) { if (viejo[pre + h]) MEMO_[pre + h] = viejo[pre + h]; });\n    if (viejo.__corregidas && viejo.__corregidas[h]) MEMO_.__corregidas[h] = viejo.__corregidas[h];\n  });\n}\n\nfunction log_(idOds, usuario, accion, detalle) {\n  hoja_(CFG.HOJAS.LOG).appendRow([ahora_(), idOds, usuario, accion, detalle || ''].map(celda_));\n  olvidarHoja_(CFG.HOJAS.LOG);\n  // Toda acción que cambia datos pasa por aquí: el panel administrativo usa esta marca para actualizarse solo.\n  PropertiesService.getScriptProperties().setProperty('VERSION_DATOS', String(Date.now()));\n}\n\n/** Marca de la última modificación de datos. El panel la consulta cada 30 segundos y, si cambió, se actualiza. */\nfunction adminVersion(token) {\n  sesion_(token, 'panel');\n  return PropertiesService.getScriptProperties().getProperty('VERSION_DATOS') || '0';\n}\n\n/** Historial de una orden: lee solo la columna del número y después las filas de esa orden (el registro crece mucho). */\nfunction historialCambios_(id) {\n  const sh = hoja_(CFG.HOJAS.LOG);\n  const n = sh.getLastRow() - 1;\n  if (n < 1) return [];\n  const ids = sh.getRange(2, 2, n, 1).getValues();\n  const filas = [];\n  ids.forEach(function (v, i) { if (String(v[0]) === id) filas.push(i + 2); });\n  const out = [];\n  // Filas seguidas se leen en un solo bloque.\n  for (let i = 0; i < filas.length;) {\n    let j = i; while (j + 1 < filas.length && filas[j + 1] === filas[j] + 1) j++;\n    sh.getRange(filas[i], 1, filas[j] - filas[i] + 1, 5).getValues().forEach(function (f) {\n      out.push({ fecha: texto_(f[0]), usuario: texto_(f[2]), accion: texto_(f[3]), detalle: texto_(f[4]) });\n    });\n    i = j + 1;\n  }\n  return out.reverse();\n}\n\nfunction carpetaRaiz_(prop, nombre) {\n  const p = PropertiesService.getScriptProperties();\n  const id = p.getProperty(prop);\n  if (id) return DriveApp.getFolderById(id);\n  const c = DriveApp.createFolder(nombre);\n  p.setProperty(prop, c.getId());\n  return c;\n}\n\n/** Datos fijos que usan los dos paneles. */\nfunction catalogos_() {\n  return {\n    estados: CFG.ESTADOS, tiposServicio: CFG.TIPOS_SERVICIO, tarifas: CFG.TARIFAS_TIPO,\n    formasPago: CFG.FORMAS_PAGO, categorias: CFG.CATEGORIAS_ITEM, estadoArtefacto: CFG.ESTADO_ARTEFACTO,\n    condiciones: CFG.CONDICIONES, fichaTareas: CFG.FICHA_TAREAS, fichaCampos: CFG.FICHA_CAMPOS,\n    responsabilidadesSiigo: SIIGO_RESPONSABILIDADES_.map(function (x) { return { codigo: x[0], nombre: x[1] }; })\n  };\n}\n\n// Dashboard.gs\n/**\n * Resumen financiero mes a mes. Se calcula en vivo desde la hoja ODS cada vez que se abre\n * (y cada 5 minutos mientras está abierto), así que se actualiza solo con cada servicio nuevo.\n *\n * A qué mes pertenece cada cifra:\n *   - Servicios realizados: mes del cierre del técnico (HORA_CIERRE).\n *   - Liquidado (mano de obra, materiales, transporte): mes de la liquidación (FECHA_LIQUIDACION).\n *   - Recaudado: mes del pago (FECHA_PAGO), con el valor recibido.\n *   - Facturado electrónicamente: mes en que se marcó la factura terminada (FECHA_COMPLETADA).\n *   - Cartera: foto del momento (órdenes liquidadas que aún no se han cobrado ni facturado).\n * Los valores son antes de IVA. Las garantías y los retornos no suman ingresos.\n */\n\nconst ESTADOS_LIQUIDADOS_ = ['LIQUIDADA', 'POR_FACTURAR', 'COMPLETADA'];\n\nfunction mesDe_(v) {\n  const f = fechaISO_(v);\n  return f ? f.slice(0, 7) : '';\n}\n\nfunction mesesHasta_(fin, n) {\n  const p = fin.split('-').map(Number);\n  const lista = [];\n  for (let i = n - 1; i >= 0; i--) {\n    const d = new Date(p[0], p[1] - 1 - i, 1);\n    lista.push(d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2));\n  }\n  return lista;\n}\n\n/** Calcula el resumen. meses: cuántos meses hacia atrás (6 a 24). hasta: 'yyyy-MM' (por defecto el mes actual). */\nfunction resumenFinanciero_(meses, hasta) {\n  meses = Math.min(24, Math.max(3, Number(meses) || 12));\n  const fin = /^\\d{4}-\\d{2}$/.test(String(hasta || '')) ? hasta : hoy_().slice(0, 7);\n  const lista = mesesHasta_(fin, meses);\n  const vacio = function () {\n    const t = {}; CFG.TIPOS_SERVICIO.forEach(function (k) { t[k] = 0; });\n    const pagos = {}; CFG.FORMAS_PAGO.forEach(function (k) { pagos[k] = 0; });\n    return { servicios: 0, porTipo: t, garantias: 0, retornos: 0, anuladas: 0, liquidadas: 0, manoObra: 0, materiales: 0, transporte: 0,\n      liquidado: 0, recaudado: 0, facturado: 0, porPago: pagos, cotizado: 0, liquidadoConCotizacion: 0, clientes: {}, tecnicos: {} };\n  };\n  const m = {}; lista.forEach(function (k) { m[k] = vacio(); });\n  let cartera = 0, carteraOrdenes = 0, porFacturar = 0, porFacturarOrdenes = 0;\n\n  leerODS_().forEach(function (o) {\n    const total = numero_(o.TOTAL) || 0;\n    if (o.ESTADO === 'ANULADA') {\n      const ma = mesDe_(o.FECHA_CREACION);\n      if (m[ma]) m[ma].anuladas++;\n      return;\n    }\n    const mc = mesDe_(o.HORA_CIERRE);\n    if (m[mc]) {\n      m[mc].servicios++;\n      if (m[mc].porTipo[o.TIPO_SERVICIO] !== undefined) m[mc].porTipo[o.TIPO_SERVICIO]++;\n      if (o.TIPO_ORDEN === 'GARANTIA') m[mc].garantias++;\n      if (numero_(o.RETORNOS) > 0) m[mc].retornos++;\n      if (o.TECNICO_NOMBRE) m[mc].tecnicos[o.TECNICO_NOMBRE] = (m[mc].tecnicos[o.TECNICO_NOMBRE] || 0) + 1;\n    }\n    if (ESTADOS_LIQUIDADOS_.indexOf(o.ESTADO) >= 0) {\n      const ml = mesDe_(o.FECHA_LIQUIDACION);\n      if (m[ml]) {\n        const x = m[ml];\n        x.liquidadas++;\n        x.manoObra += numero_(o.MANO_OBRA) || 0; x.materiales += numero_(o.MATERIALES) || 0; x.transporte += numero_(o.TRANSPORTE) || 0;\n        x.liquidado += total;\n        if (x.porPago[o.FORMA_PAGO] !== undefined) x.porPago[o.FORMA_PAGO] += total;\n        const cotizado = o.COTIZACION ? totalCotizacion_(o) : null;\n        if (cotizado !== null) { x.cotizado += cotizado || 0; x.liquidadoConCotizacion += total; }\n        x.clientes[o.CLIENTE] = (x.clientes[o.CLIENTE] || 0) + total;\n      }\n      if (o.ESTADO === 'LIQUIDADA') { cartera += total; carteraOrdenes++; }\n      if (o.ESTADO === 'POR_FACTURAR') { porFacturar += total; porFacturarOrdenes++; }\n    }\n    if (o.ESTADO === 'COMPLETADA') {\n      const mp = mesDe_(o.FECHA_PAGO);\n      if (m[mp] && o.VALOR_RECIBIDO !== '') m[mp].recaudado += numero_(o.VALOR_RECIBIDO) || 0;\n      const mf = mesDe_(o.FECHA_COMPLETADA);\n      if (m[mf] && o.FORMA_PAGO === 'FACTURA') m[mf].facturado += total;\n    }\n  });\n\n  const top = function (obj, n) {\n    return Object.keys(obj).map(function (k) { return { nombre: k, valor: obj[k] }; })\n      .sort(function (a, b) { return b.valor - a.valor; }).slice(0, n);\n  };\n  return {\n    actualizado: ahora_(), hasta: fin,\n    tipos: CFG.TIPOS_SERVICIO, formasPago: CFG.FORMAS_PAGO,\n    meses: lista.map(function (k) {\n      const x = m[k];\n      return {\n        mes: k, servicios: x.servicios, porTipo: x.porTipo, garantias: x.garantias, retornos: x.retornos, anuladas: x.anuladas,\n        liquidadas: x.liquidadas, manoObra: x.manoObra, materiales: x.materiales, transporte: x.transporte, liquidado: x.liquidado,\n        recaudado: x.recaudado, facturado: x.facturado, porPago: x.porPago,\n        ticket: x.liquidadas ? Math.round(x.liquidado / x.liquidadas) : 0,\n        cotizado: x.cotizado, difCotizacion: x.liquidadoConCotizacion - x.cotizado,\n        topClientes: top(x.clientes, 5), topTecnicos: top(x.tecnicos, 5)\n      };\n    }),\n    cartera: { valor: cartera, ordenes: carteraOrdenes },\n    porFacturar: { valor: porFacturar, ordenes: porFacturarOrdenes }\n  };\n}\n\n/** API del panel: resumen financiero (solo quien tiene el permiso \"finanzas\"). */\nfunction adminDashboard(token, meses, hasta) {\n  sesion_(token, 'finanzas');\n  return resumenFinanciero_(meses, hasta);\n}\n\n// Informes.gs\n/**\n * Informes técnicos para clientes, con el formato del informe IT (Sistema de gestión de la calidad).\n * Se arman desde una o varias ODS del cliente, se completan en el panel, y el sistema genera\n * un Google Doc y su PDF en \"Family Air · Informes técnicos/<cliente>\".\n */\n\nconst ORDINALES_ = ['Primera', 'Segunda', 'Tercera', 'Cuarta', 'Quinta', 'Sexta', 'Séptima', 'Octava', 'Novena', 'Décima'];\nconst MESES_ = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];\n\nfunction fechaLarga_(iso) {\n  const f = fechaISO_(iso);\n  if (!f) return '';\n  const p = f.split('-');\n  return Number(p[2]) + ' de ' + MESES_[Number(p[1]) - 1] + ' de ' + p[0];\n}\n\nfunction fechaCorta_(iso) {\n  const f = fechaISO_(iso);\n  if (!f) return '';\n  const p = f.split('-');\n  return p[2] + '/' + p[1] + '/' + p[0];\n}\n\n/** Sigla del cliente para el número del informe: \"Notaría 22 de Medellín\" → N22. */\nfunction siglaCliente_(nombre) {\n  const palabras = normalizar_(nombre).split('_').filter(String);\n  const nums = palabras.filter(function (w) { return /^\\d+$/.test(w); }).join('');\n  const letras = palabras.filter(function (w) { return !/^\\d+$/.test(w) && ['DE', 'DEL', 'LA', 'LAS', 'LOS', 'EL', 'Y', 'S', 'A', 'SAS'].indexOf(w) < 0; });\n  if (nums && letras.length) return letras[0][0] + nums;\n  return letras.slice(0, 3).map(function (w) { return w[0]; }).join('') || 'CLI';\n}\n\nfunction informesListar(token) {\n  sesion_(token, 'informes');\n  return filasComoObjetos_(hoja_(CFG.HOJAS.INFORMES)).filter(function (r) { return r.ID_INFORME; }).reverse().map(function (r) {\n    return { id: r.ID_INFORME, fecha: r.FECHA, cliente: r.CLIENTE, idCliente: r.ID_CLIENTE, ods: r.ODS_IDS, titulo: r.TITULO, dirigidoA: r.DIRIGIDO_A, docId: r.DOC_ID, pdfId: r.PDF_ID, creadoPor: r.CREADO_POR };\n  });\n}\n\n/** Órdenes del cliente que pueden ir en un informe (cerradas por el técnico en adelante). */\nfunction informeOrdenesCliente(token, idCliente) {\n  sesion_(token, 'informes');\n  return leerODS_().filter(function (o) {\n    return o.ID_CLIENTE === idCliente && ['CERRADA_TECNICO', 'REVISADA', 'LIQUIDADA', 'POR_FACTURAR', 'COMPLETADA'].indexOf(o.ESTADO) >= 0;\n  }).reverse().map(function (o) {\n    return { id: o.ID_ODS, fecha: fechaISO_(o.HORA_CIERRE || o.FECHA_PROGRAMADA), sede: o.SEDE, tipoServicio: o.TIPO_SERVICIO, tecnico: o.TECNICO_NOMBRE, trabajo: o.TRABAJO_REALIZADO, fotos: fotosDe_(o).filter(function (f) { return f.tipo !== 'VIDEO'; }).length };\n  });\n}\n\n/** Propuesta de informe con los datos de las ODS escogidas. Todo es editable en el panel. */\nfunction informePrellenar(token, idCliente, odsIds) {\n  sesion_(token, 'informes');\n  const c = buscarCliente_(idCliente);\n  if (!c) throw new Error('Cliente no encontrado.');\n  const ods = leerODS_().filter(function (o) { return (odsIds || []).indexOf(o.ID_ODS) >= 0 && o.ID_CLIENTE === idCliente; })\n    .sort(function (a, b) { return String(fechaISO_(a.HORA_CIERRE || a.FECHA_PROGRAMADA)).localeCompare(String(fechaISO_(b.HORA_CIERRE || b.FECHA_PROGRAMADA))); });\n  if (!ods.length) throw new Error('Escoja al menos una orden.');\n  const ultima = ods[ods.length - 1];\n  const fUlt = fechaISO_(ultima.HORA_CIERRE || ultima.FECHA_PROGRAMADA) || hoy_();\n  const equipos = [];\n  ods.forEach(function (o) { (o.EQUIPOS_DETALLE || '').split('\\n').filter(String).forEach(function (e) { if (equipos.indexOf(e) < 0) equipos.push(e); }); });\n  const tecnicos = [];\n  ods.forEach(function (o) { if (o.TECNICO_NOMBRE && tecnicos.indexOf(o.TECNICO_NOMBRE) < 0) tecnicos.push(o.TECNICO_NOMBRE); });\n  const fotos = [];\n  ods.forEach(function (o) { fotosDe_(o).forEach(function (f) { if (f.tipo !== 'PLACA' && f.tipo !== 'VIDEO') fotos.push({ id: f.id, tipo: f.tipo, ods: o.ID_ODS }); }); });\n  const tipo = nombreTipo_(ods[0].TIPO_SERVICIO);\n  return {\n    numero: 'IT-' + fUlt.slice(0, 4) + '-' + fUlt.slice(5, 7) + fUlt.slice(8, 10) + '-' + siglaCliente_(c.nombre),\n    fecha: hoy_(), idCliente: c.id, cliente: c.nombre, odsIds: ods.map(function (o) { return o.ID_ODS; }),\n    titulo: 'Informe Técnico de ' + tipo, dirigidoNombre: '', dirigidoCargo: '',\n    objetivo: 'Documentar el diagnóstico técnico, las intervenciones realizadas y la puesta en marcha del sistema de aire acondicionado instalado en ' + ultima.SEDE + ', con el fin de certificar la solución de las fallas presentadas y garantizar la operatividad continua del equipo.',\n    ficha: {\n      cliente: c.nombre,\n      ubicacion: [ultima.SEDE, ultima.DIRECCION, ultima.BARRIO, ultima.CIUDAD].filter(String).join(', '),\n      equipo: equipos.join('; '),\n      modelo: ''\n    },\n    antecedentes: (ods[0].FALLA_CLIENTE ? 'Nos informaron: ' + ods[0].FALLA_CLIENTE + '. Se procedió a programar el servicio.\\n\\n' : '') +\n      'Se realizó la visita técnica por ' + (tecnicos.length > 1 ? 'los técnicos ' : 'el técnico ') + tecnicos.join(' y ') + '.',\n    intervenciones: ods.map(function (o) {\n      return { ods: o.ID_ODS, fecha: fechaISO_(o.HORA_CIERRE || o.FECHA_PROGRAMADA), reporte: o.FALLA_CLIENTE || o.SOLICITUD || '', hallazgo: o.OBS_TECNICO || '', accion: o.TRABAJO_REALIZADO || '' };\n    }),\n    pruebas: 'Verificación de arranque del compresor y motor ventilador.\\nAmperaje de operación y presiones de trabajo en rango nominal.',\n    estadoFinal: 'Equipo funcionando en condiciones normales y entregado a satisfacción.',\n    analisis: '', conclusion: '', recomendaciones: '',\n    fotosDisponibles: fotos, fotos: fotos.slice(0, 4).map(function (f) { return f.id; }),\n    elaboradoNombre: 'LUCAS RAFAEL MEJÍA FLÓREZ', elaboradoCargo: 'Director Técnico-Comercial'\n  };\n}\n\nfunction informeDetalle(token, id) {\n  sesion_(token, 'informes');\n  const r = filasComoObjetos_(hoja_(CFG.HOJAS.INFORMES)).filter(function (x) { return x.ID_INFORME === id; })[0];\n  if (!r) throw new Error('No existe el informe ' + id);\n  const d = leerJSON_(r.DATOS, {});\n  d.id = r.ID_INFORME; d.docId = r.DOC_ID; d.pdfId = r.PDF_ID;\n  return d;\n}\n\n/** Guarda el informe y genera (o regenera) el Google Doc y el PDF. */\nfunction informeGenerar(token, d) {\n  const s = sesion_(token, 'informes');\n  d = d || {};\n  if (!d.numero || !d.idCliente) throw new Error('Faltan número de informe o cliente.');\n  if (!String(d.titulo || '').trim()) throw new Error('Escriba el título del informe.');\n  const sh = hoja_(CFG.HOJAS.INFORMES);\n  const filas = filasComoObjetos_(sh);\n  const previo = filas.filter(function (x) { return x.ID_INFORME === d.numero; })[0];\n  if (previo && d.nuevo) throw new Error('Ya existe el informe ' + d.numero + '. Cambie el número o ábralo desde la lista.');\n  // Las órdenes deben ser del cliente, y las fotos de esas órdenes: no se puede meter otro archivo del Drive.\n  const ordenes = leerODS_().filter(function (o) { return (d.odsIds || []).indexOf(o.ID_ODS) >= 0; });\n  if (ordenes.length !== (d.odsIds || []).length || ordenes.some(function (o) { return o.ID_CLIENTE !== d.idCliente; })) {\n    throw new Error('Las órdenes del informe deben existir y ser de este cliente.');\n  }\n  const permitidas = {};\n  ordenes.forEach(function (o) { fotosDe_(o).forEach(function (f) { if (f.tipo !== 'PLACA' && f.tipo !== 'VIDEO') permitidas[f.id] = true; }); });\n  if ((d.fotos || []).some(function (fid) { return !permitidas[fid]; })) throw new Error('Una foto no pertenece a las órdenes del informe.');\n\n  const archivos = crearDocInforme_(d, s);\n  if (previo) {\n    [previo.DOC_ID, previo.PDF_ID].forEach(function (fid) { if (fid) { try { DriveApp.getFileById(fid).setTrashed(true); } catch (e) { /* ya no existe */ } } });\n  }\n  const guardar = Object.assign({}, d);\n  delete guardar.fotosDisponibles; delete guardar.nuevo;\n  conLock_(function () {\n    const valores = {\n      ID_INFORME: d.numero, FECHA: d.fecha || hoy_(), ID_CLIENTE: d.idCliente, CLIENTE: d.cliente, ODS_IDS: (d.odsIds || []).join(','),\n      TITULO: d.titulo, DIRIGIDO_A: [d.dirigidoNombre, d.dirigidoCargo].filter(String).join(' · '), DATOS: JSON.stringify(guardar).slice(0, 45000),\n      DOC_ID: archivos.docId, PDF_ID: archivos.pdfId, CREADO_POR: s.usuario, ACTUALIZADO: ahora_()\n    };\n    const idx = indiceEncabezados_(sh);\n    const fila = new Array(sh.getLastColumn()).fill('');\n    Object.keys(valores).forEach(function (k) { if (idx[k] !== undefined) fila[idx[k]] = valores[k]; });\n    if (previo) sh.getRange(previo._fila, 1, 1, fila.length).setValues([fila.map(celda_)]);\n    else sh.appendRow(fila.map(celda_));\n    olvidarHoja_(CFG.HOJAS.INFORMES);\n    (d.odsIds || []).forEach(function (oid) { log_(oid, s.usuario, 'INFORME', d.numero); });\n  });\n  // El informe queda referenciado en el expediente interno de cada orden ya archivada.\n  marcarExpediente_(d.odsIds || []);\n  return { id: d.numero, docId: archivos.docId, pdfId: archivos.pdfId };\n}\n\nfunction carpetaInformesCliente_(cliente) {\n  const raiz = carpetaRaiz_('CARPETA_INFORMES', CFG.CARPETA_INFORMES);\n  const it = raiz.getFoldersByName(cliente);\n  return it.hasNext() ? it.next() : raiz.createFolder(cliente);\n}\n\n/** Construye el documento con el mismo orden y estilo del informe IT-2026-0826-N22. */\nfunction crearDocInforme_(d, s) {\n  const GRIS = '#D9D9D9';\n  const carpeta = carpetaInformesCliente_(d.cliente);\n  const doc = DocumentApp.create(d.numero + ' · ' + d.cliente);\n  DriveApp.getFileById(doc.getId()).moveTo(carpeta);\n  const body = doc.getBody();\n  body.setMarginTop(36).setMarginBottom(36).setMarginLeft(54).setMarginRight(54);\n  const estiloBase = {};\n  estiloBase[DocumentApp.Attribute.FONT_FAMILY] = 'Arial';\n  estiloBase[DocumentApp.Attribute.FONT_SIZE] = 10;\n  body.setAttributes(estiloBase);\n\n  // Encabezado: logo, sistema de gestión, número y fecha.\n  const header = doc.addHeader();\n  const th = header.appendTable([\n    ['', 'SISTEMA DE GESTIÓN DE LA CALIDAD', 'Informe N° - ' + d.numero],\n    ['', 'INFORME TÉCNICO', 'Fecha: ' + fechaCorta_(d.fecha || hoy_())]\n  ]);\n  th.setBorderColor('#000000');\n  try {\n    const logo = th.getCell(0, 0).getChild(0).asParagraph().appendInlineImage(Utilities.newBlob(Utilities.base64Decode(LOGO_PNG_B64), 'image/png', 'logo.png'));\n    const k = 70 / logo.getHeight();\n    logo.setHeight(70).setWidth(Math.round(logo.getWidth() * k));\n  } catch (e) { /* sin logo */ }\n  [[0, 1], [1, 1]].forEach(function (rc) { th.getCell(rc[0], rc[1]).getChild(0).asParagraph().setAlignment(DocumentApp.HorizontalAlignment.CENTER).editAsText().setBold(true); });\n  doc.addFooter().appendParagraph('Rev. 0').setAlignment(DocumentApp.HorizontalAlignment.RIGHT);\n\n  const banda = function (texto) {\n    const t = body.appendTable([[texto]]);\n    const cell = t.getCell(0, 0);\n    cell.setBackgroundColor(GRIS);\n    cell.getChild(0).asParagraph().setAlignment(DocumentApp.HorizontalAlignment.CENTER).editAsText().setBold(true);\n    return t;\n  };\n  const parrafo = function (texto) {\n    String(texto || '').split(/\\n{2,}/).forEach(function (p) {\n      if (p.trim()) body.appendParagraph(p.trim()).setAlignment(DocumentApp.HorizontalAlignment.JUSTIFY).editAsText().setBold(false).setUnderline(false);\n    });\n  };\n  const conEtiqueta = function (contenedor, etiqueta, valor) {\n    const p = contenedor.appendParagraph(etiqueta + ' ' + (valor || ''));\n    p.editAsText().setBold(false).setUnderline(false).setBold(0, etiqueta.length - 1, true);\n    return p;\n  };\n  const vineta = function (etiqueta, valor) {\n    const li = body.appendListItem((etiqueta ? etiqueta + ' ' : '') + (valor || ''));\n    li.setGlyphType(DocumentApp.GlyphType.BULLET).setAlignment(DocumentApp.HorizontalAlignment.JUSTIFY);\n    li.editAsText().setBold(false).setUnderline(false);\n    if (etiqueta) li.editAsText().setBold(0, etiqueta.length - 1, true);\n    return li;\n  };\n  const subtitulo = function (texto) {\n    const p = body.appendParagraph(texto);\n    p.editAsText().setBold(true).setUnderline(true);\n    return p;\n  };\n  const lineas = function (texto) { return String(texto || '').split('\\n').map(function (l) { return l.replace(/^[-•*]\\s*/, '').trim(); }).filter(String); };\n\n  // Título y destinatario.\n  const t1 = body.appendTable([['Título del informe', 'Dirigido a:'], [d.titulo, (d.dirigidoNombre || '') + (d.dirigidoCargo ? '\\n' + d.dirigidoCargo : '')]]);\n  [0, 1].forEach(function (c) {\n    t1.getCell(0, c).setBackgroundColor(GRIS).getChild(0).asParagraph().setAlignment(DocumentApp.HorizontalAlignment.CENTER).editAsText().setBold(true);\n  });\n  t1.getCell(1, 1).getChild(0).asParagraph().setAlignment(DocumentApp.HorizontalAlignment.CENTER).editAsText().setBold(true);\n\n  // Objetivo y ficha.\n  banda('Objetivo del informe');\n  parrafo(d.objetivo);\n  const f = d.ficha || {};\n  if (f.cliente) conEtiqueta(body, 'Cliente:', f.cliente);\n  if (f.ubicacion) conEtiqueta(body, 'Ubicación:', f.ubicacion);\n  if (f.equipo) conEtiqueta(body, 'Equipo:', f.equipo);\n  if (f.modelo) conEtiqueta(body, 'Modelo:', f.modelo);\n  parrafo(d.antecedentes);\n\n  // Intervenciones.\n  banda('Detalle de las Intervenciones Documentadas');\n  (d.intervenciones || []).forEach(function (it, i) {\n    subtitulo((ORDINALES_[i] || (i + 1) + 'ª') + ' Intervención' + (it.fecha ? ' (' + fechaLarga_(it.fecha) + ')' : '') + ':');\n    if (it.reporte) vineta('Reporte:', it.reporte);\n    if (it.hallazgo) vineta('Hallazgo:', it.hallazgo);\n    if (it.accion) vineta('Acción realizada:', it.accion);\n  });\n  if (lineas(d.pruebas).length || d.estadoFinal) {\n    subtitulo('Pruebas de Funcionamiento y Entrega:');\n    lineas(d.pruebas).forEach(function (l) { vineta('', l); });\n    if (d.estadoFinal) vineta('Estado final:', d.estadoFinal);\n  }\n  if (lineas(d.analisis).length) {\n    subtitulo('Análisis técnico');\n    lineas(d.analisis).forEach(function (l) { vineta('', l); });\n  }\n\n  // Conclusión y recomendaciones.\n  if (lineas(d.conclusion).length || lineas(d.recomendaciones).length) {\n    banda('Conclusión');\n    lineas(d.conclusion).forEach(function (l) { vineta('', l); });\n    if (lineas(d.recomendaciones).length) {\n      subtitulo('Recomendaciones Preventivas');\n      lineas(d.recomendaciones).forEach(function (l) { vineta('', l); });\n    }\n  }\n\n  // Evidencias: 4 fotos por fila.\n  const fotos = (d.fotos || []).slice(0, 16);\n  if (fotos.length) {\n    banda('Evidencias');\n    const filas = [];\n    for (let i = 0; i < fotos.length; i += 4) filas.push(['', '', '', '']);\n    const tf = body.appendTable(filas);\n    tf.setBorderWidth(0);\n    fotos.forEach(function (fid, i) {\n      try {\n        const p = tf.getCell(Math.floor(i / 4), i % 4).getChild(0).asParagraph().setAlignment(DocumentApp.HorizontalAlignment.CENTER);\n        const img = p.appendInlineImage(DriveApp.getFileById(fid).getBlob());\n        const k = 110 / img.getWidth();\n        img.setWidth(110).setHeight(Math.round(img.getHeight() * k));\n      } catch (e) { /* foto no disponible */ }\n    });\n  }\n\n  // Elaborado por.\n  body.appendParagraph('');\n  const te = body.appendTable([['Elaborado por:', 'Cargo:', 'Firma:'], [d.elaboradoNombre || '', d.elaboradoCargo || '', '']]);\n  [0, 1, 2].forEach(function (c) {\n    te.getCell(0, c).setBackgroundColor(GRIS).getChild(0).asParagraph().setAlignment(DocumentApp.HorizontalAlignment.CENTER).editAsText().setBold(true);\n  });\n  te.getCell(1, 1).getChild(0).asParagraph().setAlignment(DocumentApp.HorizontalAlignment.CENTER);\n  const firmaId = PropertiesService.getScriptProperties().getProperty('FIRMA_INFORMES_ID');\n  if (firmaId) {\n    try {\n      const img = te.getCell(1, 2).getChild(0).asParagraph().setAlignment(DocumentApp.HorizontalAlignment.CENTER).appendInlineImage(DriveApp.getFileById(firmaId).getBlob());\n      const k = 40 / img.getHeight();\n      img.setHeight(40).setWidth(Math.round(img.getWidth() * k));\n    } catch (e) { /* sin firma */ }\n  }\n\n  // Quita el párrafo vacío inicial del cuerpo.\n  try { if (body.getNumChildren() > 1 && body.getChild(0).getType() === Docume
